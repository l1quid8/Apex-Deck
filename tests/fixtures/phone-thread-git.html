<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<div id="root"></div>
<output id="result" style="position:fixed;bottom:10px;right:10px;background:white;color:black;z-index:9999"></output>
<script type="module">
import '/src/styles.css';
import '/src/phone/phone.css';
import React from 'react';
import {createRoot} from 'react-dom/client';
import {PhoneApp} from '/src/phone/PhoneApp.tsx';

const root = createRoot(document.querySelector('#root'));
const params = new URLSearchParams(location.search);
const suggestions = params.has('suggestions');
const writes = [];
let mode = 'decision_card';
let decisionKind = 'merge';
const checkout = {generation:1, root:'/fixture', branch:'fix/alert', repo:'test/repo'};
const decisions = {
  merge: {context:'PR #42 · Review and required checks passed for abc', question:'Merge the alert fix into main?', primary:'Merge to main', turns:0, dismissible:true},
  merging: {question:'Waiting for checks', turns:0, cancellable:true},
  fix_checks: {question:'Send the Windows failure to the agent?', primary:'Ask agent to fix', detail:'expected 0 alerts', turns:1, dismissible:true},
  question: {question:'Add diagnostic logging?', primary:'Add logging', to:'builder', prompt:'Add diagnostic logging.', turns:1, dismissible:true},
};
function currentOffer() {
  const card = decisions[decisionKind];
  const visible = card && (mode === 'decision_card' || decisionKind === 'merging');
  return {mode, checkout, replySeq:1, decision:visible ? {...card, kind:decisionKind, head:'abc', key:'phone-room/1/'+decisionKind} : null};
}
const transcript = [
  {seq:0, speaker:{kind:'human'}, text:'Fix the sticky alert.'},
  {seq:1, speaker:{kind:'bot',id:'builder'}, text:'The alert now clears after eight seconds.\nDeck asks: Add diagnostic logging? | Add logging'}
];
let reads = 0;
let failNextRead = false;
let failNextWrite = false;
let workflow = {head:'abc', reviewer:'reviewer', phase:'ready', detail:'Reviewed abc', pushed:false};
const state = () => ({root:'/fixture', branch:'fix/alert', originRepo:'test/repo', head:'abc', ahead:1, files:[], workflow:{...checkout,...workflow}});
const backend = {async call(cmd, {id, action}) {
  if (id !== 'phone-room') throw Error('Wrong thread');
  if (cmd === 'room_git_status') {
    reads++;
    if (failNextRead) { failNextRead = false; throw Error('Transient status blip'); }
    return state();
  }
  if (cmd !== 'room_thread_git_action' || action.expected.head !== workflow.head) throw Error('Wrong command or commit');
  if (failNextWrite) { failNextWrite = false; throw Error('Push rejected by remote'); }
  writes.push(action.kind);
  switch (action.kind) {
    case 'merge_ready': decisionKind = 'merging'; break;
    case 'fix_checks': decisionKind = null; break;
    case 'push': workflow.pushed = true; break;
    case 'request_merge': workflow.phase = 'checks'; break;
    case 'cancel_merge': decisionKind = null; workflow.phase = 'cancelled'; break;
    case 'ask_fix': workflow.fix_requested = true; break;
    default: throw Error('Unexpected action');
  }
  return {state:state(), message:'Saved'};
}};
const machine = {id:'local',name:'Fixture Mac',kind:'mac',url:'ws://127.0.0.1:19101',token:'fixture'};
const session = {version:1,profiles:[],workspaces:[{id:'p',path:'/fixture',name:'Fixture project'}],
  panes:[{id:'phone-room',kind:'chat',workspaceId:'p',title:'Alert fix'}],activeWorkspace:'p',section:'threads'};
localStorage.setItem('apex-deck.phone.machines.v1', JSON.stringify([machine]));
localStorage.setItem('apex-deck.phone.session.v1', JSON.stringify(session));
const RealSocket = window.WebSocket;
window.WebSocket = class extends EventTarget {
  constructor(url,...args) {
    super();
    if (url !== machine.url && url !== machine.url+'/') return new RealSocket(url,...args);
    queueMicrotask(() => this.dispatchEvent(new Event('open')));
  }
  close() { this.dispatchEvent(new Event('close')); }
  async send(frame) {
    const {id,cmd,args} = JSON.parse(frame);
    let response = {id,err:'Unsupported fixture command '+cmd};
    if (cmd === 'hello') response = {id,ok:{host_id:'fixture',boot_id:'boot',protocol:1,version:__APP_VERSION__,build_commit:__APP_BUILD__.commit,build_dirty:__APP_BUILD__.dirty,last_seq:0,resumed:false,
      capabilities:[...(params.has('textOnly') ? [] : ['phone_thread_git_v1']), ...(suggestions ? ['reply_suggestions_v1'] : [])]}};
    if (cmd === 'session_load') response = {id,ok:session};
    if (cmd === 'room_state') response = {id,ok:{active:[],approvals:[],next_steps:suggestions ? {id:'builder',pending:false,steps:[{label:'Add logging',prompt:'Add diagnostic logging.'}]} : null,snapshot:{participants:[],transcript:suggestions ? transcript : [],options:{policy:'mention',max_bot_hops:3}}}};
    if (cmd === 'room_reply_decision' && args.id === 'phone-room') response = {id,ok:currentOffer()};
    if (cmd === 'room_reply_decision_dismiss' && args.key === currentOffer().decision?.key) {
      decisionKind = null;
      response = {id,ok:null};
    }
    if (cmd === 'room_post_to' && args.id === 'phone-room' && args.targets.join() === 'builder' && args.text === 'Add diagnostic logging.' && args.decisionKey === currentOffer().decision?.key) {
      writes.push(cmd);
      decisionKind = null;
      response = {id,ok:null};
    }
    if (cmd === 'settings_load') response = {id,ok:{replySuggestions:mode}};
    if (cmd === 'settings_reply_suggestions_set') {mode = args.mode; response = {id,ok:{mode}};}
    if (cmd === 'room_git_status' || cmd === 'room_thread_git_action') {
      try { response = {id,ok:await backend.call(cmd,args)}; }
      catch (error) { response = {id,err:error instanceof Error ? error.message : String(error)}; }
    }
    queueMicrotask(() => this.dispatchEvent(new MessageEvent('message',{data:JSON.stringify(response)})));
  }
};
async function mount() {
  const row = () => [...document.querySelectorAll('button')].find(b => b.textContent.includes('Alert fix'));
  await wait(row);
  row().click();
}
async function leave() {
  const back = document.querySelector('button[aria-label="Back to Threads"]');
  if (!back) throw Error('Missing thread navigation '+document.body.innerText);
  back.click();
}
const button = label => Array.from(document.querySelectorAll('button')).find(b => b.textContent === label);
async function wait(check) {
  for (let i=0; i<200; i++) {
    if (check()) return;
    await new Promise(resolve => setTimeout(resolve, 25));
  }
  throw Error('Timed out waiting for ' + check + ' · '+document.body.innerText);
}
async function click(label) {
  await wait(() => button(label) && !button(label).disabled);
  button(label).click();
}
async function run() {
  root.render(React.createElement(PhoneApp));
  await mount();
  failNextWrite = true;
  failNextRead = true;
  const readsBeforeFail = reads;
  await click('Push');
  await wait(() => reads > readsBeforeFail && document.querySelector('.ph-thread-git [role="alert"]')?.textContent.includes('Push rejected by remote'));
  if (!button('Push') || !button('Merge to main')) throw Error('Transient poll failure hid Git controls');
  await click('Push');
  await click('Merge to main');
  await wait(() => button('Waiting for checks…'));
  await leave();
  await wait(() => !button('Cancel'));
  const before = reads;
  await mount();
  await wait(() => reads > before && button('Cancel'));
  await click('Cancel');
  await click('Merge to main');
  await wait(() => button('Waiting for checks…'));
  await leave();
  await wait(() => !button('Cancel'));
  workflow = {...workflow, phase:'failed', detail:'Windows check failed\nexpected 0 alerts'};
  await mount();
  await wait(() => document.querySelector('details pre')?.textContent.includes('expected 0 alerts'));
  await click('Ask agent to fix · uses one model turn');
  await wait(() => button('Fix requested')?.disabled);
  if (writes.join(',') !== 'push,request_merge,cancel_merge,request_merge,ask_fix') throw Error('Unexpected writes ' + writes);
}
async function runSuggestions() {
  root.render(React.createElement(PhoneApp));
  await mount();
  const card = () => document.querySelector('.reply-decision');
  const list = () => document.querySelector('.reply-next-steps');
  if (params.has('textOnly')) {
    await wait(() => document.querySelector('[data-seq="1"]'));
    if (button('Merge to main') || button('Push')) throw Error('Git unavailable on this transport');
    await leave(); decisionKind = 'question'; await mount();
    await click('Add logging');
    await wait(() => !card());
    if (writes.join(',') !== 'room_post_to') throw Error('Expected one agent request');
    return;
  }
  await wait(() => card() && button('Merge to main'));
  if (!card().closest('[data-seq="1"]') || list() || button('Push') || document.querySelector('[data-seq="1"] .ph-md').innerText.includes('Deck asks:')) throw Error('Incorrect decision placement');
  if (params.has('preview')) return;
  await click('Merge to main');
  await click('Cancel');
  await wait(() => !card());
  async function reopen(kind) {
    await leave(); decisionKind = kind; await mount();
  }
  await reopen('fix_checks');
  await wait(() => card()?.textContent.includes('1 model turn') && card().querySelector('pre')?.textContent.includes('expected 0 alerts'));
  await click('Ask agent to fix');
  await wait(() => !card());
  await reopen('question');
  await click('Not yet');
  await wait(() => !card());
  await leave(); await mount();
  await wait(() => document.querySelector('[data-seq="1"]'));
  if (card()) throw Error('Dismissal did not survive reopening');
  await reopen('question');
  await click('Add logging');
  await wait(() => !card());
  async function selectMode(next) {
    await leave();
    document.querySelector('button[aria-label="Settings"]').click();
    const select = () => document.querySelector('select[aria-label="Suggestions after a reply"]');
    await wait(() => select() && !select().disabled);
    select().value = next; select().dispatchEvent(new Event('change',{bubbles:true}));
    await wait(() => mode === next && !select().disabled);
    const back = [...document.querySelectorAll('button')].find(b => b.getAttribute('aria-label')?.startsWith('Back to'));
    back.click(); await mount();
  }
  await selectMode('next_steps');
  await wait(list);
  if (card()) throw Error('List showed a decision card');
  decisionKind = 'merging';
  await selectMode('off');
  await wait(() => card() && button('Cancel'));
  if (list()) throw Error('Off showed a next steps list');
  await click('Cancel');
  await wait(() => !card() && !list());
  if (writes.join(',') !== 'merge_ready,cancel_merge,fix_checks,room_post_to,cancel_merge') throw Error('Unexpected writes '+writes);
}
(suggestions ? runSuggestions() : run()).then(() => result.textContent=params.has('preview')?'':'PASS', e => result.textContent='FAIL '+e.message);
</script>
