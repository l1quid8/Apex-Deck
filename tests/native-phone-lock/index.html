<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<body style="background:#090d12;color:white;font:20px system-ui;padding:50px 18px">
  <h2>App lock acceptance</h2>
  <p>Production command guard + native ApexLock plugin</p>
  <button id="send" style="font-size:20px;padding:16px;display:block;width:100%;margin-bottom:12px">Send a thread delete</button>
  <button id="status" style="font-size:20px;padding:16px;display:block;width:100%;margin-bottom:12px">Lock status</button>
  <button id="lock" style="font-size:20px;padding:16px;display:block;width:100%;margin-bottom:12px">Turn the lock on</button>
  <button id="unlock" style="font-size:20px;padding:16px;display:block;width:100%;margin-bottom:12px">Unlock</button>
  <pre id="result" style="white-space:pre-wrap">Ready. Sent: 0</pre>
  <script src="acceptance.js"></script>
</body>
