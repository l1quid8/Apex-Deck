ons" style="margin-top:22px">${button(task.id==='audit'?'Mark reviewed':'Accept result','accept',task.id,'aa-primary')}${button('Request changes','changes',task.id)}${button('Open chat','worker',task.id)}</div>`:''}${state.requestChanges?`<div style="margin-top:18px"><label class="aa-field">What should the agent change?<textarea data-change-request placeholder="Describe what needs another pass…"></textarea></label>${button('Send to agent','send-changes',task.id,'aa-primary')}</div>`:''}${task.status==='done'?`<div class="aa-checks"><div class="aa-check">${icon('circle-check')}${task.id==='audit'?'You reviewed the cleanup list.':'Result accepted.'}</div></div>`:''}`}`;

    function renderSettings() {

    }
    function renderActivity() {

      return `<h2>Activity</h2><p class="aa-view-sub" style="margin-top:5px">A short record of hand-offs, questions, and results.</p><ol class="aa-timeline">${events.map(item=>`<li>${icon('circle-check')}<div><p>${escape(item.text)}</p><small>${escape(item.detail)}</small></div></li>`).join('')}</ol>`;
    }
    function renderWorker() {
      const pane=product.querySelector('[data-worker]');

      if (task.status==='question') text=task.capPaused?'The task reached its spend cap. I’m waiting for you before continuing.':'May I restart the remote service to verify the connection? I sent this question to ApexAgent for your approval.';
      if (task.status==='cancelled') text='The task is stopped. The conversation and any existing work are kept here.';
      pane.innerHTML=`<div class="aa-worker-header"><div><div class="aa-worker-title">${escape(task.chat)}</div><div class="aa-worker-sub">${escape(task.worker)} · ${escape(task.provider)}<br>Linked to ApexAgent</div></div><button type="button" class="aa-icon-button cursor-interaction" aria-label="Close worker chat" data-action="close-worker">${icon('x')}</button></div><div class="aa-worker-body">${message('ApexAgent',escape(task.brief))}${message(task.worker,escape(text))}${task.status==='ready'||task.status==='done'?button('Review in ApexAgent','detail',task.id,'aa-primary'):''}</div><div class="aa-worker-footer">Closing this pane keeps the task running.<br>Questions and approvals come back to you.</div>`;

    function renderScope() {
      const overlay=product.querySelector('[data-scope-overlay]');

      overlay.innerHTML=`<section class="aa-dialog" role="dialog" aria-modal="true" aria-label="Choose chats to review"><div class="aa-dialog-header"><h3>Review scope</h3><button type="button" class="aa-icon-button cursor-interaction" aria-label="Close review scope" data-action="close-scope">${icon('x')}</button></div><label class="aa-scope-row"><input type="checkbox" data-all-scopes${state.scopes.length===3?' checked':''}><span>All projects<small>Includes local and remote chats</small></span></label>${[['apex-deck','9 chats · This Mac'],['apex_terminal','6 chats · Apex Terminal'],['arcane_trader','4 chats · Apex Terminal']].map(([name,note])=>`<label class="aa-scope-row"><input type="checkbox" data-scope="${name}"${state.scopes.includes(name)?' checked':''}><span>${name}<small>${note}</small></span></label>`).join('')}<p class="aa-settings-note">Scope choices are a design preview. Remote monitoring support is still required in the app.</p><div class="aa-dialog-footer">${button('Apply scope','apply-scope','','aa-primary')}</div></section>`;

    function render() {
      product.querySelectorAll('[data-tab]').forEach(tab=>tab.setAttribute('aria-selected',String(tab.dataset.tab===state.tab)));
      const content=product.querySelector('[role="tabpanel"]');

    function save() {
      const privateContent={};

    }
    function notify(text) { clearTimeout(toastTimer); state.toast=text; render(); toastTimer=setTimeout(()=>{state.toast='';render();},2600); }

    }
    function run(task) {
      updateBrief(task); const spentBefore=Number(task.spend.replace('$',''))||0;
      task.status='running';task.spend=`$${Math.min(spentBefore+0.03,task.cap!==''&&task.cap!==undefined?Number(task.cap):Infinity).toFixed(2)}`; state.requestChanges=false;
      record(`${task.title} started`,task); notify(`${task.worker} is working in ${task.chat}`); save();
      setTimeout(()=>{
        if(task.status!=='running') return;
        const total=spentBefore+(task.id==='audit'?0.14:0.09);
        if(task.cap!==''&&task.cap!==undefined&&Number(task.cap)<total){
          task.status='question'; task.capPaused=true; task.spend=`$${Number(task.cap).toFixed(2)}`;
          record(`${task.title} paused at its spend cap`,task);notify('Task paused. Raise its cap to continue.');save();return;
        }
        task.status='ready'; task.spend=`$${total.toFixed(2)}`;
        record(`${task.title} ready to review`,task);
        if(task.id==='audit') state.messages.push({html:`<p>The cleanup review is ready. In this sample, <strong>${Math.min(4,scopeCount()-3)} chats are ready to archive</strong>, <strong>${Math.max(1,scopeCount()-6)} need follow-up</strong>, and <strong>2 are blocked</strong>.</p>${button('Review cleanup list','detail',task.id,'aa-primary')}`});
        notify(`${task.title} is ready to review`); save();
      },1600);
    }
    function send() {
      const text=textarea.value.trim(); if(!text){textarea.focus();return;}
      textarea.value=''; state.tab='chat'; state.detail=null;
      state.messages.push({user:true,text});
      if(/status|progress|how.*going|what.*working/i.test(text)) {
        const working=state.tasks.filter(task=>task.status==='running');
        state.messages.push({text:working.length?`${working.length} task is working. I'll bring its result and any questions here.`:'Your tasks are up to date. Open Tasks to see proposals, questions, and results.'});
      } else {
        const task={id:`request-${state.tasks.length}`,title:text.length>70?text.slice(0,67)+'…':text,brief:text,worker:state.profile,provider:state.profile==='Jigga'?'Claude Code':'Codex',chat:'New delegated task',status:'running',source:'Your direct request',original:text,mode:state.defaultMode,cap:state.defaultCap,spend:'$0.00'};
        state.tasks.push(task);
        state.messages.push({html:`<p>I'll hand this to <strong>${escape(task.worker)}</strong>. You can follow the work in its linked chat.</p>`,taskId:task.id});
        run(task);
      }
      render(); scroll.scrollTop=scroll.scrollHeight; save();
    }
    product.addEventListener('click',event=>{
      const tab=event.target.closest('[data-tab]');
      if(tab){state.tab=tab.dataset.tab;state.detail=null;state.requestChanges=false;render();scroll.scrollTop=0;save();return;}
      const target=event.target.closest('[data-action]'); if(!target)return;
      const action=target.dataset.action; const task=findTask(target.dataset.task);
      if(action==='send'){send();return;}
      if(action==='home'||action==='tasks'||action==='settings'){state.tab=action==='home'?'chat':action;state.detail=null;state.requestChanges=false;state.worker=null;render();scroll.scrollTop=0;save();}
      if(action==='scope'){state.scopeOpen=true;render();product.querySelector('[data-all-scopes]').focus();}
      if(action==='close-scope'){state.scopeOpen=false;render();product.querySelector('[data-action="scope"]').focus();}
      if(action==='apply-scope'){
        const next=[...product.querySelectorAll('[data-scope]:checked')].map(input=>input.dataset.scope);
        if(!next.length){notify('Select at least one project.');return;}
        state.scopes=next;state.scopeOpen=false;notify('Review scope updated');save();
      }
      if(action==='detail'&&task){state.tab='tasks';state.detail=task.id;state.requestChanges=false;render();scroll.scrollTop=0;save();}
      if(action==='worker'&&task){state.worker=task.id;render();save();}
      if(action==='close-worker'){state.worker=null;render();}
      if(action==='save-brief'&&task){updateBrief(task);record('Task brief updated',task);notify('Brief saved');save();}
      if(action==='approve'&&task)run(task);
      if(action==='stop'&&task){task.status='cancelled';record(`${task.title} stopped`,task);notify('Task stopped. Its chat and work are kept.');save();}
      if((action==='answer'||action==='readonly')&&task){
        if(task.capPaused){task.cap=0.5;task.capPaused=false;record('Spend cap raised',task);}
        else {task.brief=action==='readonly'?'Verify the connection without restarting the remote service.':task.brief;record(action==='readonly'?'Read-only check requested':'Service restart approved',task);}
        run(task);
      }
      if(action==='keep-paused'){notify('Task stays paused. Its chat and work are kept.');save();}
      if(action==='accept'&&task){task.status='done';record(task.id==='audit'?'Cleanup list reviewed':'Result accepted',task);state.messages.push({text:task.id==='audit'?'You reviewed the cleanup list. I can hand off the unfinished work when you ask.':`${task.title} is complete. Its linked chat keeps the result and history.`});notify(task.id==='audit'?'Cleanup list marked reviewed':'Result accepted');save();}
      if(action==='changes'&&task){state.requestChanges=true;render();product.querySelector('[data-change-request]').focus();}
      if(action==='send-changes'&&task){const request=product.querySelector('[data-change-request]').value.trim();if(!request){notify('Describe what should change.');return;}task.brief=request;run(task);}
      if(action==='save-settings'){state.profile=product.querySelector('[data-profile-select]').value;state.askFirst=product.querySelector('[data-ask-first]').checked;const advanced=view.querySelector('.aa-advanced');state.defaultMode=advanced.querySelector('select').value;state.defaultCap=advanced.querySelector('input').value;state.tab='chat';notify('Assistant settings saved');save();}
    });
    product.addEventListener('change',event=>{
      if(event.target.matches('[data-all-scopes]'))product.querySelectorAll('[data-scope]').forEach(input=>input.checked=event.target.checked);
      if(event.target.matches('[data-scope]'))product.querySelector('[data-all-scopes]').checked=[...product.querySelectorAll('[data-scope]')].every(input=>input.checked);
    });
    product.querySelector('[data-compose]').addEventListener('submit',event=>{event.preventDefault();send();});
    textarea.addEventListener('keydown',event=>{if(event.key==='Enter'&&(event.metaKey||event.ctrlKey)){event.preventDefault();send();}});
    product.addEventListener('keydown',event=>{
      if(state.scopeOpen&&event.key==='Tab'){
        const controls=[...product.querySelector('[data-scope-overlay]').querySelectorAll('button,input')];
        if(event.shiftKey&&event.target===controls[0]){event.preventDefault();controls[controls.length-1].focus();}
        else if(!event.shiftKey&&event.target===controls[controls.length-1]){event.preventDefault();controls[0].focus();}
      }
      if(event.key==='Escape'){if(state.scopeOpen){state.scopeOpen=false;render();}else if(state.worker){state.worker=null;render();}}
      if(event.target.matches('[data-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){
        event.preventDefault();const tabs=[...product.querySelectorAll('[data-tab]')];const current=tabs.indexOf(event.target);const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(current+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].click();tabs[next].focus();
      }
    });
    const controller={id,render,snapshot:()=>({tab:state.tab,statuses:Object.fromEntries(state.tasks.filter(task=>!task.id.startsWith('request-')).map(task=>[task.id,task.status])),profile:state.profile,scopes:state.scopes}),restore:incoming=>{
      if(!incoming)return;
      if(JSON.stringify(controller.snapshot())===JSON.stringify(incoming))return;
      if(['chat','tasks','activity','settings'].includes(incoming.tab))state.tab=incoming.tab;
      if(['Jigga','Null'].includes(incoming.profile))state.profile=incoming.profile;
      if(Array.isArray(incoming.scopes)&&incoming.scopes.length)state.scopes=incoming.scopes.filter(scope=>['apex-deck','apex_terminal','arcane_trader'].includes(scope));
      if(incoming.statuses)state.tasks.forEach(task=>{if(statuses[incoming.statuses[task.id]])task.status=incoming.statuses[task.id];});
      state.detail=null;render();
    }};
    controllers.push(controller);render();
    if(globalThis.Tweak){
      const design={readingWidth:620,corners:12};
      const tweak=new Tweak({container:product,onChange:()=>{product.style.setProperty('--aa-reading',`${design.readingWidth}px`);product.style.setProperty('--aa-radius',`${design.corners}px`);}});
      tweak.addSlider(design,'readingWidth',{label:'Reading width',min:480,max:760,step:20,unit:'px'});
      tweak.addSlider(design,'corners',{label:'Window corners',min:4,max:20,step:2,unit:'px'});
    }
    return controller;
  }
  build('aa-focused',false); build('aa-docked',true);
  window.addEventListener('openai:set_globals',event=>{
    const incoming=event.detail?.globals?.widgetState?.privateContent;
    if(!incoming)return;
    controllers.forEach(controller=>controller.restore(incoming[controller.id]));
  });
})();
</script>
