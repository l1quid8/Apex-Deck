name: Enable auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  enroll:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pr=$(gh pr view "$PR_NUMBER" --json state,isDraft,baseRefName,headRefOid,autoMergeRequest)
          if jq -e --arg head "$EXPECTED_HEAD" '
            .state == "OPEN" and .isDraft == false and .baseRefName == "main"
            and .headRefOid == $head and .autoMergeRequest == null
          ' <<< "$pr" > /dev/null; then
            gh pr merge "$PR_NUMBER" --auto --merge --match-head-commit "$EXPECTED_HEAD"
          fi
