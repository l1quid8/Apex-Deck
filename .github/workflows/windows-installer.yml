# Builds the Windows installer on GitHub's Windows runner and attaches it to the
# run as a downloadable artifact. It publishes nothing: no release, no tag, no
# upload anywhere else. The Human downloads it from the run summary, tries it on
# a Windows 11 PC, and only then is a real release cut.
#
# Runs on fix/windows-catch-up and feat/windows-auto-update are signed through
# Azure Artifact Signing as Tyler Caldwell. GitHub proves the branch to Azure, so
# no key is stored here, and Azure trusts those branches only. Other branches build
# an unsigned installer, which Windows shows as "unknown publisher".
#
# Runs only for the branches that carry Windows work, because an Electron build
# is minutes of runner time nobody asked for on every push.
name: windows-installer

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: Also build and verify the Nightly channel
        type: boolean
        default: false
  push:
    branches:
      - feat/win-m4-installer
      - feat/windows-11
      - fix/windows-catch-up
      - feat/windows-auto-update
      - feat/nightly-windows

permissions:
  contents: read

env:
  APEX_DECK_WIN_SIGN: ${{ (github.ref == 'refs/heads/fix/windows-catch-up' || github.ref == 'refs/heads/feat/windows-auto-update') && '1' || '' }}

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.identity.outputs.variants }}
      date: ${{ steps.identity.outputs.date }}
      previous: ${{ steps.identity.outputs.previous }}
      current: ${{ steps.identity.outputs.current }}
    steps:
      - id: identity
        env:
          VARIANTS: ${{ (github.ref == 'refs/heads/feat/nightly-windows' || inputs.nightly) && '["stable","nightly-previous","nightly"]' || '["stable"]' }}
        run: |
          echo "variants=$VARIANTS" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "previous=$((2 * GITHUB_RUN_NUMBER - 1))" >> "$GITHUB_OUTPUT"
          echo "current=$((2 * GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  channel-tests:
    needs: prepare
    if: github.ref == 'refs/heads/feat/nightly-windows' || inputs.nightly
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, nightly]
    env:
      APEX_CHANNEL: ${{ matrix.channel }}
      APEX_BUILD_NUMBER: ${{ needs.prepare.outputs.current }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node -e "import('electron')"
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p apex-provenance -p apex-daemon
      - if: ${{ !cancelled() }}
        run: npm test

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    env:
      APEX_CHANNEL: ${{ matrix.variant == 'stable' && 'stable' || 'nightly' }}
      APEX_BUILD_DATE: ${{ needs.prepare.outputs.date }}
      APEX_BUILD_NUMBER: ${{ matrix.variant == 'nightly-previous' && needs.prepare.outputs.previous || needs.prepare.outputs.current }}
      OUTPUT_DIR: ${{ matrix.variant == 'stable' && 'release' || 'release/nightly-windows' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Keep LF line endings so files match the Mac and Linux checkouts.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the app's dependencies
        run: npm ci
      - name: Compile the service and the app
        run: node scripts/package-win.mjs --compile
      - name: Test elevated authority ACLs and read-only host locks
        run: cargo test --locked -p apex-provenance --lib -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: win-unpacked-${{ matrix.variant }}
          path: ${{ env.OUTPUT_DIR }}/win-unpacked
          if-no-files-found: error
          retention-days: 1

  # Only this job can reach Azure. It runs no install scripts and no project build,
  # so nothing the dependencies add to a build can get hold of the signing login.
  sign:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    env:
      APEX_CHANNEL: ${{ matrix.variant == 'stable' && 'stable' || 'nightly' }}
      APEX_BUILD_DATE: ${{ needs.prepare.outputs.date }}
      APEX_BUILD_NUMBER: ${{ matrix.variant == 'nightly-previous' && needs.prepare.outputs.previous || needs.prepare.outputs.current }}
      OUTPUT_DIR: ${{ matrix.variant == 'stable' && 'release' || 'release/nightly-windows' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the packaging tools only
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: win-unpacked-${{ matrix.variant }}
          path: ${{ env.OUTPUT_DIR }}/win-unpacked
      - name: Sign in to Azure
        if: env.APEX_DECK_WIN_SIGN == '1'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: 4c7cb8eb-c6e5-4804-80fe-b2164f58af8b
          tenant-id: 02381f02-2a9b-4968-b74c-dd4b89329434
          subscription-id: 360e8f4a-285c-46a3-bd01-5f8cddbbaa59
          allow-no-subscriptions: true
      - name: Sign the programs
        if: env.APEX_DECK_WIN_SIGN == '1'
        shell: pwsh
        run: scripts/sign-win-unpacked.ps1 -Unpacked "$env:OUTPUT_DIR/win-unpacked"
      - name: Build the installer
        run: node scripts/package-win.mjs --package
      - name: Write the update feed
        if: matrix.variant == 'stable' || (matrix.variant == 'nightly' && env.APEX_DECK_WIN_SIGN == '1')
        run: node scripts/windows-update-manifest.mjs
      - name: Check the final Nightly Setup identity
        if: matrix.variant != 'stable'
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $setup = Join-Path $env:OUTPUT_DIR "Apex-Deck-Nightly_${env:APEX_BUILD_DATE}_${short}_x64-Setup.exe"
          $info = (Get-Item -LiteralPath $setup).VersionInfo
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $parts = $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
          $build = [int64]0
          foreach ($part in $parts) { $build = ($build -shl 16) + $part }
          Get-FileHash -LiteralPath $setup -Algorithm SHA256 | Format-List
          Write-Host "ProductName=$($info.ProductName) ProductVersion=$($info.ProductVersion) FileVersion=$($parts -join '.') Build=$build Commit=$env:GITHUB_SHA Signature=$($signature.Status) Publisher=$($signature.SignerCertificate.Subject)"
          if ($info.ProductName -cne 'Apex Deck Nightly' -or $info.ProductVersion -cne $version -or $build -ne [int64]$env:APEX_BUILD_NUMBER) { throw 'Final Setup PE resource mismatch' }
          if ($env:APEX_DECK_WIN_SIGN -eq '1') {
            node scripts/windows-update-smoke.mjs $setup "$env:OUTPUT_DIR/win-unpacked/Apex Deck Nightly.exe"
            if ($LASTEXITCODE) { throw 'Signed Nightly verifier smoke failed' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-to-verify-${{ matrix.variant }}
          path: |
            ${{ env.OUTPUT_DIR }}/*Setup.exe
            ${{ env.OUTPUT_DIR }}/*Setup.exe.sha256
            ${{ env.OUTPUT_DIR }}/windows-update/
            ${{ env.OUTPUT_DIR }}/nightly/
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: sign
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: installer-to-verify-stable
          path: release
      # The shutdown step lives inside the built .exe, so `npm run desktop:win`
      # cannot prove anything about it. An earlier version compiled, passed every
      # check, and would have refused to install on a machine that never had Apex
      # Deck: with a /FI filter, taskkill answers 0 both for "ended one" and for
      # "found none", so the retry loop never saw an end. Only running it catches
      # that, so run it -- once with a service already running, once with none.
      - name: Run the installer, with a service running and without
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'release\Apex-Deck-Setup.exe'
          if (-not (Test-Path $setup)) { throw "no installer at $setup" }

          function Install-ApexDeck([string] $label) {
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $proc = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
            if (-not $proc.WaitForExit(180000)) { throw "$label did not finish within 3 minutes" }
            $watch.Stop()
            $seconds = $watch.Elapsed.TotalSeconds
            Write-Host ("{0}: exit {1} after {2:N1} s" -f $label, $proc.ExitCode, $seconds)
            # A silent install that cannot stop the service now reports it here
            # instead of going on to fail on a locked image.
            if ($proc.ExitCode -ne 0) { throw "$label exited $($proc.ExitCode)" }
            if ($seconds -ge 90) { throw "$label took $seconds s: something is waiting a long time" }
            return [double] $seconds
          }

          # Nothing running, which is what a first install looks like.
          $idle = Install-ApexDeck 'install with nothing running'

          # electron-builder copies the service to resources\bin\apex-daemon.exe
          # through win.extraResources, and desktop/sidecar.mjs runs it from
          # there. No check has ever confirmed the two agree on a real install.
          $service = Get-ChildItem -Path (Join-Path $env:ProgramFiles 'Apex Deck') `
            -Recurse -Filter 'apex-daemon.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $service) {
            throw 'the installed app has no apex-daemon.exe, so it has no service to start'
          }
          Write-Host "the installed app carries the service at $($service.FullName)"
          if ($env:APEX_DECK_WIN_SIGN -eq '1') {
            $bin = Split-Path $service.FullName
            $files = @($setup, (Join-Path $env:ProgramFiles 'Apex Deck\Apex Deck.exe'), $service.FullName, (Join-Path $bin 'apex-provenance.exe'))
            foreach ($file in $files) {
              $signature = Get-AuthenticodeSignature -FilePath $file
              Write-Host "$file $($signature.Status) $($signature.SignerCertificate.Subject)"
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Tyler Caldwell') {
                throw "$file is not validly signed by Tyler Caldwell"
              }
            }
            node scripts/windows-update-smoke.mjs $setup (Join-Path $env:ProgramFiles 'Apex Deck\Apex Deck.exe')
            if ($LASTEXITCODE -ne 0) { throw 'the update check refused the installer it should accept' }
          }
          node scripts/windows-authority-smoke.mjs $service.FullName
          if ($LASTEXITCODE -ne 0) { throw 'installed production authority smoke failed' }
          $recovery = sc.exe qfailure ApexDeckProvenance | Out-String
          if ($recovery -notmatch 'RESTART') { throw "the service has no restart on failure: $recovery" }

          # Now the case the shutdown step exists for: a service from an earlier
          # build is still running. ping -t is always present and never exits, and
          # the image name is what the installer looks for.
          $fakeDir = Join-Path $env:RUNNER_TEMP 'fake-service'
          New-Item -ItemType Directory -Force -Path $fakeDir | Out-Null
          $fake = Join-Path $fakeDir 'apex-daemon.exe'
          Copy-Item "$env:SystemRoot\System32\PING.EXE" $fake -Force
          Start-Process -FilePath $fake -ArgumentList '-t', '127.0.0.1'
          Start-Sleep -Milliseconds 500
          if (-not (Get-Process -Name 'apex-daemon' -ErrorAction SilentlyContinue)) {
            throw 'the stand-in service did not start, so this would prove nothing'
          }

          $upgrade = Install-ApexDeck 'install over a running service'

          $deadline = (Get-Date).AddSeconds(5)
          while ((Get-Process -Name 'apex-daemon' -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 200
          }
          if (Get-Process -Name 'apex-daemon' -ErrorAction SilentlyContinue) {
            throw 'the service was still running after the install, so it was never stopped'
          }
          Write-Host 'the running service was gone after the install'
          node scripts/windows-authority-smoke.mjs $service.FullName
          if ($LASTEXITCODE -ne 0) { throw 'upgraded production authority smoke failed' }
          & scripts/windows-authority-standard-user.ps1 -Daemon $service.FullName

          # Both figures are printed so the baseline is visible; the exit code is
          # what catches the regression, because that bug taxed every install
          # equally and so hides in the difference.
          Write-Host ("the running service added {0:N1} s to the install" -f ($upgrade - $idle))
      - name: Attach the installer to this run
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Deck-Setup-windows-x64
          path: |
            release/Apex-Deck-Setup.exe
            release/Apex-Deck-Setup.exe.sha256
            release/windows-update/
          if-no-files-found: error
          retention-days: 30

  coexistence:
    needs: [prepare, sign]
    if: github.ref == 'refs/heads/feat/nightly-windows' || inputs.nightly
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-to-verify-*
          path: installers
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        if: env.APEX_DECK_WIN_SIGN != '1'
        with:
          name: win-unpacked-nightly
          path: nightly-app
      - name: Exercise Authenticode verification with a disposable QA publisher
        if: env.APEX_DECK_WIN_SIGN != '1'
        shell: pwsh
        run: |
          $current = (Get-ChildItem installers/installer-to-verify-nightly/*_x64-Setup.exe).FullName
          $previous = (Get-ChildItem installers/installer-to-verify-nightly-previous/*_x64-Setup.exe).FullName
          ./scripts/windows-nightly-authenticode-qa.ps1 -PreviousSetup $previous -CurrentSetup $current -App 'nightly-app/Apex Deck Nightly.exe' -PreviousBuild '${{ needs.prepare.outputs.previous }}' -CurrentBuild '${{ needs.prepare.outputs.current }}'
      - name: Verify concurrent installations and run the previously shipped Stable installer
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $oldStable = Join-Path $env:RUNNER_TEMP 'stable-0.9.9.exe'
          Invoke-WebRequest https://github.com/l1quid8/Apex-Deck/releases/download/v0.9.9/Apex-Deck-0.9.9-x64-Setup.exe -OutFile $oldStable
          if ((Get-FileHash $oldStable).Hash -ne '38630fd9f8dcfa31507684f2b559a5d73399566545ac05ff751f9420166827a8' -or
              (Get-AuthenticodeSignature $oldStable).Status -ne 'Valid') { throw 'Historical Stable setup differs from the signed baseline' }
          $nightly = (Get-ChildItem installers/installer-to-verify-nightly/*_x64-Setup.exe).FullName
          $previous = (Get-ChildItem installers/installer-to-verify-nightly-previous/*_x64-Setup.exe).FullName
          ./scripts/windows-channel-lifecycle.ps1 -StableSetup installers/installer-to-verify-stable/Apex-Deck-Setup.exe -NightlySetup $nightly -PreviousNightlySetup $previous -ExistingStableSetup $oldStable
      - name: Keep failed UI window captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-channel-ui
          path: ${{ runner.temp }}/apex-channel-ui/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep the verified Nightly installer and its release-owner artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Deck-Nightly-windows-x64
          path: installers/installer-to-verify-nightly/
          if-no-files-found: error
          retention-days: 30
