# apex-daemon tests on Windows, macOS, and Linux (x86_64 and arm64), alongside
# Linux release binaries. Built on Ubuntu 22.04 so the binaries run on
# 22.04 and 24.04 servers. Native Windows app and installer work follows M1
# (docs/superpowers/plans/2026-10-21-windows-11.md).
name: daemon

# A pull request runs once, for the pull request. A push runs only on main, so
# a branch with an open pull request no longer runs everything twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Which parts of the repository a pull request touches. A push to main always
  # runs everything. The lists are deliberately wide, because the suites read
  # across the tree:
  #   - Rust tests read crates/, shared/, src/, tests/ and voice-sidecar/, and
  #     the Linux job runs the VPS updater checks in scripts/ and tests/.
  #   - The app tests read nearly everything (crates/, docs/, mockups/,
  #     branding/, npm/, .github/ and the root Markdown files), so they are
  #     skipped only for changes confined to artifacts/ and screenshots/.
  # If the changed files cannot be listed, everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rust=true
          app=true
          if [ "$EVENT" = "pull_request" ] && files=$(git diff --name-only "$BASE...$HEAD") && [ -n "$files" ]; then
            rust=false
            app=false
            while IFS= read -r file; do
              echo "$file"
              case "$file" in
                crates/*|shared/*|src/*|tests/*|voice-sidecar/*|scripts/*|Cargo.toml|Cargo.lock|.github/workflows/daemon.yml) rust=true ;;
              esac
              case "$file" in
                artifacts/*|screenshots/*) ;;
                *) app=true ;;
              esac
            done <<< "$files"
          fi
          echo "rust=$rust app=$app"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  # One release version everywhere it is written: Cargo workspace, both
  # lockfiles, package.json, package-lock.json and the npm CLI packages.
  # Fix a failure with `node scripts/bump-version.mjs <x.y.z>`.
  versions-agree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-versions.mjs
      - run: node --experimental-strip-types --test tests/version-scripts.test.mjs

  # src/generated/protocol.ts is written from the Rust wire types (Command,
  # RoomEvent, HostEvent, Welcome). A type changed in Rust without regenerating
  # fails here; fix with `node scripts/gen-protocol-types.mjs` and commit.
  protocol-types:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The generator tests type-check their output with the project's TypeScript.
      - run: npm ci
      - run: node --experimental-strip-types --test tests/gen-protocol-types.test.mjs
      - run: node scripts/gen-protocol-types.mjs --check

  # Exercise the production IPC, privacy, and lock source independently.
  test-windows-ipc:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run pipe security and transport tests on Windows
        run: cargo test --locked -p apex-ipc-check --lib -- --nocapture

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, suite: updater }
          - { os: ubuntu-22.04, suite: host }
          - { os: ubuntu-22.04, suite: daemon }
          - { os: ubuntu-22.04-arm, suite: all }
          - { os: macos-latest, suite: all }
    name: test (${{ matrix.os }}${{ matrix.suite != 'all' && format(', {0}', matrix.suite) || '' }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Linux gateway and talk-only integration tests require the real sandbox.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # The host's libtest executable cannot answer the jail's init/probe commands.
      - name: Build the Linux jail init for host tests
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p apex-daemon --features remote --bin apex-daemon
          echo "APEX_JAIL_INIT=$GITHUB_WORKSPACE/target/debug/apex-daemon" >> "$GITHUB_ENV"
      - name: Verify native VPS updater candidates
        if: runner.os == 'Linux' && (matrix.suite == 'all' || matrix.suite == 'updater')
        run: |
          python3 -m unittest discover -s tests -p 'test_vps_update*.py'
          python3 scripts/check-vps-candidate.py
      - if: matrix.suite == 'all'
        run: cargo test --locked -p apex-core -p apex-adapters -p apex-host -p apex-daemon --features apex-daemon/remote
      - if: matrix.suite == 'host'
        run: cargo test --locked -p apex-core -p apex-adapters -p apex-host
      - if: matrix.suite == 'daemon'
        run: cargo test --locked -p apex-daemon --features remote
      - name: Test provenance platform boundary
        if: matrix.suite == 'all' || matrix.suite == 'daemon'
        run: cargo test --locked -p apex-provenance --lib
      - name: Forged-storage tests against apex-host built without test-support
        if: matrix.suite == 'all' || matrix.suite == 'daemon'
        run: cargo test --locked -p apex-host-production-check
      - name: Test the standalone mobile bridge with its committed lockfile
        if: runner.os == 'macOS'
        run: CARGO_TARGET_DIR=target cargo test --locked --manifest-path crates/iroh-mobile/Cargo.toml

  # Windows compilation and runtime failures fail CI, just like Unix failures.
  # This used to be one job that ran the Rust suites, the daemon suite and the
  # app suite back to back, about 34 minutes against a 40-minute limit. The
  # three now run side by side as test-windows, test-windows-daemon and
  # test-windows-app.
  test-windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Keep LF line endings so files match the Mac and Linux checkouts.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check every crate and list all errors
        run: cargo check --locked --keep-going --all-targets -p apex-core -p apex-adapters -p apex-host -p apex-daemon --features apex-daemon/remote
      - name: Stress concurrent checkpoint writes on Windows
        shell: pwsh
        run: |
          1..20 | ForEach-Object {
            Write-Host "Checkpoint contention attempt $_/20"
            cargo test --locked -p apex-host --lib checkpoints::tests::concurrent_store_rebuild_is_serialized_and_rebuilds_once -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test apex-core, apex-adapters and apex-host
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast -p apex-core -p apex-adapters -p apex-host
      - name: Test provenance platform boundary
        if: ${{ !cancelled() }}
        run: cargo test --locked -p apex-provenance --lib

  test-windows-daemon:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Test apex-daemon
        run: cargo test --locked --no-fail-fast -p apex-daemon --features remote

  # The Electron app's Node checks run on Windows, because the desktop app is a
  # Windows target now and nothing else tests it there. Node splits the test
  # files across four shards by position, so each shard runs about a quarter of
  # them.
  test-windows-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test-windows-app (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Keep LF line endings so files match the Mac and Linux checkouts.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # One cache for all four shards: they build the same thing.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-app
          cache-on-failure: true
      # The Task Scheduler tests launch the real daemon and build it themselves
      # with this same command. The old single job had already compiled it by
      # the time they ran; build it here so no test pays for a cold compile.
      - name: Build the daemon the Task Scheduler tests launch
        run: cargo build --locked -p apex-daemon
      - name: Install the app's Node dependencies
        run: npm ci
      # `require('electron')` downloads and unzips dist/electron.exe on the first
      # import; npm ci does not, because this repo's install-script allowlist
      # skips electron's postinstall (the "Downloading Electron binary..." line
      # in the readback is that first import). Two test files importing it at the
      # same moment both ran the download, and whoever finished first got
      # `spawn EBUSY` on an electron.exe the other was still writing. Extract it
      # once, before any test file starts.
      - name: Fetch the Electron binary once, so the tests cannot race for it
        run: node -e "import('electron').then((m) => console.log(m.default))"
      # Type-checking does not depend on the shard, so one shard does it.
      - name: Type-check the app
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: npx tsc --noEmit
      - name: Test the app
        # Blocking. The suite never ran off this Mac until M4: it started at
        # 2,468 of 2,550 failing on run 40233880246, and the merged Windows
        # branch now reads 0 failures (run 40253047144: 2,529 of 2,564 passed,
        # 35 gated). What it took, in case a future break looks familiar:
        #   - electron unzips itself on the first import, so the step above
        #     fetches it once instead of letting test files race for it.
        #   - 30 macOS-only suites and 1 posix-only premise are gated, not
        #     deleted, so they still run where they mean something.
        #   - /tmp is not a folder on Windows (it is C:\tmp, if anything);
        #     fixtures that need a short socket path keep /tmp on posix.
        # Two test files at a time: four cores booting four Chromiums at once
        # crashed scenarios silently, which reads as a failure with no output.
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/4 tests/*.test.mjs

  build:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p apex-daemon --features remote
      - uses: actions/upload-artifact@v4
        with:
          name: apex-daemon-linux-${{ matrix.arch }}
          path: target/release/apex-daemon
