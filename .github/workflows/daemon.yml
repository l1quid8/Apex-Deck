# apex-daemon tests on Windows, macOS, and Linux (x86_64 and arm64), then
# Linux release binaries. Built on Ubuntu 22.04 so the binaries run on
# 22.04 and 24.04 servers. Native Windows app and installer work follows M1
# (docs/superpowers/plans/2026-10-21-windows-11.md).
name: daemon

on:
  push:
  pull_request:

jobs:
  # Exercise the production IPC, privacy, and lock source independently.
  test-windows-ipc:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run pipe security and transport tests on Windows
        run: cargo test --locked -p apex-ipc-check --lib -- --nocapture

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p apex-core -p apex-adapters -p apex-host -p apex-daemon --features apex-daemon/remote
      - name: Test provenance platform boundary
        run: cargo test --locked -p apex-provenance --lib
      - name: Forged-storage tests against apex-host built without test-support
        run: cargo test --locked -p apex-host-production-check
      - name: Test the standalone mobile bridge with its committed lockfile
        if: runner.os == 'macOS'
        run: CARGO_TARGET_DIR=target cargo test --locked --manifest-path crates/iroh-mobile/Cargo.toml

  # Windows compilation and runtime failures fail CI, just like Unix failures.
  # The Electron app's Node checks run here too, because the desktop app is a
  # Windows target now and nothing else tests it there.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # Keep LF line endings so files match the Mac and Linux checkouts.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check every crate and list all errors
        run: cargo check --locked --keep-going --all-targets -p apex-core -p apex-adapters -p apex-host -p apex-daemon --features apex-daemon/remote
      - name: Test apex-core, apex-adapters and apex-host
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast -p apex-core -p apex-adapters -p apex-host
      - name: Test apex-daemon
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast -p apex-daemon --features remote
      - name: Test provenance platform boundary
        if: ${{ !cancelled() }}
        run: cargo test --locked -p apex-provenance --lib
      - name: Install the app's Node dependencies
        if: ${{ !cancelled() }}
        run: npm ci
      # `require('electron')` downloads and unzips dist/electron.exe on the first
      # import; npm ci does not, because this repo's install-script allowlist
      # skips electron's postinstall (the "Downloading Electron binary..." line
      # in the readback is that first import). Two test files importing it at the
      # same moment both ran the download, and whoever finished first got
      # `spawn EBUSY` on an electron.exe the other was still writing. Extract it
      # once, before any test file starts.
      - name: Fetch the Electron binary once, so the tests cannot race for it
        if: ${{ !cancelled() }}
        run: node -e "import('electron').then((m) => console.log(m.default))"
      - name: Type-check the app
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit
      - name: Test the app
        # Known gap, tracked, not hidden. The app suite never ran off this Mac
        # until M4: it started at 2,468 of 2,550 failing on run 40233880246 and
        # is at 2,513 of 2,551 on 40250672155. What is left is not this branch:
        #   - 1 desktop-sidecar assertion expects apex-daemon.exe (M3).
        #   - 2 message-actions-narrow scenarios (M3: hidden windows get no
        #     BeginFrame, so 64 rAFs took 64s and hit the 60s harness limit).
        # On feat/windows-11 (M2+M3, before this branch) run 40248283610 was
        # 2,527 of 2,563 with one left: the electron-download race, which the
        # step above now rules out. The two sides' leftovers are each other's
        # fixes, so one merged run should read zero. Flip this to blocking the
        # day that run does.
        # Two test files at a time: four cores booting four Chromiums at once
        # crashed scenarios silently, which reads as a failure with no output.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node --experimental-strip-types --test --test-concurrency=2 tests/*.test.mjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p apex-daemon --features remote
      - uses: actions/upload-artifact@v4
        with:
          name: apex-daemon-linux-${{ matrix.arch }}
          path: target/release/apex-daemon
