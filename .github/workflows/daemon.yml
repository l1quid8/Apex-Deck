# apex-daemon tests on Windows, macOS, and Linux (x86_64 and arm64), then
# Linux release binaries. Built on Ubuntu 22.04 so the binaries run on
# 22.04 and 24.04 servers. Native Windows app and installer work follows M1
# (docs/superpowers/plans/2026-10-21-windows-11.md).
name: daemon

on:
  push:
  pull_request:

jobs:
  # Exercise the production IPC, privacy, and lock source independently.
  test-windows-ipc:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run pipe security and transport tests on Windows
        run: cargo test --locked -p apex-ipc-check --lib -- --nocapture

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Linux runs gateway and talk-only turns inside bubblewrap, as users must.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo test --locked -p apex-core -p apex-adapters -p apex-host -p apex-daemon --features apex-daemon/remote
      - name: Test provenance platform boundary
        run: cargo test --locked -p apex-provenance --lib
      - name: Forged-storage tests against apex-host built without test-support
        run: cargo test --locked -p apex-host-production-check
      - name: Test the standalone mobile bridge with its committed lockfile
        if: runner.os == 'macOS'
        run: CARGO_TARGET_DIR=target cargo test --locked --manifest-path crates/iroh-mobile/Cargo.toml

  # Windows compilation and runtime failures fail CI, just like Unix failures.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Keep LF line endings so files match the Mac and Linux checkouts.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check every crate and list all errors
        run: cargo check --locked --keep-going --all-targets -p apex-core -p apex-adapters -p apex-host -p apex-daemon --features apex-daemon/remote
      - name: Test apex-core, apex-adapters and apex-host
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast -p apex-core -p apex-adapters -p apex-host
      - name: Test apex-daemon
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast -p apex-daemon --features remote
      - name: Test provenance platform boundary
        if: ${{ !cancelled() }}
        run: cargo test --locked -p apex-provenance --lib

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p apex-daemon --features remote
      - uses: actions/upload-artifact@v4
        with:
          name: apex-daemon-linux-${{ matrix.arch }}
          path: target/release/apex-daemon
