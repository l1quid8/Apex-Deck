<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iOS assistant chat — layout proposal</title><style>
*{box-sizing:border-box}body{margin:0;background:#080c0b;color:#e9eeec;font:16px/1.5 system-ui}main{max-width:430px;height:100dvh;margin:auto;display:flex;flex-direction:column}header{padding:18px 20px 0}h1{font-size:20px;margin:0}small{color:#919d96;font-size:12px}nav{display:flex;gap:28px;border-bottom:1px solid #29332e;padding-top:20px}nav span{padding:8px 0}nav span:first-child{border-bottom:2px solid #57dfa3}.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:24px}.day{text-align:center;font-size:12px;color:#919d96}.human{align-self:flex-end;background:#1e2a24;padding:10px 14px;border-radius:18px}p{margin:5px 0}.actions{display:flex;align-items:center;gap:8px;color:#919d96}.actions button{width:44px;height:44px;background:none;border:0;color:inherit;font-size:20px}.compose{padding:10px 12px max(12px,env(safe-area-inset-bottom));border-top:1px solid #29332e}.box{padding:8px;border:1px solid #29332e;border-radius:20px;background:#131b17}textarea{width:100%;min-height:44px;resize:none;background:none;border:0;color:inherit;font:inherit;padding:8px}.tools{display:flex;gap:8px;align-items:center}.tools button{min-width:44px;height:44px;border:0;border-radius:22px;background:none;color:inherit}.tools .mode{font-size:11px;background:#29332e}.tools .send{margin-left:auto;background:#57dfa3;color:#06140e;font-size:24px}.destination{display:block;padding:5px 8px 0;font-size:11px}button{cursor:pointer}
</style><main><header><h1>Alfred</h1><small>MacBook Pro</small><nav><span>Chat</span><span>Tasks</span><span>Notifications</span></nav></header><section class="chat"><div class="day">Today</div><div class="human">Please check the latest changes.</div><article><small>Alfred</small><p>I’ll check the changes and let you know what needs attention.</p><div class="actions"><small>11:20 AM</small><button aria-label="Show message actions" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">•••</button><small hidden>Reply · Copy · Read · Pin · React</small></div></article><article><small>Alfred</small><p>The checks passed. It’s ready for your review.</p><div class="actions"><small>11:21 AM</small><button aria-label="Show message actions">•••</button></div></article></section><footer class="compose"><div class="box"><textarea placeholder="Message Alfred…" aria-label="Message Alfred"></textarea><div class="tools"><button aria-label="Add attachment">+</button><button class="mode" aria-pressed="false" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true');this.style.color=this.getAttribute('aria-pressed')==='true'?'#57dfa3':''">TL;DR</button><button class="send" aria-label="Send">↑</button></div></div><small class="destination">To Alfred · MacBook Pro</small></footer></main></html>
