<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex Deck · Project Desk</title><style>
:root{color-scheme:dark;--base:#202322;--panel:#2b302e;--inset:#252927;--line:#3b423e;--text:#f1f3ed;--muted:#a1aaa3;--mint:#bfe8ce;--amber:#e9c68b}*{box-sizing:border-box}body{margin:0;background:#131615;color:var(--text);font-family:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:3px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;gap:80px}.caption{width:240px;align-self:center}.caption p{color:var(--muted);font-size:14px;line-height:1.6}.caption h1{font-size:32px;letter-spacing:-1.2px;font-weight:550}.caption small{color:var(--mint)}.phone{width:393px;height:852px;position:relative;overflow:hidden;border:1px solid #475149;border-radius:42px;background:var(--base);box-shadow:0 35px 100px #0006}.status{height:45px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:650}.status svg{width:16px;height:16px}.status>span:last-child{display:flex;gap:5px}.scroll{height:calc(100% - 122px);overflow:auto;scrollbar-width:none;padding:17px 20px 110px}.scroll::-webkit-scrollbar{display:none}.eyebrow{margin:0;color:var(--muted);font-size:13px}.head{display:flex;justify-content:space-between;align-items:center;margin:3px 0 26px}.head h2{font-size:34px;letter-spacing:-1.2px;line-height:1.15;margin:0;font-weight:600}.icon{height:36px;width:36px;display:grid;place-items:center;border-radius:50%}.icon:hover{background:#ffffff0c}.label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:0 0 10px}.label svg{width:14px;height:14px}.pinned{display:flex;flex-direction:column;gap:9px;margin-bottom:27px}.feature{background:#303832;border:1px solid #4b5d50;border-radius:17px;padding:15px 15px 13px;text-align:left;width:100%;position:relative}.feature.wait{background:#34332d;border-color:#555043}.feature-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.state{font-size:11px;color:var(--mint);display:flex;align-items:center;gap:6px}.state:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.wait .state{color:var(--amber)}.age{font-size:11px;color:var(--muted)}.feature strong{font-size:16px;font-weight:550;display:block;letter-spacing:-.3px}.meta{color:var(--muted);font-size:11px;margin-top:8px;display:flex;align-items:center;gap:7px}.meta svg{width:12px;height:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 11px}.sectionhead h3{font-size:18px;font-weight:550;letter-spacing:-.4px;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.project{background:var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden}.projectheader{display:flex;align-items:center;padding:15px 11px 13px 15px;gap:10px}.folder{display:grid;place-items:center;width:37px;height:39px;background:#39443c;border:1px solid #506053;border-radius:11px;color:#c2d4c5}.clef .folder{background:#3b3e48;border-color:#505666;color:#c6cada}.projectname{flex:1;padding:0;text-align:left;min-width:0}.projectname strong{display:block;font-size:17px;font-weight:550;letter-spacing:-.35px}.projectname span{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center;margin-top:4px}.projectname svg{width:12px;height:12px}.online{width:5px;height:5px;background:var(--mint);border-radius:50%}.projectheader .icon{width:28px;height:32px}.projectheader .icon svg{width:17px;height:17px}.projectbody{padding:0 9px 9px}.projectbody[hidden]{display:none}.projectsummary{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;padding:0 6px 12px}.projectsummary em{color:var(--mint);font-style:normal}.rows{background:var(--inset);border-radius:12px;overflow:hidden}.row{display:flex;align-items:center;text-align:left;padding:13px 11px;width:100%;gap:10px}.row+.row{border-top:1px solid #353b37}.row:hover{background:#ffffff04}.rowicon{width:21px;color:var(--muted)}.rowicon svg{width:17px;height:17px}.rowicon.unread{color:var(--mint)}.rowtext{flex:1}.rowtext strong{font-weight:500;font-size:13px;display:block}.rowtext small{font-size:10px;color:var(--muted);display:block;margin-top:4px}.row .age{font-size:10px}.continue{margin-top:24px}.continue .row{padding:13px 0}.compose{position:absolute;right:21px;bottom:94px;border-radius:19px;background:var(--mint);color:#25392c;height:52px;display:flex;align-items:center;gap:8px;padding:0 17px;font-size:13px;font-weight:650;box-shadow:0 5px 24px #0005}.tabs{position:absolute;bottom:0;height:77px;width:100%;border-top:1px solid #3b403c;background:#202322f5;display:flex;padding:10px 18px 18px;justify-content:space-around}.tabs button{display:flex;flex-direction:column;align-items:center;gap:5px;color:#919b93;font-size:10px;min-width:58px}.tabs button[aria-current]{color:var(--mint)}.tabs svg{width:21px;height:21px}.homebar{position:absolute;bottom:7px;left:calc(50% - 55px);width:110px;height:4px;border-radius:4px;background:#c7ccc5}.shade{position:absolute;inset:0;background:#0007;z-index:5;display:flex;align-items:flex-end}.shade[hidden]{display:none}.sheet{width:100%;padding:14px 22px 35px;background:#2a302c;border:1px solid #4c574e;border-radius:26px 26px 0 0;box-shadow:0 -15px 60px #0003}.handle{width:34px;height:4px;background:#647067;border-radius:4px;margin:0 auto 20px}.sheethead{display:flex;align-items:center;justify-content:space-between}.sheet h3{margin:0;font-size:21px;font-weight:550}.sheet p{color:var(--muted);font-size:13px;line-height:1.5}.sheet label{display:block;color:var(--muted);font-size:12px;margin:17px 0 7px}.sheet input,.sheet select{width:100%;padding:12px;background:#202622;color:var(--text);border:1px solid #4a574d;border-radius:10px}.primary{background:var(--mint);color:#213729;border-radius:12px;padding:13px 18px;width:100%;margin-top:22px;font-weight:600}.menuaction{display:flex;align-items:center;gap:12px;width:100%;padding:17px 0;border-bottom:1px solid var(--line);font-size:14px}.toast{position:absolute;top:55px;left:20px;right:20px;z-index:8;background:var(--mint);color:#213729;padding:13px 15px;border-radius:12px;font-size:12px;box-shadow:0 5px 20px #0004}.toast[hidden]{display:none}@media(max-width:700px){.stage{padding:0;min-height:100dvh}.caption{display:none}.phone{border:0;border-radius:0;width:100%;height:100dvh;max-width:480px;box-shadow:none}.status{padding-top:12px}.scroll{padding-top:14px}}@media(prefers-reduced-motion:no-preference){.compose:active{transform:scale(.97)}}
</style></head><body>
<svg style="display:none" aria-hidden="true"><defs><symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V5h6l3 3h9v11H3Z"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="chat" viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4Z"/></symbol><symbol id="laptop" viewBox="0 0 24 24"><path d="M5 4h14v12H5ZM2 20h20l-3-4H5Z"/></symbol><symbol id="terminal" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5m8 0h6"/></symbol><symbol id="command" viewBox="0 0 24 24"><path d="M8 8h8v8H8Zm0 0H5a3 3 0 1 1 3-3Zm8 0V5a3 3 0 1 1 3 3Zm0 8h3a3 3 0 1 1-3 3Zm-8 0v3a3 3 0 1 1-3-3Z"/></symbol><symbol id="pin" viewBox="0 0 24 24"><path d="m8 3 8 0-1 7 3 4H6l3-4Zm4 11v7"/></symbol><symbol id="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol><symbol id="settings" viewBox="0 0 24 24"><path d="M12 3 15 5l3 0 1 3 2 3-2 3-1 3-3 0-3 2-3-2H6l-1-3-2-3 2-3 1-3h3Z"/><circle cx="12" cy="11" r="3"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="battery" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4M5 10h12v4H5Z"/></symbol></defs></svg>
<div class="stage"><aside class="caption"><small>Apex Deck / Phone</small><h1>Project Desk</h1><p>Your threads, gathered around the projects they belong to.</p><p>Tap a project to fold it.<br>Use + to start in that project.</p></aside><main class="phone" aria-label="Project Desk phone mockup"><div class="status"><span>9:41</span><span>▮▮▮ <svg><use href="#battery"/></svg></span></div><div class="scroll"><p class="eyebrow">Your work</p><div class="head"><h2>Threads</h2><button class="icon" aria-label="Machines and settings" data-machine><svg><use href="#settings"/></svg></button></div><p class="label"><svg><use href="#pin"/></svg>Pinned</p><div class="pinned"><button class="feature" data-thread="Fix phone thread sync"><span class="feature-top"><span class="state">Allison is working</span><span class="age">2m</span></span><strong>Fix phone thread sync</strong><span class="meta">Apex Deck <svg><use href="#laptop"/></svg> Mac</span></button><button class="feature wait" data-thread="Bots sheet polish"><span class="feature-top"><span class="state">Waiting for approval</span><span class="age">12m</span></span><strong>Bots sheet polish</strong><span class="meta">Apex Deck <svg><use href="#laptop"/></svg> Mac</span></button></div><div class="sectionhead"><h3>Projects</h3><span>2 projects</span></div><div id="projects"></div><section class="continue"><div class="sectionhead"><h3>Continue working</h3></div><button class="row" data-thread="Pairing flow"><span class="rowicon"><svg><use href="#chat"/></svg></span><span class="rowtext"><strong>Pairing flow</strong><small>Apex Deck · Mac · Idle</small></span><span class="age">Yesterday</span></button><button class="row" data-thread="Draft: Release notes"><span class="rowicon"><svg><use href="#chat"/></svg></span><span class="rowtext"><strong>Draft: Release notes</strong><small>Apex Deck · Mac · Draft</small></span><span class="age">Yesterday</span></button></section></div><button class="compose" data-new=""><svg><use href="#plus"/></svg>New thread</button><nav class="tabs" aria-label="Main navigation"><button data-tab="Agents"><svg><use href="#command"/></svg>Agents</button><button data-tab="Code"><svg><use href="#terminal"/></svg>Code</button><button aria-current="page" data-tab="Threads"><svg><use href="#chat"/></svg>Threads</button><button data-tab="Library"><svg><use href="#folder"/></svg>Library</button></nav><div class="homebar"></div><div class="shade" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle"><div class="handle"></div><div class="sheethead"><h3 id="sheettitle"></h3><button class="icon" id="close" aria-label="Close"><svg><use href="#close"/></svg></button></div><div id="sheetbody"></div></section></div><div class="toast" id="toast" role="status" hidden></div></main></div>
<script>
const icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;const projects=[{name:'Apex Deck',machine:'Mac',count:4,status:'1 working · 1 waiting',rows:[['Fix phone thread sync','Allison is working','2m'],['Bots sheet polish','Waiting for approval','12m'],['Pairing flow','Idle','Yesterday'],['Draft: Release notes','Draft','Yesterday']]},{name:'Clef Feed',machine:'Apex Terminal',count:1,status:'1 unread',rows:[['Observer feed review','Unread','34m']]}];
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.querySelector('#projects').innerHTML=projects.map((p,i)=>`<section class="project ${i?'clef':''}"><div class="projectheader"><span class="folder">${icon('folder')}</span><button class="projectname" aria-expanded="true" data-expand="${i}"><strong>${esc(p.name)}</strong><span><b class="online"></b>${esc(p.machine)} ${icon('chevron')}</span></button><button class="icon" data-new="${esc(p.name)}" aria-label="New thread in ${esc(p.name)}">${icon('plus')}</button><button class="icon" data-menu="${i}" aria-label="${esc(p.name)} project menu">${icon('more')}</button></div><div class="projectbody" id="project-${i}"><div class="projectsummary"><span>${p.count} threads</span><em>${p.status}</em></div><div class="rows">${p.rows.map(r=>`<button class="row" data-thread="${esc(r[0])}"><span class="rowicon ${r[1]==='Unread'?'unread':''}">${icon('chat')}</span><span class="rowtext"><strong>${esc(r[0])}</strong><small>${r[1]}</small></span><span class="age">${r[2]}</span></button>`).join('')}</div></div></section>`).join('')}render();
const overlay=document.querySelector('#overlay'),body=document.querySelector('#sheetbody');let previous;function sheet(title,content){previous=document.activeElement;document.querySelector('#sheettitle').textContent=title;body.innerHTML=content;overlay.hidden=false;document.querySelector('#close').focus()}function close(){overlay.hidden=true;previous?.focus()}document.querySelector('#close').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};let timer;function toast(message){const t=document.querySelector('#toast');t.textContent=message;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,2600)}function newThread(project){sheet('New thread',`<form id="newform"><label for="threadtitle">Thread name</label><input id="threadtitle" required placeholder="What are you working on?" autocomplete="off"><label for="project">Project</label><select id="project">${projects.map(p=>`<option ${p.name===project?'selected':''}>${p.name}</option>`).join('')}</select><label for="machine">Machine</label><select id="machine"><option>Mac</option><option>Apex Terminal</option></select><button class="primary">Create thread</button></form>`);const ps=body.querySelector('#project'),ms=body.querySelector('#machine');function sync(){ms.value=projects.find(p=>p.name===ps.value).machine}sync();ps.onchange=sync;body.querySelector('#newform').onsubmit=e=>{e.preventDefault();const title=body.querySelector('#threadtitle').value.trim();if(!title)return;const p=projects.find(p=>p.name===ps.value);p.rows.push([title,'Draft','Now']);p.count++;render();close();toast('Thread created in '+p.name)}}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-expand')){const target=document.querySelector('#project-'+b.dataset.expand);target.hidden=!target.hidden;b.setAttribute('aria-expanded',String(!target.hidden))}if(b.hasAttribute('data-new'))newThread(b.dataset.new);if(b.hasAttribute('data-menu')){const p=projects[+b.dataset.menu];sheet(p.name,`<button class="menuaction" id="menunew">${icon('plus')}New thread</button><button class="menuaction" id="menumachine">${icon('laptop')}Choose machine <span style="margin-left:auto;color:var(--muted)">${p.machine}</span></button>`);body.querySelector('#menunew').onclick=()=>newThread(p.name);body.querySelector('#menumachine').onclick=()=>machine(p)}if(b.hasAttribute('data-machine'))machine();if(b.hasAttribute('data-thread'))sheet(b.dataset.thread,`<p>${projects.find(p=>p.rows.some(r=>r[0]===b.dataset.thread))?.name||'Apex Deck'}</p><p>This mockup focuses on the Threads overview.</p><button class="primary" id="back">Back to Threads</button>`),body.querySelector('#back').onclick=close;if(b.hasAttribute('data-tab')){if(b.dataset.tab==='Threads'){close();document.querySelector('.scroll').scrollTop=0}else toast(b.dataset.tab+' tab selected · mockup')}});function machine(p){sheet(p?'Choose machine':'Machines',`<p>${p?'Choose where '+p.name+' runs.':'Your connected machines.'}</p>${['Mac','Apex Terminal'].map(n=>`<button class="menuaction" data-pick="${n}">${icon(n==='Mac'?'laptop':'terminal')}<span>${n}</span><span style="margin-left:auto;color:var(--mint);font-size:12px">Connected</span></button>`).join('')}`);body.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(p){p.machine=b.dataset.pick;render()}close();toast(p?p.name+' is on '+b.dataset.pick:b.dataset.pick+' selected')})}document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&!overlay.hidden){const items=[...overlay.querySelectorAll('button,input,select')];if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus()}}});
</script></body></html>
