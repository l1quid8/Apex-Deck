<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex Deck — Thread Inbox</title><style>
:root{color-scheme:dark;--bg:#242522;--panel:#30312d;--line:#41423c;--text:#f4f3eb;--muted:#a7aaa0;--mint:#bbe7c9;--amber:#edc483}*{box-sizing:border-box}body{margin:0;background:#161714;color:var(--text);font-family:"Avenir Next",Avenir,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}button,input,select{font:inherit}button{color:inherit;border:0;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:3px}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.presentation{display:flex;align-items:center;gap:70px;padding:45px}.caption{width:240px;color:var(--muted);font-size:15px;line-height:1.7}.caption h1{font-size:27px;line-height:1.2;color:var(--text);font-weight:500;letter-spacing:-1px}.caption p{margin:20px 0}.phone{width:393px;height:852px;background:var(--bg);border-radius:43px;overflow:hidden;border:1px solid #51524a;box-shadow:0 30px 100px #0007;position:relative;display:flex;flex-direction:column}.status{height:48px;padding:17px 28px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:14px;font-weight:600}.status-icons{display:flex;gap:6px;align-items:center}.status-icons svg{width:16px;height:16px}.header{padding:20px 24px 0}.heading{display:flex;justify-content:space-between;align-items:center}.heading h2{font-size:37px;letter-spacing:-1.5px;line-height:1.1;font-weight:650;margin:0}.compose{width:44px;height:44px;border-radius:15px;background:var(--mint);color:#253c2e;display:grid;place-items:center}.machines{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 11px;margin-top:20px;font-size:11px;color:#d2d6ca}.machines svg{width:14px;height:14px}.dot{width:6px;height:6px;border-radius:50%;background:var(--mint);display:inline-block;flex-shrink:0}.machines .chevron{margin-left:5px;color:var(--muted)}.segment{background:#1d1e1b;border-radius:13px;padding:4px;display:flex;margin-top:23px}.segment button{width:50%;padding:9px;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:600}.segment .selected{background:#3b3d36;color:var(--text)}.pinned{padding:23px 24px 21px;border-bottom:1px solid var(--line)}.label{font-size:12px;color:var(--muted);margin:0 0 11px;font-weight:500}.pins{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.pin{background:var(--panel);border:1px solid var(--line);border-radius:11px;display:flex;align-items:center;gap:8px;padding:10px 11px;white-space:nowrap;font-size:12px}.pin svg{width:13px;height:13px;color:var(--mint)}.content{overflow:auto;flex:1;padding:0 24px}.list-title{font-size:12px;color:var(--muted);padding:18px 0 3px}.row{position:relative;display:flex;min-height:86px;align-items:center;border-bottom:1px solid #363831;gap:9px}.row-main{background:none;flex:1;text-align:left;padding:14px 0;min-width:0}.topline{display:flex;justify-content:space-between;gap:8px;align-items:center}.title{font-size:15px;font-weight:600;letter-spacing:-.2px}.age{font-size:10px;color:var(--muted);white-space:nowrap}.state{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:7px}.state.working{color:var(--mint)}.state.waiting{color:var(--amber)}.metadata{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:10px;margin-top:7px}.metadata svg{width:11px;height:11px}.separator{height:9px;width:1px;background:#65685c;margin:0 2px}.more{background:transparent;color:var(--muted);width:24px;padding:3px}.more svg{width:16px}.unread{width:6px;height:6px;background:var(--mint);border-radius:50%;margin-right:2px}.nav{height:90px;background:#22231f;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:14px 10px 25px}.nav button{background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;color:#989c90;font-size:10px;min-width:60px}.nav .active{color:var(--mint)}.home{position:absolute;width:125px;height:4px;border-radius:4px;background:#f0f0e5;bottom:9px;left:calc(50% - 62px)}.overlay{position:absolute;inset:0;background:#090a0977;display:none;align-items:flex-end;z-index:5}.overlay.open{display:flex}.sheet{background:#30322c;width:100%;border:1px solid #484b41;border-radius:25px 25px 0 0;padding:9px 24px 32px;max-height:80%;overflow:auto}.handle{width:35px;height:4px;background:#62665b;border-radius:3px;margin:0 auto 22px}.sheet-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.sheet h3{font-size:23px;letter-spacing:-.6px;margin:0}.close{background:#42463a;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}.close svg{width:15px}.sheet p{font-size:13px;line-height:1.6;color:#b9beb0}.sheet-row{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line);font-size:14px}.sheet-row small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.action{width:100%;padding:13px;border-radius:12px;background:var(--mint);color:#253c2e;font-weight:600;margin-top:20px}.menu-action{display:block;width:100%;background:none;padding:17px 0;text-align:left;border-bottom:1px solid var(--line);font-size:14px}label{display:block;font-size:12px;color:var(--muted);margin:19px 0 7px}input,select{background:#22241e;border:1px solid #55594b;border-radius:10px;padding:12px;color:var(--text);width:100%}.project-heading{font-size:15px;font-weight:600;margin:22px 0 0}.toast{position:absolute;bottom:104px;left:24px;right:24px;padding:12px;background:var(--mint);color:#253c2e;border-radius:12px;font-size:12px;text-align:center;display:none;z-index:10}@media(max-width:650px){body{display:block}.presentation{padding:0;display:block}.caption{display:none}.phone{width:100%;height:100dvh;min-height:740px;border:0;border-radius:0;box-shadow:none}.status{padding-top:15px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><svg style="display:none" aria-hidden="true"><defs><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="laptop" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M2 20h20M9 16l-1 4m7-4 1 4"/></symbol><symbol id="terminal" viewBox="0 0 24 24"><path d="m4 6 6 6-6 6m9 0h7"/></symbol><symbol id="threads" viewBox="0 0 24 24"><path d="M20 4H4v13h4l4 4v-4h8z"/></symbol><symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V4h6l3 3h9v13H3z"/></symbol><symbol id="agents" viewBox="0 0 24 24"><path d="M9 7V5a2 2 0 1 0-2 2h10a2 2 0 1 0-2-2v14a2 2 0 1 0 2-2H7a2 2 0 1 0 2 2z"/></symbol><symbol id="down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol><symbol id="more" viewBox="0 0 24 24"><circle cx="4" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="20" cy="12" r="1"/></symbol><symbol id="pin" viewBox="0 0 24 24"><path d="m14 3 7 7-4 1-4 6-2-2-6 6m6-6-4-4 6-4z"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol></defs></svg><main class="presentation"><aside class="caption"><h1>A little more room<br>for the work.</h1><p>Threads come first. The next action stays visible, and connected machines stay within reach.</p><p style="font-size:12px">Apex Deck · Thread Inbox<br>Interactive phone study / v1</p></aside><section class="phone" aria-label="Thread Inbox mockup"><div class="status"><span>9:41</span><span class="status-icons"><svg viewBox="0 0 20 20"><path d="M2 15v-3m4 3V9m4 6V6m4 9V3"/></svg><svg viewBox="0 0 20 20"><path d="M2 6q8-7 16 0M5 9q5-4 10 0m-7 3q2-2 4 0"/><circle cx="10" cy="15" r=".6"/></svg><svg viewBox="0 0 24 16"><rect x="1" y="3" width="19" height="10" rx="2"/><path d="M23 6v4M4 6h13v4H4z"/></svg></span></div><header class="header"><div class="heading"><h2>Threads</h2><button class="compose" aria-label="New thread" onclick="newThread()"><svg><use href="#plus"/></svg></button></div><button class="machines" onclick="machineSheet()"><span class="dot"></span><svg><use href="#laptop"/></svg>Mac<span style="color:#6c7163">/</span><svg><use href="#terminal"/></svg>Apex Terminal<svg class="chevron"><use href="#down"/></svg></button><div class="segment" role="tablist" aria-label="Thread grouping"><button class="selected" role="tab" aria-selected="true" onclick="group('Recent',this)">Recent</button><button role="tab" aria-selected="false" onclick="group('Projects',this)">Projects</button></div></header><section class="pinned"><h3 class="label">Pinned</h3><div class="pins"><button class="pin" onclick="openThread(0)"><svg><use href="#pin"/></svg>Fix phone thread sync</button><button class="pin" onclick="openThread(1)"><svg><use href="#pin"/></svg>Bots sheet polish</button></div></section><section class="content" id="list" aria-label="Threads"></section><nav class="nav" aria-label="Main navigation"><button onclick="navSheet('Agents')"><svg><use href="#agents"/></svg>Agents</button><button onclick="navSheet('Code')"><svg><use href="#terminal"/></svg>Code</button><button class="active" aria-current="page" onclick="closeSheet()"><svg><use href="#threads"/></svg>Threads</button><button onclick="navSheet('Library')"><svg><use href="#folder"/></svg>Library</button></nav><div class="home"></div><div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="handle"></div><div class="sheet-heading"><h3 id="sheetTitle"></h3><button class="close" aria-label="Close sheet" onclick="closeSheet()"><svg><use href="#close"/></svg></button></div><div id="sheetBody"></div></section></div><div class="toast" role="status" id="toast"></div></section></main>
<script>
const data=[{title:'Fix phone thread sync',project:'Apex Deck',machine:'Mac',state:'Allison is working',kind:'working',age:'2m'},{title:'Bots sheet polish',project:'Apex Deck',machine:'Mac',state:'Waiting for approval',kind:'waiting',age:'12m'},{title:'Observer feed review',project:'Clef Feed',machine:'Apex Terminal',state:'Unread',kind:'',age:'34m',unread:true},{title:'Pairing flow',project:'Apex Deck',machine:'Mac',state:'Idle',kind:'',age:'Yesterday'},{title:'Draft: Release notes',project:'Apex Deck',machine:'Mac',state:'Draft',kind:'',age:'Yesterday'}];data[0].pinned=true;data[1].pinned=true;let grouping='Recent',offline=false,lastFocus;const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function row(t){let i=data.indexOf(t);return `<article class="row"><button class="row-main" onclick="openThread(${i})"><span class="topline"><span class="title">${esc(t.title)}</span><span class="age">${t.age}</span></span><span class="state ${t.kind}">${t.kind==='working'?'<span class="dot"></span>':''}${t.kind==='waiting'?'<span style="font-size:12px">◷</span>':''}${t.state}</span><span class="metadata"><svg><use href="#folder"/></svg>${t.project}<span class="separator"></span><svg><use href="#${t.machine==='Mac'?'laptop':'terminal'}"/></svg>${t.machine}</span></button>${t.unread?'<span class="unread" aria-label="Unread"></span>':''}<button class="more" aria-label="Options for ${esc(t.title)}" onclick="threadMenu(${i})"><svg><use href="#more"/></svg></button></article>`}function render(){document.querySelector('.pins').innerHTML=data.filter(t=>t.pinned).map(t=>`<button class="pin" onclick="openThread(${data.indexOf(t)})"><svg><use href="#pin"/></svg>${esc(t.title)}</button>`).join('')||'<span class="label">Pin a thread from its options.</span>';document.getElementById('list').innerHTML=grouping==='Recent'?'<div class="list-title">All threads</div>'+data.map(row).join(''):['Apex Deck','Clef Feed'].map(p=>`<h3 class="project-heading">${p}</h3>`+data.filter(t=>t.project===p).map(row).join('')).join('')}function group(g,b){grouping=g;document.querySelectorAll('.segment button').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-selected',x===b)});render()}function sheet(title,body){lastFocus=document.activeElement;document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=body;document.getElementById('overlay').classList.add('open');document.querySelector('.close').focus()}function closeSheet(){document.getElementById('overlay').classList.remove('open');lastFocus?.focus()}function machineSheet(){sheet('Machines',`<div class="sheet-row"><span>Mac<small>${offline?'Offline · Connection lost':'Connected'}</small></span><span class="dot" style="background:${offline?'var(--amber)':'var(--mint)'}"></span></div><div class="sheet-row"><span>Apex Terminal<small>Connected</small></span><span class="dot"></span></div>${offline?'<p style="color:var(--amber)">Mac is offline. Reconnect to continue its threads.</p><button class="action" onclick="offline=false;machineSheet();notify(\'Mac reconnected\')">Reconnect Mac</button>':''}<button class="menu-action" onclick="offline=!offline;machineSheet()">${offline?'Show connected state':'Preview Mac offline state'}</button>`)}function newThread(){sheet('New thread','<form onsubmit="event.preventDefault();createThread()"><label for="name">Thread title</label><input id="name" placeholder="What are you working on?" required maxlength="70"><label for="project">Project</label><select id="project"><option>Apex Deck</option><option>Clef Feed</option></select><label for="machine">Machine</label><select id="machine"><option>Mac</option><option>Apex Terminal</option></select><button class="action" type="submit">Create thread</button></form>')}function createThread(){let name=document.getElementById('name').value.trim();if(!name)return;data.unshift({title:name,project:document.getElementById('project').value,machine:document.getElementById('machine').value,state:'Idle',kind:'',age:'Now'});render();closeSheet();notify('Thread created')}function openThread(i){let t=data[i];sheet(t.title,`<p>${t.project} / ${t.machine}</p><div class="sheet-row"><span>${t.state}</span></div><p>This study focuses on the inbox. Thread content opens here in the app.</p><button class="action" onclick="closeSheet()">Back to Threads</button>`);if(t.unread){t.unread=false;t.state='Idle';render()}}function threadMenu(i){let t=data[i];sheet('Thread options',`<p>${esc(t.title)}</p><button class="menu-action" onclick="renameThread(${i})">Rename</button><button class="menu-action" onclick="data[${i}].pinned=!data[${i}].pinned;render();closeSheet();notify(data[${i}].pinned?'Thread pinned':'Thread unpinned')">${t.pinned?'Unpin thread':'Pin thread'}</button><button class="menu-action" onclick="data.splice(${i},1);render();closeSheet();notify('Thread archived')">Archive</button>`)}function renameThread(i){sheet('Rename thread',`<form onsubmit="event.preventDefault();data[${i}].title=document.getElementById('rename').value.trim()||data[${i}].title;render();closeSheet();notify('Thread renamed')"><label for="rename">Thread title</label><input id="rename" value="${esc(data[i].title)}" required><button class="action">Save name</button></form>`)}function navSheet(name){sheet(name,`<p>The ${name.toLowerCase()} tab stays in the same position as the app. This study covers the thread inbox.</p><button class="action" onclick="closeSheet()">Back to Threads</button>`)}let timer;function notify(s){clearTimeout(timer);let e=document.getElementById('toast');e.textContent=s;e.style.display='block';timer=setTimeout(()=>e.style.display='none',2300)}document.addEventListener('keydown',e=>{if(!document.getElementById('overlay').classList.contains('open'))return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){let a=[...document.querySelectorAll('.sheet button,.sheet input,.sheet select')],first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script></body></html>
