[workspace]
resolver = "2"
# apex-host-production-check must run alone (feature unification), so a bare `cargo test` skips it.
default-members = ["crates/apex-core", "crates/apex-adapters", "crates/apex-host", "crates/apex-daemon", "crates/apex-pairing", "crates/apex-provenance"]
members = ["crates/apex-core", "crates/apex-adapters", "crates/apex-host", "crates/apex-daemon", "crates/apex-pairing", "crates/apex-provenance", "crates/apex-host-production-check", "crates/apex-ipc-check"]

[workspace.package]
version = "0.9.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/l1quid8/apex-deck"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
