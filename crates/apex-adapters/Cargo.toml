[package]
name = "apex-adapters"
description = "Backends for Apex Deck group chat participants: OpenAI-style HTTP APIs and command-line tools."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apex-core = { path = "../apex-core" }
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.13", features = ["json", "stream"] }
serde.workspace = true
base64 = "0.22"
# File search for API bots' tools: gitignore-aware walking and patterns.
ignore = "0.4"
globset = "0.4"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
