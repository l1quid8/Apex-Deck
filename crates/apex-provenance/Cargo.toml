[package]
name = "apex-provenance"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ring = "0.17"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt", "time", "sync"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug", "Win32_UI_Shell", "Win32_System_Com"] }
