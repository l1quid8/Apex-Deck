[package]
name = "apex-daemon"
description = "Apex Deck without a window: runs the host and lets the desktop app, a phone or an SSH session drive it."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apex-daemon"
path = "src/main.rs"

[dependencies]
apex-adapters = { path = "../apex-adapters" }
apex-core = { path = "../apex-core" }
apex-host = { path = "../apex-host" }
dirs = "7"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["signal", "io-std", "fs"] }
futures.workspace = true
tokio-util = { version = "0.7", features = ["codec"] }
getrandom = "0.3"
libc = "0.2"
tokio-tungstenite = "0.28"
# Remote access over iroh (`serve --remote`); off until pairing ships.
iroh = { version = "1.3", optional = true }
apex-pairing = { path = "../apex-pairing", optional = true }
base64 = "0.22"
reqwest = { version = "0.13", features = ["stream"] }
async-trait.workspace = true
# The QR in `apex-daemon pair`: Unicode blocks only.
qrcode = { version = "0.14", default-features = false, optional = true }

[features]
# Test builds only (enabled by the self dev-dependency below): the daemon binary
# assumes verified UI admission for a dedicated temporary data directory, as the
# in-process fixtures do. No environment or CLI switch enables this.
test-support = ["apex-host/test-support"]
remote = ["dep:iroh", "dep:apex-pairing", "dep:qrcode"]

[dev-dependencies]
apex-daemon = { path = ".", features = ["test-support"] }
apex-host = { path = "../apex-host", features = ["test-support"] }
apex-core = { path = "../apex-core" }
tokio = { workspace = true, features = ["test-util"] }
