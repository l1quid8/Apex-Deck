[package]
name = "apex-daemon"
description = "Apex Deck without a window: runs the host and lets the desktop app, a phone or an SSH session drive it."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apex-daemon"
path = "src/main.rs"

# Test-only twin of apex-daemon that assumes verified UI admission for a dedicated
# temporary data directory. Not built, installed or packaged without the feature.
[[bin]]
name = "apex-daemon-fixture"
path = "src/bin_fixture.rs"
required-features = ["test-support"]

[dependencies]
apex-adapters = { path = "../apex-adapters" }
apex-core = { path = "../apex-core" }
apex-host = { path = "../apex-host" }
dirs = "7"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["signal", "io-std", "fs"] }
futures.workspace = true
tokio-util = { version = "0.7", features = ["codec"] }
getrandom = "0.3"
tokio-tungstenite = "0.28"
# Remote access over iroh (`serve --remote`); off until pairing ships.
iroh = { version = "1.3", optional = true }
apex-pairing = { path = "../apex-pairing", optional = true }
base64 = "0.22"
reqwest = { version = "0.13", features = ["stream"] }
async-trait.workspace = true
# The QR in `apex-daemon pair`: Unicode blocks only.
qrcode = { version = "0.14", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Pipes"] }

[features]
# Test builds only (enabled by the self dev-dependency below). Compiling it opts
# nothing in: only the apex-daemon-fixture binary's own main does.
test-support = ["apex-host/test-support"]
remote = ["dep:iroh", "dep:apex-pairing", "dep:qrcode"]

[dev-dependencies]
apex-daemon = { path = ".", features = ["test-support"] }
apex-host = { path = "../apex-host", features = ["test-support"] }
apex-core = { path = "../apex-core" }
tokio = { workspace = true, features = ["test-util"] }
