[package]
name = "apex-daemon"
description = "Apex Deck without a window: runs the host and lets the desktop app, a phone or an SSH session drive it."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apex-daemon"
path = "src/main.rs"

[dependencies]
apex-adapters = { path = "../apex-adapters" }
apex-host = { path = "../apex-host" }
dirs = "7"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "io-std", "fs"] }
futures.workspace = true
tokio-util = { version = "0.7", features = ["codec"] }
getrandom = "0.3"
libc = "0.2"
tokio-tungstenite = "0.28"
# Remote access over iroh (`serve --remote`); off until pairing ships.
iroh = { version = "1.3", optional = true }

[features]
remote = ["dep:iroh"]

[dev-dependencies]
apex-core = { path = "../apex-core" }
tokio = { workspace = true, features = ["test-util"] }
