[package]
name = "iroh-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Remote-access milestone 1: checks iroh direct/relayed connections between Apex Deck machines."

# Kept out of the main workspace so the spike's dependencies never touch the
# daemon build.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iroh = "1.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
