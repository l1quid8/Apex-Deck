[package]
name = "apex-iroh-mobile"
version = "0.0.0"
edition = "2021"
publish = false
description = "The iPhone's remote-access bridge (ApexRemote): iroh connections and pairing behind a small C ABI."

# Built on its own for iOS (scripts/build-iroh-mobile.sh), not in the workspace.
[workspace]

[lib]
name = "apex_remote"
crate-type = ["staticlib", "rlib"]

[dependencies]
apex-pairing = { path = "../apex-pairing" }
base64 = "0.22"
futures = "0.3"
iroh = "=1.3.0"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "macros"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
zeroize = "1"

# Match the iroh Swift release: newer libc removes iOS BSD definitions
# still used by netwatch/netdev. Revisit when those dependencies are updated.
libc = "=0.2.186"

[dev-dependencies]
# The real daemon, for loopback pairing tests.
apex-daemon = { path = "../apex-daemon", features = ["remote"] }
apex-host = { path = "../apex-host" }
