[package]
name = "apex-iroh-mobile"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
anyhow = "1"
iroh = "=1.3.0"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }

# Match the iroh Swift release: newer libc removes iOS BSD definitions
# still used by netwatch/netdev. Revisit when those dependencies are updated.
libc = "=0.2.186"
