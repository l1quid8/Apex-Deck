[package]
name = "apex-host"
description = "The UI-free core of Apex Deck: rooms, terminals, storage, approvals and mods, shared by the desktop app and the daemon."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apex-provenance = { path = "../apex-provenance" }
apex-core = { path = "../apex-core" }
apex-adapters = { path = "../apex-adapters" }
portable-pty = "0.9"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest = { version = "0.13", features = ["json", "stream", "query", "form"] }
base64 = "0.22"
sha2 = "0.10"
ring = "0.17"
tokio-tungstenite = "0.28"
trash = "5"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Integration tests assume verified UI admission through the restricted test seam.
apex-host = { path = ".", features = ["test-support"] }

[features]
# Explicit in-process fixtures only; no environment or CLI switch enables this.
test-support = []
