.agents-section .agent-card { background: var(--panel-2); }
.agents-section .agent-library .empty { margin: 0; }

/* Run a code block: the ▶ beside Copy, and the output box under the block. */
.md-code-head .code-run-button { color: var(--accent); }
.md-code-head .code-run-button.armed { color: var(--warn, #e0a030); font-weight: 600; }
.md-code-run-box { border-top: 1px solid var(--line); font-size: 11px; }
.md-code-run-bar { display: flex; align-items: center; gap: 8px; padding: 2px 4px 2px 12px; color: var(--muted); line-height: 1.6; flex-wrap: wrap; }
.md-code-run-status { color: var(--text); font-weight: 500; }
.md-code-run-box.failed .md-code-run-status { color: var(--danger, #e5534b); }
.md-code-run-host { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.md-code-run-actions { display: flex; align-items: center; gap: 2px; }
.md-code-run-actions button { border: 0; background: transparent; color: var(--muted); font-size: 11px; padding: 3px 8px; }
.md-code-run-actions button:hover, .md-code-run-actions button:focus-visible { color: var(--text); }
.md-code .md-code-run { max-height: 160px; overflow: auto; padding: 8px 12px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 60%, transparent); white-space: pre-wrap; word-break: break-word; font-size: 12px; }
.md-code-run-cut, .md-code-run-empty { color: var(--muted); font-style: italic; }

/* Clay's reading-column geometry is shared by every desktop theme.
   Keep the same 24px floor on both sides, including in narrow panes. */
.thread-chat .composer-box {
  flex-wrap: wrap;
  align-items: center;
  padding: 6px 8px 6px 10px;
}
.thread-chat .composer-box > .composer-field { order: -1; flex-basis: 100%; }
.thread-chat .composer-box > .composer-field > textarea { min-height: 44px; }
.thread-chat .composer-box > .composer-tools { margin: 0 auto 0 0; }
.thread-chat .composer-box > :is(.tldr-pill, button.round-send, .plan-chip) { align-self: center; margin-bottom: 0; }
.thread-chat .composer-box.adding {
  align-items: stretch;
  padding: 0;
}

/* Active threads reserve a bottom row outside the transcript scrollport. */
.thread-chat:not(.thread-landing) > .composer {
  flex-shrink: 0;
  border-top: 1px solid var(--line);
  background: var(--bg);
}

/* Only the empty rain texture extends beneath the composer. */
.thread-chat.thread-landing > .composer {
  flex-shrink: 0;
  border-top: 0;
  background: transparent;
  /* The strip is a gutter, not a surface: let clicks beside the box fall
     through to the texture instead of dying on an invisible band. */
  pointer-events: none;
}

.thread-chat.thread-landing > .composer > * {
  pointer-events: auto;
}

.thread-chat.thread-landing .chat-body > .transcript {
  /* Keep welcome copy inside the available scrollport in short split panes.
     The absolutely positioned landing texture extends beneath the composer. */
  padding-bottom: 24px;
  scroll-padding-bottom: 24px;
}

.thread-chat.thread-landing .transcript > .empty {
  flex-shrink: 0;
}

.thread-chat > .composer,
.thread-chat .chat-body > .transcript {
  padding-inline: max(24px, calc((100% - var(--deck-message-width, 44rem)) / 2));
}

.identicon i {
  /* dots fade between scramble frames */
  transition: background-color .08s ease;
}

@media (prefers-reduced-motion: reduce) {
  .identicon i {
    transition: none;
  }
}

/* Usage resets a provider granted, in a bot's quick menu: a collapsed row that opens like Model. */
.quick-resets { display: grid; gap: 6px; }
.quick-resets-trigger:disabled { cursor: default; opacity: 0.6; }
.quick-resets-next { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; cursor: help; }
.reset-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); font-size: 11px; font-weight: 700; }
.reset-credits { display: grid; gap: 6px; }
.reset-credit { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.reset-credit.soon { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.reset-credit-title { font-size: 12px; font-weight: 600; }
.reset-credit-expiry { grid-column: 1; width: max-content; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; cursor: help; border-bottom: 1px dotted color-mix(in srgb, var(--muted) 50%, transparent); }
.reset-credit.soon .reset-credit-expiry { color: var(--warn); }
.reset-credit-use { grid-row: 1 / span 2; grid-column: 2; padding: 3px 10px; font-size: 12px; }
.reset-more { margin: 0; font-size: 11px; }
.reset-confirm { display: grid; gap: 8px; padding: 10px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 8px; background: var(--panel); font-size: 12px; }
.reset-confirm p { margin: 0; color: var(--muted); }
.reset-confirm p b { color: var(--text); font-weight: 600; }
.reset-confirm .reset-warn { color: var(--warn); }
.reset-confirm-actions { display: flex; justify-content: flex-end; gap: 6px; }
.reset-confirm-actions button { padding: 3px 10px; font-size: 12px; }
.reset-go { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.reset-status { margin: 0; font-size: 12px; }
.reset-status.good { color: var(--accent); }
.reset-status.meh { color: var(--warn); }
.reset-tip { position: fixed; z-index: 1100; pointer-events: none; min-width: 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); box-shadow: 0 8px 24px rgb(0 0 0 / 45%); font-size: 12px; }
.reset-tip-key { color: var(--muted); font-size: 11px; }
.reset-tip-value { font-variant-numeric: tabular-nums; }
.reset-tip-value + .reset-tip-key { margin-top: 4px; }

/* Automatic updates: the ready and after-restart notices are rows under the title bar, never over a composer. */

.settings-advanced { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-top: 14px; overflow: hidden; }
.settings-advanced > summary { padding: 16px 20px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--text); list-style: none; display: flex; align-items: center; gap: 8px; }
.settings-advanced > summary::before { content: '›'; display: inline-block; width: 12px; transition: transform .15s; }
.settings-advanced[open] > summary::before { transform: rotate(90deg); }
.settings-advanced[open] > summary { border-bottom: 1px solid var(--line); }
.settings-advanced .advanced-body { padding: 0; }
.settings-advanced .settings-row { padding-left: 20px; padding-right: 20px; }

.settings-card.search-highlight, .search-highlight { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.settings-row.search-highlight { animation: settings-highlight 2.2s ease; }
@keyframes settings-highlight { 0% { background: color-mix(in srgb, var(--accent) 20%, transparent); } 100% { background: transparent; } }

.settings-search-results .settings-head h2 { margin: 0; }
.search-results-card { padding: 0; overflow: hidden; }
.search-result { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; padding: 14px 18px; border: 0; border-bottom: 1px solid var(--line); background: var(--panel); border-radius: 0; }
.search-result:last-child { border-bottom: 0; }
.search-result:hover { background: var(--panel-2); }
.search-result strong { font-size: 13px; }
.search-result span { font-size: 11px; color: var(--muted); }
.settings-empty { padding: 32px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.settings-empty strong { color: var(--text); }

.appearance-mode-card { padding: 18px 20px; }
.mode-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.mode-card { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); text-align: left; min-width: 0; }
.mode-card.selected { border-color: var(--accent); border-width: 2px; padding: 11px; background: color-mix(in srgb, var(--accent) 10%, var(--panel-2)); }
.mode-card .mini-preview { height: 72px; border-radius: 6px; border: 1px solid var(--line); background: #f8fafb; display: flex; overflow: hidden; }
.mode-card .mini-preview.night { background: #000; border-color: #333; }
.mode-card .mini-preview.night .mini-side { background: #111; border-color: #333; }
.mode-card .mini-preview.night i { background: #555; }
.mode-card .mini-preview.auto { background: linear-gradient(90deg,#f8fafb 50%,#000 50%); }
.mode-card .mini-preview .mini-side { width: 28%; background: #e6edf0; border-right: 1px solid #d4dce0; padding: 8px 5px; display: flex; flex-direction: column; gap: 5px; }
.mode-card .mini-preview .mini-main { flex: 1; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; }
.mode-card .mini-preview i { display: block; height: 4px; background: #bccbd0; border-radius: 3px; }
.mode-card .mini-preview .mini-main b { height: 18px; display: block; background: #dcefed; border-radius: 4px; margin-top: auto; border: 1px solid #a8cecb; }
.mode-card .mode-name { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-top: 4px; }
.mode-card .mode-name .tick { color: var(--accent); }
.mode-card small { font-size: 11px; color: var(--muted); line-height: 1.4; }

.inline-options { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
.inline-options button { border: 0; background: transparent; padding: 6px 10px; font-size: 12px; color: var(--muted); border-radius: 5px; }
.inline-options button[aria-pressed=true] { background: var(--panel-2); color: var(--text); box-shadow: 0 1px 2px #0003; border: 1px solid var(--line); }

.settings-footer-save { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); min-height: 20px; }
.save-indicator { font-size: 12px; color: var(--muted); }
.save-indicator.saving { color: var(--muted); }
.save-indicator.saved { color: var(--accent); }
.save-indicator.error { color: var(--danger); }

.settings-card .provider-toggle { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.settings-card .provider-toggle:last-child { border-bottom: 0; }
.settings-card .provider-toggle input { margin-top: 3px; }

.appearance-note { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.voice-seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; }
.voice-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 5px; font-size: 12px; color: var(--muted); }
.voice-seg button[aria-pressed=true] { background: var(--panel-2); color: var(--text); box-shadow: 0 1px 2px #0003; border: 1px solid var(--line); }

@media (max-width: 860px) {
  .settings-nav.settings-nav-v2 { width: 100%; flex: none; border-right: 0; border-bottom: 1px solid var(--line); }
  .settings-nav-v2 nav { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .settings-nav-v2 details { margin-top: 0; }
  .settings-nav-v2 summary { white-space: nowrap; }
  .settings-nav-v2 .nav-group { flex-direction: row; padding: 0; }
  .settings.settings-v2 { flex-direction: column; }
  .settings-main { padding: 18px 16px; }
  .mode-grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .mode-grid { gap: 8px; }
  .settings-row { flex-direction: column; align-items: stretch; gap: 10px; }
  .settings-label { max-width: none; }
}


/* Serif replies in the themes whose own reply face is sans. Same rules as Clay's
   reading layout: reply text only, code and tables keep their own faces. */
:root[data-deck-reply="serif"] {
  --deck-font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --deck-font-reading: "Iowan Old Style", Charter, "Source Serif 4", Georgia, serif;
  --deck-reading-size: calc(13px + 3px * var(--deck-density, 1));
}
:root[data-deck-reply="serif"] .bubble.bot > :is(.md, .draft-text) {
  font-family: var(--deck-font-reading);
  font-size: var(--deck-reading-size);
  line-height: 1.62;
}
:root[data-deck-reply="serif"] .bubble.bot :is(.md-code, .md-table) {
  font-family: var(--deck-font-ui);
  font-size: 13px;
}

/* Optional glass appearance. Classic has no matching root selector, so it
   continues to use the existing styles unchanged. */
:root[data-deck-theme="glass"],
:root[data-deck-theme="flat"] {
  --deck-bg: #000000;
  --deck-panel: 16 16 16;
  --deck-panel-raised: 24 24 24;
  --deck-code: #101010;
  --deck-line: 255 255 255;
  --deck-text: #f5f5f5;
  --deck-muted: #aaaaaa;
  --deck-warning: #f59e0b;
  --deck-danger: #f87171;
  --deck-accent: var(--deck-custom-accent, oklch(.85 .13 var(--deck-hue, 172)));
  --deck-accent-ink: var(--deck-custom-accent-ink, #04211d);
  --deck-glass-fill: rgb(var(--deck-panel) / var(--deck-opacity, .44));
  --deck-edge: rgb(255 255 255 / .14);
  --bg: var(--deck-bg);
  --panel: rgb(var(--deck-panel));
  --panel-2: rgb(var(--deck-panel-raised));
  --line: rgb(255 255 255 / .14);
  --text: var(--deck-text);
  --muted: var(--deck-muted);
  --accent: var(--deck-accent);
  --accent-ink: var(--deck-accent-ink);
  --warn: var(--deck-warning);
  --danger: var(--deck-danger);
  --radius: var(--deck-radius, 12px);
  color-scheme: dark;
}

:root[data-deck-light="true"][data-deck-theme="glass"],
:root[data-deck-light="true"][data-deck-theme="flat"] {
  --deck-bg: #d9e4ec;
  --deck-panel: 247 250 252;
  --deck-panel-raised: 236 243 247;
  --deck-code: #e9f0f5;
  --deck-line: 20 40 58;
  --deck-text: #142636;
  --deck-muted: #475d6e;
  --deck-warning: #a76000;
  --deck-danger: #b3261e;
  --deck-accent: var(--deck-custom-accent, oklch(.47 .12 var(--deck-hue, 172)));
  --deck-accent-ink: var(--deck-custom-accent-ink, #fff);
  --deck-edge: rgb(20 40 58 / .14);
  --bg: var(--deck-bg);
  --panel: rgb(var(--deck-panel));
  --panel-2: rgb(var(--deck-panel-raised));
  --line: rgb(var(--deck-line) / .15);
  --text: var(--deck-text);
  --muted: var(--deck-muted);
  --accent: var(--deck-accent);
  --accent-ink: var(--deck-accent-ink);
  --warn: var(--deck-warning);
  --danger: var(--deck-danger);
  color-scheme: light;
}

:root[data-deck-theme="glass"] {
  --deck-backdrop-image:
    radial-gradient(ellipse at 12% 4%, oklch(.56 .14 var(--deck-hue, 172) / var(--deck-backdrop, .5)), transparent 46%),
    radial-gradient(ellipse at 93% 17%, oklch(.46 .15 calc(var(--deck-hue, 172) + 75) / calc(var(--deck-backdrop, .5) * .8)), transparent 42%),
    radial-gradient(ellipse at 52% 100%, oklch(.5 .12 calc(var(--deck-hue, 172) - 55) / calc(var(--deck-backdrop, .5) * .72)), transparent 48%);
}
:root[data-deck-light="true"][data-deck-theme="glass"] {
  --deck-backdrop-image:
    radial-gradient(ellipse at 12% 4%, oklch(.86 .09 var(--deck-hue, 172) / var(--deck-backdrop, .5)), transparent 46%),
    radial-gradient(ellipse at 93% 17%, oklch(.84 .1 calc(var(--deck-hue, 172) + 75) / calc(var(--deck-backdrop, .5) * .8)), transparent 42%),
    radial-gradient(ellipse at 52% 100%, oklch(.87 .08 calc(var(--deck-hue, 172) - 55) / calc(var(--deck-backdrop, .5) * .72)), transparent 48%);
}
/* Settings and full-window panels cover the deck, so they repaint the same
   backdrop instead of showing the threads underneath. */
:root[data-deck-theme="glass"] :is(body, .settings, .preview.full-window, .artifacts-panel.full-window, .artifacts-panel.mod-dock.maximized) {
  background-color: var(--deck-bg);
  background-image: var(--deck-backdrop-image);
  background-size: var(--deck-backdrop-size, auto);
  background-attachment: fixed;
}

/* Frost and Liquid share one surface treatment; the numeric controls only
   change its fill, blur, corner size, backdrop and spacing. */
:root[data-deck-theme="glass"] :is(.pane, .rail, .assistant-workspace, .thread, .thread-details, .composer-box, .md-code, .approval-plan, .quote-preview, .queued-inline) {
  border-radius: var(--deck-radius, 12px);
  -webkit-backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
  backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
}
:root[data-deck-theme="glass"] :is(.pane, .rail, .assistant-workspace, .thread-details, .composer-box, .md-code, .quote-preview, .queued-inline) {
  background-color: var(--deck-glass-fill);
  border-color: var(--deck-edge);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .12), 0 14px 38px -28px rgb(0 0 0 / .7);
}
:root[data-deck-theme="glass"] .thread-details { border-left-color: var(--deck-edge); }
/* One frame for every surface: the sidebar, panes and docked details share
   the same compact gap on every skin, including Classic. */
:root { --deck-gap: 8px; }
:root .canvas { padding: var(--deck-gap); }
:root :is(.rail, .thread-details.docked) {
  margin-block: var(--deck-gap);
  border: 1px solid var(--deck-edge, var(--line));
  border-radius: var(--radius);
}
:root .rail { margin-left: var(--deck-gap); }
:root .thread-details.docked { margin-right: var(--deck-gap); }
/* The overlay's resize handle sits on its inset left edge and spans only its height;
   App.tsx adds --deck-gap to the handle's right offset. */
:root .sidebar-handle.overlay { top: var(--deck-gap); bottom: var(--deck-gap); }
:root .thread-details.overlay { inset: var(--deck-gap) var(--deck-gap) var(--deck-gap) auto; border: 1px solid var(--deck-edge, var(--line)); border-radius: var(--radius); }
/* The title bar stays unpainted, letting the backdrop show through. */
:root[data-deck-theme="glass"] .titlebar {
  position: relative;
  z-index: 1;
  background: transparent;
  border-bottom: 0;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: none;
}
/* Keep the title bar's New action visible without letting it compete with
   the section switcher. */
:root[data-deck-theme="glass"] .titlebar button.titlebar-new {
  background: transparent;
  border-color: transparent;
  color: var(--muted);
  border-radius: max(8px, calc(var(--deck-radius, 12px) * .75));
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: none;
}
:root[data-deck-theme="glass"] .titlebar button.titlebar-new:hover:not(:disabled) {
  background: var(--deck-well-fill);
  border-color: var(--deck-edge);
  color: var(--text);
  box-shadow: none;
}
:root[data-deck-theme="glass"] .titlebar button.titlebar-new:disabled { box-shadow: none; }
/* Title-bar icons stay unboxed; open panels are indicated by a flat fill. */
:root[data-deck-theme="glass"] .titlebar > .titlebar-start > button.icon,
:root[data-deck-theme="glass"] .titlebar > .titlebar-end > button.icon {
  background: transparent;
  border-color: transparent;
  border-radius: max(8px, calc(var(--deck-radius, 12px) * .75));
  -webkit-backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
  backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
  box-shadow: none;
  min-width: calc(34px * var(--tb-scale));
  min-height: calc(34px * var(--tb-scale));
}
:root[data-deck-theme="glass"] .titlebar > .titlebar-start > button.icon:hover:not(:disabled),
:root[data-deck-theme="glass"] .titlebar > .titlebar-end > button.icon:hover:not(:disabled),
:root[data-deck-theme="glass"] .titlebar > .titlebar-start > button.icon:is(.active, [aria-expanded="true"]),
:root[data-deck-theme="glass"] .titlebar > .titlebar-end > button.icon:is(.active, [aria-expanded="true"]) {
  background: var(--deck-well-fill);
  border-color: transparent;
  color: var(--text);
  box-shadow: none;
}
:root[data-deck-theme="glass"] :is(.section-navigation, .layout-presets) {
  background: rgb(var(--deck-panel) / calc(var(--deck-opacity, .44) * .6));
  border-color: var(--deck-edge);
  border-radius: max(8px, calc(var(--deck-radius, 12px) * .75));
}
:root[data-deck-theme="glass"] .section-navigation {
  gap: 0;
  padding: 2px;
  background: rgb(var(--deck-panel) / calc(var(--deck-opacity, .44) * .6));
  border: 1px solid var(--deck-edge);
  border-radius: max(8px, calc(var(--deck-radius, 12px) * .75));
}
:root[data-deck-theme="glass"] .titlebar .section-button:hover:not(:disabled):not(.selected) {
  background: transparent;
  border: 0;
  box-shadow: none;
}
:root[data-deck-theme="glass"] :is(.section-button.selected, .layout-presets button:hover:not(:disabled)) {
  background: rgb(var(--deck-panel-raised) / calc(.35 + .6 * var(--deck-opacity, .44)));
  border-color: var(--deck-edge);
}
:root[data-deck-theme="glass"] .section-button.selected {
  border-radius: max(6px, calc(var(--deck-radius, 12px) * .6));
  border: 0;
  background: var(--accent);
  color: var(--text);
  box-shadow: none;
}
:root[data-deck-theme="glass"] .titlebar .section-button.selected > span {
  color: var(--text);
}
:root[data-deck-theme="glass"] .pane-head,
:root[data-deck-theme="glass"] .composer { background: transparent; }
:root[data-deck-theme="glass"] .layout-presets {
  border: 0;
  background: transparent;
  gap: 2px;
}
:root[data-deck-theme="glass"] .layout-presets button,
:root[data-deck-theme="glass"] .layout-presets button + button {
  border: 0;
  background: transparent;
  box-shadow: none;
}
:root[data-deck-theme="glass"] .layout-presets button:hover:not(:disabled),
:root[data-deck-theme="glass"] .layout-presets button[aria-pressed="true"] {
  border-color: transparent;
  background: var(--deck-well-fill);
  color: var(--text);
  box-shadow: none;
}
:root[data-deck-theme="glass"] .rail-controls button.icon {
  border-color: transparent;
  background: transparent;
  box-shadow: none;
}
:root[data-deck-theme="glass"] .rail-controls button.icon:is(:hover, .active, [aria-pressed="true"]):not(:disabled) {
  border-color: transparent;
  background: var(--deck-well-fill);
  box-shadow: none;
}
:root[data-deck-theme="glass"] .pane-head { border-color: var(--deck-edge); }
:root[data-deck-theme="glass"] .bubble.bot {
  background: rgb(var(--deck-panel-raised) / calc(.35 + .6 * var(--deck-opacity, .44)));
  border: 1px solid var(--deck-edge);
  border-radius: var(--deck-radius, 12px);
  -webkit-backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
  backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
}
:root[data-deck-theme="glass"] .bubble.human {
  border-radius: var(--deck-radius, 12px);
  border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--deck-edge));
  -webkit-backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
  backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
}
:root[data-deck-theme="glass"] .composer-box {
  --box: rgb(var(--deck-panel-raised) / var(--deck-opacity, .44));
  border-color: var(--deck-edge);
}
/* The shared placeholder grey fails on Liquid's light surfaces. Plan and TL;DR
   keep their own tints. */
:root:is([data-deck-theme="glass"], [data-deck-theme="flat"]) .composer:not(.tldr, .plan) .composer-box textarea::placeholder {
  color: var(--deck-muted);
}
:root[data-deck-theme="glass"] :is(.md-code, .md-code pre, .approval-detail, .diff, .answer-command) {
  background: color-mix(in srgb, var(--deck-code) 88%, transparent);
  color: var(--deck-text);
  border-color: var(--deck-edge);
}
:root[data-deck-theme="glass"] :is(.muted, .head-state, .details-head p, .approval-note, .approval-deadline, .approval-scope) {
  color: var(--deck-muted);
}
:root[data-deck-theme="glass"] .speaker { color: var(--agent-color, var(--accent)); }
:root[data-deck-theme="glass"] :is(.rail-row[aria-current="page"], .chip.to, .pin, .folder-chip, .tray, .steps .step) {
  border-radius: max(5px, calc(var(--deck-radius, 12px) * .48));
}
:root[data-deck-theme="glass"] :is(.work-steps button, .work-steps-toggle, .work-steps-output, .work-steps-helper) {
  border-radius: max(5px, calc(var(--deck-radius, 12px) * .48));
}
:root[data-deck-theme="glass"] .work-steps-output {
  background: color-mix(in srgb, var(--deck-code) 88%, transparent);
  border-color: var(--deck-edge);
  color: var(--deck-muted);
}
:root[data-deck-theme="glass"] :is(.work-steps-helper, .work-steps-detail) { border-color: var(--deck-edge); }
:root[data-deck-theme="glass"] :is(.pane, .rail, .thread-details, .thread, .bubble, .composer-box, .pin, .details-bot, .md-code, .quote-preview, .folder-chip, .chip) {
  border-radius: var(--deck-radius, 12px);
}
:root[data-deck-theme="glass"] :is(.pane-head, .pins, .details-section-body) {
  padding-block: calc(8px * var(--deck-density, 1));
}
:root[data-deck-theme="glass"] .bubble { padding-block: calc(10px * var(--deck-density, 1) + 2px); }

/* Menus, popovers and dialogs float over text. Most open inside a pane that
   already blurs, and a blur inside a blur can't see past its parent, so these
   keep the tint and edge but stay nearly solid to remain readable.
   Dialogs (.confirm) are the exception: they sit on their own blurred backdrop,
   see the rule after this one. */
:root[data-deck-theme="glass"] :is(.composer-menu, .pane-menu, .hover-card, .usage-card, .bot-settings, .quick-add, .workspace-machine-menu,
  .new-menu-list, .link-menu, .review-menu, .artifact-menu, .model-menu, .selection-actions, .steer-pop, .mod-status-menu,
  .host-menu, .attention-list, .proj-picker, .confirm, .toast, .mod-toast, .mod-modal, .library-viewer) {
  --deck-pop: rgb(var(--deck-panel-raised) / max(.96, var(--deck-opacity, .44)));
  background: linear-gradient(165deg, oklch(.8 .1 var(--deck-hue, 172) / .07), transparent 60%), var(--deck-pop);
  border-radius: max(8px, calc(var(--deck-radius, 12px) * .6));
  -webkit-backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
  backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .12), 0 18px 44px -18px rgb(0 0 0 / .6);
}
:root[data-deck-theme="glass"] .confirm-backdrop {
  background: rgb(0 0 0 / .28);
  -webkit-backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
  backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
}
/* Floor of .75 so text stays readable when Blur is 0 and the page behind is sharp. */
:root[data-deck-theme="glass"] .confirm-backdrop > .confirm {
  --deck-pop: rgb(var(--deck-panel-raised) / max(.75, var(--deck-opacity, .44)));
}
:root[data-deck-theme="glass"] .proj-picker .list-wrap.fade::after { background: linear-gradient(transparent, var(--deck-pop)); }

/* Side panels, cards and strips let the backdrop through like the panes. */
:root[data-deck-theme="glass"] :is(.settings-nav, .settings-card, .artifacts-panel, .preview, .changes, .agent-card, .library-tile, .mod-card,
  .add-form, .connection-banner, .terminal-bar, .folder-list, .pins, .qform, .move-ask, .conn-retarget, .answer-strip) {
  background-color: var(--deck-glass-fill);
  -webkit-backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
  backdrop-filter: blur(var(--deck-blur, 0px)) saturate(1.2);
}
:root[data-deck-theme="glass"] :is(.settings-card, .agent-card, .library-tile, .mod-card) {
  border-radius: var(--deck-radius, 12px);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .1), 0 14px 38px -28px rgb(0 0 0 / .7);
}
:root[data-deck-theme="glass"] .settings-nav { border-right-color: var(--deck-edge); }

/* Changes already sits inside the frosted details rail. Avoid stacking a
   second panel fill, and let expanded patches use the chosen glass settings. */
:root[data-deck-theme="glass"] .thread-details .changes {
  background: transparent;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
:root[data-deck-theme="glass"] .thread-details .changes .diff {
  background: rgb(var(--deck-panel-raised) / var(--deck-opacity, .44));

/* Small controls. :where() keeps each override at its base rule's

:where(:root[data-deck-theme="glass"]) {

:where(:root[data-deck-theme="glass"]) input,
:where(:root[data-deck-theme="glass"]) select,
:where(:root[data-deck-theme="glass"]) textarea,
:where(:root[data-deck-theme="glass"]) .stepper,
:where(:root[data-deck-theme="glass"]) .count,
:where(:root[data-deck-theme="glass"]) kbd,
:where(:root[data-deck-theme="glass"]) .quick-add-tools,
:where(:root[data-deck-theme="glass"]) .artifacts-tabs,

:where(:root[data-deck-theme="glass"]) .pair-thread-list,
:where(:root[data-deck-theme="glass"]) .new-menu-filter,
:where(:root[data-deck-theme="glass"]) .settings-row select,

:where(:root[data-deck-theme="glass"]) .stepper button,
:where(:root[data-deck-theme="glass"]) .quick-add-tools button.on,
:where(:root[data-deck-theme="glass"]) .starters button,
:where(:root[data-deck-theme="glass"]) .allowed-list li,
:where(:root[data-deck-theme="glass"]) .example-row,
:where(:root[data-deck-theme="glass"]) .answer-command,
:where(:root[data-deck-theme="glass"]) .ws-row.active,
:where(:root[data-deck-theme="glass"]) .ws-row.lit,
:where(:root[data-deck-theme="glass"]) .pane-row.lit,
:where(:root[data-deck-theme="glass"]) .settings-nav nav button.active,
:where(:root[data-deck-theme="glass"]) .artifacts-tabs button[aria-selected="true"],
:where(:root[data-deck-theme="glass"]) .artifacts-kind,

:where(:root[data-deck-theme="glass"]) .titlebar button.icon.active,

:where(:root[data-deck-theme="glass"]) .provider-grid label:hover,
:where(:root[data-deck-theme="glass"]) .preview-servers button:hover,
:where(:root[data-deck-theme="glass"]) .artifacts-list button:hover,
:where(:root[data-deck-theme="glass"]) .mod-status-menu button:hover,
:where(:root[data-deck-theme="glass"]) .transcript-pill:hover:not(:disabled),

:where(:root[data-deck-theme="glass"]) .pane-ws { background: var(--deck-raised-fill); }
:where(:root[data-deck-theme="glass"]) .pane-ws .fold { --cut: transparent; }

/* The empty-thread card, its emblem and the human bubble had fixed dark
   greens; tie them to the accent so they read on Frost too. */
:where(:is(:root[data-deck-theme="glass"], :root[data-deck-theme="flat"])) .empty-emblem {
  background: color-mix(in srgb, var(--accent) 14%, var(--deck-raised-fill, var(--panel-2)));

}
:where(:is(:root[data-deck-theme="glass"], :root[data-deck-theme="flat"])) .picker-grid.single button {

}
:where(:is(:root[data-deck-theme="glass"], :root[data-deck-theme="flat"])) .picker-grid.single button:hover {
  background: color-mix(in srgb, var(--accent) 18%, var(--deck-raised-fill, var(--panel-2)));
}
:where(:is(:root[data-deck-theme="glass"], :root[data-deck-theme="flat"])) .bubble.human {
  background: color-mix(in srgb, var(--accent) 16%, var(--deck-raised-fill, var(--panel-2)));
}

:where(:root[data-deck-light="true"]:is([data-deck-theme="glass"], [data-deck-theme="flat"])) :is(.details-backdrop, .artifacts-backdrop) { background: rgb(20 40 58 / .12); }

/* Files tab: the toolbar and preview paint an opaque panel fill that reads
   as white strips over the glass sidebar. Let the panel fill show through. */
:root[data-deck-theme="glass"] :is(.right-files-toolbar, .right-files-preview, .file-editor .cm-gutters) {
  background: transparent;
  border-color: var(--deck-edge);
}

/* Flat keeps the selected palette and radius while returning to solid panels.
   Zeroing these here also disables activity bloom and animated edge light. */
:root[data-deck-theme="flat"] {
  --deck-glow: 0;
  --deck-blur: 0px;
}
:root[data-deck-theme="flat"] body { background: var(--deck-bg); }
:root[data-deck-theme="flat"] :is(.pane, .rail, .thread-details, .composer-box, .md-code, .bubble.bot, .bubble.human) {
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: none;
}
:root[data-deck-theme="flat"] .bubble.bot { background: var(--panel-2); }
:root[data-deck-theme="flat"] .composer-box { background: var(--panel-2); }

/* Activity comes from real draft/ask state on the bubble. A completed reply
   carries its agent color as metadata, but stays quiet. */
:root[data-deck-theme="glass"] .bubble.bot[data-activity="working"] {
  --activity-color: var(--agent-color, var(--accent));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--activity-color) calc(70% * var(--deck-glow, 0)), transparent),
    0 0 calc(34px * var(--deck-glow, 0)) -12px color-mix(in srgb, var(--activity-color) calc(75% * var(--deck-glow, 0)), transparent),
    inset 0 1px 0 rgb(255 255 255 / .12);
}
:root[data-deck-theme="glass"] .bubble.bot[data-activity="waiting"] {
  box-shadow: 0 0 0 1px color-mix(in srgb, #f59e0b calc(65% * var(--deck-glow, 0)), transparent),
    0 0 calc(28px * var(--deck-glow, 0)) -10px color-mix(in srgb, #f59e0b calc(72% * var(--deck-glow, 0)), transparent),
    inset 0 1px 0 rgb(255 255 255 / .12);
}

/* Approval cards are the safety boundary: solid amber surfaces and fixed
   action colors stay readable regardless of imported hue/frost values.
   Clay joins here so its warm palette can never recolor an approval. */
:root[data-deck-theme="glass"] .approval,
:root[data-deck-theme="flat"] .approval,
:root[data-deck-theme="clay"] .approval {
  background: #fff4d6;
  color: #2d220d;
  border: 1px solid #d18a00;
  border-radius: 10px;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: 0 0 0 1px rgb(209 138 0 / .18), 0 0 calc(22px * var(--deck-glow, 0)) -8px #d18a00;
  font-size: max(12px, 1em);
}
:root[data-deck-theme="glass"] .approval :is(.approval-host, .approval-kind, .approval-head strong, .approval-detail, .approval-scope, .approval-note, .approval-deadline, .approval-plan, [role="alert"]) ,
:root[data-deck-theme="flat"] .approval :is(.approval-host, .approval-kind, .approval-head strong, .approval-detail, .approval-scope, .approval-note, .approval-deadline, .approval-plan, [role="alert"]),
:root[data-deck-theme="clay"] .approval :is(.approval-host, .approval-kind, .approval-head strong, .approval-detail, .approval-scope, .approval-note, .approval-deadline, .approval-plan, [role="alert"]) {
  color: #2d220d;
  font-size: max(12px, 1em);
}
:root[data-deck-theme="glass"] .approval :is(.approval-head, .approval-detail, .approval-actions, .approval-scope, .approval-plan),
:root[data-deck-theme="flat"] .approval :is(.approval-head, .approval-detail, .approval-actions, .approval-scope, .approval-plan),
:root[data-deck-theme="clay"] .approval :is(.approval-head, .approval-detail, .approval-actions, .approval-scope, .approval-plan) {
  background: #fff4d6;
  border-color: #e2bd68;
}
:root[data-deck-theme="glass"] .approval .approval-kind,
:root[data-deck-theme="flat"] .approval .approval-kind,
:root[data-deck-theme="clay"] .approval .approval-kind { color: #805000; }
/* The base diff colors suit dark surfaces; light approval diffs need deeper ink. */
:root[data-deck-light="true"]:is([data-deck-theme="glass"], [data-deck-theme="flat"], [data-deck-theme="clay"]) .approval .diff-line.add {
  color: #14532d;
}
:root[data-deck-light="true"]:is([data-deck-theme="glass"], [data-deck-theme="flat"], [data-deck-theme="clay"]) .approval .diff-line.del {
  color: #7f1d1d;
}
:root[data-deck-theme="glass"] .approval-actions button[data-answer="once"],
:root[data-deck-theme="glass"] .approval-actions button[data-answer="always"],
:root[data-deck-theme="flat"] .approval-actions button[data-answer="once"],
:root[data-deck-theme="flat"] .approval-actions button[data-answer="always"],
:root[data-deck-theme="clay"] .approval-actions button[data-answer="once"],
:root[data-deck-theme="clay"] .approval-actions button[data-answer="always"] {
  background: #9a5b00;
  border-color: #9a5b00;
  color: #fff;
  font-size: max(12px, 1em);
}
:root[data-deck-theme="glass"] .approval-actions button[data-answer="deny"],
:root[data-deck-theme="flat"] .approval-actions button[data-answer="deny"],
:root[data-deck-theme="clay"] .approval-actions button[data-answer="deny"] {
  background: #fff4d6;
  border-color: #a3261e;
  color: #8b211b;
  font-size: max(12px, 1em);
}

/* Plans are review content: follow the active palette, keeping an amber
   boundary and explicit decisions. Other permission cards retain the solid
   safety treatment above. Scope these rules to plans in every skin. */
:root .approval.approval-plan-card {
  background: var(--panel);
  color: var(--text);
  border-color: color-mix(in srgb, var(--warn) 55%, var(--line));
  box-shadow: none;
}
:root .approval.approval-plan-card :is(.approval-head, .approval-actions, .approval-plan) {
  background: transparent;
  border-color: var(--line);
  color: var(--text);
}
:root .approval.approval-plan-card .approval-head strong { color: var(--text); }
:root .approval.approval-plan-card :is(.approval-host, .approval-note, .approval-deadline, .approval-scope) { color: var(--muted); }
:root .approval.approval-plan-card .approval-kind { color: var(--warn); }
:root .approval.approval-plan-card [role="alert"] { color: var(--danger); }
:root .approval.approval-plan-card .approval-actions button[data-answer="once"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
:root .approval.approval-plan-card .approval-actions button[data-answer="deny"] {
  background: transparent;
  border-color: var(--line);
  color: var(--text);
}

@media (prefers-reduced-motion: reduce) {
}

/* Panel edges: Strong. Clay has its own rule beside its tokens. */
:root[data-deck-theme="classic"][data-deck-edges="strong"] { --line: #3f3f3f; }
:root[data-deck-theme="glass"][data-deck-edges="strong"],
:root[data-deck-theme="flat"][data-deck-edges="strong"] { --line: rgb(var(--deck-line) / .3); }

/* Clay: a solid, warm theme layer beside glass and flat, with an opt-in Black palette. Clean-room and
   Claude-inspired in feel only — system/open fonts, no copied code or
   assets. Classic, Glass and Flat have no matching selectors here and are
   untouched. Surfaces are opaque (no blur, no backdrop glow), bot replies
   set in a reading serif, and one hue-derived accent stays readable as
   text in both modes: light with dark ink on Ember, dark with light ink
   on Paper. Approval cards deliberately keep the shared amber safety
   treatment in glass-theme.css. */
:root[data-deck-theme="clay"] {
  --deck-bg: #262421;
  --deck-panel: 30 28 26;
  --deck-panel-raised: 48 45 41;
  --deck-code: #1b1917;
  --deck-line: 239 233 224;
  --deck-text: #efe9e0;
  --deck-muted: #c2b9ad;
  --deck-muted-2: #ada294;
  --deck-warning: #e6b562;
  --deck-danger: #f0907f;
  --deck-success: #9dc79b;
  --deck-accent: var(--deck-custom-accent, oklch(.83 .08 var(--deck-hue, 38)));
  --deck-accent-ink: var(--deck-custom-accent-ink, #2a1e16);
  --deck-accent-text: var(--deck-accent);
  --deck-accent-soft: color-mix(in srgb, var(--deck-accent) 16%, var(--deck-bg));
  --deck-selected: #3a3630;
  --deck-human-fill: #38332d;
  --deck-human-line: color-mix(in srgb, var(--deck-human-fill) 92%, var(--deck-text));
  --deck-surface-sunken: var(--deck-code);
  --deck-edge: #544e46;
  --deck-glow: 0;
  --deck-blur: 0px;
  --deck-font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --deck-font-reading: "Iowan Old Style", Charter, "Source Serif 4", Georgia, serif;
  --deck-reading-size: calc(13px + 3px * var(--deck-density, 1));
  --deck-message-width: 44rem;
  --bg: var(--deck-bg);
  --panel: rgb(var(--deck-panel));
  --panel-2: rgb(var(--deck-panel-raised));
  --line: #3b3732;
  --text: var(--deck-text);
  --muted: var(--deck-muted);
  --accent: var(--deck-accent);
  --accent-ink: var(--deck-accent-ink);
  --warn: var(--deck-warning);
  --danger: var(--deck-danger);
  --radius: var(--deck-radius, 10px);
  --plus: var(--deck-success);
  --minus: var(--deck-danger);
  color-scheme: dark;
}

/* Black sits before the Light block, which it ties on specificity, so Black
   in Light starts from the warm Light tokens and takes its own block below. */
:root[data-deck-theme="clay"][data-deck-palette="black"] {
  --deck-bg: #000000;

  --deck-panel-raised: 24 24 24;
  --deck-code: #101010;

  --deck-text: #f2f2f2;
  --deck-muted: #9a9a9a;
  --deck-muted-2: #9a9a9a;
  --deck-warning: #f59e0b;
  --deck-danger: #f87171;
  --deck-accent-ink: var(--deck-custom-accent-ink, #04211d);
  --deck-selected: #181818;
  --deck-human-fill: #181818;
  --deck-edge: #3f3f3f;
  --line: #2a2a2a;
}

:root[data-deck-light="true"][data-deck-theme="clay"] {
  --deck-bg: #f8f5ee;
  --deck-panel: 240 236 227;
  --deck-panel-raised: 255 253 249;
  --deck-code: #f0ebe1;
  --deck-line: 41 37 31;
  --deck-text: #29251f;
  --deck-muted: #58514a;
  --deck-muted-2: #6a6258;
  --deck-warning: #865800;
  --deck-danger: #ad3626;
  --deck-success: #356b3a;
  --deck-accent: var(--deck-custom-accent, oklch(.48 .1 var(--deck-hue, 38)));
  --deck-accent-ink: var(--deck-custom-accent-ink, #fffaf3);
  --deck-selected: #e5dfd2;
  --deck-human-fill: #ebe4d7;
  --deck-edge: #c9c0b1;
  --line: #e1dacd;
  color-scheme: light;
}

:root[data-deck-light="true"][data-deck-theme="clay"][data-deck-palette="black"] {
  --deck-bg: #f7f7f6;
  --deck-panel: 238 238 236;
  --deck-panel-raised: 255 255 255;
  --deck-code: #eeeeec;
  --deck-line: 28 28 28;
  --deck-text: #1c1c1c;
  --deck-muted: #555555;
  --deck-muted-2: #636363;
  --deck-warning: #865800;
  --deck-danger: #ad3626;
  --deck-accent-ink: var(--deck-custom-accent-ink, #ffffff);

}

:root[data-deck-edges="strong"][data-deck-theme="clay"],
:root[data-deck-edges="strong"][data-deck-theme="clay"][data-deck-palette="black"] { --line: var(--deck-edge); }

@media (prefers-contrast: more) {
  :root[data-deck-theme="clay"] {
    --deck-muted: #ddd4c6;

  :root[data-deck-light="true"][data-deck-theme="clay"][data-deck-palette="black"] {

  }
  :root[data-deck-theme="clay"] :is(button, input, select, textarea, [tabindex]):focus-visible {
    outline-width: 3px;

}

/* Solid theme surfaces. Most components already paint from --panel,
   --panel-2 and --line, so they follow the tokens above; these rules set
   the radius and remove glass effects Clay never uses. */
:root[data-deck-theme="clay"] body { background: var(--deck-bg); }
:root[data-deck-theme="clay"] :is(.pane, .rail, .assistant-workspace, .thread-details, .composer-box, .md-code, .quote-preview, .queued-inline) {
  border-radius: var(--deck-radius, 10px);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: none;
}
:root[data-deck-theme="clay"] .pane-head { border-color: var(--line); }
:root[data-deck-theme="clay"] .titlebar { border-bottom-color: var(--line); }
:root[data-deck-theme="clay"] button:hover:not(:disabled) { border-color: var(--deck-edge); }
/* The base sheet hard-codes a navy button hover, a mint primary hover and
   dark-green agent picker tiles. Low specificity, like glass, so component
   hovers still win; the primary hover deepens on Paper and lifts on Ember. */
:where(:root[data-deck-theme="clay"]) button:hover:not(:disabled) {
  background-color: color-mix(in srgb, var(--deck-text) 8%, rgb(var(--deck-panel-raised)));

}
:where(:root[data-deck-theme="clay"]) .picker-grid.single button {
  background: color-mix(in srgb, var(--accent) 8%, rgb(var(--deck-panel-raised)));
  border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
}
:where(:root[data-deck-theme="clay"]) .picker-grid.single button:hover {
  background: color-mix(in srgb, var(--accent) 16%, rgb(var(--deck-panel-raised)));
}
/* Pastel +/− counts and server errors only suit dark surfaces. */
:root[data-deck-theme="clay"] :is(.plus, .minus, .server-error) { color: var(--minus); }
:root[data-deck-theme="clay"] .plus { color: var(--plus); }
:root[data-deck-light="true"][data-deck-theme="clay"] :is(.details-backdrop, .artifacts-backdrop) { background: rgb(70 45 20 / .14); }
:root[data-deck-theme="clay"] ::selection { background: color-mix(in srgb, var(--accent) 38%, transparent); color: inherit; }
:root[data-deck-theme="clay"] .empty-emblem {
  background: color-mix(in srgb, var(--accent) 14%, var(--panel-2));
  border-color: color-mix(in srgb, var(--accent) 38%, transparent);
}
:root[data-deck-theme="clay"] :is(.empty h3, .assistant-first-run .empty-title) {
  font-family: var(--deck-font-reading);
  font-size: 22px;
  font-weight: 500;
  line-height: 1.25;
}

/* Reading layout: replies drop the bubble and set in the serif at a
   measured width; your messages keep a soft tinted card in the UI sans.
   Speaker names, steps and code keep their own sans/mono faces. */
:root[data-deck-theme="clay"] .bubble.bot {
  background: transparent;
  border-color: transparent;
  border-radius: 0;
  padding: 2px 0;
}
/* Serif covers reply text only, never the controls that ride inside a
   bubble (approvals, steps, file strips, code-head buttons). The reply
   body is always a direct child of the bubble, so the child combinator
   is what keeps a plan approval's Markdown in the safety treatment. */
:root[data-deck-theme="clay"] .bubble.bot > :is(.md, .draft-text) {
  font-family: var(--deck-font-reading);
  font-size: var(--deck-reading-size);
  line-height: 1.62;
}
:root[data-deck-theme="clay"] .bubble.bot :is(.md-code, .md-table) {
  font-family: var(--deck-font-ui);
  font-size: 13px;
}
:root[data-deck-theme="clay"] .bubble.bot .speaker { font-family: var(--deck-font-ui); }
/* Reply text can leave the theme's own face: sans here, serif in the other
   themes. Clay's headings keep their serif either way. */
:root[data-deck-theme="clay"][data-deck-reply="sans"] .bubble.bot > :is(.md, .draft-text) {
  font-family: var(--deck-font-ui);
}
/* Agent names, in bubbles and in Details. The color-mix line is the
   fallback: a gentle warm mute on Ember, a stronger pull toward the dark
   text color on Paper, enough for the built-in palette. Where relative
   oklch is supported the second line wins and clamps lightness per mode
   (chroma capped so names stay muted), so any user-picked color — even
   black, white or the background itself — remains readable. */
:root[data-deck-theme="clay"] :is(.bubble.bot .speaker, .thread-details .details-bot-copy strong, .thread-details .allowed-copy strong) {
  color: color-mix(in srgb, var(--agent-color, var(--accent)) 80%, var(--text));
  color: oklch(from var(--agent-color, var(--accent)) clamp(.76, l, .92) clamp(0, c, .13) h);
}
:root[data-deck-light="true"][data-deck-theme="clay"] :is(.bubble.bot .speaker, .thread-details .details-bot-copy strong, .thread-details .allowed-copy strong) {
  color: color-mix(in srgb, var(--agent-color, var(--accent)) 38%, var(--text));
  color: oklch(from var(--agent-color, var(--accent)) clamp(.28, l, .44) clamp(0, c, .13) h);
}
/* The same clamp for names outside bubbles and Details; these fall back
   to the text color, not the accent, when no agent color is set. */
:root[data-deck-theme="clay"] :is(.diff-group h4, .qform-who) {
  color: color-mix(in srgb, var(--agent-color, var(--text)) 80%, var(--text));
  color: oklch(from var(--agent-color, var(--text)) clamp(.76, l, .92) clamp(0, c, .13) h);
}
:root[data-deck-light="true"][data-deck-theme="clay"] :is(.diff-group h4, .qform-who) {
  color: color-mix(in srgb, var(--agent-color, var(--text)) 38%, var(--text));
  color: oklch(from var(--agent-color, var(--text)) clamp(.28, l, .44) clamp(0, c, .13) h);
}
:root[data-deck-theme="clay"] .bubble.human {
  background: var(--deck-human-fill);
  border: 1px solid var(--deck-human-line);
  border-radius: calc(var(--deck-radius, 10px) * 1.6);
  font-size: 14px;
  line-height: 1.5;
}
:root[data-deck-theme="clay"] .bubble { padding-block: calc(10px * var(--deck-density, 1) + 2px); }
:root[data-deck-theme="clay"] .bubble.bot { padding-block: calc(4px * var(--deck-density, 1)); }

/* One raised composer box on the solid raised surface. */
:root[data-deck-theme="clay"] .composer-box {
  --box: rgb(var(--deck-panel-raised));
  background: var(--box);
  border: 1px solid var(--deck-edge);
  border-radius: calc(var(--deck-radius, 10px) * 1.6);
  box-shadow: 0 2px 10px -6px rgb(0 0 0 / .35);
}
:root[data-deck-light="true"][data-deck-theme="clay"] .composer-box {
  box-shadow: 0 2px 10px -6px rgb(70 45 20 / .25);
}
:root[data-deck-theme="clay"] .composer-box:focus-within {
  --box: rgb(var(--deck-panel-raised));
  border-color: var(--deck-accent-text);
}

/* Quieter rail: the focused thread gets a filled row, not a glow. */
:root[data-deck-theme="clay"] .pane-row { border-radius: max(5px, calc(var(--deck-radius, 10px) * .6)); }
:root[data-deck-theme="clay"] .pane-row.focused {
  background: var(--deck-selected);
  color: var(--text);
}
:root[data-deck-theme="clay"] .pane-row.lit,
:root[data-deck-theme="clay"] .ws-row.lit { background: var(--deck-selected); }

/* Code, diffs and tables keep the monospace face on the sunken warm
   surface. The base diff inks suit dark surfaces only, so Paper gets
   deeper inks that stay readable on cream. */
:root[data-deck-theme="clay"] :is(.md-code, .md-code pre, .diff, .answer-command) {
  background: var(--deck-code);
  color: var(--deck-text);
  border-color: var(--line);
}
:root[data-deck-theme="clay"] .md code { background: var(--deck-code); }
:root[data-deck-theme="clay"] .md-table th { background: var(--deck-code); }
:root[data-deck-theme="clay"] .diff-line.add { color: var(--deck-success); background: color-mix(in srgb, var(--deck-success) 13%, transparent); }
:root[data-deck-theme="clay"] .diff-line.del { color: var(--deck-danger); background: color-mix(in srgb, var(--deck-danger) 13%, transparent); }
:root[data-deck-light="true"][data-deck-theme="clay"] .diff-line.add { color: #14532d; }
:root[data-deck-light="true"][data-deck-theme="clay"] .diff-line.del { color: #7f1d1d; }
:root[data-deck-theme="clay"] .work-steps-output {
  background: var(--deck-code);
  border-color: var(--line);
  color: var(--deck-muted);
}
:root[data-deck-theme="clay"] :is(.work-steps-helper, .work-steps-detail) { border-color: var(--line); }
:root[data-deck-theme="clay"] :is(.muted, .head-state, .details-head p) {
  color: var(--deck-muted);
}

/* Menus, popovers, dialogs and toasts stay solid and readable — the same
   surfaces glass lifts, without the blur. */
:root[data-deck-theme="clay"] :is(.composer-menu, .pane-menu, .hover-card, .usage-card, .bot-settings, .quick-add, .workspace-machine-menu,
  .new-menu-list, .link-menu, .review-menu, .artifact-menu, .model-menu, .selection-actions, .steer-pop, .mod-status-menu,
  .host-menu, .attention-list, .proj-picker, .confirm, .toast, .mod-toast, .mod-modal, .library-viewer) {
  background: rgb(var(--deck-panel-raised));
  border-color: var(--deck-edge);
  border-radius: max(8px, calc(var(--deck-radius, 10px) * .6));
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: 0 14px 36px -18px rgb(0 0 0 / .45);
}
:root[data-deck-light="true"][data-deck-theme="clay"] :is(.composer-menu, .pane-menu, .hover-card, .usage-card, .bot-settings, .quick-add, .workspace-machine-menu,
  .new-menu-list, .link-menu, .review-menu, .artifact-menu, .model-menu, .selection-actions, .steer-pop, .mod-status-menu,
  .host-menu, .attention-list, .proj-picker, .confirm, .toast, .mod-toast, .mod-modal, .library-viewer) {
  box-shadow: 0 14px 36px -18px rgb(70 45 20 / .3);
}
:root[data-deck-theme="clay"] :is(.settings-nav, .settings-card, .artifacts-panel, .preview, .changes, .agent-card, .library-tile, .mod-card,
  .add-form, .connection-banner, .terminal-bar, .folder-list, .pins, .qform, .move-ask, .conn-retarget, .answer-strip) {
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
:root[data-deck-theme="clay"] :is(.settings-card, .agent-card, .library-tile, .mod-card) {
  border-radius: var(--deck-radius, 10px);
  box-shadow: none;
}
:root[data-deck-theme="clay"] .settings-nav { border-right-color: var(--line); }

/* Details as quiet cards, echoing a per-session inspector without
   rebuilding it. Data and layout are unchanged. */
:root[data-deck-theme="clay"] .thread-details { background: var(--panel); border-left-color: var(--line); }
:root[data-deck-theme="clay"] .details-bot {
  background: rgb(var(--deck-panel-raised));
  border: 1px solid var(--line);
  border-radius: var(--deck-radius, 10px);
  padding: 10px;
  margin-bottom: 10px;
}
:root[data-deck-theme="clay"] .details-bot:hover { background: rgb(var(--deck-panel-raised)); }

/* Settings › Appearance paints from these, so its cards follow Clay too.
   Skin previews inside each tile keep their own colors. */
:root[data-deck-theme="clay"] .appearance-settings {
  --appearance-panel: rgb(var(--deck-panel-raised));
  --appearance-raised: var(--deck-accent-soft);
  --appearance-line: var(--line);
}
:root[data-deck-theme="clay"] .appearance-settings .appearance-section {
  border-radius: var(--deck-radius, 10px);
  box-shadow: none;
}
:root[data-deck-theme="clay"] .appearance-settings .appearance-skin { border-radius: calc(var(--deck-radius, 10px) * .6); }

/* ── Structure ─────────────────────────────────────────────────────────
   The rules above recolor Apex Deck; these reshape it toward the Clay mock:
   flush columns instead of floating cards, one centered reading column
   shared by the transcript and the composer, senders inline above their
   reply, a two-row composer, quiet tabs, and status by shape as well as
   color. CSS only — no component markup changes for any theme. */

/* Flush shell: no gutter frame. The rail and Details are columns split by
   hairlines; the title bar shares the rail's surface; the chat sits on
   the lighter canvas. */
:root[data-deck-theme="clay"] { --deck-gap: 0px; }
/* The grid's -4px margin cancels an 8px gutter; with none it would reach
   4px past the window, so clip it here. clip, not hidden: no scroller. */
:root[data-deck-theme="clay"] .canvas { overflow: clip; }
:root[data-deck-theme="clay"] .titlebar {
  background: rgb(var(--deck-panel));
  border-bottom: 1px solid var(--line);
}
:root[data-deck-theme="clay"] .rail {
  margin: 0;
  border: 0;
  border-right: 1px solid var(--line);
  border-radius: 0;
}
:root[data-deck-theme="clay"] :is(.thread-details.docked, .thread-details.overlay) {
  margin: 0;
  border: 0;
  border-left: 1px solid var(--line);
  border-radius: 0;
}
:root[data-deck-theme="clay"] .thread-details.overlay { inset: 0 0 0 auto; }
:root[data-deck-theme="clay"] :is(.sidebar-handle.overlay) { top: 0; bottom: 0; }
/* Panes are inset half a gap inside the grid (PaneLayout GAP); with no
   canvas padding a lone pane meets the canvas edges exactly; split panes
   get back a hairline frame (below) so the gutter between them reads. */
:root[data-deck-theme="clay"] .pane {
  background: var(--deck-bg);
  border: 0;
  border-radius: 0;
}
:root[data-deck-theme="clay"] .pane.focused { box-shadow: none; }
/* Only with two or more panes showing does focus need a frame. */
:root[data-deck-theme="clay"] .grid:has(> .pane:not([style*="display: none"]) ~ .pane:not([style*="display: none"])) > .pane {
  border: 1px solid var(--line);
  border-radius: max(6px, calc(var(--deck-radius, 10px) * .6));
}
:root[data-deck-theme="clay"] .grid:has(> .pane:not([style*="display: none"]) ~ .pane:not([style*="display: none"])) > .pane.focused {
  border-color: color-mix(in srgb, var(--deck-accent-text) 55%, var(--line));
}
:root[data-deck-theme="clay"] .pane-head { background: transparent; }

/* Title bar: the section switcher is quiet text with a neutral selected
   chip, never an accent slab; New is a plain bordered button. */
:root[data-deck-theme="clay"] .titlebar > .section-navigation {
  background: transparent;
  border-color: transparent;
}
:root[data-deck-theme="clay"] .titlebar .section-button { color: var(--deck-muted); }
:root[data-deck-theme="clay"] .titlebar .section-button:hover:not(:disabled):not(.selected) { color: var(--text); }
:root[data-deck-theme="clay"] .titlebar .section-button.selected {
  background: var(--deck-selected);
  color: var(--text);
}
:root[data-deck-theme="clay"] .titlebar .section-button.selected > span { color: var(--text); }
:root[data-deck-theme="clay"] .titlebar button.titlebar-new {
  background: rgb(var(--deck-panel-raised)) !important;
  border-color: var(--deck-edge) !important;
  color: var(--text) !important;
}
:root[data-deck-theme="clay"] .titlebar button.titlebar-new:hover:not(:disabled) {
  background: var(--deck-selected) !important;
}

/* Rail: sentence-case section labels and plain project rows; only the
   selected thread is filled. */
:root[data-deck-theme="clay"] .rail-sec {
  text-transform: none;
  letter-spacing: 0;
  font-size: 12px;
  font-weight: 500;
  color: var(--deck-muted-2);
}
:root[data-deck-theme="clay"] .ws-row.active { background: transparent; border-color: transparent; }
:root[data-deck-theme="clay"] .ws-row.active .fold { --cut: rgb(var(--deck-panel)); }

/* Status: Classic's cyan "done" color arrives through --brand-cyan (done
   dots, Ready flags, counts, plan mode); Clay maps it to its success ink.
   Links take the accent. Every state also gets a shape: a ring when idle,
   a diamond when it waits for you, a square when it failed. */
:root[data-deck-theme="clay"] { --brand-cyan: var(--deck-success); }
:root[data-deck-theme="clay"] :is(.msg-link, button.link) {
  color: var(--deck-accent-text);
  text-decoration-color: color-mix(in srgb, var(--deck-accent-text) 45%, transparent);
}
:where(:root[data-deck-theme="clay"]) .dot {
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--deck-muted-2);
}
:root[data-deck-theme="clay"] .dot.working {
  background: var(--deck-accent-text);
  box-shadow: 0 0 0 3px var(--deck-accent-soft);
}
:root[data-deck-theme="clay"] .dot.needs_input { border-radius: 1px; transform: rotate(45deg) scale(.92); }
:root[data-deck-theme="clay"] .dot.failed { border-radius: 1px; }

/* Senders sit inline: a small identicon before the name, the reply flush
   with the column instead of indented past an avatar gutter. The Avatar
   keeps its markup (and its context battery), only scaled and placed. */
:root[data-deck-theme="clay"] .bot-row {
  max-width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  position: relative;
}
:root[data-deck-theme="clay"] .bot-row > :is(.bubble, .message-actions) { grid-column: 1; }
/* The grid sizes a start-aligned reply to at least its longest unbroken
   line, and step rows never wrap, so a long command pushed the reply past
   the column and the thread scrolled sideways. Clamped, the step's own
   ellipsis takes the rest; the base's max-width: none allowed the overflow. */
:root[data-deck-theme="clay"] .bot-row > .bubble { max-width: 100%; }
/* No avatar gutter here, so a reply being written keeps its 260px floor
   wherever the thread itself is that wide. */
:root[data-deck-theme="clay"] .bot-row > .bubble.writing { min-width: min(260px, 100%); }
:root[data-deck-theme="clay"] .bot-row > .identicon {
  position: absolute;
  left: 0;
  top: calc(4px * var(--deck-density, 1));
  transform: scale(.58);
  transform-origin: 0 0;
  z-index: 1;
}
:root[data-deck-theme="clay"] .bubble.bot > .speaker {
  padding-left: 28px;
  min-height: 21px;
  line-height: 21px;
  margin-bottom: 4px;
}

/* Empty thread and welcome: sentence-case eyebrow, serif headline,
   examples as a wrapping row of pill chips. */
:root[data-deck-theme="clay"] .eyebrow {
  text-transform: none;
  letter-spacing: 0;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--deck-muted);
}
:root[data-deck-theme="clay"] .example-rows {
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
}
:root[data-deck-theme="clay"] .example-row {
  border-radius: 999px;
  border-color: var(--deck-edge);
  background: transparent;
  padding: 5px 12px;
}
:root[data-deck-theme="clay"] .example-row:hover:not(:disabled) { border-color: var(--deck-muted-2); }
:root[data-deck-theme="clay"] .picker h2 {
  font-family: var(--deck-font-reading);
  font-weight: 500;
  letter-spacing: -0.01em;
}
:root[data-deck-theme="clay"] .welcome-capabilities { font-family: var(--deck-font-ui); font-size: 11.5px; letter-spacing: 0; }

/* Right panel: the open tab is underlined by the base sheet, so every theme
   matches; filters as outlined pills; sentence-case group labels. */
:root[data-deck-theme="clay"] .right-dashboard-filters button { border: 1px solid var(--deck-edge); }
:root[data-deck-theme="clay"] .right-dashboard-filters button[aria-checked="true"] {
  background: var(--deck-selected);
  border-color: var(--deck-muted-2);
}
:root[data-deck-theme="clay"] .right-dashboard-group {
  text-transform: none;
  letter-spacing: 0;
  font-size: 12px;
  color: var(--deck-muted-2);
}

/* Appearance settings are deliberately self-contained so optional skin UI
   styles do not change the rest of Classic Deck. */
.appearance-settings {
  --appearance-line: var(--line);
  --appearance-panel: var(--panel);
  --appearance-raised: var(--panel-2);
  --appearance-ink: var(--text);
  --appearance-muted: var(--muted);
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: 100%;
  min-width: 0;
  color: var(--appearance-ink);
}

.appearance-settings :is(h2, h3, p) { margin-top: 0; }
.appearance-settings p { margin-bottom: 0; }
.appearance-settings small,
.appearance-settings p,
.appearance-settings label,
.appearance-settings output { font-size: 12px; line-height: 1.5; }
.appearance-settings small,
.appearance-settings p { color: var(--appearance-muted); }

.appearance-settings .appearance-heading,
.appearance-settings .appearance-section-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}
.appearance-settings .appearance-heading h2 {
  margin: 0;
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: -0.04em;
}
.appearance-settings .appearance-heading p { margin: 5px 0 0; }
.appearance-settings .appearance-current {
  flex: none;
  max-width: 45%;
  padding: 6px 9px;
  border: 1px solid var(--appearance-line);
  border-radius: 999px;
  color: var(--appearance-muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.appearance-settings .appearance-current strong { color: var(--appearance-ink); }

.appearance-settings .appearance-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--appearance-line);
  border-radius: 12px;
  background: var(--appearance-panel);
}
.appearance-settings .appearance-section-heading h3 {
  margin: 0;
  font-size: 15px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.02em;
}
.appearance-settings .appearance-section-heading p { margin: 4px 0 0; }

.appearance-settings .appearance-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(132px, 100%), 1fr));
  gap: 9px;
  min-width: 0;
}
.appearance-settings .appearance-skin-tile {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.appearance-settings .appearance-skin-delete {
  align-self: flex-end;
  min-height: 32px;
  padding: 4px 10px;
  font-size: 12px;
}
.appearance-settings .appearance-skin {
  width: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
  min-width: 0;
  padding: 7px;
  border-color: var(--appearance-line);
  background: var(--appearance-raised);
  text-align: left;
}
.appearance-settings .appearance-skin[aria-pressed="true"] {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
}
.appearance-settings .appearance-skin strong {
  min-width: 0;
  font-size: 12px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.appearance-settings .appearance-skin small {
  font-size: 12px;
  line-height: 1.35;
}

/* The swatches use only their own --appearance-* values, never application
   theme variables, so every preset remains visible while editing another. */
.appearance-settings .appearance-preview {
  position: relative;
  display: block;
  height: 76px;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid rgb(255 255 255 / .15);
  border-radius: max(5px, calc(var(--appearance-radius, 12px) * .55));
  background: #0b1118;
  color: #eaf1f6;
  --preview-accent: var(--appearance-accent, oklch(.78 .15 var(--appearance-hue, 172)));
  --preview-panel: rgb(22 31 41 / var(--appearance-opacity, .65));
  --preview-edge: rgb(255 255 255 / .18);
}
.appearance-settings .appearance-preview[data-mode="classic"] {
  --preview-accent: #71e6b5;
  --preview-panel: #151e28;
  --preview-edge: #344150;
  background: #090d12;
}
.appearance-settings .appearance-preview[data-mode="flat"] { background: #090d12; }
.appearance-settings .appearance-preview[data-mode="clay"] {
  --preview-panel: #302d29;
  --preview-edge: #544e46;
  background: #262421;
  color: #efe9e0;
}
.appearance-settings .appearance-preview[data-mode="clay"][data-light="true"] {
  --preview-panel: #fffdf9;
  --preview-edge: #c9c0b1;
  background: #f8f5ee;
  color: #29251f;
}
.appearance-settings .appearance-preview[data-mode="clay"] .appearance-preview-field { display: none; }
.appearance-settings .appearance-preview[data-mode="clay"] .appearance-preview-bubble { background: transparent; border-color: transparent; }
.appearance-settings .appearance-preview[data-mode="glass"] {
  -webkit-backdrop-filter: blur(var(--appearance-blur, 0px));
  backdrop-filter: blur(var(--appearance-blur, 0px));
}
.appearance-settings .appearance-preview[data-mode="glass"] { box-shadow: inset 0 1px 0 rgb(255 255 255 / .12); }
