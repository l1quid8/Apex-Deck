<!DOCTYPE html>
<!-- v11 (Jigga, 2026-11-03). Keeps v10's shape: Alfred's one line, a small progress pill, and Stop shown to the right
     when you point at the pill. Fixes from the final v10 review:
     1. Stop only when you mean it: the Stop button, or a message that is only a stop ("stop", "cancel that").
        Esc stops only before the agent starts. No dragging. "Don't give it to Muck" gets a reply, not a hand-over.
     2. The progress pop-up only shows. Its one action hands the rest to another agent from where the job really is.
     3. Notes for a working agent use Deck's own "Queued for Hyke" row with Steer (⌘↵), which warns that it interrupts.
        Shift+Enter is a new line again.
     4. Plain words in every line, label and status.
     5. Stop uses Deck's quiet style at the pill's height. The line under the chat box stays empty until a job runs.
     6. Pill states: needs your OK (Ask first), needs you, couldn't start, and no total (no to-do list).
     Also: two agents show as "Muck + Null" with the lead named; the agent question has no Back when it comes first;
     Enter ticks agents and ⌘↵ starts; Stop is announced as "Stop Hyke"; the watchdog waits 20 quiet minutes.
     The screen is Deck's captured UI from v10. Mock-up only: no product code changed. -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfred handoff mock-up v11</title>
<style>
:root{--mk-bg:#0b0b0d;--mk-panel:#17171a;--mk-line:#2c2c31;--mk-text:#f2f2f3;--mk-muted:#a0a0a8;--mk-accent:#a78bfa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--mk-bg);color:var(--mk-text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
.mk-bar{flex:none;padding:10px 16px 12px;border-bottom:1px solid var(--mk-line);background:var(--mk-panel);display:grid;gap:6px}
.mk-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mk-label{color:var(--mk-muted);font-size:12px;min-width:68px;font-weight:500}
.mk-label-inline{min-width:auto;margin-left:12px}
.mk-btn{font:inherit;font-size:12px;color:var(--mk-text);background:transparent;border:1px solid var(--mk-line);border-radius:8px;padding:3px 9px;cursor:pointer;transition:background .12s,border-color .12s}
.mk-btn:hover:not(:disabled){background:#ffffff12}
.mk-btn:focus-visible{outline:2px solid var(--mk-accent);outline-offset:1px}
.mk-btn[aria-pressed=true]{background:var(--mk-text);color:#111;border-color:var(--mk-text);font-weight:600}
.mk-btn:disabled{opacity:.35;cursor:default}
.mk-nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.mk-caption{margin:0;font-size:13px;color:var(--mk-text)}
.mk-caption b{color:var(--mk-accent);font-weight:600}
.mk-behind{color:var(--mk-muted);font-size:12px}
.mk-behind .mk-label{display:inline-block}
.mk-stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;justify-content:center}
.mk-frame{width:1280px;height:860px;border:0;transform-origin:top center;flex:none;display:block}
@media (max-width:760px){.mk-label{min-width:0;width:100%}.mk-label-inline{margin-left:0}.mk-nav{margin-left:0}}
</style>
</head>
<body>
<div class="mk-bar">
  <div class="mk-row"><span class="mk-label">Moment</span><span id="mk-steps" class="mk-row"></span><span class="mk-nav"><button class="mk-btn" id="mk-prev">← Back</button><button class="mk-btn" id="mk-next">Next →</button></span></div>
  <div class="mk-row"><span class="mk-label">Alfred</span><span id="mk-cases" class="mk-row"></span><span class="mk-label mk-label-inline">Access</span><span id="mk-access" class="mk-row"></span></div>
  <div class="mk-row"><span class="mk-label">Job</span><span id="mk-jobs" class="mk-row"></span><span class="mk-label mk-label-inline">Progress</span><span id="mk-progress" class="mk-row"></span><span class="mk-label mk-label-inline">First job</span><span id="mk-whens" class="mk-row"></span></div>
  <div class="mk-row"><span class="mk-label">You say</span><span id="mk-says" class="mk-row"></span></div>
  <div class="mk-row"><span class="mk-label">You pick</span><span id="mk-picks" class="mk-row"></span></div>
  <p class="mk-caption" id="mk-caption" role="status"></p>
  <p class="mk-caption mk-behind"><span class="mk-label">Behind the chat</span> <span id="mk-behind"></span></p>
</div>
<div class="mk-stage" id="mk-stage"><iframe class="mk-frame" id="mk-frame" title="Alfred chat screen"></iframe></div>
<script type="text/plain" id="mk-app"><!doctype html><html lang="en" data-deck-theme="classic" data-deck-light="false" data-deck-color-mode="system" data-deck-system-dark="true" style="--deck-top: 48px;"><head><meta charset="utf-8"><style>.personal-browser { position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow: auto; background: var(--panel, var(--bg)); color: var(--text); font-size: 12.5px; }
.assistant-browser { position: absolute; z-index: 25; min-width: 0; }
.assistant-browser[hidden] { display: none; }
.assistant-browser-popup { right: 16px; bottom: var(--assistant-browser-bottom, 112px); width: min(620px, calc(100% - 32px)); height: min(460px, calc(100% - var(--assistant-browser-bottom, 112px) - 56px)); min-height: 180px; overflow: hidden; border-radius: 14px; background: var(--panel, var(--bg)); box-shadow: 0 12px 32px color-mix(in srgb, var(--text) 15%, transparent); }
.assistant-browser-expanded { inset: 0; background: var(--panel, var(--bg)); }
.assistant-browser .personal-browser { border-radius: inherit; }
.personal-browser-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.personal-browser-head strong { flex: 1 1 100px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.personal-browser-state { font-size: 11px; color: var(--muted); }
.personal-browser-state.is-taken { color: var(--accent); }
.personal-browser-close { margin-left: auto; }
.personal-browser-bar { display: flex; gap: 6px; align-items: center; min-width: 0; }
.personal-browser-bar input, .personal-browser-keys input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
.personal-browser button { flex-shrink: 0; min-height: 28px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: none; color: var(--text); font: inherit; cursor: pointer; }
.personal-browser button.primary { border-color: var(--accent); color: var(--accent); }
.personal-browser button:disabled, .personal-browser input:disabled { opacity: .45; cursor: default; }
.personal-browser-toggle { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.personal-browser-hint { margin: 0; color: var(--muted); font-size: 11.5px; }
.personal-browser-alert { margin: 0; color: var(--danger, var(--text)); }
.personal-browser-page { min-height: 0; }
.personal-browser-page img { display: block; width: 100%; height: auto; border-radius: 6px; user-select: none; cursor: default; }
.personal-browser-page img.is-taken { cursor: crosshair; }
.personal-browser-keys { display: flex; flex-direction: column; gap: 6px; }
.personal-browser-keys form, .personal-browser-keys > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
@media (max-width: 560px) {
  .assistant-browser-popup { right: 8px; width: calc(100% - 16px); }
  .personal-browser { padding: 8px; }
  .personal-browser-head { gap: 6px; }
}

.personal-browser button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,var(--bg))}

.shared-browser { display: flex; flex-direction: column; height: 100%; min-height: 0; gap: 4px; }
.shared-browser-tabs { display: flex; align-items: stretch; gap: 2px; padding: 6px 6px 0; overflow-x: auto; scrollbar-width: none; }
.shared-browser-tab { display: flex; align-items: center; min-width: 0; max-width: 200px; flex: 0 1 auto; border: 1px solid transparent; border-radius: 6px 6px 0 0; }
.shared-browser-tab.active { background: var(--panel, var(--bg)); border-color: var(--line); border-bottom-color: transparent; }
.shared-browser-tab > button:first-child { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 3px 4px 3px 8px; border: 0; background: none; color: var(--text); font-size: 11.5px; text-align: left; }
.shared-browser-tab-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shared-browser-owner { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; color: var(--muted); }
.shared-browser-owner.is-bot, .shared-browser-owner.is-assistant { color: var(--accent); }
.shared-browser-tab-close, .shared-browser-new { flex-shrink: 0; padding: 0 6px; border: 0; background: none; color: var(--muted); }
.shared-browser-machine { margin-left: auto; align-self: center; flex-shrink: 0; padding-left: 8px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.shared-browser-bar { display: flex; gap: 4px; padding: 0 6px; align-items: center; }
.shared-browser-bar input { flex: 1; min-width: 0; }
.shared-browser-control, .shared-browser-dialog { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 6px; font-size: 11.5px; color: var(--muted); }
.shared-browser-control button, .shared-browser-dialog button { padding: 2px 8px; min-height: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: transparent; color: var(--text); font-size: 11.5px; }
.shared-browser-control button.primary, .shared-browser-dialog button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink, var(--bg)); }
.shared-browser-stop { margin-left: auto; }
.shared-browser-dialog input:not([type="file"]) { flex: 1 1 120px; min-width: 0; }
.shared-browser-problem { margin: 0; padding: 0 6px; font-size: 11.5px; color: var(--danger, var(--text)); }
.shared-browser-page { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--bg); user-select: none; }
.shared-browser-page.is-held { cursor: default; }
.shared-browser-page img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.shared-browser-keys { position: absolute; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; resize: none; pointer-events: none; }

.runner-drawer-container {
  position: relative;
  width: 100%;
  font-family: var(--font-sans);
}

.runner-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border: 1px solid var(--color-border, #ddd);
  border-bottom: none;
  border-radius: var(--border-radius-md, 8px) var(--border-radius-md, 8px) 0 0;
  background: var(--color-background-secondary, #f6f6f6);
  cursor: pointer;
  user-select: none;
  min-height: 32px;
  box-sizing: border-box;
}

.runner-drawer-container.phone .runner-strip {
  min-height: 44px;
  padding: 10px 12px;
}

.runner-drawer-container.needs-you .runner-strip {
  background: #fef3c7;
  border-color: #f59e0b;
}

.runner-dot {
  font-size: 10px;
  line-height: 1;
}
.runner-dot.running { color: #22c55e; }
.runner-dot.paused { color: #6b7280; }
.runner-dot.needs { color: #f59e0b; }
.runner-dot.limit { color: #ef4444; }

.runner-type {
  font-weight: 600;
  font-size: 13px;
}

.runner-metric {
  font-size: 12px;
  color: var(--color-text-secondary);
  white-space: nowrap;
}

.runner-objective-short {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  color: var(--color-text-primary);
}

.runner-spacer { flex: 0 0 4px; }

.runner-action {
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 2px 10px;
  font-size: 12px;
  cursor: pointer;
  background: white;
}
.runner-action.primary {
  background: #111;
  color: white;
  border-color: #111;
}
.runner-action.danger {
  background: #fee2e2;
  border-color: #fecaca;
}
.runner-action.secondary {
  background: transparent;
}

.runner-chevron {
  font-size: 12px;
  margin-left: 4px;
}

.runner-details {
  position: absolute;
  bottom: 100%;
  left: 0;
  right: 0;
  max-height: 60vh;
  overflow-y: auto;
  background: var(--color-background-primary, white);
  border: 1px solid var(--color-border, #ddd);
  border-bottom: none;
  border-radius: 12px 12px 0 0;
  padding: 12px 14px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  z-index: 20;
}

.runner-drawer-container.phone .runner-details {
  max-height: 45vh;
  -webkit-overflow-scrolling: touch;
}

.runner-details-section {
  margin-bottom: 12px;
}
.runner-details-section h4 {
  margin: 0 0 6px 0;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-tertiary);
}
.runner-full-objective {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
}
.runner-criteria {
  list-style: none;
  padding: 0;
  margin: 0;
}
.runner-criteria li {
  padding: 2px 0;
  font-size: 13px;
}
.criteria-done { color: #16a34a; }
.criteria-failed { color: #dc2626; }
.criteria-pending { color: #6b7280; }

.runner-details-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.runner-details-actions button {
  flex: 1;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  background: white;
  cursor: pointer;
}
.runner-details-actions button.danger {
  background: #fee2e2;
}
.runner-strip { border:0; border-bottom:1px solid var(--line, #5554); border-radius:0; background:transparent; padding:4px 8px; gap:6px; }
.runner-strip button,.runner-details button { min-height:24px; background:var(--panel, var(--color-background-secondary,#292929)); color:inherit; border:1px solid var(--line,#8884); border-radius:6px; padding:3px 8px; cursor:pointer; }
.runner-strip .runner-disclosure { display:flex;align-items:center;gap:8px;min-width:0;flex:1;border:0;background:transparent;text-align:left;padding:0; }
.runner-disclosure .runner-objective-short {min-width:0;}
.runner-drawer-container {flex:0 0 100%;width:100%;color:inherit;}
.runner-details {background:var(--panel,var(--color-background-primary,#252525));color:inherit;max-height:min(55dvh,440px);border-color:var(--line,#8884);}
.runner-details p {font-size:12px;line-height:1.5;margin:8px 0;}
.runner-details .runner-details-actions button {flex:initial;background:var(--panel,var(--color-background-secondary,#333));color:inherit;}
.runner-details-actions {align-items:center;flex-wrap:wrap;}
.runner-live-region {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
.runner-limit-fields {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.runner-limit-fields label {display:grid;gap:4px;font-size:11px;}
.runner-limit-fields input {width:100%;min-width:0;box-sizing:border-box;background:transparent;color:inherit;border:1px solid var(--line,#8884);border-radius:5px;padding:6px;}
.runner-criteria small {display:block;opacity:.7;overflow-wrap:anywhere;}
.runner-drawer-container.phone .runner-strip {padding:2px 6px;min-height:44px;}
.runner-drawer-container.phone button,.runner-drawer-container.phone input {min-height:44px;}
.runner-drawer-container.needs-you .runner-strip {background:var(--warning-bg,#b580151a);border-color:#b58015;}
.runner-setup {flex:0 0 100%;display:flex;gap:8px;flex-wrap:wrap;padding:6px 10px;font-size:12px;box-sizing:border-box;}
.runner-setup label {display:flex;align-items:center;gap:6px;}
.runner-setup input {width:65px;background:transparent;color:inherit;border:1px solid var(--line,#8884);border-radius:4px;padding:3px;}
@media(max-width:600px){.runner-objective-short{display:none;}.runner-disclosure{gap:5px;}.runner-details{max-height:45dvh;}.runner-details-actions button{min-height:44px;}}
.composer-box:has(> .runner-drawer-container),.composer-box:has(> .runner-setup) {flex-wrap:wrap;}
.composer-box > .runner-drawer-container,.composer-box > .runner-setup {order:-3;flex-basis:100%;}
.ph-composer .runner-drawer-container {border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;margin-bottom:-1px;background:var(--panel-2);}
.ph-composer:has(.runner-strip) .ph-input {border-top-left-radius:0;border-top-right-radius:0;}
.ph-composer .runner-setup button,.ph-composer .runner-setup input {min-height:44px;}
.ph-runner-review-backdrop {position:fixed;inset:0;z-index:100;background:#0008;display:flex;align-items:flex-end;}
.ph-runner-review {background:var(--panel);color:var(--text);width:100%;max-height:85dvh;overflow:auto;padding:16px;box-sizing:border-box;}
.ph-runner-review button {min-height:44px;}.ph-runner-review pre {white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;}
.runner-advanced {width:100%;max-height:40dvh;overflow:auto;display:grid;gap:8px;}
.runner-advanced fieldset{display:flex;flex-wrap:wrap;gap:10px;border:1px solid var(--line,#8884);border-radius:6px;}
.runner-advanced input[type=checkbox]{width:16px;min-height:16px;}
.runner-advanced label:has(textarea){display:grid;}
.runner-advanced textarea{min-height:70px;background:transparent;color:inherit;resize:vertical;}
.runner-setup:has(.runner-advanced) {position:relative;}
.runner-work {margin:10px 0;padding:8px;border:1px solid var(--line,#8884);border-radius:8px;min-width:0;}
.runner-work>summary {cursor:pointer;font-size:12px;color:var(--muted,var(--color-text-secondary));padding:4px;min-height:24px;}
.ph-chat .runner-work>summary {min-height:44px;display:flex;align-items:center;}

.voice-call-controls {
  position: relative;
  display: inline-flex;
  align-items: center;
  flex: none;
  align-self: flex-end;
  margin-bottom: 3px;
}
.composer-box.stacked > .voice-call-controls,
.thread-chat .composer-box > .voice-call-controls {
  align-self: center;
  margin-bottom: 0;
}
.voice-mic {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: none;
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.voice-mic.live {
  background: #b92d42;
  color: white;
}
.voice-mic:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 2px;
}

/* Shared by the bar, pill, capsule and their panels. Skins (Clay, Glass) set the --deck-* names; other themes fall back. */
.voice-call-ui {
  --agent: var(--accent);
  --vc-raised: var(--panel-2, var(--panel));
  --vc-edge: var(--deck-edge, var(--line));
  --vc-sunk: var(--deck-code, var(--bg));
  --vc-danger: var(--deck-danger, var(--danger, #e5484d));
  --vc-selected: var(--deck-selected, color-mix(in srgb, var(--text) 12%, transparent));
  --vc-radius: var(--deck-radius, var(--radius, 10px));
  color: var(--text);
}
.voice-callbtn {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  flex: none;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.voice-callbtn:hover:not(:disabled) {
  background: color-mix(in srgb, var(--text) 9%, transparent) !important;
  color: var(--text);
}
.voice-callbtn[aria-pressed="true"] {
  background: color-mix(in srgb, var(--vc-danger) 18%, transparent);
  color: var(--vc-danger);
}
.voice-callbtn[aria-expanded="true"] {
  background: var(--vc-selected);
  color: var(--text);
}
.voice-callbtn.boxed {
  border: 1px solid var(--vc-edge);
  border-radius: 6px;
}
.voice-end {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  flex: none;
  padding: 0 11px;
  border: 0;
  border-radius: 999px;
  background: #b92d42;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.voice-end:hover:not(:disabled) {
  background: #c93a50 !important;
}
.voice-end.round {
  width: 28px;
  padding: 0;
  justify-content: center;
}
.voice-who {
  flex: none;
  font-weight: 600;
  color: color-mix(in srgb, var(--agent) 70%, var(--text));
}
.voice-status {
  min-width: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.tone-warn .voice-status {
  color: var(--warn, #f59e0b);
}
.tone-muted .voice-status {
  color: var(--vc-danger);
}
.voice-timer {
  flex: none;
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.voice-live-dot {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: #d9475d;
  box-shadow: 0 0 0 3px rgb(217 71 93 / 0.2);
  animation: voice-dot 1.6s ease-in-out infinite;
}
.tone-warn .voice-live-dot {
  background: var(--warn, #f59e0b);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn, #f59e0b) 22%, transparent);
}
.voice-spacer {
  flex: 1;
}

/* Sound wave: the bot's colour while it talks, yours while it hears you, dots while it works. */
.voice-wave {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: 16px;
  flex: none;
  color: var(--muted);
}
.voice-wave i {
  display: block;
  width: 3px;
  height: 4px;
  border-radius: 2px;
  background: currentColor;
}
.voice-wave[data-mode="bot"] { color: var(--agent); }
.voice-wave[data-mode="bot"] i { animation: voice-bounce 0.9s ease-in-out infinite; }
.voice-wave[data-mode="you"] { color: var(--text); }
.voice-wave[data-mode="you"] i { --h: 9px; animation: voice-bounce 1.3s ease-in-out infinite; }
.voice-wave i:nth-child(1) { --h: 7px; animation-delay: -0.2s; }
.voice-wave i:nth-child(2) { --h: 13px; animation-delay: -0.5s; }
.voice-wave i:nth-child(3) { --h: 16px; animation-delay: -0.1s; }
.voice-wave i:nth-child(4) { --h: 11px; animation-delay: -0.7s; }
.voice-wave i:nth-child(5) { --h: 6px; animation-delay: -0.35s; }
.voice-wave[data-mode="you"] i:nth-child(3) { --h: 10px; }
.voice-wave[data-mode="flat"] i { height: 3px; opacity: 0.45; }
.voice-wave[data-mode="dots"] { gap: 3px; color: var(--agent); }
.voice-wave[data-mode="dots"] i { width: 4px; height: 4px; border-radius: 50%; animation: voice-dot 1.2s ease-in-out infinite; }
.voice-wave[data-mode="dots"] i:nth-child(n + 4) { display: none; }
.voice-wave[data-mode="dots"] i:nth-child(2) { animation-delay: 0.2s; }
.voice-wave[data-mode="dots"] i:nth-child(3) { animation-delay: 0.4s; }
@keyframes voice-bounce { 0%, 100% { height: 4px; } 50% { height: var(--h); } }
@keyframes voice-dot { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .voice-wave i, .voice-live-dot { animation: none !important; }
}

/* A: the call bar over the chat box. */
.voice-callbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 6px;
  padding: 5px 6px 5px 12px;
  border: 1px solid var(--vc-edge);
  border-radius: calc(var(--vc-radius) * 1.6);
  background: var(--vc-raised);
}

/* B: the mic grown into a pill. */
.voice-pill {
  display: inline-flex;
  align-items: center;
  height: 30px;
  padding: 0 2px;
  border-radius: 999px;
  background: color-mix(in srgb, #b92d42 16%, var(--vc-raised));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, #b92d42 45%, transparent);
}
.voice-pill .voice-callbtn,
.voice-pill .voice-end.round {
  width: 26px;
  height: 26px;
}
.voice-pill .voice-callbtn {
  color: var(--text);
}
.voice-pill.tone-muted {
  background: color-mix(in srgb, var(--vc-danger) 12%, var(--vc-raised));
}
.voice-pill-mid {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 6px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
}
.voice-pill-mid:hover:not(:disabled),
.voice-pill-mid[aria-expanded="true"] {
  background: color-mix(in srgb, var(--text) 9%, transparent) !important;
}
.voice-pill .voice-timer {
  color: var(--text);
}
.voice-pill.tone-warn .voice-wave {
  color: var(--warn, #f59e0b);
}

/* C: the capsule in the thread's top bar. It takes the spacer's place, so the title gives way to it, never under it. */
.pane-head:has(> .pane-counts > .voice-capsule) > .spacer,
.popout-bar:has(.voice-capsule) > .spacer {
  display: none;
}
.voice-capsule {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 1 auto;
  min-width: 0;
  max-width: 420px;
  height: 32px;
  box-sizing: border-box;
  margin-inline: auto;
  padding: 0 3px 0 4px;
  border: 1px solid var(--vc-edge);
  border-radius: 18px;
  background: var(--vc-sunk);
  font-size: 12.5px;
}
.voice-capsule.open {
  background: var(--vc-raised);
}
.voice-capsule .voice-callbtn,
.voice-capsule .voice-end.round {
  width: 24px;
  height: 24px;
}
.voice-capsule-body {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  height: 26px;
  padding: 0 6px;
  border: 0;
  border-radius: 13px;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.voice-capsule-body:hover:not(:disabled),
.voice-capsule-body[aria-expanded="true"] {
  background: color-mix(in srgb, var(--text) 8%, transparent) !important;
}

/* Panels: call settings, Call who?, setup and errors. */
.voice-pop {
  position: fixed;
  z-index: 30;
  box-sizing: border-box;
  max-width: calc(100vw - 16px);
  max-height: min(70vh, calc(100vh - 16px));
  overflow: auto;
  padding: 12px;
  border: 1px solid var(--vc-edge);
  border-radius: max(8px, calc(var(--vc-radius) * 0.8));
  background: var(--vc-raised);
  box-shadow: 0 14px 36px -18px rgb(0 0 0 / 0.45);
  font-size: 12.5px;
}
.voice-pop p {
  margin: 0 0 10px;
  font-size: 12px;
  line-height: 1.45;
}
.voice-pop-head {
  margin: 0 0 10px;
  font-weight: 600;
}
/* Which engine the running call uses, so GPT-Live and local settings never look alike. */
.voice-engine-tag {
  margin-left: 6px;
  padding: 1px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  vertical-align: 1px;
}
.voice-engine-tag[data-engine="realtime"] {
  border-color: var(--accent);
  color: var(--accent);
}
.voice-pop-note {
  display: block;
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 11.5px;
}
.voice-pop-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 6px;
}
.voice-settings { width: 300px; }
.voice-setup { width: 320px; }
.voice-pick { width: 240px; padding: 6px; }
.voice-pick .voice-pop-head {
  margin: 0;
  padding: 4px 8px 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}
.voice-pick .voice-pop-note { margin: 4px 8px; }
.voice-pick-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.voice-pick-row:hover,
.voice-pick-row:focus-visible {
  background: color-mix(in srgb, var(--accent) 16%, transparent) !important;
}
.voice-pick-row b { font-weight: 600; }
.voice-pick-row span:last-child {
  margin-left: auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 11.5px;
}
.voice-set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 0 10px;
}
.voice-set-row > span:first-child {
  flex: none;
  color: var(--muted);
}
.voice-set-row.col {
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
}
.voice-set-row.col > span:first-child {
  display: flex;
  justify-content: space-between;
}
.voice-set-row.col b {
  color: var(--text);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.voice-set-row input[type="range"] {
  width: 100%;
  height: 18px;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  accent-color: var(--accent);
}
.voice-set-row input[type="text"],
.voice-voice select {
  box-sizing: border-box;
  height: 28px;
  padding: 0 8px;
  border: 1px solid var(--vc-edge);
  border-radius: 6px;
  background: var(--vc-sunk);
  color: var(--text);
  font: inherit;
  font-size: 12.5px;
}
.voice-set-row input[type="text"] {
  width: 150px;
}
.voice-voice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.voice-voice select {
  max-width: 150px;
}
.voice-seg {
  display: inline-flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 2px;
  padding: 2px;
  border-radius: 14px;
  background: var(--vc-sunk);
}
.voice-seg button {
  padding: 3px 9px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
}
.voice-seg button[aria-pressed="true"] {
  background: var(--vc-raised);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--vc-edge);
}
/* Play-a-sample button beside voice pickers outside a call (Settings, agent form). */
.voice-pick {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: 0;
}
/* The note drops onto its own line under the picker. */
.voice-sample {
  display: contents;
}
/* As tall as the picker beside it. */
.voice-sample-btn {
  display: inline-grid;
  place-items: center;
  align-self: stretch;
  min-height: 28px;
  aspect-ratio: 1;
  padding: 0;
  flex: none;
  border: 1px solid var(--deck-edge, var(--line));
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
}
.voice-sample-btn:hover {
  background: color-mix(in srgb, var(--text) 9%, transparent);
}
.voice-sample-note {
  flex-basis: 100%;
  max-width: 280px;
  font-size: 12px;
  opacity: 0.7;
}
.voice-sample-note:empty {
  display: none;
}
.voice-sample-note.error {
  opacity: 1;
  color: var(--danger, #d9534f);
}

/* Call controls fit their pane; long names and native selects must not set its minimum width. */
.voice-call-controls{min-width:0;max-width:100%;flex:0 1 auto}
.voice-callbar{box-sizing:border-box;min-width:0;max-width:100%;flex-wrap:wrap;gap:6px}
.voice-callbar .voice-who,.voice-capsule .voice-who{flex:0 1 auto;min-width:0;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voice-callbar .voice-status{flex:1 1 80px}
.voice-capsule{max-width:min(420px,100%)}
.voice-capsule-body{flex:1 1 auto;overflow:hidden}
.voice-capsule .voice-status{flex:1 1 auto}
.voice-pop{overflow-x:hidden;overflow-y:auto;overflow-wrap:anywhere}
.voice-settings{width:320px}
.voice-settings .voice-set-row{display:grid;grid-template-columns:minmax(0,1fr);align-items:start;gap:6px;min-width:0}
.voice-settings .voice-set-row>span:first-child{min-width:0;overflow-wrap:anywhere}
.voice-settings .voice-set-row.col>span:first-child{gap:12px}
.voice-settings .voice-set-row input[type=text]{width:100%;min-width:0;max-width:100%}
.voice-settings .voice-voice{display:flex;width:100%;min-width:0;max-width:100%}
.voice-settings .voice-voice select{flex:1 1 0;width:0;min-width:0;max-width:none}
.voice-settings .voice-seg{display:flex;box-sizing:border-box;width:100%;min-width:0;max-width:100%;justify-content:stretch}
.voice-settings .voice-seg button{flex:1 1 auto;min-width:0;white-space:normal;overflow-wrap:anywhere}
.voice-pop.voice-pick{display:block;padding:6px}

.legacy-import, .legacy-import-notice { padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.legacy-import { max-height: min(75vh, 720px); overflow: auto; min-width: 0; }
.legacy-import header, .legacy-import footer, .legacy-import-notice, .legacy-import-files summary { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.legacy-import header { justify-content: space-between; }
.legacy-import-notice > div { flex: 1; }
.legacy-import-notice small, .legacy-import-note { display: block; color: var(--muted); }
.legacy-import-files { list-style: none; padding: 0; }
.legacy-import-files > li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.legacy-import-files summary { cursor: pointer; }
.legacy-import-rows { width: 100%; border-collapse: collapse; text-align: left; }
.legacy-import-rows :is(td, th) { padding: 8px; vertical-align: top; overflow-wrap: anywhere; }
.legacy-import-rows caption { text-align: left; padding: 8px; color: var(--muted); }
.legacy-import-rows td button { display: block; margin-top: 6px; }
.legacy-import-problem, .legacy-import-stale { color: var(--muted); }
.legacy-badge { display: inline-block; font-size: 11px; padding: 2px 6px; margin-inline: 4px; border: 1px solid currentColor; border-radius: 6px; color: var(--muted); white-space: nowrap; }
.legacy-room-marker { padding: 4px 12px; }
.legacy-history pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow: auto; user-select: text; }

.legacy-badge-disclosure{font-size:11px;color:var(--muted)}
.legacy-badge-disclosure>summary{cursor:pointer;list-style:none;width:fit-content}
.legacy-badge-disclosure>summary::-webkit-details-marker{display:none}
.legacy-badge-disclosure>summary:after{content:' ⓘ';font-size:10px}
.legacy-badge-disclosure>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legacy-badge-disclosure>p{max-width:600px;padding:8px 10px;margin:5px 4px;border:1px solid var(--line);border-radius:6px;line-height:1.6;white-space:normal}

/* Landing texture: fills the nearest positioned ancestor (the chat body
   for an empty thread, the card for the agents empty state), behind the
   empty-state copy, and never takes pointer events. */
.landing-texture-wrap {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.landing-texture {
  display: block;
  width: 100%;
  height: 100%;
}
.transcript .empty:not(.quick-add-wrap) > *:not(.landing-texture-wrap) {
  position: relative;
  z-index: 1;
}
.agents-empty {
  position: relative;
}
.agents-empty > *:not(.landing-texture-wrap) {
  position: relative;
  z-index: 1;
}
/* texture runs on under the floating composer */
.thread-chat.thread-landing .landing-texture-wrap { bottom: calc(-1 * var(--composer-h, 0px)); }

/* Quiet the moving field only behind the welcome copy. The soft edge
   keeps the surrounding rain visible, in dark and light themes alike. */
.transcript .empty-copy {
  isolation: isolate;
  color: color-mix(in srgb, var(--text) 88%, var(--bg));
  text-shadow: 0 1px 4px var(--bg);
}
.transcript .landing-texture-wrap + .empty-copy::before {
  content: "";
  position: absolute;
  inset: -40px -48px;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse, color-mix(in srgb, var(--bg) 96%, transparent) 45%, transparent 75%);
}
.transcript .empty-copy .where { color: inherit; }

.persona-draft {
  container-type: inline-size;
  display: grid;
  gap: 8px;
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
}

.persona-draft-title {
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
}

.persona-draft textarea {
  width: 100%;
  min-width: 0;
  min-height: 54px;
  padding: 8px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  resize: vertical;
}

.persona-draft-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.persona-draft-source {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 8px;
}

.persona-draft-by {
  flex: none;
  color: var(--muted);
  font-size: 11px;
}

.persona-draft .provider-tile {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 6px;
}

.persona-draft .provider-tile svg {
  width: 15px;
  height: 15px;
}

.persona-draft-row select {
  min-width: 0;
  max-width: min(240px, 44vw);
  padding: 5px 26px 5px 8px;
}

.persona-draft-go {
  flex: none;
  margin-left: auto;
  padding: 6px 12px;
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 650;
}

.persona-draft-go:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent);
  filter: brightness(1.05);
}

.persona-draft-link {
  flex: none;
  padding: 2px 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 11px;
}

.persona-draft-link:hover:not(:disabled) {
  border: 0;
  background: transparent;
  text-decoration: underline;
}

.persona-draft-status,
.persona-draft-error,
.persona-draft-done,
.persona-draft-off p {
  margin: 0;
  font-size: 11px;
}

.persona-draft-status,
.persona-draft-done {
  color: var(--muted);
}

.persona-draft-error {
  color: var(--warn);
}

.persona-draft-done {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 3px 8px;
}

.persona-draft-actions {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.persona-draft-off {
  border-style: dashed;
  background: color-mix(in srgb, var(--panel) 65%, transparent);
}

.persona-draft-off .persona-draft-title,
.persona-draft-off p {
  color: var(--muted);
}

.persona-draft :focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@container (max-width: 400px) {
  .persona-draft { padding: 10px; }
  .persona-draft-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px;
  }
  .persona-draft-source { grid-column: 1 / -1; }
  .persona-draft-row select { grid-column: 1; grid-row: 2; width: 100%; max-width: none; }
  .persona-draft-row > .persona-draft-go { grid-column: 2; grid-row: 2; }
  .persona-draft-row > .persona-draft-link { grid-column: 1; grid-row: 3; justify-self: start; }
  .persona-draft-go { padding-inline: 9px; }
}

/* Jigga V2: an inline card, a quiet file list, one commit row, then the merge sequence. */
.git-changes-trigger { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; }
.git-state-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--warn); flex: none; }
.git-changes-trigger.is-clean .git-state-dot { background: var(--accent); }
.git-changes-slot { min-width: 0; width: 100%; }
.git-changes-menu { box-sizing: border-box; width: 100%; min-width: 0; margin-top: 9px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); font-size: 12px; line-height: 1.45; }
.git-changes-menu button { font: inherit; min-height: 29px; padding: 5px 10px; border-radius: 7px; white-space: nowrap; }
.git-changes-menu button:disabled { opacity: .4; cursor: default; }
.git-changes-menu :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.git-menu-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.git-menu-head code { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.git-menu-head strong { font-size: 11px; font-weight: 600; white-space: nowrap; }
.git-card-branch { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 10px; }
.git-card-branch::before { content: '·'; margin-right: 6px; }
.git-live-label { margin-left: auto; color: var(--muted); font-size: 9px; white-space: nowrap; }
@media (max-width: 420px) { .git-menu-head { flex-wrap: wrap; } .git-card-branch { flex: 1; } }
.git-changes-menu .git-icon { padding: 0 5px; border: 0; background: transparent; color: var(--muted); }
.git-file-list { max-height: min(300px, 45dvh); overflow: auto; margin-bottom: 9px; scrollbar-width: thin; }
.git-file-row { display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 2px; }
.git-file-row > input { width: 13px; height: 13px; margin: 0; flex: none; accent-color: var(--accent); }
.git-changes-menu .git-file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; border: 0; background: transparent; padding: 3px 0; font-size: 11px; color: var(--text); }
.git-file-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.git-file-stat { font-size: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.git-turn-mark { flex: none; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.git-file-patch { overflow: auto; margin: 3px 0 8px; max-height: 220px; }
.git-file-patch .diff { margin: 0; font-size: 10px; }
.git-commit-row { display: flex; gap: 6px; }
.git-commit-row > input { flex: 1; min-width: 0; padding: 6px 8px; font: inherit; font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; color: var(--text); }
.git-changes-menu .git-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.git-step-rail { display: flex; gap: 0; margin: 13px 0 11px; padding: 12px 2px 0; border-top: 1px solid var(--line); list-style: none; font-size: 10px; color: var(--muted); }
.git-step-rail li { display: flex; align-items: center; gap: 5px; }
.git-step-rail li:not(:last-child) { flex: 1; }
.git-step-rail li:not(:last-child)::after { content: ''; flex: 1; min-width: 5px; height: 1px; background: var(--line); margin: 0 5px; }
.git-step-dot { display: grid; place-items: center; width: 13px; height: 13px; flex: none; border: 1px solid currentColor; border-radius: 50%; font-size: 9px; }
.git-step-rail .done { color: var(--accent); }
.git-step-rail .done .git-step-dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.git-step-rail .current { color: var(--text); }
.git-step-rail .current .git-step-dot { border-color: var(--accent); }
.git-changes-menu .git-step-rail button { padding: 0; min-height: 18px; border: 0; background: transparent; color: var(--accent); font-size: 10px; text-decoration: underline; text-underline-offset: 2px; }
.git-branch-actions { display: flex; gap: 6px; }
.git-branch-actions > button { flex: 1; }
.git-menu-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 10px; margin-top: 7px; }
.git-changes-menu .git-menu-foot button { padding: 0; min-height: 22px; border: 0; background: transparent; color: var(--muted); font-size: 10px; }
.git-empty { margin: 10px 2px; color: var(--muted); font-size: 11px; }
.git-menu-error, .git-menu-status { font-size: 11px; margin: 8px 2px 0; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 150px; overflow: auto; }
.git-menu-error { color: var(--danger); }
.git-menu-status { color: var(--muted); }
.git-confirm { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 7px; }
.git-confirm p { margin: 0 0 8px; font-size: 11px; overflow-wrap: anywhere; }
.git-confirm > button + button { margin-left: 6px; }

.git-unselected-group { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px; }
.git-unselected-toggle { border: 0; background: transparent; color: var(--muted); font-size: 10px; padding: 4px 2px; cursor: pointer; }
.git-unselected-toggle:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.git-file-entry.is-unselected { opacity: 0.72; }

.git-sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* Interactive answers: a comparison card in a reply. Laid out like
   mockups/intelligent-ui/threads-comparison.html, in the app's own colours.
   The fallbacks are for the phone, whose sheet names some colours itself. */
.answer-card { container-type: inline-size; margin: 10px 0; border: 1px solid var(--line, #24303d); border-radius: var(--radius, 12px); background: var(--panel, #0e141b); overflow: hidden; }
.answer-card-head { padding: 14px 16px 10px; }
.answer-eyebrow { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted, #91a0af); }
.answer-card-head h3 { margin: 4px 0 0; font-size: 15px; font-weight: 600; }
.answer-summary { margin: 6px 0 0; color: var(--muted, #91a0af); }
.answer-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 22px; padding: 4px 16px 14px; }
.answer-range { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted, #91a0af); }
.answer-range output { margin-left: 4px; color: var(--text, #e4eaf0); font-variant-numeric: tabular-nums; }
.answer-range input { width: 100%; accent-color: var(--accent, #71e6b5); }
.answer-choice { min-width: 0; margin: 0; padding: 0; border: 0; font-size: 12px; color: var(--muted, #91a0af); }
.answer-choice legend { margin-bottom: 6px; padding: 0; }
.answer-segments { display: flex; flex-wrap: wrap; gap: 4px; }
.answer-segments label { position: relative; flex: 1; padding: 6px 10px; border: 1px solid var(--line, #24303d); border-radius: 8px; text-align: center; color: var(--text, #e4eaf0); cursor: pointer; }
.answer-segments label.on { background: var(--accent, #71e6b5); border-color: var(--accent, #71e6b5); color: var(--accent-ink, #04211d); }
.answer-segments input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.answer-segments label:has(input:focus-visible) { outline: 2px solid var(--accent, #71e6b5); outline-offset: 2px; }
.answer-choice:disabled label, .answer-range input:disabled { cursor: default; opacity: 0.7; }
.answer-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--line, #24303d); border-bottom: 1px solid var(--line, #24303d); }
.answer-option { min-width: 0; padding: 14px 16px; background: var(--bg, #090d12); border-right: 1px solid var(--line, #24303d); }
.answer-option:last-child { border-right: 0; }
.answer-option.best { background: var(--panel-2, #151e28); box-shadow: inset 0 3px var(--accent, #71e6b5); }
.answer-option.out { opacity: 0.55; }
.answer-option-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 22px; }
.answer-option h4 { margin: 0; font-size: 13px; font-weight: 600; }
.answer-best { font-size: 11px; color: var(--accent, #71e6b5); }
.answer-headline { display: flex; flex-direction: column; margin-top: 8px; }
.answer-headline strong { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.answer-headline span, .answer-fit, .answer-note, .answer-hint { font-size: 12px; color: var(--muted, #91a0af); }
.answer-fit { margin: 4px 0 10px; }
.answer-option dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 12px; }
.answer-option dt { color: var(--muted, #91a0af); }
.answer-option dd { margin: 0; }
.answer-note { margin: 10px 0 0; }
.answer-result { margin: 0; padding: 12px 16px 4px; }
.answer-more { padding: 4px 16px 12px; font-size: 12px; color: var(--muted, #91a0af); }
.answer-more summary { cursor: pointer; }
.answer-more ul { margin: 6px 0 0; padding-left: 18px; }
.answer-more pre { max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.answer-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line, #24303d); }
.answer-foot .primary { margin-left: auto; }
.answer-card.preparing, .answer-card.broken { padding: 14px 16px; }
.answer-skeleton { height: 44px; margin: 10px 0; border-radius: 6px; background: var(--line, #24303d); animation: answer-pulse 1.4s ease-in-out infinite; }
.answer-skeleton.short { width: 60%; height: 14px; }
@keyframes answer-pulse { 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .answer-skeleton { animation: none; } }
/* A narrow pane stacks the options. */
@container (max-width: 480px) {
  .answer-options { grid-template-columns: 1fr; }
  .answer-option { border-right: 0; border-bottom: 1px solid var(--line, #24303d); }
  .answer-option:last-child { border-bottom: 0; }
}

/* Inline-size containment removes the card's intrinsic width. Stretch its
   chat bubble instead of shrinking a diagram to the prose's shortest line. */
.bot-row:has(.generated-answer) { width: 85%; }
.bot-row > .bubble:has(.generated-answer) { justify-self: stretch; }
/* Staging Discuss text must not make Chromium shift an approved native view.
   Explicit scrolling still revokes it through the normal capture listener. */
.transcript:has(.generated-answer[data-generated-running="true"]) { overflow-anchor: none; }
.generated-fallback { margin: 0; padding: 4px 16px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
/* Inward integer rounding can remove one CSS pixel at a fractional top edge.
   Reserve it so the native rectangle still meets main's 200px minimum. */
.generated-slot { margin: 0 16px 14px; border: 1px solid var(--line, #24303d); border-radius: 6px; background: var(--bg, #090d12); display: grid; place-items: center; color: var(--muted, #91a0af); min-height: 201px; max-height: 800px; }
.generated-slot > span { padding: 20px; text-align: center; font-size: 12px; }
.generated-discuss { padding: 12px 16px; border-top: 1px solid var(--line, #24303d); }
.generated-discuss pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; }
.generated-status { padding: 0 16px 12px; }
.generated-answer .answer-foot { min-height: 48px; box-sizing: border-box; }
.generated-text-version { padding: 0 16px 12px; }
.generated-text-version summary { cursor: pointer; color: var(--muted, #91a0af); font-size: 12px; }
.generated-text-version .generated-fallback { padding: 12px 0 0; }

/* The per-project Sources sheet in the ApexAgent dock. Reuses the dock's theme variables. */

.apex-agent-sources-add input,
.apex-agent-sources-field select,
.apex-agent-sources-field textarea {

.apex-agent-backdrop { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: 22px; background: color-mix(in srgb, var(--bg) 85%, transparent); }
.apex-agent { --aa-line: color-mix(in srgb, var(--line) 90%, transparent); --aa-surface: color-mix(in srgb, var(--panel) 92%, transparent); width: min(760px, 100%); height: min(780px, 100%); min-height: min(420px, 100%); display: flex; flex-direction: column; overflow: hidden; color: var(--text); background: var(--aa-surface); border: 1px solid var(--aa-line); border-radius: 16px; box-shadow: 0 30px 80px color-mix(in srgb, black 60%, transparent), 0 0 34px color-mix(in srgb, var(--accent) 8%, transparent); -webkit-backdrop-filter: blur(22px) saturate(1.25); backdrop-filter: blur(22px) saturate(1.25); }
.apex-agent.widget { width: 100%; height: 100%; min-height: 0; border-radius: inherit; box-shadow: none; }
.apex-agent-head { min-width: 0; display: grid; gap: 4px; padding: 7px 12px; border-bottom: 1px solid var(--aa-line); }
.apex-agent-head-row { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.apex-agent-brand { min-width: 0; display: flex; align-items: baseline; gap: 7px; }
.apex-agent-head .eyebrow { flex: none; margin: 0; color: var(--muted); font-size: 10px; }
.apex-agent-head h1 { margin: 0; color: var(--text); font-size: 13px; line-height: 1.2; font-weight: 700; }
.apex-agent-project-selector { min-width: 0; flex: 0 1 190px; }
.apex-agent-project-selector select { min-width: 0; max-width: 100%; }
.apex-agent-head-context > p { min-width: 0; flex: 1; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
.apex-agent-head-meta { min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.apex-agent-head-actions { min-width: 0; display: flex; align-items: center; gap: 5px; }
.apex-agent-head-actions button, .apex-agent-tabs button, .apex-agent-source-picker > button, .apex-agent-settings > button { min-height: 28px; padding: 0 8px; color: var(--text); border: 1px solid var(--aa-line); border-radius: 8px; background: color-mix(in srgb, var(--panel-2) 78%, transparent); cursor: pointer; font: inherit; }
.apex-agent-head-actions .icon { width: 28px; padding: 0; font-size: 18px; }
.apex-agent-status { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apex-agent-thinking { min-width: 0; display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
.apex-agent-thinking select { min-width: 0; max-width: 150px; padding: 4px 6px; }
.apex-agent-tabs button, .apex-agent-source-picker > button, .apex-agent-settings > button { min-height: 30px; padding: 0 10px; color: var(--text); border: 1px solid var(--aa-line); border-radius: 8px; background: color-mix(in srgb, var(--panel-2) 78%, transparent); cursor: pointer; }
.apex-agent-head-actions .icon { width: 30px; padding: 0; font-size: 18px; }
.apex-agent-status { color: var(--accent); white-space: nowrap; font-size: 11px; }
.apex-agent-status.paused { color: var(--warn); }
.apex-agent-tabs { flex: none; display: flex; gap: 4px; padding: 8px 14px 0; border-bottom: 1px solid var(--aa-line); }
.apex-agent-tabs button { border-color: transparent; background: transparent; color: var(--muted); }
.apex-agent-tabs button.active { color: var(--text); border-color: var(--aa-line); background: color-mix(in srgb, var(--panel-2) 85%, transparent); }
.apex-agent-tabpanel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.apex-agent-transcript { flex: 1; min-height: 80px; overflow-y: auto; padding: 18px clamp(14px, 5vw, 36px); }
.apex-agent-message { max-width: 680px; margin: 0 0 16px; }
.apex-agent-message.human { margin-left: auto; }
.apex-agent-message-role, .apex-agent-muted { color: var(--muted); font-size: 11px; }

.apex-agent-message p { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.apex-agent-evidence, .apex-agent-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.apex-agent-evidence button, .apex-agent-evidence-link { max-width: 100%; padding: 6px 8px; color: var(--accent); border: 1px solid var(--aa-line); border-radius: 8px; background: var(--panel); text-align: left; font-size: 11px; cursor: pointer; }
.apex-agent-evidence button small, .apex-agent-evidence-link small { display: block; max-width: 520px; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
.apex-agent-composer { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--aa-line); }

.apex-agent-composer button, .apex-agent-setup-form button, .apex-agent-settings .primary { flex: none; min-height: 36px; padding: 0 14px; color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 9px; background: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
.apex-agent button:disabled { opacity: .52; cursor: default; }
.apex-agent-setup { display: flex; flex-direction: column; gap: 16px; padding: 20px; overflow-y: auto; }
.apex-agent-intro { padding: 16px; border: 1px solid var(--aa-line); border-radius: 12px; background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.apex-agent-intro strong { font-size: 15px; }
.apex-agent-intro p { margin: 5px 0 0; color: var(--muted); }
.apex-agent-recent { display: flex; flex-wrap: wrap; gap: 7px; margin: 0; padding: 9px 10px 11px; border: 1px solid var(--aa-line); border-radius: 10px; }

.apex-agent-source-picker { display: grid; gap: 7px; }
.apex-agent-chips { align-items: flex-start; }
.apex-agent-setup-form { display: flex; align-items: flex-end; gap: 8px; padding-top: 5px; }
.apex-agent-empty { padding: 24px 18px; color: var(--muted); }

.apex-agent-findings { display: grid; gap: 8px; margin: 6px 0 12px; }

.apex-agent-findings article.settled { opacity: .58; }
.apex-agent-findings article small { display: block; color: var(--muted); }
.apex-agent-buttons { display: flex; flex-wrap: wrap; gap: 5px; align-items: flex-start; }
.apex-agent-buttons button { min-height: 27px; padding: 3px 8px; color: var(--text); border: 1px solid var(--aa-line); border-radius: 7px; background: var(--panel-2); font-size: 10px; cursor: pointer; }
.apex-agent-activity-view, .apex-agent-settings { display: grid; gap: 12px; padding: 16px; overflow-y: auto; }
.apex-agent-controls { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; }
.apex-agent-controls p, .apex-agent-settings p { margin: 4px 0; color: var(--muted); }
.apex-agent-activity-row { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); font-size: 11px; }
.apex-agent-activity-row time { flex: none; width: 120px; color: var(--muted); }
.apex-agent-settings h2 { margin: 4px 0 0; font-size: 12px; }
.apex-agent-settings label { display: grid; gap: 5px; font-size: 11px; }
.apex-agent-settings input, .apex-agent-settings select { width: 100%; min-height: 34px; padding: 7px 9px; color: var(--text); border: 1px solid var(--aa-line); border-radius: 8px; background: var(--panel); font: inherit; }
.apex-agent-settings > button { justify-self: start; }
.apex-agent-sr-only, .apex-agent .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (max-width: 600px) { .apex-agent-backdrop { padding: 8px; } .apex-agent { height: 100%; } .apex-agent-head { padding: 6px 8px; } .apex-agent-setup { padding: 14px; } .apex-agent-composer { padding: 10px; } .apex-agent-controls { flex-direction: column; } .apex-agent-head-row { flex-wrap: nowrap; } .apex-agent-brand { flex: 0 1 auto; } .apex-agent-project-selector { flex: 0 1 150px; } .apex-agent-head-actions { gap: 4px; flex-wrap: nowrap; justify-content: flex-end; } .apex-agent-status { max-width: none; overflow: visible; white-space: normal; text-align: right; } }
@media (max-width: 380px) {
  .apex-agent-head-row:first-child { gap: 4px; }
  .apex-agent-brand .eyebrow { display: none; }
  .apex-agent-head-actions { flex: 0 0 auto; gap: 3px; }
  .apex-agent-head-actions button:not(.icon) { padding-inline: 4px; font-size: 9px; }
  .apex-agent-project-selector { flex: 0 1 68px; }
  .apex-agent-project-selector select { width: 68px; }
  .apex-agent-head-context > p { flex-basis: 0; }
  .apex-agent-head-meta { flex: none; }
  .apex-agent-status { display: none; }
  .apex-agent-thinking select { max-width: 106px; }

  .apex-agent-thinking select { width: 100%; max-width: 100%; }
}
