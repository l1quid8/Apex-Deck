.assistant-float-picker-top>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assistant-float-picker>input{min-width:0;max-width:calc(100% - 20px)}
.assistant-float-thread-list{min-width:0;min-height:0;flex:1 1 126px;overflow-x:hidden}
.assistant-float-thread,.assistant-float-use-thread{min-width:0;max-width:100%}

/* Appearance only: ChatPane owns the shared chip actions and state.
   Loaded after themes so the chosen geometry survives every skin. */
.composer-bots .chip-copy, .composer-bots .chip-details { display: contents; }
.composer-bots .chip-phase { font-size: 10px; font-weight: 400; color: var(--muted); }
.composer-bots[data-chip-style]:where(:not([data-chip-style="classic"])) { padding: 5px 4px 7px; }
.composer-bots[data-chip-style]:not([data-chip-style="classic"]) .chip { position: relative; flex: none; }
.composer-bots .chip-name:focus-visible, .composer-bots .chip-kick:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }

.composer-bots[data-chip-style="dashed"] .chip { border: 1px dashed var(--muted); background: transparent; }
.composer-bots[data-chip-style="dashed"] .chip.to { border: 1px solid var(--who); background: var(--who); color: #111622; }
.composer-bots[data-chip-style="dashed"] .chip.to :is(button,.chip-meta,.editor-badge) { color: #111622; }
.composer-bots[data-chip-style="dashed"] .chip.to .editor-badge { border-color: #11162266; }

.composer-bots[data-chip-style="tinted"] .chip { border-color: color-mix(in srgb,var(--who) 20%,transparent); background: color-mix(in srgb,var(--who) 8%,var(--panel)); color: var(--muted); }
.composer-bots[data-chip-style="tinted"] .chip.to { border-color: var(--who); background: color-mix(in srgb,var(--who) 24%,var(--panel)); color: var(--text); }

.composer-bots[data-chip-style="stamp"] { gap: 10px; }
.composer-bots[data-chip-style="stamp"] .chip { border: 1px solid var(--who); border-radius: 2px; box-shadow: 2px 2px 0 var(--who); background: transparent; overflow: visible; }
.composer-bots[data-chip-style="stamp"] .chip-name { padding: 4px 8px 4px 4px; }
.composer-bots[data-chip-style="stamp"] .chip-label { text-transform: uppercase; letter-spacing: .04em; font-size: 10px; }
.composer-bots[data-chip-style="stamp"] .chip.to { outline: 2px solid var(--text); outline-offset: 3px; }
.composer-bots[data-chip-style="stamp"] .chip[data-editing="true"] { background: var(--who); color: #111622; box-shadow: none; }
.composer-bots[data-chip-style="stamp"] .chip[data-editing="true"] :is(button,.chip-meta,.editor-badge) { color: #111622; }
.composer-bots[data-chip-style="stamp"] .chip[data-editing="true"] .editor-badge { border-color: #11162266; }

.composer-bots[data-chip-style="mono"] .chip { border-radius: 4px; border-color: var(--line); background: transparent; color: var(--muted); }
.composer-bots[data-chip-style="mono"] .chip-name { font: 500 11px ui-monospace,"SF Mono",Menlo,monospace; text-transform: uppercase; letter-spacing: .06em; }
.composer-bots[data-chip-style="mono"] .chip.to { border-color: var(--who); color: var(--who); }
.composer-bots[data-chip-style="mono"] :is(.chip-meta,.editor-badge) { text-transform: none; letter-spacing: 0; font-family: inherit; }
.composer-bots[data-chip-style="mono"] .chip-add { border-radius: 4px; }

.composer-bots[data-chip-style="ticket"] .chip { border: 1px dashed color-mix(in srgb,var(--who) 65%,var(--line)); border-radius: 8px; background: transparent; }
.composer-bots[data-chip-style="ticket"] .chip-name { padding: 0 8px 0 0; gap: 6px; }
.composer-bots[data-chip-style="ticket"] .identicon { width: 32px; height: 32px; border-radius: 0; padding: 6px; background: color-mix(in srgb,var(--who) 18%,var(--panel)); border-right: 1px dashed var(--line); }
.composer-bots[data-chip-style="ticket"] .chip.to { border-style: solid; border-color: var(--who); background: color-mix(in srgb,var(--who) 10%,transparent); }

.composer-bots[data-chip-style="keycap"] .chip { border: 1px solid var(--line); border-bottom-width: 4px; border-radius: 7px; background: var(--well,var(--panel)); }
.composer-bots[data-chip-style="keycap"] .chip-name { padding: 4px 8px 4px 4px; }
.composer-bots[data-chip-style="keycap"] .chip[data-editing="true"] { transform: translateY(2px); border-bottom-width: 2px; }
.composer-bots[data-chip-style="keycap"] .chip.to { border-color: var(--who); box-shadow: inset 3px 0 0 var(--who); }

/* The composer is above the row: tabs attach at their top edge. */
.chat[data-bot-chip-style="tab"] .composer-box { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.composer-bots[data-chip-style="tab"] { margin-top: 0; padding-top: 0; align-items: flex-start; }
.composer-bots[data-chip-style="tab"] .chip { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; background: var(--panel); }
.composer-bots[data-chip-style="tab"] .chip-name { padding: 7px 8px 6px 4px; }
.composer-bots[data-chip-style="tab"] .chip[data-editing="true"] .chip-name { padding-bottom: 10px; }
.composer-bots[data-chip-style="tab"] .chip.to { border-color: var(--who); border-bottom-width: 3px; }
.composer-bots[data-chip-style="tab"] :is(.quick-add-wrap,.chips-fold) { margin-top: 5px; }

.composer-bots:is([data-chip-style="ledger"],[data-chip-style="two-line"]) .chip { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.composer-bots:is([data-chip-style="ledger"],[data-chip-style="two-line"]) .chip-name { padding: 5px 8px 5px 4px; gap: 7px; }
.composer-bots:is([data-chip-style="ledger"],[data-chip-style="two-line"]) .chip-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.composer-bots:is([data-chip-style="ledger"],[data-chip-style="two-line"]) .chip-details { display: flex; align-items: center; gap: 5px; }
.composer-bots:is([data-chip-style="ledger"],[data-chip-style="two-line"]) .chip.to { border-color: var(--who); }
.composer-bots[data-chip-style="ledger"] .chip-description { display: none; }
.composer-bots[data-chip-style="ledger"] .editor-badge { border: 0; padding: 0; color: var(--who); }
.composer-bots[data-chip-style="two-line"] .chip-name { padding: 5px 12px 5px 5px; }
.composer-bots[data-chip-style="two-line"] .identicon { --cell: 4px; width: 32px; height: 32px; }
.composer-bots[data-chip-style="two-line"] .chip.to { background: color-mix(in srgb,var(--who) 10%,var(--panel)); }

.composer-bots[data-chip-style="terminal"] .chip { border: 0; border-radius: 0; background: transparent; }
.composer-bots[data-chip-style="terminal"] .chip-name { font: 500 11px ui-monospace,"SF Mono",Menlo,monospace; padding: 4px 0; gap: 4px; }
.composer-bots[data-chip-style="terminal"] .chip-name::before { content: '['; }
.composer-bots[data-chip-style="terminal"] .chip-name::after { content: ']'; }
.composer-bots[data-chip-style="terminal"] .chip-label::before { content: '@'; }
.composer-bots[data-chip-style="terminal"] .chip.to { color: var(--who); }
.composer-bots[data-chip-style="terminal"] .chip.to .chip-label { text-decoration: underline; text-underline-offset: 3px; }
.composer-bots[data-chip-style="terminal"] .editor-badge { border: 0; padding: 0; }
/* Keep a face when folded or automatically compacted, so a name-free token is still identifiable. */
.composer-bots[data-chip-style="terminal"]:not(.folded):not([data-fit="faces"]) .identicon { display: none; }

/* Compact layouts retain queue and editing as separate badges. The complete
   state and name are also on the button's accessible label and tooltip. */
.composer-bots[data-chip-style="stack"] { gap: 0; padding-left: 12px; }
.composer-bots[data-chip-style="stack"] .chip-wrap { margin-left: -8px; }
.composer-bots[data-chip-style="stack"] .chip-wrap:is(:hover,:focus-within) { position: relative; z-index: 3; }
.composer-bots[data-chip-style="stack"] .chip { overflow: visible; border: 0; background: var(--panel); border-radius: 50%; box-shadow: 0 0 0 2px var(--panel); }
.composer-bots[data-chip-style="stack"] .chip.to { box-shadow: 0 0 0 2px var(--panel),0 0 0 4px var(--who); z-index: 1; }
.composer-bots[data-chip-style="stack"] .chip-name { position: relative; min-width: 36px; min-height: 36px; padding: 4px; }
.composer-bots[data-chip-style="stack"] .identicon { border-radius: 50%; }
.composer-bots[data-chip-style="stack"] :is(.chip-label,.chip-description,.chip-levels,.chip-queued-word) { display: none; }
.composer-bots[data-chip-style="stack"] .participant-status { position: absolute; bottom: 1px; right: 1px; border: 2px solid var(--panel); box-sizing: content-box; }
.composer-bots[data-chip-style="stack"] .chip-queued { position: absolute; top: -4px; right: -3px; background: var(--who); color: #111622; padding: 1px 4px; border-radius: 9px; z-index: 2; }
.composer-bots[data-chip-style="stack"] .editor-badge { position: absolute; bottom: -5px; left: -3px; font-size: 0; background: var(--panel); padding: 2px 3px; }
.composer-bots[data-chip-style="stack"] .editor-badge::after { content: '✎'; font-size: 11px; }
.composer-bots[data-chip-style="stack"] .quick-add-wrap { margin-left: 12px; }

.composer-bots[data-chip-style="tiles"] { align-items: flex-start; }
.composer-bots[data-chip-style="tiles"] .chip { overflow: visible; border: 1px solid transparent; border-radius: 10px; background: transparent; }
.composer-bots[data-chip-style="tiles"] .chip-name { position: relative; flex-direction: column; min-width: 54px; padding: 5px 6px 4px; gap: 3px; font-size: 10.5px; }
.composer-bots[data-chip-style="tiles"] .chip.to { border-color: var(--who); background: color-mix(in srgb,var(--who) 10%,transparent); }
.composer-bots[data-chip-style="tiles"] .identicon { --cell: 4px; width: 32px; height: 32px; border-radius: 8px; }
.composer-bots[data-chip-style="tiles"] :is(.chip-description,.chip-levels,.chip-queued-word) { display: none; }
.composer-bots[data-chip-style="tiles"] .participant-status { position: absolute; top: 28px; right: 8px; box-shadow: 0 0 0 2px var(--panel); }
.composer-bots[data-chip-style="tiles"] .chip-queued { position: absolute; top: 0; right: 0; background: var(--who); color: #111622; border-radius: 8px; padding: 1px 4px; }
.composer-bots[data-chip-style="tiles"] .editor-badge { font-size: 0; border: 0; padding: 0; }
.composer-bots[data-chip-style="tiles"] .editor-badge::after { content: '✎'; font-size: 11px; }
.composer-bots[data-chip-style="tiles"] .chip-add { min-height: 48px; border-radius: 10px; }

/* Dense fitting must not erase the layout choice or hide an active editor. */
.composer-bots.folded :is(.chip-copy,.chip-details), .composer-bots[data-fit="faces"] :is(.chip-copy,.chip-details) { display: contents; }
.composer-bots.folded .chip-phase, .composer-bots[data-fit="faces"] .chip-phase { display: none; }
.composer-bots[data-chip-style]:not([data-chip-style="classic"]) .editor-badge { display: inline; }
.composer-bots.folded .editor-badge { font-size: 0; padding: 0 2px; }
.composer-bots.folded .editor-badge::after { content: '✎'; font-size: 11px; }
@media (prefers-reduced-motion: reduce) { .composer-bots .chip { transition: none; } }
.composer-bots .chip-low { position: absolute; top: -6px; left: 0; padding: 1px 3px; border-radius: 3px; background: var(--panel); color: var(--danger); font-size: 9px; z-index: 3; }
.composer-bots[data-chip-style="stack"] .chip-wrap:first-child { margin-left: 0; }

/* Settings: chip style picker (one live preview + style names). */
.settings-row.chip-style-row { flex-direction: column; align-items: stretch; gap: 10px; }
.chip-style-picker { display: grid; gap: 8px; }
.chip-style-preview { display: block; height: auto; min-height: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); pointer-events: none; overflow: hidden; }
.chip-style-preview .chips.composer-bots { position: static; margin: 0; }
.chip-style-preview-composer { height: 14px; padding: 0; min-height: 0; margin: 0 0 0; border: 1px solid var(--line); background: var(--panel); }
.chip-style-caption { margin: 0; font-size: 12px; color: var(--muted); }
.chip-style-names { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.chip-style-name { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--text); font-size: 12px; cursor: pointer; }
.chip-style-name:hover, .chip-style-name:focus-visible { border-color: var(--muted); }
.chip-style-name.current { border-color: var(--text); font-weight: 600; }

/* Access is plain metadata at every level, with no nested pill or warning tint. */
.composer-bots .chip-access { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 0; border: 0; border-radius: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 500; line-height: 1.4; white-space: nowrap; }
.composer-bots .chip-access svg { flex-shrink: 0; }
.bot-access-note { margin: 4px 0 0; font-size: 11px; }
.composer-bots:is([data-chip-style="stack"],[data-chip-style="tiles"]) .chip-access { display: none; }
.bot-access { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bot-access .segmented .seg { padding: 4px 10px; font-size: 12px; }

/* The Appearance page. Everything here is neutral: it follows Deck's applied
   Mode and never the theme, which shows only inside the preview frame. */
.settings.appearance-neutral,
:root[data-deck-theme] .settings.appearance-neutral {
  --bg: #18191b; --panel: #1f2023; --panel-2: #2a2b2f; --line: #303136; --text: #ececea; --muted: #a6a7ab;
  --accent: #ececea; --accent-ink: #141517; --radius: 7px;
  --studio-code: #141517; --studio-edge: #4a4b52; --studio-selected: #2c2d31; --studio-attention: #eebb6c; --studio-danger: #f0907f;
  /* Theme rules that paint from their own tokens get the same neutral values. */
  --deck-bg: var(--bg); --deck-panel: 31 32 35; --deck-panel-raised: 42 43 47; --deck-code: var(--studio-code); --deck-text: var(--text);
  --deck-muted: var(--muted); --deck-muted-2: var(--muted); --deck-accent: var(--accent); --deck-edge: var(--studio-edge);
  --deck-selected: var(--studio-selected); --deck-opacity: 1; --deck-blur: 0px;
  --deck-font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
  background: var(--bg);
  color: var(--text);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
:root[data-deck-light="true"] .settings.appearance-neutral,
:root[data-deck-light="true"][data-deck-theme] .settings.appearance-neutral {
  --bg: #f2f2f0; --panel: #fafaf9; --panel-2: #ffffff; --line: #dcdcd8; --text: #1d1e20; --muted: #5a5b60;
  --accent: #1d1e20; --accent-ink: #ffffff;
  --studio-code: #e9e9e6; --studio-edge: #b4b4b0; --studio-selected: #e6e6e3; --studio-attention: #8a5a00; --studio-danger: #ad3626;
  --deck-panel: 250 250 249; --deck-panel-raised: 255 255 255;
  color-scheme: light;
}
:root[data-deck-theme] .settings.appearance-neutral .settings-nav {
  background: var(--panel);
  border: 0;
  border-right: 1px solid var(--line);
  border-radius: 0;
  box-shadow: none;
  margin: 0;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
:root[data-deck-theme] .settings.appearance-neutral .settings-main.studio-main { padding: 0; overflow: hidden; background: var(--bg); }

.studio { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }
:root[data-deck-theme] .settings.appearance-neutral {
/* ---- Status bar: two fixed rows. What Deck is using, then what the preview shows. ---- */
.studio-identity { display: flex; align-items: center; gap: 16px; justify-content: space-between; padding: 0 14px; height: 52px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 6; min-width: 0; }
.studio-id-copy { display: flex; align-items: center; gap: 10px; min-width: 0; position: relative; }
.studio-id-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--studio-edge); }
.studio-id-text { min-width: 0; }
.studio-id-line { display: flex; gap: 0 6px; align-items: center; font-size: 13px; line-height: 19px; white-space: nowrap; min-width: 0; }
.studio-id-line strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.studio-id-tag { flex: 0 0 50px; font-size: 11.5px; color: var(--muted); }
.studio-deck-line strong { font-weight: 500; }
.studio-sep { color: var(--muted); }
.studio-id-state { color: var(--muted); }
.studio-state-btn { padding: 0; line-height: inherit; font-size: 13px; font-weight: 600; color: var(--studio-attention); text-decoration-color: currentColor; }
.studio-id-actions { display: flex; gap: 6px; flex: none; }
.studio-btn { min-height: 32px; padding: 4px 11px; border: 1px solid var(--studio-edge); background: var(--panel-2); border-radius: var(--radius); cursor: pointer; white-space: nowrap; max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
.studio-btn:hover:not(:disabled) { border-color: var(--muted); }
.studio-btn.studio-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.studio-btn:disabled { opacity: .45; cursor: default; }
.studio-btn.studio-small { min-height: 28px; padding: 2px 9px; font-size: 12.5px; }
.studio-link-btn { background: none; border: 0; padding: 4px 2px; color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--muted); cursor: pointer; font-size: 12.5px; white-space: nowrap; }
.studio-link-btn.danger, .studio-err { color: var(--studio-danger); }
.studio-popover { position: absolute; top: calc(100% + 10px); left: 0; z-index: 20; width: min(340px, 86vw); background: var(--panel-2); border: 1px solid var(--studio-edge); border-radius: var(--radius); padding: 12px; box-shadow: 0 16px 40px -18px rgb(0 0 0 / .6); }
.studio-pop-title { font-weight: 600; margin-bottom: 6px; }
.studio-pop-note { font-size: 12px; color: var(--muted); margin: -3px 0 6px; }
.studio-popover ul { list-style: none; margin: 0; padding: 0; }
.studio-popover li { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
.studio-popover li em { grid-column: 1; font-style: normal; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.studio-popover li .studio-link-btn { grid-column: 2; grid-row: 1 / 3; align-self: center; }

.studio-pinned { flex: none; padding: 8px 14px 0; }
.studio-row { display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 34px; }
.studio-row-label { font-weight: 600; font-size: 13px; }
.studio-row-note { padding-left: 70px; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
.studio-preset-block { margin-top: 2px; }
.studio-preset-head { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.studio-preset-count { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.studio-preset-count .studio-link-btn { padding: 0; font-size: 11.5px; }
.studio-preset-nav { margin-left: auto; display: flex; gap: 4px; flex: none; }
.studio-preset-nav[data-hidden="true"] { visibility: hidden; }
.studio-nav-arrow { width: 26px; height: 26px; display: grid; place-items: center; padding: 0 0 2px; font-size: 18px; line-height: 1; border: 1px solid var(--studio-edge); border-radius: var(--radius); background: var(--panel-2); color: var(--text); cursor: pointer; }
.studio-nav-arrow:hover:not([aria-disabled="true"]) { border-color: var(--muted); }
.studio-nav-arrow[aria-disabled="true"] { background: none; color: var(--studio-edge); cursor: default; }
.studio-preset-meta { display: flex; align-items: center; gap: 8px; min-height: 20px; }
.studio-preset-owner { font-size: 11.5px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.studio-preset-actions { margin-left: auto; display: flex; gap: 8px; flex: none; }
.studio-preset-actions .studio-link-btn { padding: 0 1px; font-size: 11.5px; }
/* One row in every theme, so nothing below it moves. The next card is left cut off on purpose. */
.studio-preset-strip { display: flex; gap: 6px; height: 68px; overflow-x: auto; overflow-y: hidden; padding: 2px 2px 2px; margin: 0 -2px; scrollbar-width: none; position: relative; }
.studio-preset-strip::-webkit-scrollbar { display: none; }
.studio-preset-strip[data-more="right"] { mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent); }
.studio-preset-strip[data-more="left"] { mask-image: linear-gradient(to left, #000 calc(100% - 30px), transparent); }
.studio-preset-strip[data-more="both"] { mask-image: linear-gradient(to right, transparent, #000 30px, #000 calc(100% - 30px), transparent); }
.studio-preset-card { flex: 0 0 clamp(72px, calc((100% - 24px) / 4.35), 96px); display: flex; flex-direction: column; gap: 2px; cursor: pointer; position: relative; border-radius: 6px; min-width: 0; }
.studio-preset-card .studio-thumb { height: 42px; flex: none; }
.studio-preset-card.studio-on::before { content: ""; position: absolute; inset: -2px -2px auto; height: 46px; border: 2px solid var(--accent); border-radius: 8px; pointer-events: none; }
.studio-card-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 1px; color: var(--muted); }
.studio-preset-card.studio-on .studio-card-name { color: var(--text); font-weight: 600; }
.studio-first-yours { margin-left: 9px; }

.studio-yours-tag { position: absolute; left: 3px; top: 3px; font-size: 9.5px; line-height: 13px; font-weight: 600; padding: 0 4px; border-radius: 3px; background: rgb(0 0 0 / .78); color: #fff; }
.studio-preset-empty { flex: 0 0 104px; align-self: flex-start; height: 42px; display: grid; place-items: center; margin-left: 4px; padding: 0 8px; border: 1px dashed var(--studio-edge); border-radius: 6px; font-size: 11px; line-height: 1.2; color: var(--muted); text-align: center; }

.studio-tabs { display: flex; gap: 0; padding: 0 8px; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); flex: none; }

/* ---- Segmented ---- */
.studio-seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); padding: 2px; gap: 2px; background: var(--studio-code); min-width: 0; }

/* Thumbnail: a miniature of the real surfaces, painted from the same tokens. */

.studio-thumb[data-material="solid"] .studio-t-pane { background: var(--panel); border: 1px solid var(--line); border-radius: min(var(--radius), 3px); }
.studio-thumb .studio-t-l { height: 2px; width: 78%; background: var(--text); opacity: .75; }
.studio-thumb .studio-t-l.studio-s { width: 52%; opacity: .45; }
.studio-thumb .studio-t-a { height: 2px; width: 34%; background: var(--accent); }
.studio-thumb .studio-t-box { margin-top: auto; height: 7px; border: 1px solid var(--studio-edge); background: var(--panel-2); border-radius: min(var(--radius), 3px); }

/* ---- Controls ---- */
.studio-ctl { padding: 5px 0; position: relative; }
.studio-ctl-head { display: flex; align-items: center; gap: 2px; min-width: 0; min-height: 26px; }
.studio-ctl-name { font-weight: 500; white-space: nowrap; }
.studio-ctl.studio-changed .studio-ctl-name::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: var(--studio-attention); vertical-align: 2px; }
.studio-ctl-revert { width: 22px; height: 22px; padding: 0; line-height: 1; border: 1px solid transparent; background: none; border-radius: 5px; color: var(--muted); cursor: pointer; }

.studio-ctl-top, .studio-line-seg { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.studio-line { display: grid; grid-template-columns: 104px minmax(0, 1fr) 44px; align-items: center; column-gap: 8px; }

input[role="switch"]:checked::after { transform: translateX(16px); background: var(--accent-ink); }
input[type="color"] { width: 44px; height: 30px; padding: 2px; border: 1px solid var(--studio-edge); border-radius: 6px; background: var(--studio-code); cursor: pointer; }
/* Adaptive and Exact share a height, so nothing below the accent jumps. */
.studio-accent-slot { height: 60px; }
.studio-swatches { display: flex; gap: 8px; align-items: center; margin: 3px 0 0; height: 28px; }

.studio-hue-item.studio-on .studio-hue-dot { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.studio-hue-dot { width: 16px; height: 16px; border-radius: 50%; }
.studio-range-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.studio-range-row output { text-align: right; }
.studio-exact-row { display: flex; gap: 8px; margin-top: 4px; }
.studio-hex, textarea, #saveName { background: var(--studio-code); border: 1px solid var(--studio-edge); border-radius: 6px; padding: 5px 8px; }
.studio-hex { font-family: ui-monospace, "SF Mono", Menlo, monospace; flex: 1; min-width: 0; }
textarea { width: 100%; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; resize: vertical; margin-top: 6px; }
.studio-err { font-size: 12px; margin-top: 3px; }
[aria-invalid="true"] { border-color: var(--studio-danger); }
.studio-result { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
.studio-res-item { height: 22px; border: 1px solid var(--line); border-radius: 5px; padding: 0 7px; display: flex; gap: 6px; align-items: center; font-size: 11.5px; min-width: 0; white-space: nowrap; }
.studio-res-chip { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.studio-cap-line { font-size: 12.5px; padding: 4px 0 6px; }
.studio-cap-note { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); background: var(--studio-code); border-radius: var(--radius); font-size: 12.5px; }
.studio-stepper { display: flex; align-items: center; gap: 10px; }

.studio-pattern-strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px; scrollbar-width: thin; }
.studio-pattern-card { position: relative; flex: 0 0 58px; display: grid; gap: 2px; font-size: 11px; text-align: center; color: var(--muted); cursor: pointer; }
.studio-pattern-card.studio-on { color: var(--text); font-weight: 600; }

.studio-pat { height: 28px; border-radius: 4px; }
.studio-more-glow { margin-top: 6px; }

.studio-glow-colors { display: flex; gap: 6px; flex-wrap: wrap; padding: 2px 0 4px; }
.studio-sw { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--studio-edge); }
.studio-row-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

.studio-chip-list { display: flex; flex-wrap: wrap; gap: 5px; }

.studio-check-row { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; }


.studio-status { display: flex; align-items: center; gap: 16px; justify-content: space-between; padding: 0 14px; height: 52px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 6; min-width: 0; }
.studio-workspace { display: grid; grid-template-columns: 372px minmax(0, 1fr); min-height: 0; }

.studio-preview { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; padding: 6px 12px 12px; }
.studio-preview-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 30px; flex: none; }
.studio-prev-state { margin: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; }

.studio-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: -1px; padding: 0; border: 0; opacity: 0; }
label:has(> .studio-vh:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }
button { font: inherit; }
.studio-preset-strip { position: relative; }
.studio-id-copy { display: flex; align-items: center; gap: 10px; min-width: 0; position: relative; }
.studio-id-line { margin: 0; }
.studio-id-tag { flex: 0 0 50px; font-size: 11.5px; color: var(--muted); }
.studio-pop-section + .studio-pop-section { margin-top: 12px; }
dialog.studio-dialog { color: var(--text); background: var(--panel-2); border: 1px solid var(--studio-edge); border-radius: var(--radius); padding: 18px; width: min(400px, calc(100vw - 32px)); }

#studio-save-name { display: block; width: 100%; margin: 4px 0 8px; padding: 5px 8px; color: var(--text); background: var(--studio-code); border: 1px solid var(--studio-edge); border-radius: 6px; }

.studio-preview-tools { flex: none; min-width: 0; }
.studio-text { display: block; width: 100%; margin-top: 6px; padding: 5px 8px; background: var(--studio-code); border: 1px solid var(--studio-edge); border-radius: 6px; color: var(--text); font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; resize: vertical; }
.studio-notice { margin-top: 8px; font-size: 12px; color: var(--muted); }

.studio-check-row { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; }

}

/* The draft bar lives in Deck, outside the neutral page, so it wears the theme. */

 if(STATUSQ.test(t)||(/\?\s*$/.test(t)&&/\b(how|where|done|finished|far|going)\b/i.test(t)))return {kind:'status'};

/* ---------- The story: rebuilt from your actions up to the current moment ---------- */

/* The story pauses where it ends, or where it waits for you (an OK, an answer, or a next step after a failed start). */

function handoffLine(j){

const noteBit=j=>!j.notes.length?'':j.notes.some(n=>/stderr/i.test(n))?', checking stderr as I go':', with your note in mind';

function apply(S,a,m){

function stopJob(S,m){

function retry(S,m){

 S.list.push(human(q.text));

function answer(S,value,m){

 if(value==='other'){
  // Text is already in transcript from respond(). Keep paused.
  const raw = (state.acts.filter(a=>a.at===m).slice(-1)[0]||{}).text || txt;
  if(/\?\s*$/.test(raw)||/\b(what|how|why|when|where|did|does|should|explain|mean)\b/i.test(raw)){
   S.list.push(bot('Alfred',TIMES[m],p(esc(lead(j))+' is waiting after step '+j.done+' with '+lines(j.done)+' so far. I can answer while it waits.')));

function pillText(j){

/* The pill, then Stop to its right. Stop shows when you point at the pill or tab to it. */

/* ---------- Words for the top bar ---------- */

 }
 if(!j)return '';

 if(s===3)return esc(team(j))+' joined Alfred’s chat. Click the pill to see progress. A note you send waits as <b>Queued for '+esc(lead(j))+'</b>; <b>Steer</b> sends it now.';
 if(s===4)return state.progress==='todo'?'Halfway. The pill says 20 of 40 because '+esc(lead(j))+' keeps a to-do list.':'With no to-do list there’s no total, so the pill shows the command '+esc(lead(j))+' is running.';
 if(s===5)return esc(lead(j))+' went quiet for 20 minutes, so the watchdog restarted it once.';

function behind(S){
 const s=state.step,j=S.job;

 if(!j)return '';
 const L=lead(j);let base;
 switch(j.status){
  case 'needs-ok':base='The plan is saved. With Ask first, nothing starts until you OK it.';break;
  case 'starting':base=j.kind==='follow'?'The follow-up waits for its agent to pick it up.':'Alfred’s line was saved first, then the job was let go. '+L+' hasn’t picked it up yet.'+(j.fresh?' Alfred made the new thread, and the watchdog will watch it.':'');break;

   else if(s===2)base='Alfred’s line was saved first. '+L+' picked the job up straight away and has done 2 steps.';
   else if(s===5)base=L+' was quiet for 20 minutes, so the watchdog restarted it once. It waits 60 minutes while a command is still running.';
   else base=state.progress==='todo'?L+'’s to-do list says '+j.done+' of 40 are done. That’s where the pill’s number comes from.':L+' keeps no to-do list, so the pill shows its latest command instead of a count.';
   break;

  case 'stopped':base='Alfred stopped the job, then read back how far it got: '+(state.progress==='todo'?j.done+' of 40.':'up to tools/step.sh '+j.done+'.');break;
  case 'cancelled':base='The job was cancelled before anyone picked it up. Nothing ran.';break;
  default:base='The job finished, and Alfred read the result before he reported it.';

 const q=S.queued.length?' Your note waits in '+lead(S.queued[0].job)+'’s queue until this run ends, unless you Steer.':'';
 const l=S.later.length?' Your follow-up starts when this job ends.':'';
 return base+q+l;
}
function headerFor(S){
 if(state.step===0)return ['Ready','ready'];
 if(S.working)return ['Thinking','working'];
 if(S.menu)return ['Waiting for you','needs_you'];
 const j=S.job;if(!j)return ['Ready','ready'];
 switch(j.status){
  case 'needs-ok':return ['Needs your OK','needs_you'];
  case 'starting':return [j.kind==='follow'?'Follow-up starting':'Handing over','working'];
  case 'running':return [state.progress==='todo'?teamPill(j)+' · '+j.done+' of 40':lead(j)+' is working','working'];
  case 'needs-you':return [lead(j)+' needs you','needs_you'];
  case 'couldnt':return ['Couldn’t start','failed'];
  default:return ['Ready','ready'];

}
function contextFor(S){
 if(S.menu)return state.ask==='project'?'Context: waiting for you to pick the project':'Context: '+(state.project||LAST.project)+' · waiting for you to pick '+(state.ask==='agents'?'who':'where');
 const j=S.job;
 return j&&state.step>=2?'Context: '+j.project+' · '+j.name:'Context: '+LAST.project;

/* A thread row in the sidebar, copied from a real one so the menu and the list agree. */
function railThread(id,project,title){
 doc.getElementById(id)?.remove();
 if(!project)return;
 const ws=[...doc.querySelectorAll('.rail .ws')].find(w=>w.querySelector('.ws-title')?.textContent===project);
 const rows=ws?.querySelectorAll('.pane-row');if(!rows?.length)return;
 const row=rows[0].cloneNode(true);row.id=id;
 const name=row.querySelector('.pane-row-title');name.textContent=title;name.setAttribute('aria-label','Rename '+title);
 const dot=row.querySelector('.dot');if(dot){dot.className='dot idle';dot.title='idle';delete dot.dataset.mkOrig;}
 rows[rows.length-1].after(row);
}
/* The sidebar dot of the thread doing the job follows it: working, waiting on you, or failed. */
function railDots(S){
 const j=S.job;
 doc.querySelectorAll('.rail .pane-row').forEach(row=>{
  const dot=row.querySelector('.dot');if(!dot)return;
  if(dot.dataset.mkOrig==null){dot.dataset.mkOrig=dot.className;dot.dataset.mkTitle=dot.title;}
  let cls=dot.dataset.mkOrig,title=dot.dataset.mkTitle;
  const ws=row.closest('.ws')?.querySelector('.ws-title')?.textContent;
  if(j&&state.step>=2&&ws===j.project&&row.querySelector('.pane-row-title')?.textContent===j.name){
   if(j.status==='running'){cls='dot working';title='working';}
   else if(j.status==='needs-you'){cls='dot needs_input';title='needs you';}
   else if(j.status==='couldnt'){cls='dot failed';title='failed';}
  }
  dot.className=cls;dot.title=title;
 });
}

/* ---------- Drawing everything ---------- */
function paint(){
 if(!doc)return;
 const S=simulate();
 const t=doc.querySelector('.assistant-chat-transcript'),form=doc.querySelector('.assistant-thread-composer');
 const box=doc.querySelector('.apex-agent-all-input'),sendBtn=form.querySelector('.round-send');
 box.value=state.step===0?MESSAGE:state.draft;
 box.style.height='44px';
 sendBtn.disabled=!box.value.trim();
 form.querySelectorAll('.qform,.mk-teach').forEach(el=>el.remove());
 const cbox=form.querySelector('.composer-box');
 if(S.menu)cbox.insertAdjacentHTML('beforebegin',menu());
 if(S.ask)cbox.insertAdjacentHTML('beforebegin',askForm(S));
 cbox.insertAdjacentHTML('afterend',teachLine(S));
 t.innerHTML=render(S);
 t.style.paddingBottom=Math.max(0,form.offsetHeight-113)+'px';
 const pop=t.querySelector('.mk-pop');
 if(pop)pop.scrollIntoView({block:'nearest'});else{t.parentElement.scrollTop=1e6;t.scrollTop=1e6;}
 const [label,st]=headerFor(S);
 const status=doc.querySelector('.assistant-session-status');status.textContent=label;status.dataset.state=st;
 const g=doc.querySelector('.assistant-team-group');g.dataset.status=st;
 const row=g.querySelector('.assistant-team-row');row.querySelector('.assistant-team-subtitle')?.remove();
 if(st!=='ready')row.lastElementChild.insertAdjacentHTML('beforeend','<span class="assistant-team-subtitle" data-state="'+st+'">'+esc(label)+'</span>');
 const ctx=doc.querySelector('.assistant-workspace-context');const c=contextFor(S);ctx.textContent=c;ctx.title=c;
 const fresh=S.jobs.find(x=>x.fresh&&x.status!=='cancelled');
 railThread('mk-new-thread',fresh&&state.step>=2?fresh.project:null,fresh?fresh.name:'');
 railDots(S);
 $('mk-caption').innerHTML=state.note?esc(state.note):caption(S);
 $('mk-behind').textContent=behind(S);
 const cap=rawCap();
 document.querySelectorAll('#mk-steps .mk-btn').forEach(b=>{b.setAttribute('aria-pressed',String(+b.dataset.id===state.step));b.disabled=+b.dataset.id>cap;});
 const mark=(host,val)=>document.querySelectorAll('#'+host+' .mk-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===val)));
 mark('mk-cases',state.kase);mark('mk-access',state.access);mark('mk-jobs',state.jobv);mark('mk-progress',state.progress);mark('mk-whens',state.when);
 $('mk-prev').disabled=state.step===0;$('mk-next').disabled=state.step>=cap;
}
/* The last moment you can reach from here: where the job ends, or where it waits for you. */
function rawCap(){
 const S=simulate(STEPS.length-1);
 const end=S.endAt!=null?S.endAt:STEPS.length-1,wait=S.menu||S.blockAt==null?STEPS.length-1:S.blockAt;
 return Math.min(end,wait);
}
function setStep(n){
 n=Math.max(0,Math.min(STEPS.length-1,n));
 if(n<state.step){state.acts=state.acts.filter(a=>a.at<=n);if(n<2)resetMenu();}
 if(n>2)autoMenu();
 n=Math.min(n,rawCap());
 state.step=n;state.pop=null;state.steerAsk=null;state.sendAs=null;state.draft='';state.note='';
 paint();
}
function restart(){
 state.acts=[];resetMenu();
 state.step=2;state.pop=null;state.steerAsk=null;state.sendAs=null;state.draft='';state.note='';
 paint();
}
function reclamp(){const cap=rawCap();if(state.step>cap)state.step=cap;state.pop=null;state.steerAsk=null;paint();}
function addAct(a){
 a.at=state.step;
 state.acts=state.acts.filter(x=>x.at<=state.step);
 state.acts.push(a);
 state.pop=null;state.steerAsk=null;state.note='';
 paint();
}
function sendText(v,opts){
 opts=opts||{};
 if(state.step===0)return;
 if(simulate().menu)return typedMenu(v);
 const as=opts.as||state.sendAs||null;state.sendAs=null;
 const a={kind:'typed',text:v};if(as)a.as=as;
 addAct(a);
 if(opts.steer){const id='q'+(state.acts.length-1);if(simulate().queued.some(q=>q.id===id)){state.steerAsk=id;paint();}}
}
function say(id){
 if(state.step===0)setStep(2);
 const it=SAYS.find(x=>x.id===id);
 let text=it.text;
 if(id==='stop'){const S=simulate();text=S.job&&started(S.job)?'Stop.':'Stop, don’t start it.';}
 sendText(text);
}
function pickRoute(id){
 if(state.kase==='clear'||state.kase==='agents')state.kase='where';
 state.acts=[];resetMenu();state.step=2;state.pop=null;state.note='';
 state.project=LAST.project;state.ask='where';highlight=0;
 if(id==='last')return choose({thread:LAST.thread});
 if(id==='thread')return choose({thread:'checks'});
 if(id==='agent')return typedMenu('Muck');
 choose({fresh:true,name:AUTO_NAME});
}

}

/* ---------- Inside the Deck screen ---------- */
function keepTyping(at){const again=doc.querySelector('.qform-other input');if(!again)return;again.focus();again.setSelectionRange(at,at);}
function focusRow(){
 const input=doc.querySelector('.qform-other input'),n=question().options.length;
 if(state.filter&&n)return;
 if(highlight===n&&input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}
}
/* The same keys as Deck's menu: 1-9, up and down, Enter. For several agents, Enter ticks and ⌘↵ starts. */
function menuKey(e){
 if(state.folded)return false;
 const box=doc.querySelector('.apex-agent-all-input');
 if(e.target?.closest?.('.qform-other')||box.value!=='')return false;
 const q=question(),options=q.options,n=options.length,last=q.lastRow?n:n-1;
 if(e.metaKey||e.ctrlKey){if(e.key==='Enter'&&q.multi){sendAgents();return true;}return false;}
 if(/^[1-9]$/.test(e.key)){const i=+e.key-1;if(i<n){if(q.multi)highlight=i;pickOpt(options[i].id);}return true;}
 if(e.key==='ArrowDown'){highlight=Math.min(highlight+1,last);paint();focusRow();return true;}
 if(e.key==='ArrowUp'){if(highlight>0){highlight--;paint();}return true;}
 if(q.multi&&(e.key==='Enter'||e.key===' ')&&highlight>=0&&highlight<n){pickOpt(options[highlight].id);return true;}
 if(e.key==='Enter'&&q.multi){if(state.chosen.length)sendAgents();return true;}
 if(e.key==='Enter'&&state.ask==='where'&&highlight>=0){commit();return true;}
 if(e.key==='Enter'&&highlight>=0){pickOpt(options[highlight].id);return true;}
 return false;
}
function showCell(cell){
 const pop=cell.closest('.mk-pop');if(!pop)return;
 pop.querySelector('.mk-pop-detail').textContent=cell.getAttribute('aria-label');
 pop.querySelectorAll('.mk-cell').forEach(c=>c.classList.toggle('sel',c===cell));
}
function onKey(e){
 const box=doc.querySelector('.apex-agent-all-input'),inBox=e.target===box;
 if(e.key==='Escape'){
  if(state.steerAsk){e.preventDefault();state.steerAsk=null;return paint();}
  if(state.pop){e.preventDefault();state.pop=null;return paint();}
  const S=simulate();
  if(S.working){e.preventDefault();return addAct({kind:'stop-thinking'});} /* Deck: Esc stops Alfred's reply */
  if(S.menu){e.preventDefault();state.folded=true;return paint();}
  if(state.step===2&&S.job&&S.job.status==='starting'&&!box.value.trim()){e.preventDefault();return addAct({kind:'stop'});}
  return; /* Once the agent has started, Esc never stops it. */
 }
 const cell=e.target.closest?.('.mk-cell');
 if(cell&&(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='Home'||e.key==='End')){
  e.preventDefault();
  const cells=[...cell.parentElement.children],i=cells.indexOf(cell);
  const next=cells[e.key==='Home'?0:e.key==='End'?cells.length-1:Math.max(0,Math.min(cells.length-1,i+(e.key==='ArrowRight'?1:-1)))];
  cell.tabIndex=-1;next.tabIndex=0;next.focus();showCell(next);return;
 }
 const S=simulate();
 if(S.menu&&menuKey(e)){e.preventDefault();return;}
 if(S.ask&&!box.value&&(e.key==='1'||e.key==='2')&&!e.target.closest?.('.qform-other')){e.preventDefault();return addAct({kind:'answer',value:e.key==='1'?'keep':'stop'});}
 if(e.target.matches?.('.qform-other input')){
  if(S.menu&&state.ask==='where'){
   const n=question().options.length,at=e.target.selectionStart;
   if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();highlight=e.key==='ArrowDown'?Math.min(highlight+1,n):Math.max(highlight-1,0);paint();keepTyping(at);return;}
   if(e.key==='Enter'){e.preventDefault();return commit();}
  }else if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v)sendText(v);}
  return;
 }
 /* Enter sends. Shift+Enter is a new line, as everywhere in Deck. ⌘↵ sends a note and asks to Steer it in now. */
 if(inBox&&e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();
  if(state.step===0)return setStep(1);
  const v=box.value.trim();if(!v)return;
  box.value='';state.draft='';
  return sendText(v,{steer:e.metaKey||e.ctrlKey});
 }
 if(e.target.matches?.('input,textarea,button'))return;
 if(e.key==='ArrowRight')$('mk-next').click();
 if(e.key==='ArrowLeft')$('mk-prev').click();
}
function onClick(e){
 const cell=e.target.closest('.mk-cell');if(cell){showCell(cell);return;}
 const b=e.target.closest('[data-mk]'),opt=e.target.closest('[data-mk-opt]');
 if(state.pop&&!e.target.closest('.mk-pop')&&!(b&&b.dataset.mk==='pill')){state.pop=null;paint();if(!b&&!opt)return;}
 if(opt){pickOpt(opt.dataset.mkOpt);return;}
 if(!b)return;
 const k=b.dataset.mk;
 if(k==='pill'){state.pop=state.pop===b.dataset.job?null:b.dataset.job;return paint();}
 if(k==='pop-close'){state.pop=null;return paint();}
 if(k==='stop')return addAct({kind:'stop'});
 if(k==='stop-thinking')return addAct({kind:'stop-thinking'});
 if(k==='approve')return addAct({kind:'approve'});
 if(k==='review'){state.note='In Deck, Review plan opens the plan in Tasks. That screen isn’t part of this mock-up.';return paint();}
 if(k==='handover')return addAct({kind:'handover',to:b.dataset.to});
 if(k==='nostart-move')return addAct({kind:'handover',to:other(simulate().job)});
 if(k==='nostart-retry')return addAct({kind:'retry'});
 if(k==='steer'){state.steerAsk=state.steerAsk===b.dataset.q?null:b.dataset.q;return paint();}
 if(k==='steer-once')return addAct({kind:'steer',q:b.dataset.q});
 if(k==='steer-cancel'){state.steerAsk=null;return paint();}
 if(k==='unqueue')return addAct({kind:'unqueue',q:b.dataset.q});

  state.sendAs=state.sendAs===as?null:as;paint();if(box)box.focus();return;
 }
 if(k==='ans-keep'||k==='ans-stop'||k==='ans-skip')return addAct({kind:'answer',value:k.slice(4)});
 if(k==='skip'){state.skipped=true;return paint();}
 if(k==='unfold'){state.folded=false;return paint();}

 if(k==='send')return sendAgents();

function onInput(e){

 if(e.target.matches('.qform-other input')&&simulate().menu&&state.ask==='where'){
  const v=e.target.value,at=e.target.selectionStart;
  state.typing=v;state.filter=v===AUTO_NAME?'':v.trim();
  const n=question().options.length;highlight=state.filter&&n?0:n;
  paint();keepTyping(at);
 }
}
/* Clicking into the last row means a new thread, unless what's typed matches a row. */
function onFocusIn(e){
 const cell=e.target.closest?.('.mk-cell');if(cell){showCell(cell);return;}
 if(!e.target.matches('.qform-other input')||state.ask!=='where'||!simulate().menu)return;
 const n=question().options.length;
 if(state.filter&&n){highlight=0;return;}
 if(state.filter||highlight===n)return;
 const at=e.target.selectionStart;highlight=n;paint();keepTyping(at);
}

frame.addEventListener('load',()=>{
 doc=frame.contentDocument;
 const real=doc.querySelector('.assistant-chat-transcript');
 tpl.avatar=real.querySelector('.apex-agent-message-meta .identicon').cloneNode(true);
 tpl.humanActions=real.querySelector('[data-message-id=m1] .apex-agent-message-actions').outerHTML.replace(/<time[^>]*>.*?<\/time>/,'<time class="message-time">Tuesday 2:04 PM</time>');
 tpl.botActions=real.querySelector('[data-message-id=m3] .apex-agent-message-actions')?.outerHTML||'';
 threadsOf('watchdog-test').slice(1).forEach(t=>railThread('mk-thread-'+t.id,'watchdog-test',t.title));
 doc.head.insertAdjacentHTML('beforeend','<style>'+CSS+'</style>');
 doc.addEventListener('keydown',onKey);
 doc.addEventListener('click',onClick);
 doc.addEventListener('input',onInput);
 doc.addEventListener('focusin',onFocusIn);
 doc.addEventListener('mouseover',e=>{const c=e.target.closest?.('.mk-cell');if(c)showCell(c);});
 doc.querySelector('.assistant-thread-composer').addEventListener('submit',e=>{
  e.preventDefault();
  if(state.step===0)return setStep(1);
  const box=doc.querySelector('.apex-agent-all-input'),v=box.value.trim();
  if(!v)return;
  box.value='';state.draft='';sendText(v);
 });
 fit();setTimeout(fit,50);
 const q=new URLSearchParams(location.search);
 if(CASES.some(x=>x.id===q.get('case')))state.kase=q.get('case');
 if(ACCESS.some(x=>x.id===q.get('access')))state.access=q.get('access');
 if(JOBV.some(x=>x.id===q.get('job')))state.jobv=q.get('job');
 if(PROGRESS.some(x=>x.id===q.get('progress')))state.progress=q.get('progress');
 if(WHENS.some(x=>x.id===q.get('when')))state.when=q.get('when');
 resetMenu();
 setStep(+q.get('step')||0);
});
/* For checking the mock-up from a script. */
window.mkState=()=>state;
window.mkSim=()=>simulate();
window.mkStep=n=>setStep(n);
window.mkSend=(text,opts)=>sendText(text,opts);
frame.srcdoc=$('mk-app').textContent;
})();
</script>
</body></html>
