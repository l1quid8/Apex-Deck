.phone-stepper button:nth-child(2) { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
.phone-designed .phone-toggle { border: 0; border-radius: 20px; width: 29px; height: 17px; background: var(--line); padding: 2px; }
.phone-toggle::before { content: ""; display: block; width: 13px; height: 13px; background: var(--text); border-radius: 50%; }
.phone-designed .phone-toggle[aria-pressed="true"] { background: var(--accent); }
.phone-toggle[aria-pressed="true"]::before { transform: translateX(12px); background: var(--panel); }
.phone-menu-action { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px; border: 0; background: none; border-radius: 5px; text-align: left; font-size: 11px !important; min-height: 32px; }
.phone-menu-action small { margin-left: auto; font-size: 10px; color: var(--muted); }
.phone-power { color: var(--danger, #e57e77); }
.phone-capture-pair { display: flex; gap: 3px; }
.phone-capture-pair button { width: 50%; justify-content: center; background: var(--panel); }
.phone-setting select { min-width: 0; max-width: 145px; font-size: 10px; padding: 4px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 5px; }
.phone-location { display: flex; gap: 6px; padding: 5px 7px; }
.phone-location label { min-width: 0; width: 50%; font-size: 10px; color: var(--muted); }
.phone-location input { box-sizing: border-box; width: 100%; padding: 6px 7px; margin-top: 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text); font-size: 10px; }
.phone-location-actions { display: flex; justify-content: flex-end; gap: 4px; padding: 0 7px; }
.phone-location-actions button { border: 0; background: var(--panel); padding: 5px 7px; border-radius: 4px; font-size: 10px; }
.phone-notice, .phone-capture-path, .phone-designed .right-phone-alert { margin: 0; padding: 6px 12px; font-size: 11px; overflow-wrap: anywhere; }
.phone-capture-path { max-height: 38px; overflow: auto; color: var(--muted); font-size: 10px; }
@container (min-width: 355px) { .phone-controls-trigger span { display: inline; font-size: 11px; } .phone-controls-trigger { gap: 5px; } }
@container (max-width: 300px) { .phone-toolbar { gap: 2px; padding-inline: 8px; } .phone-designed .phone-fold { padding-inline: 6px; } }

.workspace-tasks { padding: 16px; min-width: 0; }
.workspace-tasks header h2 { font-size: 16px; margin: 0 0 4px; }
.workspace-tasks header p { margin: 0 0 14px; }
.workspace-tasks-filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.workspace-tasks-filters input { grid-column: 1 / -1; }
.workspace-tasks-filters input, .workspace-tasks-filters select { min-width: 0; width: 100%; }
.workspace-tasks-group h3 { margin: 16px 0 6px; font-size: 13px; }
.workspace-tasks-group h3 button { width: 100%; text-align: left; background: transparent; border: 0; }
.workspace-tasks-group ul { list-style: none; margin: 0; padding: 0; }
.workspace-task-row { display: grid; gap: 5px; width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent; text-align: left; overflow-wrap: anywhere; }
.workspace-task-row strong { font-size: 13px; font-weight: 500; }
.workspace-task-row span { font-size: 12px; }
.workspace-tasks-problems { font-size: 12px; overflow-wrap: anywhere; }

/* File editor: CodeMirror themed from the app's own colour variables so every skin works. */
.file-editor { min-height: 0; flex: 1 1 auto; display: flex; overflow: hidden; }
.file-editor .cm-editor { flex: 1 1 auto; min-width: 0; height: 100%; color: inherit; background: transparent; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
.file-editor .cm-editor.cm-focused { outline: 1px solid var(--accent); outline-offset: -1px; }
.file-editor .cm-scroller { overflow: auto; font: inherit; }
.file-editor .cm-content { caret-color: var(--accent); padding: 6px 0; }
.file-editor .cm-cursor { border-left-color: var(--accent); }
.file-editor .cm-gutters { color: var(--muted); background: var(--panel, transparent); border-right: 1px solid var(--line, rgba(127,127,127,.25)); }
.file-editor .cm-activeLine { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.file-editor .cm-activeLineGutter { color: inherit; background: color-mix(in srgb, var(--accent) 10%, transparent); }
.file-editor .cm-selectionBackground, .file-editor .cm-focused .cm-selectionBackground { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.file-editor .cm-matchingBracket { background: color-mix(in srgb, var(--accent) 25%, transparent); outline: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); }
.file-editor .cm-searchMatch { background: rgba(238,183,61,.25); outline: 1px solid rgba(238,183,61,.45); }
.file-editor .cm-searchMatch-selected { background: rgba(238,183,61,.5); }
.file-editor .cm-panels { color: inherit; background: var(--panel, var(--bg)); border-color: var(--line, rgba(127,127,127,.25)); }
.file-editor .cm-panels input, .file-editor .cm-panels button { font: inherit; font-size: 12px; color: inherit; background: transparent; border: 1px solid var(--line, rgba(127,127,127,.3)); border-radius: 4px; padding: 2px 6px; }
.file-editor .cm-panels button { cursor: pointer; }
.file-editor .cm-panels label { font-size: 12px; }
.file-editor .cm-tooltip { color: inherit; background: var(--panel, var(--bg)); border: 1px solid var(--line, rgba(127,127,127,.3)); }
/* Syntax colours come from the accent and muted colours, so they follow the skin. */
.file-editor .tok-keyword, .file-editor .tok-operatorKeyword, .file-editor .tok-modifier { color: var(--accent); }
.file-editor .tok-string, .file-editor .tok-string2, .file-editor .tok-regexp { color: #e0a96d; }
.file-editor .tok-number, .file-editor .tok-bool, .file-editor .tok-atom { color: #c792ea; }
.file-editor .tok-comment { color: var(--muted); font-style: italic; }
.file-editor .tok-typeName, .file-editor .tok-className, .file-editor .tok-namespace { color: #6cb6ff; }
.file-editor .tok-propertyName, .file-editor .tok-attributeName { color: #8fd3c0; }
.file-editor .tok-variableName2, .file-editor .tok-variableName.tok-definition, .file-editor .tok-function { color: #f0c674; }
.file-editor .tok-heading { font-weight: 700; color: var(--accent); }
.file-editor .tok-link, .file-editor .tok-url { color: #6cb6ff; text-decoration: underline; }
.file-editor .tok-invalid { color: #ff6b6b; }
:root[data-deck-light="true"] .file-editor .tok-string, :root[data-deck-light="true"] .file-editor .tok-string2 { color: #9a5b13; }
:root[data-deck-light="true"] .file-editor .tok-number, :root[data-deck-light="true"] .file-editor .tok-bool, :root[data-deck-light="true"] .file-editor .tok-atom { color: #7b3fb0; }
:root[data-deck-light="true"] .file-editor .tok-typeName, :root[data-deck-light="true"] .file-editor .tok-className, :root[data-deck-light="true"] .file-editor .tok-link { color: #1b5fb5; }
:root[data-deck-light="true"] .file-editor .tok-propertyName { color: #1f7a63; }
:root[data-deck-light="true"] .file-editor .tok-function { color: #8a6a00; }

/* Editing session: toolbar, conflict bar, editor fill the preview. */
.right-files-preview-content.editing { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.file-edit-session { min-height: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
.file-edit-toolbar { display: flex; align-items: center; gap: 4px; padding: 3px 7px; border-bottom: 1px solid var(--line, rgba(127,127,127,.18)); }
.file-edit-toolbar button, .file-edit-conflict button, .file-edit-problem button { border: 1px solid var(--line, rgba(127,127,127,.3)); border-radius: 4px; padding: 3px 8px; font: inherit; font-size: 12px; color: inherit; background: transparent; cursor: pointer; }
.file-edit-toolbar button:hover:not(:disabled), .file-edit-conflict button:hover, .file-edit-problem button:hover { background: var(--hover, rgba(127,127,127,.14)); }
.file-edit-toolbar button:disabled { opacity: .45; cursor: default; }
.file-edit-toolbar .file-edit-save:not(:disabled) { color: var(--accent-ink, #04211d); background: var(--accent); border-color: var(--accent); }
.file-edit-dirty { color: var(--accent); font-size: 11px; }
.file-edit-conflict, .file-edit-problem { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; font-size: 12px; border-bottom: 1px solid rgba(238,183,61,.45); background: rgba(238,183,61,.14); }
.file-edit-conflict span { flex: 1 1 100%; }
.file-edit-problem { border-bottom-color: rgba(255,107,107,.5); background: rgba(255,107,107,.12); }

/* Wide Files tab (>= 720px): tree on the left, preview/editor on the right at full height. */
.right-files-body { display: contents; }
.right-files-shell.wide .right-files-body { display: flex; flex: 1 1 auto; min-height: 0; flex-direction: row; }
.right-files-shell.wide .right-files-browser { height: auto !important; flex: 1 1 auto; min-width: 0; }
.right-files-shell.wide .right-files-browser[style*="width"] { flex: 0 0 auto; }
.right-files-shell.wide .right-files-resize { display: none; }
.right-files-shell.wide .right-files-preview-slot { height: auto !important; min-height: 0; min-width: 0; flex: 1 1 0; }
.right-files-resize-v { position: relative; z-index: 1; width: 8px; flex: 0 0 8px; cursor: col-resize; touch-action: none; }
.right-files-resize-v::after { position: absolute; left: 3px; top: calc(50% - 18px); width: 2px; height: 36px; border-radius: 2px; background: var(--muted, #858995); content: ""; opacity: .5; }
.right-files-resize-v:hover::after { opacity: 1; background: var(--accent); }

/* Chats on the desktop: the rail section and the open chat. */
.rail-sec[data-sec="chats"] .chat-new { margin-left: auto; width: 22px; height: 22px; padding: 0; font-size: 14px; }
.chat-row { gap: 6px; }
.chat-row .hdot { flex: none; }
.chat-row-off { opacity: .55; }
.chat-row-side { flex: none; margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
.chat-row-tag { flex: none; padding: 0 5px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 10px; }
.chat-archived-toggle { display: block; padding: 4px 10px; font-size: 11px; color: var(--muted); }

/* Status and recovery banners above the shared thread pane. */
.desktop-chat-banner { margin: 0; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12px; }
.desktop-chat-banner button { margin-left: 6px; }
.chat-problem { margin: 0; padding: 6px 16px; color: var(--danger, #e5484d); font-size: 12px; }

.new-chat { min-width: 360px; }
.new-chat-field { display: grid; gap: 4px; margin: 10px 0; font-size: 12px; }
.new-chat-bots { display: grid; gap: 6px; margin: 0 0 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; }
.new-chat-bots label { display: flex; align-items: center; gap: 8px; }
.move-to-work { min-width: 420px; max-width: 520px; }
.move-to-work-folder { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
.move-to-work-folder code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.move-to-work-bots { display: grid; gap: 6px; margin: 0 0 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; }
.move-to-work-bot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.move-to-work-bot .segmented .seg { padding: 4px 10px; font-size: 12px; }
.move-to-work .confirm-actions button { white-space: nowrap; }

/* Shared pane geometry; chats use ChatPane's existing thread transcript and composer. */
.talk-only-pane { inset: 0; width: 100%; height: 100%; }
.talk-only-pane > .pane-body { flex: 1; min-height: 0; }
.chat-delivery-row { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); }
.chat-delivery-row > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.chat-delivery-row small { flex: none; }

/* The pop-out window: a small top bar and one live pane. It never saves. */

.popout {
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: var(--bg);
  color: var(--text);
}

.popout-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  /* 88px left matches .titlebar: room for the macOS traffic lights (hiddenInset). */
  padding: 10px 12px 10px 88px;
  -webkit-app-region: drag;
  border-bottom: 1px solid var(--line);
}

.popout-bar button,
.popout-bar input {
  -webkit-app-region: no-drag;
}

/* min-width: 0 lets the flex items shrink so the ellipsis engages. */
.popout-title {
  min-width: 0;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.popout-sub {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Deck's base button supplies the border, fill and corners; these only
   keep the bar's controls whole and at bar height. */
.popout-return {
  flex: none;
  white-space: nowrap;
  padding: 4px 12px;
}

/* Thread controls beside Return to Deck: Details toggle and the ⋯ menu. */
.popout-btn {
  flex: none;
  white-space: nowrap;
  padding: 4px 10px;
}

/* On reads as Deck's toggles do — an accent border — never the hover look. */
.popout-btn[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--text);
}

/* Artifacts and Changes counts, portalled into the bar by the thread.
   Given the same size as in Deck's pane heads; without these the buttons
   fall back to the full-size button style and crowd out everything else. */
.popout-bar .pane-counts {
  flex: none;
  display: flex;
  align-items: center;
}

/* No Artifacts and no Changes yet: the empty slot takes no room. */
.popout-bar .pane-counts:not(:has(button)) {
  display: none;
}

.popout-bar .thread-counts {
  display: flex;
  flex: none;
  gap: 4px;
}

.popout-bar .thread-counts button {
  white-space: nowrap;
  font-size: 11px;
  line-height: 1.4;
  padding: 4px 8px;
}

/* At the narrowest widths the labels go; the icons and counts stay. */
@media (max-width: 520px) {
  .popout-bar .count-label {
    display: none;
  }

  .popout-bar .count-icon {
    display: inline-block;
  }
}

/* A popped thread's bar carries more controls than the 360px minimum
   width holds in one row (only 260px is left beside the traffic
   lights). So it wraps: the spacer becomes the line break, leaving the
   title, status and counts above and the thread buttons below, with Return to
   Deck at the right edge. Bars without thread buttons fit on one row
   at every width and keep it. */
@media (max-width: 640px) {
  .popout-bar:has(.popout-btn) {
    flex-wrap: wrap;
    row-gap: 6px;
  }

  .popout-bar:has(.popout-btn) .spacer {
    flex-basis: 100%;
    height: 0;
  }

  /* Zero bases, so a long title or status truncates on the top row
     instead of wrapping the counts onto a row of their own. */
  .popout-bar:has(.popout-btn) .popout-title {
    flex: 2 1 0;
  }

  .popout-bar:has(.popout-btn) .popout-sub {
    flex: 1 1 0;
  }

  .popout-bar:has(.popout-btn) .popout-return {
    margin-left: auto;
  }
}

.popout-rename {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-weight: 600;
  color: inherit;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px 8px;
}

/* A popped thread: the chat, with its Details panel in a column beside it. */
.popout-chat-row {
  display: flex;
  flex: 1;
  min-height: 0;
  gap: 8px;
  position: relative;
}

.popout-chat-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.popout-chat-main > * {
  flex: 1;
  min-height: 0;
}

/* Details wears Deck's own .thread-details panel (docked or overlay in a
   thread, like the main window's side panel). A popped Details tab is the
   whole window, so its panel fills it; Deck's own .full rule is scoped
   under .body, which a pop-out is not inside. */
.popout-body > .thread-details.full {
  flex: 1 1 0;
  width: auto;
  max-width: none;
  min-width: 0;
  border-left: 0;
}

.popout-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 8px;
}

.popout-body > .muted,
.popout-body > [role="alert"] {
  margin: auto;
}

.popout-stopped {
  margin: auto;
  text-align: center;
}

.popout-stopped .primary {
  padding: 4px 16px;
}

/* A sibling of the whole chat, including its composer. */
.popout-artifacts { width: 440px; min-width: 0; min-height: 0; flex: none; }
.popout-artifacts.overlay { position: absolute; inset: 0 0 0 auto; z-index: 30; width: min(440px, 100%); background: var(--panel); box-shadow: -12px 0 32px #0005; }
.popout-artifacts.full { flex: 1; width: auto; }
.popout-chat-main[hidden] { display: none; }

.popout-artifacts-backdrop { position: absolute; inset: 0; z-index: 29; border: 0; border-radius: 0; background: #0003; }

:root {
  --bg: #000000;
  --panel: #101010;
  --panel-2: #181818;
  --line: #2a2a2a;
  --text: #f2f2f2;
  --muted: #9a9a9a;
  --accent: #80ceca;
  --brand-mint: #3def91;
  --brand-cyan: #1ed7ee;
  --accent-ink: #04211d;
  --warn: #f59e0b;
  --danger: #f87171;
  --radius: 12px;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--panel-2);
  border-radius: 6px;
  padding: 7px 12px;
  transition: background 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
}
button:hover:not(:disabled) {
  border-color: #2b3a4a;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
button.danger {
  background: transparent;
  border-color: var(--danger);
  color: var(--danger);
}
button.ghost {
  background: transparent;
}
button.icon {
  background: transparent;
  border-color: transparent;
  padding: 2px 7px;
  font-size: 15px;
  line-height: 1;
  color: var(--muted);
}
button.icon:hover:not(:disabled) {
  color: var(--text);
  border-color: var(--line);
}
button.icon.small {
  font-size: 13px;
  padding: 1px 5px;
}

input,
select,
textarea {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 16px;
  line-height: 1.7;
}

.muted {
  color: var(--muted);
}

.late-reply-label {
  margin: 0 0 6px;
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.spacer {
  flex: 1;
}
.loading {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--muted);
}

.loading-reason {
  max-width: 520px;
  margin-top: -8px;
  text-align: center;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.app {
  height: 100%;
  display: flex;
  flex-direction: column;
}
.titlebar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px 8px 88px;
  background: transparent;
  --tb-scale: 0.75;
  -webkit-app-region: drag;
}
.titlebar button,
.titlebar a,
.titlebar input,
.titlebar select,
.titlebar textarea,
.titlebar [role="button"] {
  -webkit-app-region: no-drag;
}
.titlebar > .section-navigation,
.titlebar > .section-navigation * {
  -webkit-app-region: no-drag;
}
.titlebar > .titlebar-start > button,
.titlebar > .section-navigation > .section-button,
.titlebar > .titlebar-end > .layout-presets > button,
.titlebar > .titlebar-end > .new-menu > button,
.titlebar > .titlebar-end > button {
  padding: calc(7px * var(--tb-scale)) calc(12px * var(--tb-scale));
  font-size: calc(1em * var(--tb-scale));
}
.titlebar > .section-navigation > .section-button {
  gap: calc(8px * var(--tb-scale));
  padding: calc(7px * var(--tb-scale)) calc(16px * var(--tb-scale));
}
.titlebar > .titlebar-end > .layout-presets > button {
  padding: calc(8px * var(--tb-scale)) calc(10px * var(--tb-scale));
}
.titlebar > .titlebar-start > button.icon,
.titlebar > .titlebar-end > button.icon {
  padding: calc(2px * var(--tb-scale)) calc(7px * var(--tb-scale));
  font-size: calc(15px * var(--tb-scale));
  min-width: max(24px, calc(28px * var(--tb-scale)));
  min-height: max(24px, calc(28px * var(--tb-scale)));
}
.titlebar > .titlebar-start > button.icon svg,
.titlebar > .section-navigation > .section-button svg,
.titlebar > .titlebar-end > .layout-presets > button svg,
.titlebar > .titlebar-end > button.icon svg {
  width: calc(16px * var(--tb-scale));
  height: calc(16px * var(--tb-scale));
}
.section-navigation {
  display: flex;
  gap: 4px;
  margin-left: 20px;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 0;
}
.section-button {
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 0;
  box-shadow: none;
  color: var(--muted);
  padding: 7px 16px;
}
.section-button > * { pointer-events: none; -webkit-app-region: no-drag; }
.section-button.selected {
  background: var(--panel-2);
  color: var(--text);
  border: 0;
}
.section-button.agents.selected > span { color: #f5bf54; }
.section-button.code.selected > span { color: #6ea2ff; }
.section-button.threads.selected > span { color: var(--brand-mint); }
.storage-error { padding: 8px 16px; color: var(--danger); border-bottom: 1px solid var(--line); }
.connection-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}
.connection-banner.failed strong { color: var(--danger); }
.connection-banner.mismatch strong { color: var(--warn); }
.connection-words { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.connection-words small { color: var(--muted); overflow-wrap: anywhere; }
.confirm.path-prompt { width: min(520px, calc(100vw - 32px)); }
.folder-bar { display: flex; gap: 6px; margin-top: 6px; }
.folder-bar button { min-width: 32px; padding: 0 8px; }
.folder-bar input { flex: 1; min-width: 0; }
.folder-list {
  list-style: none;
  margin: 4px 0 0;
  padding: 4px;
  height: min(300px, 45vh);
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
}
.folder-list[aria-busy="true"] { opacity: 0.6; }
.folder-list button {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 5px 8px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  text-align: left;
  font-size: 12px;
}
.folder-list button span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.folder-list svg { flex: none; fill: none; stroke: currentColor; stroke-width: 1.2; color: var(--muted); }
.folder-list button:hover, .folder-list button:focus-visible { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.folder-list button.selected { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.folder-empty { padding: 8px; font-size: 12px; }
.folder-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
.folder-foot label { display: flex; align-items: center; gap: 6px; }
.host-actions { display: flex; gap: 8px; }
/* Settings → Hosts: one machine per line, with the sidebar's dot */
.hosts-item { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); }
.hosts-item:first-child { border-top: 0; }
.hosts-item .hdot { margin-top: 7px; }
.hdot.blank { visibility: hidden; }
.hosts-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.hosts-name { font-weight: 600; }
.hosts-addr { font: 11.5px/1.5 var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hosts-state { font-size: 12px; color: var(--muted); }
.hosts-state.warn { color: var(--warn); }
.hosts-state.bad { color: var(--danger); }
.hosts-why { font: 11px/1.5 var(--mono); color: var(--muted); }
.hosts-buttons { display: flex; gap: 6px; flex: none; }
.hosts-buttons button, .hosts-empty button.sm { padding: 5px 10px; font-size: 12px; }
.hosts-problem { margin: 6px 0 0; padding: 7px 10px; border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--line)); border-radius: 7px; background: color-mix(in srgb, var(--danger) 7%, transparent); color: var(--danger); font-size: 12px; }
.hosts-empty { padding: 14px 16px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.hosts-empty:first-child { border-top: 0; }
.hosts-empty .hosts-text strong { font-weight: 600; }
.hosts-empty .hosts-text small { color: var(--muted); font-size: 12px; }
/* Agents: one full panel, framed like Library and the Code panes. */
.canvas.section-agents { overflow: hidden; padding: 16px; min-height: 0; }
.agents-section { box-sizing: border-box; display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.agents-section > .section-intro { flex: none; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.agents-section > .section-intro h1 { font-size: 22px; }
.agents-section > .section-intro p { font-size: 13px; }
.agents-section .chat { flex: 1; min-height: 0; overflow: hidden; }
.section-intro { padding: 28px 12px 18px; flex: none; }
.section-intro h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.025em; }
.section-intro p { color: var(--muted); margin: 0; }
.section-agents .chat-bar { border: 0; padding: 14px 22px 0; flex: none; }
.section-agents .chat-bar:not(:has(button)) { display: none; }
.section-agents .agent-library { overflow-y: auto; flex: 1; min-height: 0; padding: 16px 22px 24px; }
.section-agents .add-form { border: 0; border-radius: 0; margin: 0; padding: 20px 22px; flex: 1; min-height: 0; max-height: none; overflow-y: auto; background: transparent; align-content: start; }
/* Effort and Access share one row in the wide pane instead of stacking.
   Solo Access (e.g. Custom command, which has no effort levels) stays full width. */
.section-agents .add-form .effort-field:has(+ .access-field),
.section-agents .add-form .effort-field:has(+ .access-field) + .access-field { grid-column: auto; }
.agent-library { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 12px 24px; flex: 1; min-height: 0; }
.agent-card { display: flex; align-items: flex-start; gap: 18px; padding: 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.agent-card-copy { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.agent-card h2 { font-size: 16px; margin: 0 0 3px; }
.agent-card p { margin: 0 0 8px; max-width: 65ch; white-space: pre-wrap; }
.agent-card-actions { display: flex; gap: 6px; }
/* Benchmark pills after "model · level" (ModelMetricPills.tsx, mockups/model-metrics-v4.html). */
.agent-model-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 8px; }
.mm-metrics { position: relative; display: inline-flex; flex-wrap: wrap; gap: 5px; }
.mm-pill { display: inline-flex; align-items: baseline; gap: 5px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; background: transparent; color: var(--text); line-height: 1.6; cursor: pointer; }
.mm-pill.hot { border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); }
.mm-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mm-k { color: var(--muted); font-size: 11px; }
.mm-at { color: var(--warn); font-size: 11px; }
.mm-at.same { color: var(--muted); }
.mm-dot { width: 6px; height: 6px; border-radius: 50%; align-self: center; }
.mm-dot.t3 { background: #71e6b5; } :root[data-deck-theme="clay"] .mm-dot.t3 { background: #9dc79b; } .mm-dot.t2 { background: var(--warn); } .mm-dot.t1 { background: var(--danger); }
.mm-none { font-size: 12px; color: var(--muted); font-style: italic; }
/* One box per card; it stays open while the pointer moves into it. */
.mm-card { display: none; position: absolute; left: 0; top: 100%; z-index: 4; padding-top: 6px; }
.mm-metrics:hover .mm-card, .mm-metrics:focus-within .mm-card, .mm-metrics.pinned .mm-card { display: block; }
/* Glass cards each blur their own backdrop, which would paint the next card over an open box. */
.agent-card:has(.mm-metrics:hover, .mm-metrics:focus-within, .mm-metrics.pinned) { position: relative; z-index: 5; }
.mm-card-body { width: min(400px, 80vw); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--text); font-size: 12px; line-height: 1.45; box-shadow: 0 14px 36px -18px rgb(0 0 0 / .6); }
.agent-card .mm-card-body p { margin: 0; max-width: none; white-space: normal; }
.mm-what { margin-bottom: 8px !important; }
.mm-what b { font-weight: 600; }
.mm-what span { color: var(--muted); }
.mm-card table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.mm-card th { text-align: right; color: var(--muted); font-weight: 500; padding: 2px 6px 5px; }
.mm-card th:first-child, .mm-card td:first-child { text-align: left; }
.mm-card td { text-align: right; padding: 3px 6px; border-top: 1px solid var(--line); color: var(--muted); }
.mm-card td.gap { font-style: italic; color: color-mix(in srgb, var(--muted) 70%, transparent); }
.mm-card tr.current td { color: var(--text); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.mm-card tr.current td:first-child::after { content: " · current"; color: var(--accent); font-size: 11px; }
.mm-card tr.current td.gap { color: var(--muted); }
.mm-card td.best::after { content: " ★"; color: var(--accent); font-size: 10px; }
.mm-card [data-col].hot { color: var(--text); font-weight: 600; }
.mm-card th.hot { color: var(--accent); }
.mm-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.mm-model { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.mm-model b { color: var(--text); font-weight: 500; }
.mm-model .hot b { color: var(--accent); }
.mm-caveat { margin-top: 8px !important; color: var(--warn); font-size: 11px; }
.mm-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 11px; }
.mm-src.stale { color: var(--warn); }
.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.brand-mark,
.loading-mark,
.welcome-logo {
  display: block;
  flex-shrink: 0;
  object-fit: contain;
}
.welcome-logo {
  margin: 0 auto 28px;
  max-width: 100%;
  height: auto;
}
.badge {
  font-size: 11px;
  color: var(--warn);
  border: 1px solid var(--warn);
  border-radius: 999px;
  padding: 1px 8px;
}

.body {
  flex: 1;
  min-height: 0;
  display: flex;
}

.rail {
  width: 240px;
  flex: none;
  border-right: 1px solid var(--line);
  background: var(--panel);
  padding: 18px 12px;
  overflow-y: auto;
}
.rail-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 16px;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.rail-empty {
  padding: 0 4px;
}
.ws {
  margin-bottom: 6px;
}
.ws-row {
  display: flex;
  align-items: center;
  border: 1px solid transparent;
  border-radius: 6px;
}
.ws-row.active {
  background: var(--panel-2);
  border-color: var(--line);
}
.ws-name {
  flex: 1;
  min-width: 0;
  text-align: left;
  background: transparent;
  border-color: transparent;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.count {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  background: var(--bg);
  border-radius: 999px;
  padding: 0 6px;
}
.pane-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  background: transparent;
  border-color: transparent;
  padding: 8px 10px 8px 24px;
  color: var(--muted);
}
.pane-row.focused {
  color: var(--text);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
  background: #3a4856;
}
.dot.working {
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.18);
}
.dot.exited {
  background: transparent;
  border: 1px solid var(--muted);
}

.canvas {
  flex: 1;
  min-width: 0;
  min-height: 0;
  padding: 16px;
  display: flex;
}
/* Panes are placed inside this by position (see PaneLayout.tsx). Each one
   is inset by half the gap, so the area reaches half a gap past the edge. */
.grid {
  flex: 1;
  min-width: 0;
  position: relative;
  margin: -4px;
}
.pane {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: hidden;
}
.pane.focused {
  border-color: #3d695c;
  box-shadow: 0 0 0 1px rgba(113, 230, 181, 0.05);
}
.pane-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  line-height: 1.7;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}
.pane-title {
  font-weight: 600;
}
.pane-folder {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--muted);
  font-size: 12px;
}
.pane-body {
  flex: 1;
  min-height: 0;
  display: flex;
}
.terminal-host {
  flex: 1;
  min-width: 0;
  padding: 6px 0 0 8px;
  background: var(--panel);
}

.picker {
  margin: auto;
  width: min(100%, 620px);
  text-align: center;
  padding: 40px;
}
.picker h2 {
  margin: 0 0 6px;
  font-size: clamp(26px, 3vw, 36px);
  line-height: 1.18;
  letter-spacing: -0.045em;
  font-weight: 650;
  text-wrap: balance;
}
.picker-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 28px 0 18px;
}
.picker-grid button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 18px;
  text-align: left;
  border-radius: 12px;
}
.picker-grid button span {
  color: var(--muted);
  font-size: 12px;
}
.picker-grid button.accent {
  border-color: var(--accent);
}

/* Group chat */
.chat {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.chat-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.chip {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.chip button {
  border: 0;
  border-radius: 0;
  background: transparent;
}
.chip-name {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 4px 3px 4px;
  font-weight: 600;
}
.chip-meta {
  font-weight: 400;
  color: var(--muted);
  font-size: 11px;
}
.chip-edit {
  padding: 3px 4px;
  color: var(--muted);
}
.chip-x {
  padding: 3px 8px 3px 4px;
  color: var(--muted);
}
.form-title {
  grid-column: 1 / -1;
  margin: 0;
  font-weight: 600;
}
.add-form .form-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.add-form .form-head .form-title {
  grid-column: auto;
}
.add-form .form-back {
  flex: none;
  padding: 2px 8px;
}
.chat-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
}
.chat-options label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chat-options input {
  width: 52px;
}

.add-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  padding: 20px;
  max-height: 55vh;
  overflow-y: auto;
  flex-shrink: 0;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}
.add-form label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
}
.add-form .wide,
.add-form .form-error,
.add-form > button,
.add-form .form-foot {
  grid-column: 1 / -1;
}
.add-form > button {
  justify-self: start;
}
.add-form .form-foot {
  display: flex;
  align-items: center;
  gap: 8px;
}
.add-form input,
.add-form select,
.add-form textarea {
  color: var(--text);
}
.hint {
  font-size: 11px;
}
.add-form .key-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.add-form .key-name {
  font-size: 12px;
  color: var(--muted);
}
.add-form .key-name-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 4px;
}
.add-form .key-name summary {
  cursor: pointer;
  width: fit-content;
}
.row {
  display: flex;
  gap: 6px;
}
.row input {
  flex: 1;
  min-width: 0;
}
::placeholder {
  color: #778595;
  opacity: 1;
}
.form-error {
  margin: 0;
  color: var(--danger);
}
.add-form .field-title {
  font-size: 12px;
  color: var(--muted);
}
.provider-field,
.model-field,
.effort-field,
.access-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
/* Provider cards: logo + who makes it; the chosen one carries the accent. */
.agent-providers {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
}
.agent-provider {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 10px 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  text-align: left;
  color: var(--text);
}
.agent-provider:hover:not(:disabled) {
  border-color: #3a4a5a;
  background-color: var(--panel);
}
.agent-provider.on,
.agent-provider.on:hover {
  border-color: var(--accent);
  background-color: color-mix(in srgb, var(--accent) 9%, var(--panel));
}
.agent-provider.on::after {
  content: "";
  position: absolute;
  top: 8px;
  right: 8px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}
.agent-provider:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.agent-provider:disabled .provider-tile {
  filter: grayscale(1);
}
.agent-provider:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.provider-tile {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  flex: none;
}
.agent-provider-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.agent-provider-text strong {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.agent-provider-text small {
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.agent-provider-text small.missing {
  color: var(--warn);
}
/* Model list: search on top, grouped rows, version badge on the right. */
.model-picker {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.model-search {
  width: 100%;
}
.model-list {
  display: flex;
  flex-direction: column;
  max-height: 240px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 4px;
  background: var(--panel);
}
.model-group-label {
  font-size: 11px;
  color: var(--muted);
  padding: 10px 10px 4px;
}
.model-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  padding: 7px 10px;
  background: transparent;
  border: 0;
  border-radius: 7px;
  text-align: left;
  color: var(--text);
}
.model-row.on,
.model-row.on:hover:not(:disabled) {
  background-color: color-mix(in srgb, var(--accent) 12%, transparent);
  box-shadow: inset 2px 0 0 var(--accent);
}
.model-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.model-badge {
  flex: none;
  font-size: 10.5px;
  color: var(--muted);
}
.model-custom-toggle {
  align-self: flex-start;
}
/* Segmented control: one track, the chosen option lifts out of it. */
.segmented {
  display: inline-flex;
  flex-wrap: wrap;
  align-self: flex-start;
  max-width: 100%;
  gap: 2px;
  padding: 3px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.segmented .seg {
  padding: 6px 14px;
  background: transparent;
  border: 0;
  border-radius: 7px;
  color: var(--muted);
  font-size: 12.5px;
}
.segmented .seg:hover:not(:disabled) {
  color: var(--text);
  background-color: var(--panel-2);
}
.segmented .seg.on,
.segmented .seg.on:hover {
  background-color: var(--panel-2);
  color: var(--text);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent);
}
.segmented .seg:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.transcript {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-padding: 24px;
}
.empty {
  margin: auto;
  text-align: center;
  color: var(--muted);
  max-width: 390px;
  padding: 24px;
}
.empty h3 {
  margin: 0 0 4px;
  color: var(--text);
}
.bubble {
  max-width: 85%;
  padding: 12px 16px;
  line-height: 1.7;
  border-radius: var(--radius);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.bubble.human {
  align-self: flex-end;
  background: #17332d;
  border: 1px solid #284b40;
}
.bubble.bot {
  align-self: flex-start;
  background: var(--panel-2);
  border: 1px solid var(--line);
}
/* A bot's avatar beside its reply. */
.bot-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  align-self: flex-start;
  max-width: 85%;
}
.bot-row > .bubble {
  max-width: none;
  min-width: 0;
}
/* A participant's avatar: its 5×5 pattern in its colour (Avatar.tsx). */
.identicon {
  --cell: 5px;
  --gap: 1px;
  display: grid;
  grid-template-columns: repeat(5, var(--cell));
  grid-auto-rows: var(--cell);
  gap: var(--gap);
  place-content: center;
  flex: none;
  box-sizing: border-box;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--who) 32%, transparent);
  background: var(--panel);
}
.identicon i {
  border-radius: 1px;
  background: color-mix(in srgb, var(--who) 9%, transparent);
}
.identicon i.on {
  background: var(--who);
}
.identicon-sm {
  --cell: 3px;
  width: 21px;
  height: 21px;
  border-radius: 6px;
}
.identicon-sm i {
  border-radius: 0;
}
.identicon-lg {
  --cell: 7px;
  --gap: 2px;
  width: 52px;
  height: 52px;
  border-radius: 12px;
}
/* Working: the lit squares shimmer in a diagonal wave. */
.identicon.working i.on {
  animation: identicon-shimmer 1.4s ease-in-out infinite;
}
@keyframes identicon-shimmer {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
@media (prefers-reduced-motion: reduce) {
  .identicon.working i.on { animation: none; }
}
/* The battery (battery.ts): each cell is drawn at its own strength, always
   in the agent's colour. Low is not a failure, so it never borrows the
   danger colour: a low side gets a hairline outline, and a critical one a
   thicker outline and the word "low". */
.identicon.battery {
  position: relative;
}
.identicon.battery i {
  background: color-mix(in srgb, var(--who) var(--a), transparent);
}
.identicon.battery.low {
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 70%, transparent);
}
.identicon.battery.critical {
  box-shadow: 0 0 0 2px var(--text);
}
.identicon-low {
  position: absolute;
  left: 50%;
  bottom: -7px;
  transform: translateX(-50%);
  padding: 0 3px;
  border-radius: 4px;
  background: var(--panel);
  color: var(--text);
  font-size: 9px;
  font-weight: 650;
  line-height: 12px;
}
/* A chip's 21px avatar is too small for the word; the chip says "low" beside it. */
.identicon-sm .identicon-low {
  display: none;
}
/* A side refilling after /compact or a plan reset, bottom row first. */
.identicon.battery i.refill {
  animation: battery-refill 420ms ease-out backwards;
}
@keyframes battery-refill {
  from { background: color-mix(in srgb, var(--who) 16%, transparent); transform: scale(0.6); }
}
@media (prefers-reduced-motion: reduce) {
  .identicon.battery i.refill { animation: none; }
}
.bubble.writing {
  opacity: 0.8;
}
.speaker {
  display: block;
  font-size: 12px;
  font-weight: 650;
  margin-bottom: 6px;
  /* The bubble carries --agent-color; themes may mute it from here. */
  color: var(--agent-color, var(--accent));
}
.typing {
  color: var(--muted);
  font-style: italic;
}
/* A reply that is still being worked on. It must not be mistaken for the
   finished message: the avatar shimmers, the text is dimmer, the steps taken
   are listed above it, and a moving status line sits under it until the turn
   ends. It keeps 260px beside the 36px avatar and 12px gap, but never more
   than the thread is wide: the row's percentage is the thread's width, and the
   reply takes what is left of the row. */
.bubble.writing,
.bot-row > .bubble.writing {
  opacity: 1;
  min-width: min(260px, 100% - 48px);
}
.bot-row:has(> .bubble.writing) { min-width: min(308px, 100%); }
.draft-text {
  color: var(--muted);
}
.steps {
  list-style: none;
  margin: 2px 0 8px;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: nowrap;
}
.step {
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--muted);
  opacity: 0.7;
}
.step::before {
  content: "\2713";
  display: inline-block;
  width: 1.4em;
  color: var(--accent);
}
.step.current {
  color: var(--text);
  opacity: 1;
}
.step.current::before {
  content: "\203A";
}
/* The full step list (WorkSteps.tsx), when the daemon sends structured steps.
   Each row opens to its command and output; a helper's steps sit in a box. */
.work-steps {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 2px 0 8px;
  min-width: 0;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: normal;
}
.work-steps-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.work-steps-item { min-width: 0; }
.work-steps-saved { margin: 4px 0 2px; min-width: 0; }
.work-steps-saved .work-steps { margin-top: 4px; }
.work-steps-toggle {
  font: 12px/1.5 inherit;
  color: var(--muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  padding: 1px 6px;
  margin-left: -6px;
  cursor: pointer;
}
.work-steps-toggle:hover { color: var(--text); }
.work-steps-toggle[aria-expanded="true"] { color: var(--text); }
.work-steps-note { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
.work-steps button {
  font: inherit;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
}
.work-steps-step {
  display: flex;
  align-items: baseline;
  gap: 6px;
  width: 100%;
  min-width: 0;
  padding: 0 6px 0 0;
  color: var(--muted);
  white-space: nowrap;
}
.work-steps-step:hover:not(:disabled), .work-steps-helper-head:hover:not(:disabled), .work-steps-more:hover:not(:disabled) {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-color: transparent;
}
.work-steps-step[aria-expanded="true"], .work-steps-step.work-steps-running { color: var(--text); }
.work-steps-step::before {
  content: "\2022";
  flex: none;
  width: 1.4em;
  text-align: center;
  color: var(--accent);
}
.work-steps-step[data-kind="command"]::before { content: "$"; }
.work-steps-step[data-kind="read"]::before { content: "\2261"; }
.work-steps-step[data-kind="search"]::before { content: "\2315"; }
.work-steps-step[data-kind="list"]::before { content: "\2630"; }
.work-steps-step[data-kind="edit"]::before { content: "\270E"; }
.work-steps-step[data-kind="web"]::before { content: "\25CE"; }
.work-steps-step[data-kind="tool"]::before { content: "\2699"; }
.work-steps-step[data-kind="thinking"]::before { content: "\2026"; }
.work-steps-step.work-steps-failed::before { color: var(--danger); }
.work-steps-label {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.work-steps-folder {
  flex: none;
  max-width: 45%;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--muted);

.work-steps-step > :is(.work-steps-spinner, .work-steps-fail-mark, .work-steps-stop-mark) { margin-left: auto; flex: none; padding-left: 6px; }
.work-steps-fail-mark { color: var(--danger); }
.work-steps-stop-mark { color: var(--muted); }
.work-steps-spinner {
  display: inline-block;

  align-self: center;
}
@keyframes work-steps-spin { to { transform: rotate(360deg); } }
.work-steps-detail {
  margin: 2px 0 6px 0.7em;
  padding: 2px 0 2px 10px;
  border-left: 2px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.work-steps-command, .work-steps-output {
  margin: 0;
  font: inherit;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.work-steps-command { color: var(--text); }
.work-steps-output {
  max-height: 240px;

  padding: 6px 8px;
  background: var(--bg);
  border: 1px solid var(--line);

}
.work-steps-meta { font-size: 11px; color: var(--muted); }
.work-steps-more {

}
.work-steps-helper {
  margin: 2px 0;

}
.work-steps-helper-head {
  display: grid;

}
.work-steps-helper-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.work-steps-helper-title::before { content: "\25C7"; display: inline-block; width: 1.4em; color: var(--accent); }
.work-steps-helper-state { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.work-steps-helper.work-steps-failed > .work-steps-helper-head .work-steps-helper-state { color: var(--danger); }
.work-steps-helper-latest {
  grid-column: 1 / -1;

  text-overflow: ellipsis;

}
.work-steps-helper > .work-steps-list { margin: 2px 0 0 4px; }
.work-steps-todo {
  list-style: none;
  margin: 0 0 4px;
  padding: 0;
  display: flex;
  flex-direction: column;
}
.work-steps-todo-item { color: var(--muted); overflow-wrap: anywhere; }
.work-steps-todo-mark { display: inline-block; width: 1.4em; text-align: center; color: var(--accent); }
.work-steps-todo-in_progress { color: var(--text); font-weight: 600; }
.work-steps-todo-completed { opacity: 0.7; }
.work-steps-todo-pending .work-steps-todo-mark { color: var(--muted); }
.work-steps-todo-cancelled { text-decoration: line-through; opacity: 0.6; }
.work-steps-todo-cancelled .work-steps-todo-mark { color: var(--muted); text-decoration: none; }

.working-line {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding-top: 8px;

  line-height: 1.4;
  color: var(--accent);
  white-space: nowrap;
}
.steps + .working-line,

}
.working-time {

}

}

}

}

}

.chip-levels::before {
  content: "· ";
}
.chip-levels {
  font-variant-numeric: tabular-nums;
}
.chip-sep {

/* Low readings are not failures: they get weight and the word "low", never the danger colour. */
.usage-low {

  font-weight: 650;
}
/* The usage card under a chip, opened by hovering or focusing it. */
.chip-wrap {
  position: relative;

}
.usage-card {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 20;
  display: grid;
  gap: 6px;
  min-width: 260px;
  max-width: 340px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel-2);
  box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
  font-size: 12px;
}
/* Bridges the gap so moving the pointer down to the card keeps it open. */
.usage-card::before {
  content: "";
  position: absolute;
  inset: -7px 0 auto;
  height: 7px;
}
.usage-row {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 8px;
}
.usage-label {
  color: var(--muted);
}
.usage-note {
  margin: 0;
  color: var(--muted);

}
.usage-compact {

}
.notice {

}
.notice.error {

}
.compacted {

}
.compacted summary {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  list-style: none;
}
.compacted summary::-webkit-details-marker { display: none; }
.compacted summary::before,
.compacted summary::after {
  content: "";
  flex: 1;

}
.compacted[open] > :not(summary) {

  border-radius: 8px;
  color: var(--text);
}
.md .curation-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0 0;
}

.composer {
  position: relative;
  display: flex;
  gap: 12px;
  padding: 16px;
  align-items: flex-start;
  border-top: 1px solid var(--line);
}
.composer textarea {
  width: 100%;

  padding: 10px 14px;
  min-height: 0;
}
.composer-field > textarea { max-height: 200px; overflow-y: auto; }

@media (max-width: 720px) {

/* Shared details keep the deck quiet while the work takes focus. */
::selection { background: #285e49; color: #fff; }
* { scrollbar-width: thin; scrollbar-color: #344351 transparent; }
button:hover:not(:disabled) { background-color: #1b2834; }
button.primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

button:active:not(:disabled) { transform: translateY(1px); }
button.icon { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; min-height: 28px; }
button.icon.small { min-width: 26px; min-height: 26px; }
.titlebar { min-height: 50px; flex-shrink: 0; }
.brand { letter-spacing: -0.025em; font-size: 15px; gap: 10px; }
.section-button > span { display: flex; }

.picker-grid.single { grid-template-columns: 1fr; }

.picker-grid.single button:hover { background: #192d24; border-color: var(--accent); }
.picker-grid.single .picker-action-icon { grid-row: 1 / 3; display: flex; color: var(--accent); }
.picker-grid.single strong { font-size: 14px; }
.picker-grid.single button > span:not(.picker-action-icon) { grid-column: 2; }
.picker-grid.single button > svg { grid-column: 3; grid-row: 1 / 3; color: var(--accent); }
.picker-note { color: var(--muted); font-size: 12px; line-height: 1.7; }
.welcome-logo { margin-bottom: 28px; }
.picker > .primary { margin-top: 26px; padding: 11px 18px; }

.ws-name { padding: 10px; gap: 10px; }

.ws-label { overflow: hidden; text-overflow: ellipsis; }
.ws-row > .pane-menu-wrap > .icon { opacity: 0; }
.ws-row:hover > .pane-menu-wrap > .icon, .ws-row:focus-within > .pane-menu-wrap > .icon, .ws-row .icon[aria-expanded="true"] { opacity: 1; }
.pane-row { border-radius: 6px; }
.pane-row.focused { background: #ffffff05; }
.pane-title, .pane-folder { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pane-head { min-height: 42px; }
.pane-head > .icon { flex-shrink: 0; }
.section-intro { padding: 36px 12px 24px; }

@media (max-width: 1050px) {

/* Links to files and web pages inside a message. */
.msg-link {
  color: var(--brand-cyan);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--brand-cyan) 45%, transparent);
  text-underline-offset: 3px;
  cursor: pointer;
}
.msg-link:hover {
  text-decoration-color: currentColor;
}

/* The menu a right-click on a link opens. */
.link-menu {
  position: fixed;
  z-index: 50;
  display: flex;
  flex-direction: column;
  min-width: 180px;
  padding: 4px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  white-space: nowrap;
}

  border: 0;
  background: transparent;
  text-align: left;
  padding: 6px 10px;
  border-radius: 5px;
  font-size: 13px;
  line-height: 1.4;
}
.link-menu button:hover {
  background: color-mix(in srgb, var(--accent) 18%, transparent);
}

/* A bot's reply drawn from markdown. The bubble keeps line breaks as
   written; inside here blocks set their own spacing instead. */
.md {
  white-space: normal;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.md p,
.md blockquote,
.md .md-item {
  margin: 0;
  white-space: pre-wrap;
}
.md-heading {
  font-weight: 650;
  line-height: 1.35;
}
.md-heading.level-1 { font-size: 1.3em; }
.md-heading.level-2 { font-size: 1.18em; }
.md-heading.level-3 { font-size: 1.07em; }
.md-heading:not(:first-child) { margin-top: 6px; }
.md code {
  font: 0.9em/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  background: color-mix(in srgb, var(--text) 9%, transparent);

}
.md-item {
  min-width: 0;
}

/* Lines between panes that can be dragged to resize them. */
.divider {
  position: absolute;
  z-index: 5;
  touch-action: none;
}
.divider.row {
  cursor: col-resize;
}
.divider.column {
  cursor: row-resize;
}
.divider::after {
  content: "";
  position: absolute;
  border-radius: 2px;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.12s;
}
.divider.row::after {
  top: 0;
  bottom: 0;
  left: 50%;
  width: 3px;
  transform: translateX(-50%);
}
.divider.column::after {
  left: 0;
  right: 0;
  top: 50%;
  height: 3px;
  transform: translateY(-50%);
}
.divider:hover::after {
  opacity: 0.45;
}
.divider.held::after {
  opacity: 0.9;
}
/* While a pane is being resized or moved, the panes must not take the
   pointer, or a terminal would swallow the drag. */
.grid.adjusting .pane-body {
  pointer-events: none;
}
.grid.adjusting {
  user-select: none;
  -webkit-user-select: none;
}
.pane-head {
  cursor: grab;
}
.pane.lifted {
  opacity: 0.55;
}
.pane.lifted .pane-head {
  cursor: grabbing;
}
.drop-preview {
  z-index: 6;
  pointer-events: none;
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  transition: left 0.08s, top 0.08s, width 0.08s, height 0.08s;

.layout-presets {

.layout-presets button {

.layout-presets button + button {

}
.layout-presets button:hover:not(:disabled) {
  color: var(--text);

}
.layout-presets svg {

  stroke: currentColor;
  stroke-width: 1.3;
}
@media (prefers-reduced-motion: reduce) {
  .drop-preview, .divider::after { transition: none; }
}

/* Panes that want attention. The dot, a short flag beside the pane, a count
   on the tab and workspace it is in, and one list of all of them. */
.dot.needs_input {
  background: var(--warn);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent);
  animation: needs-you 1.6s ease-in-out infinite;
}

  background: var(--danger);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 22%, transparent);
}

  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-cyan) 20%, transparent);
}
@keyframes needs-you {
  0%, 100% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--warn) 30%, transparent); }
  50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--warn) 8%, transparent); }

.flag {

  font-size: 10.5px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0.02em;

  border-radius: 999px;
  white-space: nowrap;
  max-width: 22ch;
  overflow: hidden;
  text-overflow: ellipsis;
}
.flag.needs_input { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.flag.failed { color: var(--danger); background: color-mix(in srgb, var(--danger) 15%, transparent); }
.flag.done { color: var(--brand-cyan); background: color-mix(in srgb, var(--brand-cyan) 14%, transparent); }
.pane-row-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.pin-mark { flex: none; color: var(--accent); }
.pane-row > .pane-menu-wrap { margin-left: auto; flex: none; }
.pane-row > .pane-menu-wrap > .icon { opacity: 0; }
.pane-row:hover > .pane-menu-wrap > .icon,

.quote-preview-list { display: flex; flex-direction: column; max-height: 160px; overflow-y: auto; padding: 0 10px 8px; }

/* The conversation, with the list of changes beside it when open. */

.appearance-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.changes-note { padding: 0 16px; font-size: 12px; color: var(--muted); }

.bubble.human { position: relative; }

/* One app-level details rail; pane components stay mounted when it docks. */

.thread-chat .chip-wrap { flex: none; }

/* ChatPane picks data-fit from what the row has room for, so a wide pane full of bots still shows every one. */

.composer-field { display: flex; align-items: center; gap: 8px; }

.composer-menu { position: absolute; bottom: calc(100% + 6px); left: 16px; width: min(320px, calc(100% - 32px)); padding: 8px; background: var(--panel, #202124); border: 1px solid var(--border, #444); border-radius: 10px; box-shadow: 0 8px 28px #0005; z-index: 30; }

.attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

.attachment { position: relative; display: flex; align-items: center; height: 56px; max-width: 180px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); overflow: hidden; }

/* Per-participant turns keep the composer compact at every activity level. */

.participant-status.thinking, .participant-status.writing { background: #92b0c9; }

/* UI review, stage 1: closing, deleting and the rounds stepper. */

.danger-text { color: var(--danger); }

/* Mockup v2: the message box grows into the add menu; saved agents are tiles; the lineup is the box's bottom strip. */

.quick-add-tile {

/* Hover moves: ChatPane's playTileMove sets data-move; only the avatar moves. */
.quick-add-tile[data-move="hop"] .identicon { animation: tile-hop .5s ease; }
.quick-add-tile[data-move="wiggle"] .identicon { animation: tile-wiggle .5s ease; }
.quick-add-tile[data-move="spin"] .identicon { animation: tile-spin .5s ease; }
.quick-add-tile[data-move="squash"] .identicon { animation: tile-squash .5s ease; }
.quick-add-tile[data-move="tilt"] .identicon { animation: tile-tilt .5s ease; }
.quick-add-tile[data-move="pulse"] .identicon { animation: tile-pulse .5s ease; }
@keyframes tile-hop {
  0% {
    transform: translateY(0);
  }
  40% {
    transform: translateY(-6px);
  }
  70% {
    transform: translateY(2px);
  }
  100% {
    transform: translateY(0);
  }
}
@keyframes tile-wiggle {
  0% {
    transform: rotate(0);
  }
  20% {
    transform: rotate(-12deg);
  }
  40% {
    transform: rotate(10deg);
  }
  60% {
    transform: rotate(-6deg);
  }
  80% {
    transform: rotate(3deg);
  }
  100% {
    transform: rotate(0);
  }
}
@keyframes tile-spin {
  from {
    transform: rotate(0);
  }
  to {
    transform: rotate(360deg);
  }
}
@keyframes tile-squash {
  0% {
    transform: scale(1, 1);
  }
  30% {
    transform: scale(1.2, .8);
  }
  60% {
    transform: scale(.9, 1.1);
  }
  100% {
    transform: scale(1, 1);
  }
}
@keyframes tile-tilt {
  0% {
    transform: rotate(0);
  }
  35% {
    transform: rotate(-18deg) translateX(-2px);
  }
  70% {
    transform: rotate(6deg);
  }
  100% {
    transform: rotate(0);
  }
}
@keyframes tile-pulse {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.18);
  }
  70% {
    transform: scale(.96);
  }
  100% {
    transform: scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {

}

.quick-add-row-open {

}

.quick-add-face {

.quick-add-another {

}

.quick-add-faces {

}

}

.quick-add-say {

.composer-box.adding {

}

.composer-box.adding > :not(.quick-add) { display: none; }

.composer-box.adding > .quick-add {

  background: transparent;
  border: 0;
  border-radius: inherit;

}

@keyframes quick-add-grow {
  from {
    max-height: 48px;

  }
}
/* Themes paint .quick-add as a floating menu; docked, the message box is the only surface. */
:root[data-deck-theme] .composer-box.adding > .quick-add {
  background: transparent;
  border-radius: inherit;

/* Fade the welcome text, not the landing texture that lives inside .empty. */
.transcript .empty > :not(.landing-texture-wrap) {

}
.transcript .empty.away {

@media (prefers-reduced-motion: reduce) {

  }

    transition: none;
  }
}
.attention-severity-border { display: flex; flex: none; height: 1px; margin: 0 4px; background: var(--line); }

.attention-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; padding: 6px 10px 4px; margin-top: 2px; font-size: 11px; color: var(--muted); }

/* Composer actions: one round button, Send when idle and Stop all while a bot works. */

/* Thread details: what the person chose "Always allow" for. */
.allowed-empty { margin: 0; font-size: 12px; }
.allowed-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.allowed-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.allowed-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
.allowed-copy > span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Composer: one rounded box holding +, text, and Send, all on one line. */

.composer-field > textarea { border: 0; background: transparent; box-shadow: none; outline: none; padding: 8px 6px; line-height: 20px; }

.layout-choice { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 7px 8px; text-align: left; border: 1px solid transparent; border-radius: 7px; background: transparent; }
.layout-choice:hover, .layout-choice:focus-visible { background: color-mix(in srgb, var(--accent) 9%, var(--panel-2)); border-color: color-mix(in srgb, var(--accent) 34%, transparent); outline: none; }
.layout-choice.selected { background: color-mix(in srgb, var(--accent) 12%, var(--panel-2)); border-color: color-mix(in srgb, var(--accent) 38%, transparent); }
.layout-preview { flex: none; width: 38px; height: 28px; display: grid; gap: 2px; padding: 3px; border: 1px solid color-mix(in srgb, var(--muted) 42%, transparent); border-radius: 4px; background: color-mix(in srgb, var(--bg) 55%, transparent); }
.layout-preview i { min-width: 0; min-height: 0; border-radius: 1px; background: color-mix(in srgb, var(--muted) 45%, transparent); }
.layout-preview-grid { grid-template: 1fr 1fr / 1fr 1fr; }
.layout-preview-top { grid-template: 1.45fr 1fr / 1fr 1fr; }
.layout-preview-top i:first-child { grid-column: 1 / -1; }
.layout-preview-left { grid-template: 1fr 1fr / 1.45fr 1fr; }
.layout-preview-left i:first-child { grid-row: 1 / -1; }
.layout-choice.selected .layout-preview i { background: var(--accent); }
.layout-choice-copy { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 2px; }
.layout-choice-copy strong { font-size: 12px; font-weight: 600; }
.layout-choice-copy small { color: var(--muted); font-size: 10px; line-height: 1.3; }
.layout-choice-check { color: var(--accent); font-size: 13px; font-weight: 700; }
.layout-picker-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Now tier, stage 1: what is still running, under the quit question. */
.confirm-rows { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
.confirm-rows li { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* The section tabs are centered independently of the side controls. Keep the
   later right group at its content width: it inherits the titlebar's drag
   region, which Electron applies after the tabs' no-drag region regardless
   of z-index. Expanding it underneath the switcher swallows Library clicks. */
.titlebar-start, .titlebar-end { display: flex; align-items: center; gap: 10px; flex: 1 1 0; min-width: max-content; }
.titlebar-end { justify-content: flex-end; flex: 0 0 auto; }
@media (min-width: 1051px) {
  .titlebar { position: relative; }
  .titlebar > .section-navigation {
    position: absolute;
    /* Keep the whole switcher above the titlebar drag and control layers. */
    z-index: 20;
    pointer-events: auto;
    -webkit-app-region: no-drag;
    left: calc(50% - 36px);
    margin-left: 0;
    transform: translate(-50%, 3px);
  }
}
/* Narrower, there's no room for three balanced groups: the tabs follow the brand. */
@media (max-width: 1050px) {
  .titlebar-start, .titlebar-end { flex: none; min-width: 0; gap: 8px; }
  .titlebar-end { margin-left: auto; }
  /* At this width the switcher is in the flex row, not the centered overlay.
     Keep it above the neighboring titlebar groups and wholly clickable. */
  .titlebar > .section-navigation { position: relative; z-index: 20; pointer-events: auto; }
  .titlebar > .section-navigation > .section-button { position: relative; z-index: 1; pointer-events: auto; -webkit-app-region: no-drag; }
}
/* Below 880px the tabs no longer fit between both button groups, so they get
   their own full-width row, as on a phone. Wider, anything that still doesn't
   fit (an extra button, a long attention count) wraps instead of pushing the
   bar past the window edge. */
.titlebar { flex-wrap: wrap; row-gap: 8px; }
@media (max-width: 880px) {
  .titlebar > .section-navigation { order: 5; width: 100%; margin-left: 0; justify-content: center; }
  .titlebar .section-button { flex: 1; justify-content: center; }
}

/* A shorter title bar with a clearly grouped section switcher. */
.titlebar {
  box-sizing: border-box;
  height: 48px;
  min-height: 48px;
  padding-top: 0;
  padding-bottom: 0;
  row-gap: 2px;
}
.titlebar .brand {
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.titlebar .brand-mark {
  width: 24px;
  height: 24px;
}
.titlebar-start > .brand { -webkit-app-region: drag; }
.section-navigation {
  gap: 0;
  padding: 2px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.titlebar > .section-navigation > .section-button {
  min-height: 28px;
  padding: 4px 5px;
  border: 0;
  box-shadow: none;
  border-radius: 6px;
  font-size: 12px;
}
.titlebar > .section-navigation > .section-button { border: 0; }
.titlebar .section-button.selected {
  background: var(--accent);
  border: 0;
  color: var(--bg);
  box-shadow: none;
}
.titlebar .section-button:hover:not(:disabled):not(.selected) {
  background: transparent;
  border: 0;
  box-shadow: none;
}
.titlebar .section-button.selected > span {
  color: var(--text);
}
.titlebar .section-button.has-attention {
  position: relative;
}
.titlebar .section-button.has-attention::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -2px;
  height: 3px;
  border-radius: 3px;
  background: var(--warn, #e0a030);
}
.titlebar .section-button.has-attention.failed::after { background: var(--danger); }
.titlebar .section-button.has-attention.done::after { background: var(--brand-cyan); }
.section-navigation { position: relative; }
.section-navigation > .section-alerts {
  top: calc(100% + 6px);
  width: min(400px, calc(100vw - 32px));
}
.section-alerts .dot { flex: none; }
.titlebar .titlebar-new {
  background: transparent !important;
  border-color: transparent !important;
  color: var(--muted) !important;
  box-shadow: none !important;
  font-weight: 500;
}
.titlebar .titlebar-new:hover:not(:disabled) {
  background: var(--panel-2) !important;
  border-color: var(--line) !important;
  color: var(--text) !important;
  box-shadow: none;
}
@media (max-width: 880px) {
  .titlebar > .section-navigation { order: 0; width: auto; }
  .titlebar .section-button { flex: 0 0 auto; }
}

/* A command-line bot that has said nothing for a while: muted, not alarming. */
.working-line.quiet { color: var(--muted); }
.working-line.quiet .working-dots i { background: var(--muted); }

/* Now 3.1: pills that keep your place while bots stream. */
.transcript-pills { position: absolute; left: 0; right: 0; bottom: 12px; z-index: 5; display: flex; justify-content: center; gap: 8px; padding: 0 12px; pointer-events: none; }
.transcript-pill { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--text); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35); }
.transcript-pill:hover:not(:disabled) { background: var(--panel-2); }
.pill-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

/* Now 3.1: "New since you looked", a hairline with no colour. */
.unseen-divider { display: flex; align-items: center; gap: 10px; align-self: stretch; color: var(--muted); font-size: 11px; }
.unseen-divider::before, .unseen-divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

/* Now 3.2: who gets your message, and why. */
.link-button { padding: 0; border: 0; border-radius: 0; background: none; color: inherit; font: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; cursor: pointer; }
.link-button:hover:not(:disabled) { background: none; color: var(--text); text-decoration-color: currentColor; }
.example-rows { display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin-top: 16px; }
.example-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--muted); font-size: 12px; text-align: left; }
.example-row:hover:not(:disabled) { color: var(--text); }

/* Now 3.3: Try again and Let them answer on notices. */
.notice.with-action { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 10px; text-align: center; }
.notice.with-action button { padding: 2px 10px; font-size: 12px; color: var(--text); }

/* Now 3.4: hand a quote to another bot. The menu opens upward from the composer. */
.hand-off { flex: none; }
.hand-off > button { padding: 3px 8px; font-size: 12px; white-space: nowrap; }
.hand-off-menu { top: auto; bottom: calc(100% + 6px); }
/* Now 3.4: Quote, Copy and Fork on every message. */
/* Actions sit under the bubble: a bot's at bottom left, yours at bottom right. */
.message-row { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; row-gap: 2px; }
.human-row > .bubble { grid-column: 1; grid-row: 1; justify-self: end; }
.human-row > .message-actions { grid-column: 1; grid-row: 2; justify-self: end; }
.bot-row.message-row { grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; }
.bot-row > .identicon { grid-column: 1; grid-row: 1; }
.bot-row > .bubble { grid-column: 2; grid-row: 1; justify-self: start; }
.bot-row > .message-actions { grid-column: 2; grid-row: 2; justify-self: start; }
.human-row { align-self: flex-end; max-width: 85%; }
/* Capped at the row: the grid sizes an aligned bubble to its longest line, and
   step rows and table headers never wrap, so a long one pushed past the column. */
.message-row > .bubble { min-width: 0; max-width: 100%; }
.message-actions { flex: none; display: flex; flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 2px; }
/* In a thread the row stays inside its reply's column: where it doesn't fit,
   the time drops to its own line, and your lines stay right-aligned. */
.message-row > .message-actions { flex-wrap: wrap; }
.human-row > .message-actions { justify-content: flex-end; text-align: end; }
.message-more > .pane-menu { left: 0; right: auto; }
.human-row .message-more > .pane-menu { left: auto; right: 0; }
.human-row .msg-action.quote svg { transform: scaleX(-1); }
.msg-action, .msg-more { display: grid; place-items: center; min-width: 32px; height: 32px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); }
.msg-action:hover:not(:disabled), .msg-action:focus-visible, .msg-more:hover:not(:disabled), .msg-more:focus-visible { color: var(--text); background: var(--panel); }
.copied { font-size: 11px; color: var(--text); }

/* Now tier, stage 4: terminals. A terminal pane is its screen plus, once
   its program has ended, a bar at the foot. Neutral panel, hairline border. */
.terminal { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.terminal > .terminal-host { min-height: 0; }
.terminal-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel-2); font-size: 12px; }
/* In a narrow pane the buttons drop below the words rather than squeezing them. */
.terminal-bar-text { flex: 1 1 26ch; min-width: 0; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.terminal-bar button { padding: 4px 10px; font-size: 12px; white-space: nowrap; }
/* A terminal restored from the last session, before it is started. */
.terminal-stopped { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: var(--panel); }
.terminal-stopped p { margin: 0; max-width: 42ch; color: var(--muted); font-size: 13px; line-height: 1.6; }
.terminal-stopped-actions { display: flex; gap: 8px; }
/* What a terminal's program says it is doing, after its name. Muted, and the first thing to shrink. */
.program-title { min-width: 0; color: var(--muted); font-weight: 400; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pane-head .pane-title { flex: 0 1 auto; min-width: 4ch; }
.pane-head .program-title { flex: 0 100 auto; font-size: 12px; }
.pane-row-title:has(+ .program-title) { flex: 0 1 auto; }
.pane-row .program-title { flex: 1 1 0; font-size: 12px; }

/* Ask for review (DiffPanel): opens under the Changes head, in the sidebar's flow so it is never clipped. */
.review-menu { display: flex; flex-direction: column; margin: 8px 0 4px; padding: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45); }
.review-line { margin: 0; padding: 6px 10px 5px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.review-split { display: flex; align-items: center; gap: 8px; padding: 4px 10px 6px; font-size: 12px; }
.review-bot { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; background: transparent; border-color: transparent; font-size: 12px; text-align: left; }
.review-bot:hover:not(:disabled), .review-bot:focus-visible { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.review-bot-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.review-bot-name strong { font-weight: 650; }
.review-bot-note { flex: none; color: var(--muted); font-size: 11px; }

.bot-settings {
  position: fixed;
  z-index: 1000;
  width: 320px;
  max-width: calc(100vw - 16px);
  max-height: calc(100vh - 16px);
  overflow-y: auto;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel-2);
  box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
}
.bot-settings p { margin: 6px 0 12px; font-size: 12px; }
.bot-settings fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 12px; min-width: 0; }
.bot-settings label { display: grid; gap: 5px; font-size: 12px; }
.bot-settings select, .bot-settings input { width: 100%; min-width: 0; }
.bot-settings-actions { display: flex; justify-content: flex-end; gap: 8px; }
.bot-settings label.check-label, .add-form label.check-label { display: flex; flex-direction: row; align-items: center; gap: 8px; }
.bot-settings label.check-label input, .add-form label.check-label input { width: auto; flex: none; margin: 0; }
.settings-pending { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }

/* ---------------------------------------------------------------- settings */
.body { position: relative; }
.titlebar button.icon { background: transparent; border-color: transparent; box-shadow: none; }
.titlebar button.icon:hover:not(:disabled) { border-color: transparent; }
