.apex-agent-dock {
  position: relative;
  flex: 0 1 auto;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-left: 1px solid var(--line);
  background: var(--panel, var(--bg));
  color: var(--text);
}
.apex-agent-dock-resizer {
  position: absolute;
  z-index: 5;
  top: 0;
  bottom: 0;
  left: -5px;
  width: 10px;
  cursor: col-resize;
  touch-action: none;
  outline: none;
}
.apex-agent-dock-resizer::after { content: ""; position: absolute; top: 45%; left: 4px; width: 2px; height: 38px; border-radius: 2px; background: var(--muted); opacity: .4; }
.apex-agent-dock-resizer:hover::after, .apex-agent-dock-resizer:focus-visible::after { background: var(--accent); opacity: 1; }
.apex-agent-dock-resizer:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.apex-agent-dock > .apex-agent { width: 100%; height: auto; min-height: 0; flex: 1; border: 0; border-radius: 0; box-shadow: none; }
.apex-agent-dock > .apex-agent.widget { width: 100%; height: auto; min-height: 0; flex: 1; border: 0; border-radius: 0; box-shadow: none; }
.apex-agent-dock .apex-agent-head { flex-wrap: wrap; }
.apex-agent-dock .apex-agent-head-actions { min-width: 0; max-width: 100%; flex-wrap: wrap; }
.apex-agent-dock .apex-agent-head select { max-width: 100%; }
.apex-agent-dock-unavailable { flex: 1; overflow: auto; padding: 18px; }
.apex-agent-dock-unavailable p { color: var(--muted); }
.body.apex-agent-dock-focused > .canvas { display: none; }
.body.apex-agent-dock-focused > .apex-agent-dock { flex: 1 1 auto; width: auto !important; }
.body.apex-agent-dock-focused .apex-agent-dock-resizer { display: none; }
.body.apex-agent-dock-narrow > .canvas { display: none; }
.body.apex-agent-dock-narrow > .apex-agent-dock { flex: 1 1 auto; width: auto !important; }
.body.apex-agent-dock-narrow .apex-agent-dock-resizer { display: none; }

@media (max-width: 720px) {
  .apex-agent-dock-resizer { width: 14px; left: -7px; }
}
.apex-agent-all { display: flex; flex-direction: column; height: 100%; }
.apex-agent-all .apex-agent-tabpanel { flex: 1; overflow: auto; }
.apex-agent-project-tag { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
.apex-agent-needs-you { border-left: 2px solid var(--warn); }
.apex-agent-all-composer { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.apex-agent-all-composer textarea { resize: none; width: 100%; box-sizing: border-box; }
.apex-agent-all-composer > div { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.apex-agent-all-composer { position: relative; z-index: 2; }
.apex-agent-all-composer[hidden] { display: none !important; }
.apex-agent-all-compose-box { position: relative; display: flex; align-items: flex-end; justify-content: flex-start; gap: 8px; min-width: 0; }
.apex-agent-all-compose-box > div:first-child { flex: none; }
.apex-agent-all-compose-box textarea { flex: 1; min-width: 0; }
.apex-agent-all-compose-box .composer-menu { left: 0; bottom: calc(100% + 7px); max-height: min(360px, 55vh); overflow: auto; }
.apex-agent-back { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 6px; }
/* Shown under the header while the conversation is limited to one project. */
.apex-agent-filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted, inherit); }
.apex-agent-filter-bar button { border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 2px 6px; }
.apex-agent-all-evidence { margin: 4px 0 0; padding-left: 16px; font-size: 12px; color: var(--muted, inherit); }
.apex-agent-all-evidence li { margin: 2px 0; overflow-wrap: anywhere; }
.apex-agent-check-failed { border-left: 2px solid var(--danger); }
/* Expanded mode is a workspace pane beside the project sidebar. The canvas
   remains mounted, so terminal/thread sessions and their layout survive. */
.body.apex-agent-dock-expanded > .canvas { display: none; }
.body.apex-agent-dock-expanded > .apex-agent-dock.apex-agent-full {
  position: relative;
  inset: auto;
  z-index: auto;
  flex: 1 1 0;
  width: auto;
  height: auto;
  min-width: 0;
  min-height: 0;
  border: 0;
  border-left: 1px solid var(--line);
  border-radius: 0;
  box-shadow: none;
}
.body.apex-agent-dock-expanded > .thread-details,
.body.apex-agent-dock-expanded > .details-edge,
.body.apex-agent-dock-expanded > .details-backdrop { display: none !important; }
.apex-agent-project-expand { position: absolute; z-index: 3; top: 8px; right: 44px; }

/* Task replies expand in the conversation's scroll area, without a second pane. */
.apex-agent-all .assistant-task-conversation { flex: none; overflow: visible; gap: 10px; }
.apex-agent-all .assistant-task-conversation .assistant-task-list { flex: none; overflow: visible; padding: 0; }
.apex-agent-all .assistant-task-conversation .assistant-task-card { height: auto; }
.apex-agent-all .assistant-task-conversation .assistant-task-detail-scroll { flex: none; max-height: 360px; }
.apex-agent-all-evidence button { color: var(--accent); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }

/* Personal assistant lane: approval details, task status and command output. */
.apex-agent-personal pre { margin: 6px 0 0; padding: 8px 10px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, black 18%, transparent); font-size: 11.5px; line-height: 1.45; white-space: pre; }
.apex-agent-app-note > p { color: var(--muted); }
.apex-agent-task-chip { margin-left: 6px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); font-size: 10.5px; color: var(--muted); }
.apex-agent-task-chip[data-status="needsYou"] { border-color: var(--warn); color: var(--warn); }
.apex-agent-task-chip[data-status="done"] { border-color: var(--accent); color: var(--accent); }
.apex-agent-task-chip[data-status="failed"] { border-color: var(--danger); color: var(--danger); }
.apex-agent-operation { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 6px 0 2px; font-size: 12px; }
.apex-agent-operation dt { color: var(--muted); }
.apex-agent-operation dd { margin: 0; overflow-wrap: anywhere; }
.apex-agent-all .apex-agent-more summary { list-style: none; }
.apex-agent-all .apex-agent-more summary::-webkit-details-marker { display: none; }
.apex-agent-task-chip[data-status="waiting"] { border-color: var(--muted); color: var(--muted); }
.apex-agent-task-chip[data-status="blocked"] { border-color: var(--warn); color: var(--warn); }
.apex-agent-helper { border-left: 2px solid var(--line); padding-left: 8px; color: var(--muted); }
.apex-agent-helper-label { margin-left: 6px; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.apex-agent-notice { font-size: 12px; color: var(--muted); }
.apex-agent-new-notices { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
.apex-agent-all .apex-agent-tabpanel { position: relative; }
.apex-agent-panels-sheet { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; overflow: auto; background: var(--panel, var(--bg)); }
.apex-agent-panels-top { display: flex; justify-content: flex-end; padding: 4px 8px 0; }
.apex-agent-panels-sheet .personal-panels-body { max-height: none; flex: 1; }
.apex-agent-all { position: relative; }
/* One updating card per personal-assistant task. */
.apex-agent-task-card { align-self: stretch; margin: 6px 0; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--text) 2.5%, transparent); }
.apex-agent-task-card.apex-agent-needs-you { border: 1px solid color-mix(in srgb, var(--warn) 65%, transparent); }
.apex-agent-task-card[data-status="done"] { border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.apex-agent-task-card[data-status="failed"] { border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.apex-agent-task-card-top { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.apex-agent-task-card-top .apex-agent-task-chip { margin-left: auto; }
.apex-agent-task-card h3 { margin: 6px 0 4px; font-size: 14px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.apex-agent-task-card > p { margin: 0 0 3px; overflow-wrap: anywhere; }
.apex-agent-task-card .apex-agent-task-meta { color: var(--muted); font-size: 12px; }
.apex-agent-task-card-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.apex-agent-task-card-foot > button:not(.apex-agent-task-toggle) { margin-left: auto; flex: none; }
.apex-agent-task-toggle { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 12px; cursor: pointer; }
.apex-agent-task-decide { display: flex; gap: 8px; margin-top: 8px; }
.apex-agent-task-decide > button { padding: 8px 14px; }
.apex-agent-task-decide > button.primary { flex: 1; background: var(--warn); border-color: var(--warn); color: var(--accent-ink); font-weight: 600; }
.apex-agent-task-history { margin-top: 6px; font-size: 12px; }
.apex-agent-task-history ol { list-style: none; margin: 6px 0 0; padding: 0 0 0 9px; border-left: 1px solid var(--line); display: grid; gap: 6px; }
.apex-agent-task-history li p { margin: 2px 0 0; overflow-wrap: anywhere; }
.apex-agent-task-history pre { margin: 4px 0 0; max-height: 180px; overflow: auto; white-space: pre-wrap; }
.apex-agent-task-card-top .apex-agent-project-tag { background: none; border: 0; padding: 0; min-height: 0; }

/* Conversation and Tasks: two views in one window, switched by a tab row in the header. */
.apex-agent-views { gap: 2px; padding: 0 10px; border-top: 1px solid var(--line); flex-wrap: nowrap; min-width: 0; overflow-x: auto; }
.apex-agent-view-tab { border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 8px 8px 7px; cursor: pointer; white-space: nowrap; }
.apex-agent-view-tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.apex-agent-tabs-count { font-size: 12px; font-weight: 600; color: var(--warn); }

/* A task in the conversation: one short line where its first message was, opening the record in Tasks. */
.apex-agent-task-line { margin: 2px 0 6px; min-width: 0; }
.apex-agent-task-link, .apex-agent-all .assistant-task-link { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; min-width: 0; padding: 3px 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12.5px; line-height: 1.35; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.apex-agent-task-link::before, .apex-agent-all .assistant-task-link::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.apex-agent-task-link[data-status="needsYou"]::before, .apex-agent-all .assistant-task-link[data-status="needsYou"]::before { background: var(--warn); }
.apex-agent-task-link[data-status="done"]::before, .apex-agent-all .assistant-task-link[data-status="done"]::before { background: var(--accent); }
.apex-agent-task-link[data-status="failed"]::before, .apex-agent-all .assistant-task-link[data-status="failed"]::before { background: var(--danger); }
.apex-agent-task-link[data-status="waiting"]::before, .apex-agent-all .assistant-task-link[data-status="waiting"]::before { background: var(--muted); }
.apex-agent-task-link[data-status="blocked"]::before, .apex-agent-all .assistant-task-link[data-status="blocked"]::before { background: var(--warn); }
.apex-agent-task-link:hover, .apex-agent-all .assistant-task-link:hover { color: var(--text); text-decoration: underline; }
.apex-agent-task-link:focus-visible, .apex-agent-all .assistant-task-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Tasks list: place filter, then Needs you / Active / Finished. */
.apex-agent-tasks-home { display: grid; gap: 14px; padding: 10px; min-width: 0; box-sizing: border-box; }
.apex-agent-place-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.apex-agent-place-filter > .apex-agent-muted { font-size: 11px; margin-right: 2px; }
.apex-agent-chip-filter { max-width: 100%; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--text); font: inherit; font-size: 12px; overflow-wrap: anywhere; cursor: pointer; }
.apex-agent-chip-filter[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.apex-agent-task-group { min-width: 0; }
.apex-agent-task-group h2 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.apex-agent-task-group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.apex-agent-task-row { display: grid; gap: 4px; width: 100%; box-sizing: border-box; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--text) 2%, transparent); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.apex-agent-task-row[data-group="needsYou"] { border-color: color-mix(in srgb, var(--warn) 65%, transparent); }
.apex-agent-task-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.apex-agent-task-row strong { font-size: 13.5px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.apex-agent-task-row small, .apex-agent-task-row-result { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.apex-agent-task-row-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; min-width: 0; }
.apex-agent-task-row-when { font-size: 11px; color: var(--muted); white-space: nowrap; }
.apex-agent-task-row-tag { justify-self: start; font-size: 11px; color: var(--accent); }
.apex-agent-tasks-empty, .apex-agent-task-missing { margin: 0; padding: 16px 4px; color: var(--muted); overflow-wrap: anywhere; }

/* Back bar and detail page for one task. */
.apex-agent-task-bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel, var(--bg)); font-size: 12px; color: var(--muted); }
.apex-agent-task-bar > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apex-agent-task-bar > .apex-agent-back { flex: none; }
.apex-agent-all .apex-agent-task-card { margin: 10px; box-sizing: border-box; max-width: calc(100% - 20px); overflow-wrap: anywhere; }
.apex-agent-all .apex-agent-task-card-foot { flex-wrap: wrap; }
.apex-agent-notifications-home { display: grid; gap: 10px; padding: 10px; min-width: 0; }
.apex-agent-notifications-home > .assistant-chat-message { margin: 0; }
.apex-agent-notifications-controls { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel, var(--bg)); font-size: 12px; color: var(--muted); }
.apex-agent-notifications-controls button { padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; background: none; color: var(--text); font: inherit; cursor: pointer; }
.apex-agent-notifications-controls button:disabled { opacity: .55; cursor: default; }
.apex-agent-personal-notice { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.apex-agent-personal-notice.is-unseen { box-shadow: inset 3px 0 var(--warn); }
.apex-agent-personal-notice.is-seen { opacity: .84; }
/* Header rows stack (title, status, view tabs) everywhere, including the phone where styles.css lays the header out in a row. */
.apex-agent-all .apex-agent-head { display: grid; gap: 4px; align-items: stretch; }
.apex-agent-all .apex-agent-views { justify-content: flex-start; overflow-x: hidden; }
.apex-agent-all .apex-agent-view-tab { border-radius: 0; background: none; box-shadow: none; min-height: 0; width: auto; flex: none; }

.personal-panels { position: relative; display: flex; flex-direction: column; min-width: 0; max-width: 100%; color: var(--text); font-size: 12.5px; line-height: 1.4; }
.personal-panels-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 8px 10px 4px; min-width: 0; }
.personal-panels-head strong { font-size: 13px; }
.personal-panels .personal-panels-close { margin-left: auto; color: var(--muted); }
.personal-panels-tabs { display: flex; gap: 12px; padding: 4px 10px 0; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.personal-panels-tabs::-webkit-scrollbar { display: none; }
.personal-panels-tabs button { flex: 0 0 auto; padding: 4px 0 6px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; }
.personal-panels-tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.personal-panels-body { max-height: 60vh; overflow: auto; min-width: 0; padding: 4px 10px 10px; }
.personal-panels-body h4 { margin: 10px 0 2px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.personal-panels-body > p { margin: 6px 0; }
.personal-panels-row { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 7px 0; border-bottom: 1px solid var(--line); }
.personal-panels-row:last-child { border-bottom: 0; }
.personal-panels-rowmain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: default; }
button.personal-panels-rowmain { cursor: pointer; }
.personal-panels-goal { min-width: 0; overflow-wrap: anywhere; }
.personal-panels-muted { color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
.personal-panels-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.personal-panels-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.personal-panels-chip[data-status="needsYou"] { color: var(--warn); }
.personal-panels-chip[data-status="running"], .personal-panels-chip[data-status="queued"] { color: var(--accent); }
.personal-panels-chip[data-status="blocked"], .personal-panels-chip[data-status="failed"] { color: var(--danger); }
.personal-panels-chip[data-status="done"] { color: var(--accent); opacity: .7; }
.personal-panels-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.personal-panels-inline { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; }
.personal-panels-form { display: flex; flex-direction: column; gap: 8px; padding: 6px 0; }
.personal-panels-field { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 11.5px; }
.personal-panels-struck { text-decoration: line-through; }
.personal-panels-unseen { font-weight: 700; }
.personal-panels-alert { margin: 4px 10px 0; color: var(--danger); font-size: 12px; }
.personal-panels details { margin-top: 8px; }
.personal-panels summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
.personal-panels details ul { margin: 4px 0 0; padding-left: 16px; }
.personal-panels pre { margin: 4px 0 0; padding: 6px 8px; max-height: 180px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 6px; background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--muted); font: 11.5px ui-monospace, Menlo, monospace; }
.personal-panels table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.personal-panels th, .personal-panels td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.personal-panels th { color: var(--muted); font-weight: 600; }
.personal-panels input, .personal-panels select, .personal-panels textarea { min-width: 0; max-width: 100%; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; font-size: 12px; }
.personal-panels textarea { resize: vertical; }
.personal-panels input[type="checkbox"] { width: auto; margin-right: 4px; }
.personal-panels button { padding: 2px 6px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
.personal-panels button:hover:not(:disabled) { border-color: var(--line); }
.personal-panels button.primary { color: var(--accent); border-color: var(--accent); }
.personal-panels button:disabled, .personal-panels select:disabled, .personal-panels input:disabled { opacity: .45; cursor: default; }
.personal-panels option:disabled { color: var(--muted); }
@media (max-width: 420px) {
  .personal-panels-tabs { gap: 10px; }
  .personal-panels-body { padding-inline: 8px; }
}
.personal-panels h4 { margin: 12px 0 2px; }

/* Main-pane assistant pages follow the apex-dot reference. Floating panels keep
   their compact legacy rules above. */
.personal-panels-embedded { min-height: 0; font-size: 12px; line-height: 1.65; }
.personal-panels-embedded .personal-panels-body { max-height: none; overflow: visible; padding: 0; }
.personal-panels-embedded .assistant-panel-page { max-width: 710px; margin: 0 auto; width: 100%; }
.assistant-panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
.personal-panels-embedded .assistant-panel-heading h2 { font-size: 15px; line-height: 1.5; margin: 0; font-weight: 600; }
.assistant-panel-tag { border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; color: var(--muted); font-size: 10px; white-space: nowrap; }
.assistant-panel-subtitle { font-size: 11px; color: var(--muted); margin: 0 0 24px; }
.personal-panels-embedded .assistant-memory-controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 19px; align-items: center; }
.personal-panels-embedded .assistant-memory-controls select { flex: 1; min-width: 140px; padding: 7px 9px; background: var(--surface, var(--bg)); }
.personal-panels-embedded button { padding: 5px 10px; font-size: 11px; }
.personal-panels-embedded .assistant-memory-controls button,
.personal-panels-embedded .personal-panels-inline button,
.personal-panels-embedded .assistant-memory-title button { border: 1px solid var(--line); background: var(--surface, var(--bg)); border-radius: 7px; }
.assistant-memory-scope-info { font-size: 11px; color: var(--muted); line-height: 1.7; margin: 0 0 12px; }
.personal-panels-embedded .assistant-memory-search { width: 100%; height: 34px; background: var(--surface, var(--bg)); padding: 7px 11px; font-size: 11px; margin: 0 0 13px; }
.personal-panels-embedded .assistant-memory-note { padding: 15px 0; gap: 0; border-bottom: 1px solid var(--line); }
.personal-panels-embedded .assistant-memory-title { gap: 8px; margin-bottom: 6px; font-size: 12px; font-weight: 600; }
.assistant-memory-title > span[aria-hidden] { color: var(--accent); }
.personal-panels-embedded .assistant-memory-title button { margin-left: auto; color: var(--accent); font-weight: 400; }
.assistant-memory-text { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 1.75; }
.assistant-memory-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 10px; }
.personal-panels-embedded .assistant-memory-record { margin-top: 10px; }
.personal-panels-embedded .assistant-memory-record summary { font-size: 10px; }
.personal-panels-embedded .assistant-memory-record .personal-panels-muted { font-size: 10px; line-height: 1.8; margin-top: 8px; }
.personal-panels-embedded .assistant-memory-note > .personal-panels-actions { margin-top: 6px; }
.personal-panels-embedded .assistant-memory-note > .personal-panels-actions button { padding: 0; font-size: 10px; color: var(--muted); }
.personal-panels-embedded .assistant-notebook-inspection { margin: 0 0 8px; }
.personal-panels-embedded .assistant-notebook-inspection summary { font-size: 10px; }
.personal-panels-embedded .assistant-notebook-inspection p { font-size: 10px; }
.assistant-panel-empty { color: var(--muted); font-size: 12px; padding: 24px 0; line-height: 1.8; }
.assistant-activity-timeline { padding: 4px 0 0 13px; }
.personal-panels-embedded .assistant-activity-item { position: relative; border: 0; border-left: 1px solid var(--line); padding: 0 0 25px 25px; gap: 4px; }
.assistant-activity-item::before { content: ''; position: absolute; left: -4px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.assistant-activity-item time { font-size: 10px; color: var(--muted); display: block; }
.personal-panels-embedded .assistant-activity-item > .personal-panels-rowmain { padding: 0; font-weight: 600; }
.personal-panels-embedded .assistant-activity-item .personal-panels-muted { font-size: 11px; }
.personal-panels-embedded .assistant-activity-item .personal-panels-actions { margin-top: 4px; }
.personal-panels-embedded .assistant-activity-item .personal-panels-actions button { border: 1px solid var(--line); }
.assistant-activity-receipt { padding: 10px 0; }
.assistant-activity-receipt > span { color: var(--muted); font-size: 10px; }
.personal-panels-embedded[data-panel='connections'] .personal-panels-body > h4 { font-size: 13px; color: var(--text); text-transform: none; letter-spacing: 0; margin: 25px 0 7px; padding-top: 18px; border-top: 1px solid var(--line); }
.personal-panels-embedded[data-panel='connections'] .personal-panels-body > h4:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.personal-panels-embedded[data-panel='connections'] .personal-panels-body > p { margin: 6px 0 12px; font-size: 11px; line-height: 1.8; }
.personal-panels-embedded .personal-panels-form input,
.personal-panels-embedded .personal-panels-inline input { padding: 7px 9px; }
.personal-panels-embedded .personal-panels-inline input { flex: 1; min-width: 130px; }

.personal-call { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; gap: 12px; padding: 14px; overflow: auto; background: var(--panel, var(--bg)); color: var(--text); font-size: 13px; }
.personal-call-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; min-width: 0; }
.personal-call-muted { color: var(--muted); font-size: 11.5px; }
.personal-call-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.personal-call-orb { width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 35%, var(--accent, #71e6b5), rgba(113, 230, 181, .25)); font-size: 14px; color: var(--text); box-shadow: 0 0 0 0 rgba(113, 230, 181, .45); }
.personal-call-orb.is-listening { animation: personal-call-pulse 1.4s ease-out infinite; }
.personal-call-orb.is-speaking { animation: personal-call-pulse .9s ease-in-out infinite alternate; }
.personal-call-orb.is-thinking { opacity: .7; background: radial-gradient(circle at 35% 35%, #7aa7ff, rgba(122, 167, 255, .25)); }
.personal-call-orb.is-paused { opacity: .5; }
@keyframes personal-call-pulse {
  from { transform: scale(1); box-shadow: 0 0 0 0 rgba(113, 230, 181, .45); }
  to { transform: scale(1.06); box-shadow: 0 0 0 18px rgba(113, 230, 181, 0); }
}
@media (prefers-reduced-motion: reduce) { .personal-call-orb { animation: none !important; } }

/* The action row sits under the bubble, outside its border, like a thread message. */
.apex-agent-all .assistant-chat-transcript > .apex-agent-message-row {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  max-width: 88%;
  align-self: flex-start;
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
}
.apex-agent-all .assistant-chat-transcript > .apex-agent-message-row.human {
  align-self: flex-end;
  align-items: flex-end;
}
.apex-agent-all .apex-agent-message-row > .assistant-chat-message {
  max-width: 100%;
  align-self: auto;
}
.apex-agent-message-row.human > .apex-agent-message-actions { justify-content: flex-end; }
.apex-agent-message-row.human .msg-action.quote svg { transform: scaleX(-1); }

.apex-agent-message-actions { flex: none; }
.apex-agent-message-actions .msg-action,
.apex-agent-message-actions .message-time { opacity: 1; }
.apex-agent-reactions { position: relative; display: flex; gap: 2px; align-items: center; }
.apex-agent-reaction-options {
  position: absolute;
  z-index: 5;
  left: 0;
  bottom: calc(100% + 4px);
  display: flex;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel, var(--background));
  box-shadow: 0 4px 16px color-mix(in srgb, black 18%, transparent);
}
.apex-agent-message-row.human .apex-agent-reaction-options { left: auto; right: 0; }
.apex-agent-message-actions [role="alert"] { color: var(--danger); font-size: 11px; padding: 0 6px; }
.apex-agent-reply-quote { border-left: 2px solid var(--accent); margin: 0 0 7px; padding: 5px 9px; background: color-mix(in srgb, var(--text) 8%, transparent); border-radius: 0 7px 7px 0; }
.apex-agent-quote-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: var(--muted); }
.apex-agent-quote-clear-all { font-size: 12px; }
.apex-agent-reply-quote button { border: 0; background: none; color: inherit; cursor: pointer; }
.apex-agent-quote-list { display: flex; flex-direction: column; max-height: 160px; overflow-y: auto; }
.apex-agent-quote-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-top: 1px solid transparent; }
.apex-agent-quote-row:first-child { border-top: 0; }
.apex-agent-quote-author { flex-shrink: 0; min-width: 44px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apex-agent-quote-row blockquote { flex: 1; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; margin: 0; max-height: 3em; overflow: hidden; white-space: normal; overflow-wrap: anywhere; font-size: .9em; }
.apex-agent-message-pinned > .apex-agent-message-bubble,
.apex-agent-message-pinned > .assistant-chat-message { box-shadow: inset 3px 0 0 var(--accent); }

@media (hover: hover) {
  .apex-agent-message-actions .msg-action,
  .apex-agent-message-actions .message-time { opacity: 0; }
  .apex-agent-message-row:hover > .apex-agent-message-actions .msg-action,
  .apex-agent-message-row:hover > .apex-agent-message-actions .message-time,
  .apex-agent-message-actions:focus-within .msg-action,
  .apex-agent-message-actions:focus-within .message-time,
  .apex-agent-message-actions.held .msg-action,
  .apex-agent-message-actions.held .message-time,
  .apex-agent-message-actions .msg-action.pin-action[aria-pressed="true"],
  .apex-agent-message-actions .apex-agent-reaction-selected { opacity: 1; }
}
@media (max-width: 700px) {
  .apex-agent-message-actions { flex-wrap: wrap; }
  .apex-agent-message-actions .msg-action { min-width: 36px; height: 36px; }
}
@media (max-width: 380px) {
  .apex-agent-all .assistant-chat-transcript > .apex-agent-message-row { max-width: 100%; }
}

/* The shared global attachment rule positions every button over the card's
   top-right corner. Keep retry in the content flow and reserve that corner
   only for the remove control so failed uploads remain actionable. */
.apex-agent-all-composer .attachment .attachment-retry {
  position: static;
  background: transparent;
  border-radius: 0;
  padding: 0 2px;
}

.apex-agent-all-composer .attachment .attachment-remove {
  position: absolute;
  top: 2px;
  right: 2px;
  z-index: 1;
  background: color-mix(in srgb, black 67%, transparent);
  border-radius: 4px;
}

.apex-agent-all-composer .attachment small[role="alert"] {
  padding: 0 28px 0 8px;
  position: relative;
  z-index: 0;
}

s>.assistant-work-drawer-trigger{display:none}.assistant-work-region.is-detail .assistant-work-projects{border:0;padding:0}.assistant-work-region.is-detail .assistant-projects{padding:0}.assistant-voice-slot{display:contents;min-width:0}.assistant-voice-slot>span:empty{display:none}.assistant-workspace-head:has(.voice-capsule){height:auto;min-height:70px;flex-wrap:wrap;padding-block:12px}.assistant-workspace .voice-callbar{border-left:0}.assistant-workspace :is(.assistant-chat-message,.apex-agent-task-card,.assistant-work-row,.assistant-work-empty,.assistant-project-outcome,.assistant-project-event,.assistant-notice,.apex-agent-reply-quote,.assistant-task-card){border-left:0!important}.assistant-workspace .assistant-project-event{padding-left:0}.assistant-workspace .apex-agent-task-card:before{display:none}.assistant-workspace :is(.assistant-chat-message,.apex-agent-task-card){border:0}.assistant-work-actions{position:relative}.assistant-work-actions>summary{cursor:pointer;list-style:none}.assistant-work-actions[open]{background:var(--panel-2);border-radius:8px;padding:5px}.assistant-work-actions button{display:block;margin-top:4px}.assistant-work-deleted>summary{cursor:pointer}.assistant-work-section .assistant-work-row{border:0;background:var(--panel)}

.assistant-workspace-subview[hidden]{display:none}.assistant-workspace .assistant-thread-composer[hidden]{display:none}

.assistant-archived-list{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}.assistant-archived-list>summary{cursor:pointer}.assistant-archived-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}.assistant-archived-row small{display:block;color:var(--muted)}

/* Pending approvals, errors and activity use the same fill-only card treatment. */
.assistant-workspace :is(.assistant-task-waits,.apex-agent-needs-you,.apex-agent-check-failed,.apex-agent-helper,.assistant-activity-item),.assistant-workspace .apex-agent-task-history ol{border-left:0!important}

/* The session strip keeps one height in every state; the chat scrolls behind it. */
.assistant-workspace{container-type:inline-size}
.assistant-workspace .assistant-workspace-head{height:60px;min-height:60px;padding:0 18px;gap:10px;flex-wrap:nowrap}
.assistant-workspace .assistant-session{padding:3px 10px 3px 4px;max-width:min(70%,480px)}
/* A problem banner is an alert, not a layout change. It floats under the strip
   and the scroller keeps its own 78px plus the banner's reserved height, so the
   first message is never hidden behind either. It used to sit in the flow, which
   pushed the scroller ~40px down and clipped messages at that line — the solid
   band that read as a header bar. The old `.assistant-workspace-problem~
   .assistant-workspace-head{position:relative}` rule could never match at all,
   because the strip precedes the banner in the DOM. */
.assistant-workspace{--assistant-problem-h:44px}
.assistant-workspace-problem{position:absolute;left:0;right:0;top:60px;z-index:5;max-height:var(--assistant-problem-h);overflow:auto;margin:0;pointer-events:none}
.assistant-workspace:has(>.assistant-workspace-problem) :is(.apex-agent-tabpanel,.assistant-workspace-subview){padding-top:calc(78px + var(--assistant-problem-h))}
/* The chat has a second alert surface of its own — `.apex-agent-error`, which
   ApexAgentAll renders in the flow directly above the scroller. In dev that one
   is usually up as well, and an in-flow error bar pushes the transcript down by
   its own height, producing the same band. It floats under the strip too, sits
   below the workspace banner when both are up, and the transcript reserves room
   for one or two alerts so the first message is never hidden. */
.assistant-workspace .assistant-conversation>.apex-agent-error{position:absolute;left:0;right:0;top:60px;z-index:5;max-height:var(--assistant-problem-h);overflow:auto}
.assistant-workspace:has(>.assistant-workspace-problem) .assistant-conversation>.apex-agent-error{top:calc(60px + var(--assistant-problem-h))}
.assistant-workspace:has(.assistant-conversation>.apex-agent-error) :is(.apex-agent-tabpanel,.assistant-workspace-subview){padding-top:calc(78px + var(--assistant-problem-h))}
.assistant-workspace:has(>.assistant-workspace-problem):has(.assistant-conversation>.apex-agent-error) :is(.apex-agent-tabpanel,.assistant-workspace-subview){padding-top:calc(78px + var(--assistant-problem-h) * 2)}
/* Handoff 6.1: the strip floats and paints nothing, so the chat scrolls up
   behind it. The padding lives on the scroller, which means it scrolls away with
   the content: at rest the first message clears the strip, and older messages
   pass underneath it. Taking it off to yank the transcript up hides the first
   message behind the capsule. */
.assistant-workspace .apex-agent-tabpanel{padding-top:78px}
/* One scroll box, and it is the panel. assistant-tasks.css gives the transcript
   inside it `flex:1;overflow:auto`, which made a second scroll box that started
   78px down and clipped messages at its own top edge: an empty band under the
   strip, and pinning that never worked because every scroll read in
   ApexAgentAll (onScroll, saved positions, isPinnedToBottom) is on the panel. */
.assistant-workspace .assistant-chat-transcript{overflow:visible;flex:none;min-height:0}
/* The composer floats too: the chat scrolls right up to and behind the message box, not to a ruled-off strip above it. */
.assistant-workspace .assistant-conversation>.assistant-thread-composer{position:absolute;left:0;right:0;bottom:0;z-index:2;border-top:0;background:linear-gradient(to bottom,transparent,var(--bg) 10px)}
.assistant-workspace .assistant-conversation:has(>.assistant-thread-composer:not([hidden])) .apex-agent-tabpanel{padding-bottom:calc(var(--assistant-browser-bottom,112px) + 12px)}
.assistant-workspace .assistant-workspace-subview{padding-top:78px}
@container (max-width:580px){
 .assistant-workspace .assistant-workspace-head{padding:0 14px;gap:8px}
 .assistant-workspace .assistant-session{max-width:calc(100% - 92px)}
 .assistant-workspace .assistant-session-name{max-width:96px}
}

.assistant-workspace .assistant-session:has(.voice-capsule){max-width:min(86%,560px)}

/* Dot-style plain task messages, actions, details and typing indicator */
.assistant-workspace .dot-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.assistant-workspace .dot-details {
  border: 0;
  margin-top: 8px;
}
.assistant-workspace .dot-details summary {
  list-style: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 12px;
}
.assistant-workspace .dot-details summary::-webkit-details-marker {
  display: none;
}
.assistant-workspace .dot-details summary::before {
  content: '▸ ';
}
.assistant-workspace .dot-details[open] summary::before {
  content: '▾ ';
}
.assistant-workspace .dot-details dl {
  margin-top: 8px;
}
.assistant-workspace .dot-draft {
  background: var(--panel, var(--raised));
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
}
.assistant-workspace .dot-draft strong {
  font-size: 13px;
  font-weight: 600;
}
.assistant-workspace .dot-link {
  color: var(--accent);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
}
.assistant-workspace .dot-link:hover {
  text-decoration: underline;
}
.assistant-workspace .dot-note {
  display: block;
  margin-top: 8px;
  font-size: 12px;
}
.assistant-workspace .dot-typing {
  display: flex;
  gap: 4px;
  padding: 6px 0;
}
.assistant-workspace .dot-typing i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
  animation: dotblink 1.2s infinite;
}
.assistant-workspace .dot-typing i:nth-child(2) {
  animation-delay: .2s;
}
.assistant-workspace .dot-typing i:nth-child(3) {
  animation-delay: .4s;
}
@keyframes dotblink {
  0%, 80%, 100% { opacity: .25; }
  40% { opacity: 1; }
}
@keyframes msg-highlight {
  0% { background: color-mix(in srgb, var(--accent) 25%, transparent); }
  100% { background: transparent; }
}
.assistant-workspace .is-highlighted {
  animation: msg-highlight 1.5s ease-out;
  border-radius: 8px;
}

.assistant-workspace-context { flex: none; padding: 5px 16px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--line); }


/* The name and float recovery are independent buttons in one quiet team row. */
.assistant-team-group{display:flex;align-items:center;width:100%;height:42px;padding-right:6px;border-radius:6px;box-sizing:border-box}.assistant-team-group:is(.selected,:hover,:focus-within){background:var(--panel-2)}.assistant-team-group .assistant-team-row{flex:1;min-width:0;width:auto;height:40px;min-height:40px;background:transparent!important;border-color:transparent!important}.assistant-team-group .assistant-team-row:hover,.assistant-team-group .assistant-team-row[aria-current=page]{background:transparent!important;border-color:transparent!important}.assistant-team-popout{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;min-height:28px;padding:6px;border:0;background:transparent;color:var(--muted);border-radius:6px}.assistant-team-popout svg{height:15px;width:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.assistant-team-popout:hover{color:var(--text);background:var(--hover)}

.assistant-team-group .assistant-team-row{padding:6px 10px}.assistant-team-group .assistant-team-row>span:not(.identicon){line-height:14px}.assistant-team-group .assistant-team-row .assistant-team-subtitle{font-size:10px;line-height:12px;margin-top:2px}

.assistant-runtime-provider { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.assistant-runtime-provider label { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.assistant-runtime-provider select { flex: 1; min-width: 0; max-width: 210px; border: 1px solid var(--line); border-radius: 6px; padding: 5px; background: var(--bg); color: var(--text); font: inherit; }
.assistant-runtime-provider > p { flex-basis: 100%; margin: 0; font-size: 11px; }
.assistant-runtime-meters { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; font-size: 10px; color: var(--muted); }
.assistant-runtime-confirm { width: 100%; padding: 10px; border-radius: 8px; background: var(--panel-2, var(--bg)); }
.assistant-runtime-confirm p { margin: 0 0 8px; }
.assistant-runtime-confirm ul { padding-left: 16px; overflow-wrap: anywhere; }
.assistant-runtime-confirm button + button { margin-left: 6px; }
.assistant-runtime-resets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.assistant-runtime-resets p { flex-basis: 100%; margin: 0; }
.assistant-runtime-resets button:disabled { opacity: .5; }

/* The same runtime controls, drawn in the Details sidebar instead of a popover. */
.bot-settings.is-inline{position:static;width:100%;max-width:none;max-height:none;overflow:visible;border:0;border-radius:0;background:none;box-shadow:none;padding:0}
.bot-settings.is-inline .bot-settings-head{padding:0 0 6px}

/* Review inside the Details tab. It has to read at 260px as well as 400px, so
   paths and check commands truncate rather than wrap into a wall of text. */

.assistant-review{display:flex;flex-direction:column;gap:10px;padding:2px 6px 12px;min-width:0}
.assistant-review-title{margin:0;font:500 15px/1.35 var(--font-sans);color:var(--color-text-primary);overflow-wrap:anywhere}
.assistant-review-meta{margin:0;font:400 12px/1.4 var(--font-sans);color:var(--color-text-secondary);overflow-wrap:anywhere}
.assistant-review-summary{margin:0;font:400 13px/1.5 var(--font-sans);color:var(--color-text-primary);white-space:pre-wrap;overflow-wrap:anywhere;max-height:9em;overflow-y:auto}
.assistant-review-block{display:flex;flex-direction:column;gap:6px;min-width:0}
.assistant-review-block-title{margin:0;font:500 12px/1.3 var(--font-sans);color:var(--color-text-secondary);text-transform:none}
.assistant-review-files,.assistant-review-checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.assistant-review-file{display:flex;align-items:baseline;gap:8px;min-width:0;padding:3px 0;border-bottom:1px solid var(--color-border-subtle, var(--line))}
.assistant-review-file:last-child{border-bottom:0}
.assistant-review-path{flex:1 1 auto;min-width:0;font:400 12.5px/1.4 var(--font-mono);color:var(--color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.assistant-review-counts{flex:0 0 auto;font:400 11.5px/1.4 var(--font-mono);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.assistant-review-counts b{color:var(--color-success, var(--green));font-weight:500}
.assistant-review-check{display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:wrap}
.assistant-review-check-mark{flex:0 0 auto;font-size:12px;color:var(--color-success, var(--green))}
.assistant-review-check[data-passed="false"] .assistant-review-check-mark{color:var(--color-danger, var(--red))}
.assistant-review-check-name{flex:1 1 auto;min-width:0;font:400 12px/1.4 var(--font-mono);color:var(--color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assistant-review-check-detail{flex:1 0 100%;font:400 11.5px/1.4 var(--font-sans);color:var(--color-danger, var(--red));overflow-wrap:anywhere}
.assistant-review-note{display:flex;flex-direction:column;gap:4px;font:400 12px/1.3 var(--font-sans);color:var(--color-text-secondary)}
.assistant-review-note textarea{min-height:56px;resize:vertical}
.assistant-review-problem{margin:0;font:400 12px/1.4 var(--font-sans);color:var(--color-danger, var(--red));overflow-wrap:anywhere}
.assistant-review-actions{display:flex;flex-wrap:wrap;gap:8px}
.assistant-review-actions button{flex:1 1 auto;min-height:30px}

/* The assistant's Details tab. It fills the app's one side panel, so it has no
   width, border or shadow of its own: the panel already provides those. */

.assistant-details{display:flex;flex-direction:column;height:100%;min-height:0;color:var(--text)}

.assistant-details-head{display:flex;align-items:flex-start;gap:12px;padding:16px 14px 12px;border-bottom:1px solid var(--line)}
.assistant-details-head .identicon{width:64px;height:64px;flex:none;border-radius:14px}
.assistant-details-id{flex:1;min-width:0;padding-top:2px}
.assistant-details-name{margin:0;font-size:16px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assistant-details-role{margin:2px 0 0;font-size:12px;color:var(--muted)}
.assistant-details-close{flex:none;width:28px;height:28px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:none;color:var(--muted);font-size:17px;line-height:1}
.assistant-details-close:hover{background:var(--hover);color:var(--text)}
.assistant-details-close:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.assistant-details-body{flex:1;min-height:0;overflow:auto;padding:10px 10px 16px}

.assistant-details-card{margin:0 0 8px;padding:10px 10px 12px;border:1px solid var(--line);border-radius:12px}
.assistant-details-card-title{margin:0 0 4px;font-size:12px;font-weight:600}
.assistant-details-note{margin:0;font-size:11.5px;line-height:1.45;color:var(--muted)}
.assistant-details-action{margin-top:8px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--text);font-size:12px}
.assistant-details-action:hover{background:var(--hover)}
.assistant-details-action:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.assistant-details-fold{border-top:1px solid var(--line)}
.assistant-details-fold:first-of-type{border-top:0}
.assistant-details-fold-head{display:flex;align-items:center;gap:8px;width:100%;padding:9px 6px;border:0;border-radius:8px;background:none;color:inherit;text-align:left}
.assistant-details-fold-head:hover{background:var(--hover)}
.assistant-details-fold-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.assistant-details-fold-name{font-size:12px;font-weight:600}
.assistant-details-fold-count{margin-left:auto;font-size:11px;color:var(--muted)}
.assistant-details-fold-arrow{width:10px;font-size:10px;color:var(--muted);text-align:center}
.assistant-details-fold-body{padding:0 6px 10px}

.assistant-activity-row{display:flex;align-items:flex-start;gap:8px;width:100%;padding:6px;border:0;border-radius:8px;background:none;color:inherit;text-align:left}
.assistant-activity-row:hover{background:var(--hover)}
.assistant-activity-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.assistant-activity-mark{flex:none;width:14px;text-align:center;font-size:11px;line-height:1.5;color:var(--muted)}
.assistant-activity-row.is-waiting .assistant-activity-mark{color:var(--accent)}
.assistant-activity-text{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.assistant-activity-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assistant-activity-line{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.assistant-activity-detail{display:flex;flex-direction:column;gap:6px;padding:2px 6px 10px}
.assistant-details-back{align-self:flex-start;padding:2px 6px 2px 0;border:0;border-radius:6px;background:none;color:var(--muted);font-size:12px}
.assistant-details-back:hover{color:var(--text)}
.assistant-details-back:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.assistant-activity-title{margin:0;font-size:13px;font-weight:600;line-height:1.35}
.assistant-activity-result{margin:0;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}

.assistant-output{display:flex;flex-direction:column}
.assistant-output-row{display:flex;align-items:flex-start;gap:8px;width:100%;padding:6px;border:0;border-radius:8px;background:none;text-align:left;color:inherit}
.assistant-output-row:hover{background:var(--hover)}
.assistant-output-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.assistant-output-mark{flex:none;width:18px;text-align:center;font-family:var(--font-mono,monospace);font-size:12px;line-height:1.5;color:var(--muted)}
.assistant-output-mark.is-data{color:var(--accent)}
.assistant-output-text{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.assistant-output-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assistant-output-where{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assistant-output-source{margin:4px 0 8px 26px;padding:8px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg-2,rgba(0,0,0,.03));font-family:var(--font-mono,monospace);font-size:11px;line-height:1.45;white-space:pre-wrap;word-break:break-word}

.assistant-details-footnote{margin:8px 0 0;font-size:10.5px;line-height:1.45;color:var(--muted)}

.assistant-details-links{display:flex;flex-wrap:wrap;gap:2px 10px;padding:8px 12px;border-top:1px solid var(--line)}
.assistant-details-links button{padding:2px 0;border:0;background:none;color:var(--muted);font-size:11.5px}
.assistant-details-links button:hover{color:var(--text)}
.assistant-details-links button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* The 64px portrait and the pencil that opens the avatar editor over it. */
.assistant-details-portrait{position:relative;flex:none;display:grid}
.assistant-details-pencil{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--muted);line-height:1}
.assistant-details-pencil:hover{background:var(--hover);color:var(--text)}
.assistant-details-pencil:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.assistant-details-avatar-editor{margin:0;padding:10px 12px 12px;border-bottom:1px solid var(--line);background:var(--panel);max-height:46vh;overflow:auto}
.assistant-details-role[data-state="needs_you"],.assistant-details-role[data-state="failed"]{color:var(--accent)}
.assistant-details-role[data-state="offline"],.assistant-details-role[data-state="paused"]{color:var(--muted)}

/**
 *  Default styles for xterm.js
 */

.xterm {
    cursor: text;
    position: relative;
    user-select: none;
    -ms-user-select: none;
    -webkit-user-select: none;
}

.xterm.focus,
.xterm:focus {
    outline: none;
}

.xterm .xterm-helpers {
    position: absolute;
    top: 0;
    /**
     * The z-index of the helpers must be higher than the canvases in order for
     * IMEs to appear on top.
     */
    z-index: 5;
}

.xterm .xterm-helper-textarea {
    padding: 0;
    border: 0;
    margin: 0;
    /* Move textarea out of the screen to the far left, so that the cursor is not visible */
    position: absolute;
    opacity: 0;
    left: -9999em;
    top: 0;
    width: 0;
    height: 0;
    z-index: -5;
    /** Prevent wrapping so the IME appears against the textarea at the correct position */
    white-space: nowrap;
    overflow: hidden;
    resize: none;
}

.xterm .composition-view {
    /* TODO: Composition position got messed up somewhere */
    background: #000;
    color: #FFF;
    display: none;
    position: absolute;
    white-space: nowrap;
    z-index: 1;
}

.xterm .composition-view.active {
    display: block;
}

.xterm .xterm-viewport {
    /* On OS X this is required in order for the scroll bar to appear fully opaque */
    background-color: #000;
    overflow-y: scroll;
    cursor: default;
    position: absolute;
    right: 0;
    left: 0;
    top: 0;
    bottom: 0;
}

.xterm .xterm-screen {
    position: relative;
}

.xterm .xterm-screen canvas {
    position: absolute;
    left: 0;
    top: 0;
}

.xterm-char-measure-element {
    display: inline-block;
    visibility: hidden;
    position: absolute;
    top: 0;
    left: -9999em;
    line-height: normal;
}

.xterm.enable-mouse-events {
    /* When mouse events are enabled (eg. tmux), revert to the standard pointer cursor */
    cursor: default;
}

.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
    cursor: pointer;
}

.xterm.column-select.focus {
    /* Column selection mode */
    cursor: crosshair;
}

.xterm .xterm-accessibility:not(.debug),
.xterm .xterm-message {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 10;
    color: transparent;
    pointer-events: none;
}

.xterm .xterm-accessibility-tree:not(.debug) *::selection {
  color: transparent;
}

.xterm .xterm-accessibility-tree {
  font-family: monospace;
  user-select: text;
  white-space: pre;
}

.xterm .xterm-accessibility-tree > div {
  transform-origin: left;
  width: fit-content;
}

.xterm .live-region {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.xterm-dim {
    /* Dim should not apply to background, so the opacity of the foreground color is applied
     * explicitly in the generated class and reset to 1 here */
    opacity: 1 !important;
}

.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }
.xterm-underline-5 { text-decoration: dashed underline; }

.xterm-overline {
    text-decoration: overline;
}

.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }
.xterm-overline.xterm-underline-2 { text-decoration: overline double underline; }
.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }
.xterm-overline.xterm-underline-4 { text-decoration: overline dotted underline; }
.xterm-overline.xterm-underline-5 { text-decoration: overline dashed underline; }

.xterm-strikethrough {
    text-decoration: line-through;
}

.xterm-screen .xterm-decoration-container .xterm-decoration {
	z-index: 6;
	position: absolute;
}

.xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer {
	z-index: 7;
}

.xterm-decoration-overview-ruler {
    z-index: 8;

    right: 0;

}

/* Derived from vs/base/browser/ui/scrollbar/media/scrollbar.css */

/* xterm.js customization: Override xterm's cursor style */
.xterm .xterm-scrollable-element > .scrollbar {
    cursor: default;
}

/* Arrows */
.xterm .xterm-scrollable-element > .scrollbar > .scra {
	cursor: pointer;
	font-size: 11px !important;
}

.xterm .xterm-scrollable-element > .visible {
	opacity: 1;

	/* Background rule added for IE9 - to allow clicks on dom node */
	background:rgba(0,0,0,0);

	transition: opacity 100ms linear;
	/* In front of peek view */
	z-index: 11;
}
.xterm .xterm-scrollable-element > .invisible {
	opacity: 0;
	pointer-events: none;
}
.xterm .xterm-scrollable-element > .invisible.fade {
	transition: opacity 800ms linear;
}

/* Scrollable Content Inset Shadow */
.xterm .xterm-scrollable-element > .shadow {
	position: absolute;
	display: none;
}
.xterm .xterm-scrollable-element > .shadow.top {
	display: block;
	top: 0;
	left: 3px;
	height: 3px;
	width: 100%;
	box-shadow: var(--vscode-scrollbar-shadow, #000) 0 6px 6px -6px inset;
}
.xterm .xterm-scrollable-element > .shadow.left {
	display: block;
	top: 3px;
	left: 0;
	height: 100%;
	width: 3px;
	box-shadow: var(--vscode-scrollbar-shadow, #000) 6px 0 6px -6px inset;
}
.xterm .xterm-scrollable-element > .shadow.top-left-corner {
	display: block;
	top: 0;
	left: 0;
	height: 3px;
	width: 3px;
}
.xterm .xterm-scrollable-element > .shadow.top.left {
	box-shadow: var(--vscode-scrollbar-shadow, #000) 6px 0 6px -6px inset;
}

/* src/right-panel.css */
.right-panel { position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0; }
/* The strip clips rather than spills; RightPanel picks a stage so nothing ever needs clipping. */
.right-panel-tabs { display: flex; align-items: center; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid var(--line, rgba(127,127,127,.2)); min-width: 0; overflow: hidden; }
.right-panel-tab { display: flex; align-items: center; flex: 0 0 auto; min-width: 0; border-radius: 0; box-shadow: inset 0 -2px 0 transparent; }
.right-panel-tab[hidden] { display: none; }
.right-panel-tab > button[role="tab"] { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 8px; color: var(--muted, inherit); }
.right-panel-tab > button[role="tab"] svg { flex: none; }
.right-panel-tab-label { white-space: nowrap; }
/* The open tab is underlined, not filled: the line sits on the strip's own border. */
.right-panel-tab.active { background: transparent; box-shadow: inset 0 -2px 0 var(--text); }
.right-panel-tab.dragging { opacity: .55; }
.right-panel-tab.active > button[role="tab"] { color: var(--text, inherit); }
.right-panel-tab.has-attention { position: relative; }
/* The strip clips, so the flag sits inside the tab, just above the 2px active underline.
   It keeps that spot when the tab is behind another, so switching tabs doesn't move it. */
.right-panel-tab.has-attention::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--warn, #e0a030); pointer-events: none; }
/* Stages: a name shows in full or its tab becomes an icon, never "…". */
.right-panel[data-fit="mid"] .right-panel-tab:not(.active) .right-panel-tab-label,
.right-panel[data-fit="icons"] .right-panel-tab .right-panel-tab-label { display: none; }
.right-panel[data-fit="mid"] .right-panel-tab:not(.active) > button[role="tab"],
.right-panel[data-fit="icons"] .right-panel-tab > button[role="tab"] { gap: 0; padding: 4px 7px; }
/* The ruler sits outside the tabs so the stage rules above never hide it; a hidden ruler measures 0. */
.right-panel-meter { position: absolute; left: -9999px; top: 0; visibility: hidden; pointer-events: none; }
/* The open tool's name, shown only when every tab is an icon. */

.right-panel[data-fit="icons"] .right-panel-name { display: block; }

/* RightPanel clamps left so the bubble stays inside the panel; long names wrap. */
.right-panel-tip { position: absolute; top: 34px; z-index: 5; box-sizing: border-box; max-width: calc(100% - 12px); padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--text); font-size: 11px; overflow-wrap: anywhere; pointer-events: none; }

.right-files-image { display: block; max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; }
.right-files-markdown { overflow: auto; padding: 4px 8px; }

.right-worktrees { padding: 8px; }

.right-worktrees-list { list-style: none; padding: 0; margin: 0; }
.right-worktrees-row { border-bottom: 1px solid var(--line, rgba(127,127,127,.12)); padding: 8px 0; min-width: 0; }

.right-worktrees-menu { position: relative; }

.right-worktrees-menu summary::-webkit-details-marker { display: none; }
.right-worktrees-menu summary:hover { background: var(--hover); }
.right-worktrees-menu-items { position: absolute; right: 0; top: 100%; z-index: 55; min-width: 110px; padding: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

/* Full screen */
/* The side panel fills the work area. The canvas stays mounted underneath, so terminals and threads keep running. */
.body.right-panel-expanded > .canvas { display: none; }
.body.right-panel-expanded > .thread-details.full { flex: 1 1 0; width: auto; max-width: none; min-width: 0; border-left: 0; }
/* Text-heavy tabs cap their line length; Files and Browser keep the full width. */
.right-panel-expanded .right-panel-body > *:not(.right-files-shell):not(.right-browser):not(.right-artifacts-slot) { max-width: 960px; margin-inline: auto; }
.right-files-held { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px; border-bottom: 1px solid var(--line, rgba(127,127,127,.25)); background: color-mix(in srgb, var(--accent, #6b8cff) 12%, transparent); }
.right-files-held span { flex: 1; min-width: 0; }

/* Phone */
.right-phone { display: flex; flex-direction: column; gap: 6px; height: 100%; min-height: 0; padding: 8px; }
.right-phone h3 { margin: 0; font-size: 15px; }
.right-phone-actions { display: flex; flex-wrap: wrap; gap: 4px; }
.right-phone-picture { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.right-phone-screen { display: block; height: auto; max-width: 100%; max-height: 100%; border-radius: 12px; cursor: pointer; user-select: none; touch-action: none; }
.right-phone-screen:focus-visible { outline: 2px solid var(--accent, #71e6b5); outline-offset: 2px; }
.right-phone-state { margin: 0; color: var(--muted); font-size: 12px; }
.right-phone-alert { margin: 0; color: #ef6b6b; }

/* A tab's right-click menu: Open in new window. */
.right-panel-context-backdrop { position: fixed; inset: 0; z-index: 80; }
.right-panel-context { position: fixed; z-index: 81; min-width: 170px; padding: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.right-panel-context button { display: block; width: 100%; text-align: left; padding: 6px 10px; border-radius: 4px; }
.right-panel-context button:hover { background: var(--hover); }

.right-worktrees-copy-state { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; }
.right-worktrees-copy-state p { flex-basis:100%; margin:0; overflow-wrap:anywhere; color:var(--muted); font-size:12px; }
.right-worktrees-label.needs-you { color:var(--warn); border:1px solid currentColor; border-radius:4px; padding:1px 5px; }

.right-worktrees-row.is-bot-copy .right-worktrees-heading > strong { white-space:normal; overflow-wrap:anywhere; line-height:1.5; }

/* Right terminal */
.right-terminal { display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden; }
.right-terminal .terminal { flex: 1; min-height: 0; }

/* Approved Phone controls: one quiet toolbar, settings in a contained disclosure. */
.phone-designed { padding: 0; gap: 0; position: relative; container-type: inline-size; }
.phone-designed button { font: inherit; }
.phone-designed svg { width: 16px; height: 16px; display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.phone-designed :is(button,input,select):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.phone-sr { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.phone-device-head { padding: 10px 10px 8px; display: flex; align-items: center; gap: 6px; flex: none; }
.phone-device-trigger { min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left; padding: 5px 6px; border: 0; background: none; border-radius: 6px; flex: 1; }
.phone-device-trigger > svg:first-child { width: 18px; height: 25px; }
.phone-device-trigger > span { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.phone-device-trigger strong { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phone-device-trigger small { color: var(--muted); font-size: 10px; }
.phone-device-trigger > svg:last-child { width: 12px; height: 12px; color: var(--muted); }
.phone-connected { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-right: 6px; flex: none; }
.phone-toolbar { display: flex; align-items: center; gap: 3px; padding: 0 10px 10px; flex: none; }
.phone-designed .phone-tool { display: flex; align-items: center; justify-content: center; height: 30px; min-width: 30px; border: 0; border-radius: 6px; padding: 6px; background: none; color: var(--muted); }

.phone-designed .phone-fold { gap: 5px; color: var(--text); padding-inline: 7px; font-size: 11px; background: var(--panel-2); border: 1px solid var(--line); }
.phone-divider { height: 15px; width: 1px; background: var(--line); margin-inline: 2px; flex: none; }
.phone-push { flex: 1; min-width: 0; }
.phone-controls-trigger span { display: none; }
.phone-stage { position: relative; flex: 1; min-height: 80px; display: grid; place-items: center; margin: 0 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.phone-stage .right-phone-picture { width: 100%; height: 100%; box-sizing: border-box; padding: 10px; }
.phone-stage .right-phone-screen { box-shadow: 0 5px 18px #0003; }
.phone-changing { position: absolute; inset: 0; z-index: 3; display: grid; place-content: center; background: var(--bg); color: var(--muted); font-size: 11px; }
.phone-recording { position: absolute; z-index: 2; top: 8px; left: 8px; color: var(--danger, #e57e77); font-size: 10px !important; padding: 4px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
.phone-geometry { color: var(--muted); font-size: 10px; text-align: center; padding: 7px 10px; flex: none; }
.phone-driver { border-top: 1px solid var(--line); padding: 8px 12px; display: flex; align-items: center; gap: 7px; flex: none; }
.phone-driver .right-phone-state { font-size: 11px; flex: 1; }
.phone-driver button { flex: none; border: 0; border-radius: 4px; background: none; color: var(--muted); font-size: 10px; padding: 4px 6px; }
.phone-help { color: var(--muted); font-size: 10px; padding: 0 12px 8px; }
.phone-help summary { cursor: pointer; }
.phone-help p { margin: 6px 0 0; }
.phone-popover { position: absolute; z-index: 8; padding: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 12px 35px #0005; max-height: calc(100% - 130px); overflow: auto; overscroll-behavior: contain; box-sizing: border-box; }
.phone-popover[hidden] { display: none; }
.phone-controls-menu { top: 96px; right: 10px; width: min(302px, calc(100% - 20px)); }
.phone-device-menu { top: 58px; left: 10px; right: 10px; }
.phone-popover h4 { margin: 7px 7px; font-size: 11px; font-weight: 600; }
.phone-popover > p { font-size: 11px; padding-inline: 7px; }
.phone-popover hr { border: 0; border-top: 1px solid var(--line); margin: 7px 1px; }
.phone-setting { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px; font-size: 11px; min-height: 36px; box-sizing: border-box; }

.phone-segmented { display: flex; background: var(--panel); border-radius: 5px; padding: 2px; gap: 1px; }
