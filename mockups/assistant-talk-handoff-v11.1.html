.titlebar button.icon:is(.active, [aria-expanded="true"]) { background: var(--panel-2); border-color: transparent; color: var(--text); }
.settings { position: absolute; inset: 0; z-index: 40; display: flex; background: var(--bg); }
.settings-nav { width: 232px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 12px; background: var(--panel); border-right: 1px solid var(--line); }
.settings-nav-head { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
.settings-nav-head h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
.settings-nav nav { display: flex; flex-direction: column; gap: 2px; }
.settings-nav nav button { text-align: left; background: transparent; border-color: transparent; color: var(--muted); padding: 7px 10px; }
.settings-nav nav button:hover:not(:disabled) { color: var(--text); border-color: transparent; }
.settings-nav nav button.active { background: var(--panel-2); border-color: var(--line); color: var(--text); }
.settings-nav-foot { margin-top: auto; padding: 0 10px; display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--muted); }
.settings-main { flex: 1; min-width: 0; overflow-y: auto; padding: 36px 48px; }
.settings-column { max-width: 680px; display: flex; flex-direction: column; gap: 20px; }
.settings-head .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); }
.settings-head h2 { margin: 4px 0 0; font-size: 24px; font-weight: 650; letter-spacing: -0.04em; }
.settings-head p { margin: 6px 0 0; color: var(--muted); }
.settings-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.settings-row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); }
.settings-row:first-child { border-top: 0; }
.settings-row.compact { padding: 9px 16px; justify-content: space-between; }
.settings-label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.settings-label strong { font-weight: 600; overflow-wrap: anywhere; }
.settings-label small { color: var(--muted); font-size: 12px; line-height: 1.5; }
.settings-label .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; overflow-wrap: anywhere; }
.settings-row select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; color: var(--text); }
.settings-row select:disabled { opacity: 0.45; }
.settings-row .stepper output { min-width: 48px; display: grid; place-items: center; padding: 0 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
.provider-grid { padding: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; }
.provider-grid label { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.provider-grid label:hover { background: var(--panel-2); }
.provider-grid input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); flex-shrink: 0; }
.provider-grid strong, .provider-grid small { display: block; }
.provider-grid strong { font-weight: 600; }
.provider-grid small { color: var(--muted); font-size: 12px; }
.settings-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.settings-actions span { margin-left: auto; font-size: 12px; color: var(--muted); }
.settings-subhead { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.settings-subhead h3 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
.settings-subhead p, .settings-note { margin: 0; font-size: 12px; color: var(--muted); }
.phones-status-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; font-size: 13px; }
.phones-status-text small { font-size: 12px; color: var(--muted); }
.settings-actions .phones-status-text span { margin-left: 0; font-size: 13px; color: var(--text); }
.phones-advanced { margin-top: 12px; }
.phones-advanced > summary { padding: 10px 16px; cursor: pointer; font-size: 13px; color: var(--muted); }
.phones-advanced[open] > summary { border-bottom: 1px solid var(--line); }
.phones-advanced > .settings-row:first-of-type { border-top: 0; }
.remote-addresses { align-items: flex-end; }
.remote-addresses input { margin-top: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.confirm.pair-sheet { width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow-y: auto; gap: 12px; }
.pair-qr { align-self: center; flex: none; width: 260px; height: 260px; display: grid; place-items: center; border-radius: 10px; background: #fff; overflow: hidden; }
.pair-qr svg { width: 100%; height: 100%; display: block; }
.pair-qr .muted { color: #59636e; font-size: 12px; padding: 12px; text-align: center; }
.pair-under-qr { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.pair-under-qr p { margin: 0; font-size: 12px; }
.pair-timer { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pair-note { margin: 0; font-size: 12px; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 10px; }
.pair-note.warn { border-left-color: var(--warn); color: var(--text); }
.pair-note.bad { border-left-color: var(--danger); color: var(--text); }
.pair-claim { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0 4px; text-align: center; }
.pair-claim p { margin: 0; font-size: 12px; }
.pair-claim-phone { font-size: 14px; }
.pair-claim-code { font-size: 34px; font-weight: 650; letter-spacing: 0.18em; font-variant-numeric: tabular-nums; }
.pair-done { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; color: var(--accent); font-size: 22px; font-weight: 700; }
.pair-scope-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; }
.confirm-actions.pair-actions { justify-content: space-between; align-items: center; }
.pair-actions-right { display: flex; gap: 8px; }
.pair-scope { margin: 4px 0 0; padding: 10px 0 0; border: 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pair-scope:disabled { opacity: 0.55; }
.pair-scope > label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
.pair-scope select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--text); }
.pair-scope small { font-size: 12px; line-height: 1.5; }
.pair-thread-choice { display: flex; gap: 16px; font-size: 13px; }
.pair-thread-choice label, .pair-thread-list label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.pair-thread-choice input, .pair-thread-list input { margin: 0; accent-color: var(--accent); }
.pair-thread-list { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.pair-thread-list span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.key-state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
.key-state .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.key-state.found { color: var(--brand-cyan); }
.key-state.missing { color: var(--warn); }
.terminal-sample { background: #0b1016; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; line-height: 1.45; color: #d5dde6; }
.terminal-sample .muted { color: var(--muted); }
.terminal-sample .prompt { color: var(--accent); }
@media (max-width: 720px) {
  .settings-nav { width: 168px; }
  .settings-main { padding: 24px 20px; }
  .provider-grid { grid-template-columns: minmax(0, 1fr); }
}
.bot-settings-head { display: flex; align-items: center; gap: 10px; }
.bot-settings-head .details-bot-copy { flex: 1; min-width: 0; }
.bot-settings .bot-meters { display: flex; flex-direction: column; flex-wrap: nowrap; gap: 5px; width: 100%; }
.bot-settings .bot-meter { display: grid; grid-template-columns: 32px minmax(60px, 1fr) 36px auto; align-items: center; width: 100%; }
.bot-settings .bot-meter-track { width: 100%; height: 5px; }
.bot-settings .bot-meter-timer { text-align: right; opacity: 0.75; white-space: nowrap; }
.bot-settings .bot-meter-money > span { grid-column: 2 / -1; }
.model-menu .model-manual { display: grid; gap: 6px; padding: 6px; }
.model-menu .model-manual input { min-width: 0; width: 100%; box-sizing: border-box; }
.model-menu .model-filter { margin: 2px 2px 4px; width: calc(100% - 4px); }
.model-menu.stacked { width: 300px; grid-template-columns: minmax(0, 1fr); overflow-x: hidden; }
.model-menu.stacked .model-menu-name { flex-direction: column; align-items: stretch; gap: 1px; overflow: hidden; }
.model-select-trigger > span { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Add to chat / More details over text selected in a message. */
.selection-actions { position: fixed; z-index: 50; transform: translate(-50%, calc(-100% - 6px)); display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--panel, #1b2028); border: 1px solid var(--border, #2c3340); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.selection-actions button { background: none; border: 0; padding: 4px 8px; border-radius: 6px; font-size: 12px; color: inherit; cursor: pointer; white-space: nowrap; }
.selection-actions button:hover:not(:disabled) { background: rgba(255,255,255,.08); }
.model-select { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
/* Speed in a bot's quick menu: label left, a compact switch right. */
.bot-speed { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bot-speed .segmented .seg { padding: 4px 10px; font-size: 12px; }
.bot-settings fieldset { border-top: 1px solid var(--line); padding-top: 10px; }
.model-select-trigger { display: inline-flex; align-items: center; gap: 6px; margin-right: -8px; padding: 4px 8px; border: 0; border-radius: 6px; background: transparent; color: inherit; font-weight: 600; cursor: pointer; }
.model-select-trigger:hover, .model-select-trigger[aria-expanded="true"] { background: var(--panel); }
.model-select-chevron { opacity: 0.6; transition: transform .15s; }
.model-select-trigger[aria-expanded="true"] .model-select-chevron { transform: rotate(180deg); }
.model-menu { position: fixed; z-index: 1001; left: auto; min-width: 220px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg, #1b1b1b); box-shadow: 0 8px 24px rgba(0,0,0,.35); display: grid; gap: 2px; }
.model-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; text-align: left; }
.model-menu-item:hover, .model-menu-item:focus-visible { background: var(--panel); }
.model-menu-name { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; }
.model-menu-name small { opacity: 0.55; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-menu-check { width: 14px; text-align: center; color: var(--accent, #3fb950); opacity: 0.85; }
.model-menu-item kbd { opacity: 0.5; font-size: 11px; }
.model-menu-more { justify-content: space-between; border-top: 1px solid var(--line); opacity: 0.8; }
.model-menu-head { padding: 8px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
.bot-settings label.media-field { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bot-settings .media-field select { width: auto; min-width: 96px; max-width: 160px; padding: 3px 6px; font-size: 12px; }
.bot-settings p.media-notes { margin: 0; line-height: 1.5; }
.media-price-pill { align-self: center; margin-bottom: 3px; padding: 2px 8px; border-radius: 999px; font-size: 12px; color: var(--muted); background: var(--panel); white-space: nowrap; }
.effort-slider { display: grid; gap: 5px; font-size: 12px; }
.effort-heading { display: flex; justify-content: space-between; align-items: center; }
.effort-value { min-width: 90px; text-align: right; opacity: 0.75; }
.effort-control { position: relative; height: 28px; }
.effort-rail { position: absolute; left: 7px; right: 7px; top: 12px; height: 4px; border-radius: 4px; background: var(--line); }
.effort-fill { width: var(--effort-position); height: 100%; border-radius: inherit; background: var(--accent); transition: width 140ms ease-out; }
.effort-thumb { position: absolute; left: var(--effort-position); top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); transition: left 140ms ease-out; }
.effort-control.dragging .effort-fill, .effort-control.dragging .effort-thumb { transition: none; }
.effort-control input[type="range"] { appearance: none; -webkit-appearance: none; position: absolute; inset: 0; width: 100%; height: 28px; padding: 0; margin: 0; border: 0; outline: none; box-shadow: none; background: transparent; opacity: 0; cursor: pointer; touch-action: none; }
.effort-control input::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; }
.effort-control input::-moz-range-thumb { width: 14px; height: 14px; border: 0; }
.effort-control:has(input:focus-visible) .effort-thumb { filter: brightness(1.25); }
.effort-control:has(input:disabled) { opacity: 0.4; }
.effort-ticks { position: relative; height: 28px; margin: 0 7px; font-size: 10px; }
.effort-ticks button { position: absolute; top: 0; transform: translateX(-50%); padding: 7px 0 3px; border: 0; border-radius: 3px; background: transparent; color: var(--muted); font: inherit; white-space: nowrap; transition: color 120ms ease; }
.effort-ticks button::before { content: ''; position: absolute; top: 0; left: 50%; width: 1px; height: 4px; background: currentColor; }
.effort-ticks button:first-child span { display: inline-block; transform: translateX(calc(50% - 7px)); }
.effort-ticks button:last-child span { display: inline-block; transform: translateX(calc(-50% + 7px)); }
.effort-ticks button.on { color: var(--accent); }
.effort-ticks.compact button:not(:first-child):not(:last-child):not(.on) span { visibility: hidden; }
@media (prefers-reduced-motion: reduce) {
  .effort-fill, .effort-thumb, .effort-ticks button { transition: none; }
}

/* Preview: a web page beside your terminals or threads. */
.preview { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
.preview-bar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.preview-bar form { flex: 1; min-width: 0; display: flex; }
.preview-bar input { flex: 1; min-width: 0; padding: 5px 10px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
.preview-full-title { padding: 0 8px; font-weight: 600; white-space: nowrap; }
.preview-error { margin: 0; padding: 6px 12px; font-size: 12px; color: var(--danger); border-bottom: 1px solid var(--line); }
.preview-body { position: relative; flex: 1; min-height: 0; display: flex; overflow: auto; }
.preview-body iframe { flex: 1; border: 0; background: #fff; }
.preview-checking { margin: auto; color: var(--muted); }
.preview-notice, .preview-empty { margin: auto; max-width: 420px; padding: 32px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.preview-empty { margin: 0; max-width: none; width: 100%; box-sizing: border-box; padding: 28px 32px; align-items: center; justify-content: center; text-align: center; }
.preview-empty > * { width: 100%; max-width: 520px; }
.preview-empty p { margin-inline: auto; }
.preview-notice h2, .preview-empty h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.035em; }
.preview-notice p, .preview-empty p { margin: 0; color: var(--muted); max-width: 46ch; }
.preview-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.preview-retry { margin-top: 6px; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.preview-always { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.preview-label { margin-top: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.preview-servers { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); overflow: hidden; }
.preview-servers button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; text-align: left; border: 0; border-radius: 0; border-top: 1px solid var(--line); background: transparent; }
.preview-servers button:first-child { border-top: 0; }
.preview-servers button:hover { background: var(--panel-2); }
.preview-server { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.preview-server small { font-size: 12px; color: var(--muted); }
.preview-open { font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; }
.preview-foot { padding-top: 16px; font-size: 12px; }
/* Full window: the same element, fixed over the rail and deck, so the page keeps its state. */
.preview.full-window { position: fixed; top: var(--deck-top, 0px); left: 0; right: 0; bottom: 0; z-index: 35; background: var(--bg); }
/* A local server a terminal printed or a bot mentioned; opens it in a Preview beside that pane. */
.server-chip { flex: none; padding: 0 8px; border-radius: 999px; background: transparent; color: var(--brand-cyan); font: 11px/20px ui-monospace, SFMono-Regular, Menlo, monospace; }

/* A code block's controls: Open as artifact (and its menu) beside Copy. */
.md-code-actions { display: flex; align-items: center; gap: 2px; }
.md-code:has(.artifact-menu) { overflow: visible; }
.artifact-shown.on { color: var(--accent); }
.artifact-choice { position: relative; display: inline-flex; }
.artifact-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; width: 260px; padding: 4px; display: flex; flex-direction: column; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px #0007; }
.md-code-head .artifact-menu button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; padding: 6px 10px; border-radius: 6px; color: var(--text); font-size: 12px; text-align: left; }
.md-code-head .artifact-menu button:hover, .md-code-head .artifact-menu button:focus-visible { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.artifact-menu small { font-size: 11px; color: var(--muted); }

/* Artifacts: code from replies, opened on request, beside the conversation. */
.artifacts-panel { flex: none; width: min(440px, 46%); min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); }
.artifacts-panel.overlay { position: absolute; top: 0; right: 0; bottom: 0; z-index: 30; width: min(440px, 100%); box-shadow: -12px 0 32px #0005; }
.artifacts-backdrop { position: absolute; inset: 0; z-index: 29; border: 0; border-radius: 0; background: #0003; }
.artifacts-panel.full-window { position: fixed; top: var(--deck-top, 0px); left: 0; right: 0; bottom: 0; z-index: 35; width: auto; border: 0; box-shadow: none; background: var(--bg); }
/* In the side panel's Artifacts tab it fills the tab, top to bottom, and wears the side panel's frame. */
.right-artifacts-slot { height: 100%; min-height: 0; display: flex; flex-direction: column; }
.right-artifacts-slot[hidden] { display: none; }
:root .right-artifacts-slot > .artifacts-panel.docked { flex: 1; width: auto; border-left: 0; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
.artifacts-head { display: flex; align-items: flex-start; gap: 6px; padding: 12px 8px 12px 16px; border-bottom: 1px solid var(--line); }
.artifacts-head > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.artifacts-title { align-self: flex-start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; margin-left: -6px; font-weight: 600; background: transparent; border-color: transparent; }
.artifacts-meta { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.artifacts-bar { display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); }
.artifacts-tabs { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.artifacts-tabs button { padding: 2px 10px; font-size: 12px; background: transparent; border-color: transparent; color: var(--muted); }
.artifacts-tabs button[aria-selected="true"] { background: var(--panel-2); border-color: var(--line); color: var(--text); }
.artifacts-version { min-width: 22px; text-align: center; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
.artifacts-sep { width: 1px; height: 18px; margin: 0 2px; background: var(--line); }
.artifacts-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
.artifacts-body iframe { flex: 1; width: 100%; border: 0; background: #fff; }
.artifact-doc { padding: 16px 20px; }
.artifact-source, .artifact-changes { flex: 1; margin: 0; padding: 10px 0; box-sizing: border-box; background: #0b1016; color: #d5dde6; font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
.artifact-source .line, .artifact-changes .line { display: flex; white-space: pre; }
.artifact-source .n { width: 34px; flex: none; padding-right: 12px; text-align: right; color: #5b6875; user-select: none; }
.artifact-changes .sign { width: 22px; flex: none; text-align: center; user-select: none; }
.artifact-changes .line.add { color: #86efac; background: rgba(34, 197, 94, 0.12); }
.artifact-changes .line.del { color: #fca5a5; background: rgba(239, 68, 68, 0.12); }
.artifact-changes .line.same { color: var(--muted); }
.artifact-changes .gap { display: block; padding: 2px 22px; color: var(--muted); }
.artifacts-foot { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.artifacts-empty { margin: auto; padding: 24px; max-width: 32ch; text-align: center; color: var(--muted); }
.artifacts-list { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.artifacts-list button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; text-align: left; background: transparent; border-color: transparent; }
.artifacts-list button:hover { background: var(--panel-2); }
.artifacts-list button[aria-current="true"] { background: var(--panel-2); border-color: var(--line); }
.artifacts-kind { width: 30px; height: 30px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.artifacts-row { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.thread-counts .on { border-color: var(--accent); color: var(--text); }

/* The draggable inner edge of each sidebar. It overlaps the border by a few
   pixels each side, so it is easy to grab without taking any room. */
.sidebar-handle { flex: none; position: relative; z-index: 6; width: 7px; margin: 0 -3px; cursor: col-resize; touch-action: none; }
.sidebar-handle::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); border-radius: 2px; background: var(--accent); opacity: 0; transition: opacity 0.12s; }
.sidebar-handle:hover::after, .sidebar-handle:focus-visible::after { opacity: 0.45; }
.sidebar-handle.held::after { opacity: 0.9; }
.sidebar-handle:focus-visible { outline: none; }
.sidebar-handle.overlay { position: absolute; top: 0; bottom: 0; z-index: 31; margin: 0; transform: translateX(50%); }

/* Each reply's Working row ends in its own Stop, quiet until you point at it. */
.working-line > .bubble-stop { display: inline-flex; align-items: center; gap: 5px; margin: -3px 0 -3px auto; padding: 2px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 11px; line-height: 16px; min-height: 0; }
.working-line > .bubble-stop svg { color: var(--danger); }
.working-line > .bubble-stop:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

/* A queued message waits in the conversation under the replies: quoted italic text, no box. */
.queued-inline { align-self: flex-end; max-width: 85%; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding: 0 4px; margin-left: auto; }
.queued-inline .q-text { border: 0; background: transparent; padding: 0; min-height: 0; font: inherit; color: var(--muted); font-style: italic; white-space: pre-wrap; text-align: right; cursor: text; }
.queued-inline .q-text::before { content: "\201C"; }
.queued-inline .q-text::after { content: "\201D"; }
.queued-inline .q-edit { width: min(480px, 70vw); min-height: 40px; font-size: 13px; }
.queued-inline .q-meta { position: relative; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.queued-inline .q-meta button { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0 2px; min-height: 0; font-size: 11px; color: var(--muted); }
.queued-inline .q-meta button:hover { color: var(--text); }
.queued-inline .q-for { display: inline-flex; align-items: center; gap: 5px; }
.queued-inline .q-for .identicon { --cell: 2px; --gap: 0px; width: 14px; height: 14px; border-radius: 4px; }
.queued-inline .q-sep { width: 1px; height: 11px; background: var(--line); }
/* Opens below the Steer link so it never covers the message. */
.steer-pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 50; width: 300px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: 0 10px 28px #0009; font-size: 12px; line-height: 1.5; text-align: left; }
.steer-pop strong { display: block; font-size: 12.5px; margin-bottom: 2px; color: var(--text); }
.steer-pop p { margin: 0 0 10px; color: var(--muted); }
.steer-pop .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.queued-inline .steer-pop .row button { font-size: 12px; padding: 4px 10px; color: inherit; }
.queued-inline .steer-pop .row .primary { background: var(--accent); color: #fff; }
.queued-inline .steer-pop .row .ghost { border: 1px solid var(--line); }

/* The round button is an exact circle; the composer's 46px button rule must not reach it. */
.composer-box > button.round-send { width: 30px; height: 30px; min-width: 30px; min-height: 30px; max-height: 30px; aspect-ratio: 1; align-self: flex-end; margin-bottom: 3px; padding: 0; border-radius: 50%; border: 0; display: inline-grid; place-items: center; background: var(--accent); color: #fff; flex: none; }
.composer-box > button.round-send:hover:not(:disabled) { filter: brightness(1.1); }
.composer-box > button.round-send:disabled { opacity: .4; }
.talk-only-pane .composer-box > button.round-send:disabled { background: var(--muted); cursor: default; }
.composer-box > button.round-send.stop { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 55%, transparent); }
.composer-box > button.round-send.stop:hover { background: color-mix(in srgb, var(--danger) 26%, transparent); filter: none; }
/* A long placeholder stays on one line in a narrow pane instead of wrapping out of view. */
.composer-field > textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Retry / Revert confirmation under a message's actions. */
.message-actions { position: relative; }
.goback-pop { width: 340px; top: calc(100% + 4px); }
.goback-pop p { margin: 6px 0 0; }
.goback-pop .row { margin-top: 10px; }
.goback-pop .row button { font-size: 12px; padding: 4px 10px; color: inherit; }
.goback-pop .row .primary { background: var(--accent); color: #fff; }
.goback-pop .row .ghost { border: 1px solid var(--line); }
.goback-scope { display: flex; gap: 12px; margin: 8px 0 2px; color: var(--text); }
.goback-scope label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.goback-files { list-style: none; margin: 8px 0 0; padding: 0; max-height: 160px; overflow: auto; }
.goback-files label { display: flex; gap: 6px; align-items: center; padding: 2px 0; cursor: pointer; }
.goback-files code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.goback-files em { font-style: normal; font-size: 11px; color: var(--muted); flex: none; }
.goback-files em.warn { color: var(--danger); }
.goback-effects code { color: var(--text); }

.msg-action.pin-action[aria-pressed="true"] { color: var(--accent); }
.pin-jump { border: 0; background: transparent; color: inherit; padding: 0; cursor: pointer; text-align: left; max-height: 4.5em; overflow: hidden; }
.pin-jump:hover { text-decoration: underline; }

/* A consistent action row, with disclosure last in both message types. */
.collapsed-actions { min-height: 32px; }
.message-action-items, .message-primary-actions { display: flex; align-items: center; gap: 2px; }
.message-row :is(.message-primary-actions, .message-action-items) { flex-wrap: wrap; }
.action-disclosure { flex: none; }
/* Actions and time show while the message is hovered, like Codex. The row keeps
   its height so nothing shifts; a pinned message keeps its pin in view. In a
   thread, a week-old date wraps rather than overflow the narrowest pane. */
.message-time { padding: 0 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.message-row .message-time { text-wrap: balance; }
@media (hover: hover) {
  .message-actions .msg-action, .message-time { opacity: 0; transition: opacity 120ms ease; }
  .message-row:hover .message-actions .msg-action, .message-row:hover .message-time,
  .message-actions:focus-within .msg-action, .message-actions:focus-within .message-time,
  .message-actions.held .msg-action, .message-actions.held .message-time,
  .message-actions .msg-action.pin-action[aria-pressed="true"] { opacity: 1; }
}
.message-pin-indicator { display: grid; place-items: center; width: 20px; height: 32px; color: var(--accent); }

/* TL;DR mode: a grayscale pill that lights up, and a spinning gradient border with a glow. */
:root { --tldr-hot: #ff4d8d; --tldr-amber: #ffb020; --tldr-violet: #a855f7; }
@property --tldr-spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes tldr-spin { to { --tldr-spin: 360deg; } }
@keyframes tldr-glow {
  0%, 100% { box-shadow: 0 0 16px -4px var(--tldr-hot), 0 0 26px -8px var(--tldr-amber); }
  33% { box-shadow: 0 0 16px -4px var(--tldr-amber), 0 0 26px -8px var(--tldr-violet); }
  66% { box-shadow: 0 0 16px -4px var(--tldr-violet), 0 0 26px -8px var(--tldr-hot); }
}
.composer.tldr .composer-box, .composer.tldr .composer-box:focus-within {
  border-color: transparent;
  background: linear-gradient(var(--box), var(--box)) padding-box, conic-gradient(from var(--tldr-spin), var(--tldr-hot), var(--tldr-amber), var(--tldr-violet), var(--tldr-hot)) border-box;
  animation: tldr-spin 3s linear infinite, tldr-glow 3s linear infinite;
}
.composer.tldr .composer-box textarea::placeholder { color: color-mix(in srgb, var(--tldr-amber) 70%, transparent); }
/* Sized in em so the pill grows from 7.5px (off) to 8.75px (on); ::before keeps it clickable when tiny. */
.composer-box > .tldr-pill { position: relative; flex: none; align-self: flex-end; margin-bottom: 10px; display: inline-flex; height: 2.2em; min-height: 0; margin-right: 3px; padding: 0; font-size: 7.5px; border: 1px solid #3a3a3a; border-radius: 999px; background: none; cursor: pointer; filter: grayscale(1); transition: font-size .25s, box-shadow .3s, border-color .3s, filter .3s; }
.composer-box > .tldr-pill::before { content: ""; position: absolute; inset: -8px -6px; }
@keyframes tldr-pill-wiggle {
  0%, 100% { transform: none; }
  20% { transform: rotate(-10deg) scale(1.08); }
  40% { transform: rotate(8deg) scale(1.08); }
  60% { transform: rotate(-6deg) scale(1.05); }
  80% { transform: rotate(3deg); }
}
.composer-box > .tldr-pill:hover { animation: tldr-pill-wiggle .5s ease-in-out; }
.tldr-pill span { display: flex; align-items: center; padding: 0 .7em; font-weight: 800; letter-spacing: .03em; }
.tldr-pill span:first-child { border-radius: 999px 0 0 999px; background: var(--tldr-hot); color: #fff; }
.tldr-pill span:last-child { border-radius: 0 999px 999px 0; background: var(--tldr-amber); color: #1a0710; }
.composer-box > .tldr-pill[aria-pressed="true"] { font-size: 8.75px; border-color: transparent; filter: none; box-shadow: 0 0 7px var(--tldr-hot), 0 0 15px color-mix(in srgb, var(--tldr-amber) 50%, transparent); }
@media (prefers-reduced-motion: reduce) {
  .composer.tldr .composer-box, .composer.tldr .composer-box:focus-within { animation: none; box-shadow: 0 0 16px -4px var(--tldr-hot), 0 0 26px -8px var(--tldr-amber); }
  .composer-box > .tldr-pill:hover { animation: none; }
}

/* Something new in the artifacts pane since it was last open. */
.new-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-left: 6px;
  border-radius: 50%;
  background: var(--accent, #4f8cff);
  vertical-align: middle;
}
.md code .msg-link { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

/* A new artifact arrived while the pane stayed shut. */
.artifact-glow { animation: artifact-glow 2.2s ease-out; }
@keyframes artifact-glow {
  0%, 60% { box-shadow: 0 0 0 1px var(--accent, #4f8cff), 0 0 14px 2px color-mix(in srgb, var(--accent, #4f8cff) 55%, transparent); }
  100% { box-shadow: 0 0 0 0 transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .artifact-glow { animation: none; box-shadow: 0 0 0 1px var(--accent, #4f8cff); }
}

/* Mods: panes a mod draws, as Claude Code's desktop surface would. */
.artifacts-panel.mod-dock { width: min(760px, 62%); }
.artifacts-panel.mod-dock.overlay { width: min(760px, 100%); }
.artifacts-panel.mod-dock:not(.overlay):not(.maximized) { position: relative; }
.artifacts-panel.mod-dock.maximized { position: absolute; inset: 0; z-index: 31; width: auto; border-left: 0; background: var(--bg); }
.mod-resize { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; z-index: 2; cursor: col-resize; }
.mod-resize:hover, body.mod-resizing .mod-resize { background: var(--accent); opacity: .5; }
body.mod-resizing { cursor: col-resize; user-select: none; }
body.mod-resizing iframe { pointer-events: none; }
.mod-dock-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); }
.mod-tabs { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; }
.mod-tabs button { padding: 2px 10px; font-size: 12px; background: transparent; border-color: transparent; color: var(--muted); white-space: nowrap; }
.mod-tabs button.active { background: var(--panel-2); border-color: var(--line); color: var(--text); }
.mod-pane-body { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); position: relative; }
.mod-box { min-width: 0; box-sizing: border-box; }
.mod-text { display: block; }
.mod-box[style*="flex-direction: row"] > .mod-text { display: inline-block; }
.mod-button { font: inherit; padding: 1px 8px; margin: 1px 2px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); cursor: pointer; }
.mod-button:hover { border-color: var(--accent); }
.mod-button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mod-button.plain { background: transparent; border-color: transparent; padding: 0 2px; }
.mod-field { display: flex; align-items: center; gap: 1ch; margin: 2px 0; }
.mod-field-label { white-space: pre; opacity: 0.8; }
.mod-field input, .mod-field select { font: inherit; flex: 1; min-width: 10ch; padding: 2px 6px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
.mod-svg { display: block; max-width: 100%; height: auto; }
.mod-code { margin: 0; white-space: pre-wrap; }
.mod-modal-backdrop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #0008; }
.mod-modal { width: min(560px, 92vw); max-height: 80vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 24px 64px #000a; }
.mod-corner { position: fixed; right: 16px; top: 76px; z-index: 61; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
.mod-corner > * { pointer-events: auto; }
.mod-toast { max-width: 420px; text-align: left; padding: 8px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); box-shadow: 0 8px 24px #0007; }
.mod-toast.error { border-color: var(--danger); }
.mod-status { white-space: nowrap; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 3px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.mod-status-wrap { position: relative; display: inline-flex; min-width: 0; flex: 0 1 auto; }
button.mod-status { cursor: pointer; }
button.mod-status:hover { color: var(--text); }
.mod-status-chevron { margin-left: 4px; opacity: .7; }
.mod-status-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 50; min-width: 180px; display: flex; flex-direction: column; padding: 4px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.mod-status-menu button { text-align: left; padding: 6px 10px; border: 0; border-radius: 6px; background: none; color: var(--text); font-size: 12px; cursor: pointer; white-space: nowrap; }
.mod-status-menu button:hover { background: var(--panel-2); }
.mod-list { display: flex; flex-direction: column; gap: 12px; }
.mod-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
.mod-card-head { display: flex; align-items: center; gap: 8px; }
.mod-card-head strong { flex: 1; }
.mod-card .muted { color: var(--muted); font-size: 12px; }
.mod-card .error { color: var(--danger); font-size: 12px; white-space: pre-wrap; }
.mod-grants label, .mod-options label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.mod-options { display: grid; grid-template-columns: 1fr; gap: 6px; }
.mod-options input[type="text"], .mod-options input[type="number"], .mod-options select { flex: 1; }
.mod-option-input { display: flex; flex: 1; gap: 6px; }
.mod-option-input input { flex: 1; }

/* The docked browser's place; the page itself is drawn over it by the app. */
.browser-place { position: relative; flex: 1; min-width: 0; min-height: 0; }
.browser-snapshot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }

/* Hosts: which machine the window runs on, at the top of the rail. */
.host-switch { position: relative; margin: -6px 0 14px; }
.host-switch-button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.host-switch-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.host-switch-caret { color: var(--muted); font-size: 11px; }
.host-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--warn); }
.host-dot.connected { background: var(--accent); }
.host-dot.failed { background: var(--danger); }
.host-menu {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 6px);
  z-index: 45;
  min-width: 220px;
  display: flex;
  flex-direction: column;
  padding: 4px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
}
.host-menu-row { display: flex; align-items: center; gap: 4px; border-radius: 6px; }
.host-menu-row.current { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.host-menu button { background: transparent; border-color: transparent; font-size: 12px; }
.host-menu button:hover:not(:disabled), .host-menu button:focus-visible { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.host-menu-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 8px; text-align: left; }
.host-menu-pick:disabled { opacity: 1; cursor: default; color: inherit; }
.host-menu-check { width: 12px; flex: none; color: var(--accent); }
.host-menu-words { display: flex; flex-direction: column; min-width: 0; }
.host-menu-words small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.host-menu-new { flex: none; padding: 4px 8px; color: var(--muted); }
.host-menu-manage { text-align: left; padding: 6px 10px; }
.host-menu .error { padding: 4px 8px; font-size: 12px; }
.loading-actions { display: flex; gap: 8px; }

/* Artifacts and Changes, on the pane's top line before the window buttons (ChatPane portals them in). */
.pane-counts { display: contents; }
.pane-head .thread-counts { display: flex; flex: none; gap: 4px; }
.pane-head .thread-counts button { white-space: nowrap; font-size: 11px; line-height: 1.4; }
.count-icon { display: none; margin-right: 4px; vertical-align: -2px; }
/* ChatPane picks data-fit. A crowded top line gives up, in order: the count labels, the status words, then the server chip. */
.pane-head:is([data-fit="compact"], [data-fit="tight"], [data-fit="min"]) .count-label { display: none; }
.pane-head:is([data-fit="compact"], [data-fit="tight"], [data-fit="min"]) .count-icon { display: inline-block; }
.pane-head:is([data-fit="tight"], [data-fit="min"]) .pane-folder { display: none; }
.pane-head[data-fit="min"] .server-chip { display: none; }
/* Last of all, only when the buttons would otherwise leave the line: the flag. The dot keeps its colour and its tooltip names it. */
.pane-head[data-flag-hidden] .flag { display: none; }

/* The message box: +, the text, TL;DR and Send on one line, with no outline. As the text wraps, the
   buttons stay beside its last line. The box lightens while you type in it, so you can tell which pane
   has your typing. The border stays, invisible, so TL;DR can draw its rainbow on it. The bots get their own row under it. */
.composer { border-top-color: transparent; }
.composer-box { display: flex; align-items: flex-end; gap: 4px; padding: 3px 6px; border: 1px solid transparent; border-radius: 12px; --box: var(--panel-2); background: var(--box); transition: background-color .15s; }
.composer-box:focus-within { --box: color-mix(in srgb, var(--panel-2) 95%, var(--text)); }
.composer-box > .composer-tools { margin-bottom: 4px; }
.composer-box .composer-plus { width: 28px; height: 28px; font-size: 21px; }
.composer-box > .composer-field { flex: 1; min-width: 0; }
/* In a very narrow pane the text gets the whole width again, with +, TL;DR and Send on a line under it. */
.composer-box.stacked { flex-wrap: wrap; align-items: center; padding: 2px 6px 5px; }
.composer-box.stacked > .composer-field { order: -1; flex-basis: 100%; }
.composer-box.stacked > .composer-tools { margin: 0 auto 0 0; }
.composer-box.stacked > .tldr-pill, .composer-box.stacked > button.round-send { align-self: center; margin-bottom: 0; }
.composer-bots { margin-top: 6px; padding: 0 2px; flex-wrap: nowrap; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.composer-bots:empty { display: none; }
/* Folded: each bot is just its avatar and status; hovering still shows its card. */
.composer-bots.folded .chip-label, .composer-bots.folded .chip-meta:not(.chip-queued), .composer-bots.folded .editor-badge, .composer-bots.folded .chip-kick, .composer-bots.folded .chip-add-label { display: none; }
.composer-bots.folded .chip-name { padding: 2px 4px 2px 3px; }
.composer-bots.folded .chip-add { padding: 0 6px; }
/* The open bot unfolds to its name while its settings are showing. */
.composer-bots.folded .chip-name[aria-expanded="true"] .chip-label { display: inline; }
.composer-bots.folded .chip-name[aria-expanded="true"] { padding-right: 8px; }
.chips-fold { flex: none; align-self: center; width: 22px; height: 22px; min-height: 0; margin-left: auto; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; }
.chips-fold:hover { color: var(--text); background: color-mix(in srgb, var(--text) 8%, transparent); }
.composer-bots .chip-name { padding: 2px 8px 2px 3px; font-size: 12px; }
.composer-bots .chip-meta { font-size: 11px; }
/* A badge's usage card floats above it, so the row's overflow never clips it. */
.usage-card.above { position: fixed; top: auto; z-index: 40; }
.usage-card.above::before { inset: auto 0 -7px; }

/* Each badge is outlined in its bot's colour; the bots your message goes to are lit. */
.composer-bots .chip { border-color: color-mix(in srgb, var(--who) 30%, var(--line)); transition: background-color .15s, border-color .15s; }
.composer-bots .chip.to { border-color: var(--who); background: color-mix(in srgb, var(--who) 13%, transparent); }
/* Adding a bot is an empty seat with a person-plus, so it never reads as the attach button's +. */
.composer-bots .quick-add-wrap.roster { flex: none; display: inline-flex; }
.composer-bots .chip-add { width: auto; height: 23px; gap: 4px; margin-left: 2px; padding: 0 8px 0 6px; display: inline-flex; align-items: center; border: 1px dashed color-mix(in srgb, var(--muted) 55%, transparent); border-radius: 999px; font-size: 12px; }
.composer-bots .chip-add:hover:not(:disabled), .composer-bots .chip-add[aria-expanded="true"] { border-style: solid; }
.chips:not([data-fit="full"]) .chip-add-label { display: none; }
.chips:not([data-fit="full"]) .chip-add { padding: 0 5px; }
/* The narrowest step: the avatar and its status dot, with the name in the tooltip. */
.thread-chat .chips[data-fit="faces"] .chip-meta:not(.chip-queued), .thread-chat .chips[data-fit="faces"] .chip-label, .thread-chat .chips[data-fit="faces"] .chip-queued-word { display: none; }
.thread-chat .chips[data-fit="faces"] .chip-name { gap: 3px; padding: 2px 3px 2px 2px; }

/* Fixed project destinations remain legible when several panes share the canvas. */
.pane-project, .pane-machine, .workspace-host { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--muted); }
.pane-project { max-width: 100px; flex: 0 1 100px; }
.pane-machine { max-width: 130px; flex: 0 1 130px; }
.pane-head > button, .pane-head > .pane-menu-wrap { flex-shrink: 0; }
.workspace-host { max-width: 110px; }
.workspace-host-menu { position: relative; }
.workspace-machine-menu { position: fixed; z-index: 90; width: 260px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow-y: auto; overflow-wrap: anywhere; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px #0005; }
.workspace-machine-menu button { display: block; width: 100%; text-align: left; white-space: normal; }
.workspace-machine-menu strong, .workspace-machine-menu p { display: block; padding: 6px; }
.approval-host { max-width: 100%; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.approval, .approval-detail { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.pane-body .connection-banner { flex-wrap: wrap; min-width: 0; }

/* Pick the machine, stage 2: the Codex-style sidebar (v8 mockup). Pinned,
   Projects and Recents; a server's project shows its name, a connection dot
   and its coloured globe; rows show ⋯ and pin on hover; cards open beside. */
.rail { padding: 14px 10px; }
.rail-sec { display: flex; align-items: center; gap: 4px; padding: 12px 8px 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.rail-scroll > .rail-sec:first-child { padding-top: 0; }
.rail-sec-toggle { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
.rail-sec-toggle svg { opacity: 0; transition: opacity .12s; }
.rail-sec:hover .rail-sec-toggle svg, .rail-sec-toggle:focus-visible svg, .rail-sec-toggle[aria-expanded="false"] svg { opacity: 1; }
.rail-sec .workspace-host-menu { margin-left: auto; }
.rail-sec .workspace-host-menu > .icon { width: 22px; height: 22px; padding: 0; font-size: 14px; }
.ws { margin-bottom: 2px; }
.project-host-group { min-width: 0; margin-bottom: 6px; }
.project-host-toggle { display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0; padding: 7px 8px 4px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; text-align: left; cursor: pointer; }
.project-host-toggle:hover { color: var(--text); }
.project-host-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
.project-host-toggle > svg { flex: none; }
.project-host-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-host-count { flex: none; margin-left: auto; font-variant-numeric: tabular-nums; }
.project-host-group .ws-name { cursor: grab; }
.project-host-group .ws-name:active { cursor: grabbing; }
.project-host-group .host-tag .host-name { display: none; }
.ws-row.project-dragging { opacity: .4; }
.ws-row.project-drop-before::before, .ws-row.project-drop-after::after { content: ""; position: absolute; left: 8px; right: 8px; height: 2px; background: var(--accent); border-radius: 1px; pointer-events: none; }
.ws-row.project-drop-before::before { top: -2px; }
.ws-row.project-drop-after::after { bottom: -2px; }
.project-order-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ws-row { position: relative; }
.ws-row:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
.ws-row.lit { background: var(--panel-2); border-color: var(--line); }
.ws-name { padding: 7px 10px; gap: 9px; }
.ws-label { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.ws-label .ws-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-label .twin { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 400 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
.host-tag { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; padding-left: 8px; min-width: 0; color: var(--muted); font-size: 11.5px; font-weight: 400; white-space: nowrap; }
.host-tag .host-name { overflow: hidden; text-overflow: ellipsis; max-width: 14ch; }
.hdot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; background: #5b6672; }
.hdot.on { background: #2fbf71; }
.hdot.wait { background: var(--warn); }
.hdot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px #5b6672; }
.row-acts { display: none; align-items: center; gap: 2px; margin-left: auto; flex: none; }
.ws-row > .row-acts { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
.ws-row:hover .host-tag, .ws-row.lit .host-tag, .ws-row:focus-within .host-tag { visibility: hidden; }
.ws-row:hover > .row-acts, .ws-row.lit > .row-acts, .ws-row:focus-within > .row-acts { display: inline-flex; }
.act { display: inline-grid; place-items: center; width: 24px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); }
.act:hover, .act.on, .act[aria-expanded="true"] { color: var(--text); background: color-mix(in srgb, var(--text) 9%, transparent); }
.act.on { color: var(--accent); }
.fold { --cut: var(--panel); position: relative; display: inline-grid; flex: none; color: var(--muted); }
.fold .fold-globe { position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--cut); display: grid; place-items: center; }
.ws-row.active .fold, .ws-row.lit .fold, .hover-card .fold, .deck-menu .fold { --cut: var(--panel-2); }
.ws-row.active .fold, .ws-row.lit .fold { color: var(--text); }
.pane-row { position: relative; padding: 6px 10px 6px 24px; }
.pane-row.flat { padding-left: 10px; }
.pane-row:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
.pane-row.lit { background: var(--panel-2); color: var(--text); }
.pane-row .row-acts { margin-left: 4px; }
.pane-row:hover > .row-acts, .pane-row.lit > .row-acts, .pane-row:focus-within > .row-acts { display: inline-flex; }
.pane-row:hover > .globe-end, .pane-row.lit > .globe-end { display: none; }
.pane-row.on-canvas .pane-row-title { color: var(--text); }
.pane-row.unread .pane-row-title { color: var(--text); font-weight: 600; }
.unread-mark { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--accent); }
.pane-row-clip { flex: 1 1 0; min-width: 0; overflow: hidden; }
.pane-row-clip > .pane-row-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-row:hover .pane-row-clip > .pane-row-title, .pane-row.lit .pane-row-clip > .pane-row-title { display: inline-block; overflow: visible; text-overflow: clip; transform: translateX(var(--shift, 0px)); transition: transform 2.2s linear .3s; }
.no-threads { padding: 2px 10px 8px 37px; color: color-mix(in srgb, var(--muted) 62%, transparent); font-size: 12px; }
.globe-end { display: inline-grid; place-items: center; margin-left: auto; flex: none; }
.rail-foot { flex-wrap: wrap; }
.rail-foot-item { display: inline-flex; align-items: center; gap: 6px; }
.rail-foot-item + .rail-foot-item { margin-left: 8px; }
/* Hover cards: beside the rail, at the row's height. */
.hover-card { position: fixed; z-index: 80; width: 300px; padding: 6px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); box-shadow: 0 18px 50px #000a; font-size: 12.5px; }
.card-row { display: flex; align-items: flex-start; gap: 9px; padding: 5px 12px; color: var(--text); line-height: 1.45; }
.card-row > svg, .card-row > .fold, .card-row > span:first-child:not(.grow) { flex: none; margin-top: 2px; color: var(--muted); }
.card-row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.card-row .side { margin-left: auto; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; flex: none; }
.card-row.title { font-weight: 600; font-size: 13px; }
.card-row .mono { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
.card-row.warn > svg { color: var(--warn); }
.card-row.bad > svg { color: var(--danger); }
.hover-card hr { border: 0; border-top: 1px solid var(--line); margin: 5px 12px; }
/* Menus with shortcuts and a Copy › submenu. */
.deck-menu { z-index: 90; min-width: 230px; padding: 4px; border-radius: 10px; box-shadow: 0 18px 50px #000a; }
.deck-menu button[role="menuitem"] { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; border-radius: 6px; font-size: 12.5px; white-space: nowrap; }
.deck-menu button[role="menuitem"].hl { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.deck-menu button[role="menuitem"]:disabled { opacity: .45; cursor: default; }
.deck-menu .label { flex: 0 1 auto; }
.deck-menu .keys { margin-left: auto; padding-left: 16px; color: var(--muted); font-size: 11.5px; letter-spacing: .05em; }
.deck-menu .sub { margin-left: auto; padding-left: 14px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
.deck-menu .more { margin-left: auto; color: var(--muted); }
.deck-menu .sub + .more, .deck-menu .keys + .more { margin-left: 8px; }
/* A long server name gives way before the project's own name does. */
.ws-name .ws-label { flex: 0 1 auto; }
.ws-name .host-tag { flex: 0 4 auto; }
.ws-name .host-tag .host-name { min-width: 3ch; }
/* Edit connection… / Add a server (v8 mockup's dialog). */
.connection-dialog { width: min(440px, calc(100% - 32px)); }
.connection-dialog > label { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.connection-dialog > label input { color: var(--text); padding: 7px 10px; line-height: 1.5; }
.conn-cmd { display: block; margin-top: 2px; font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
.conn-taken { color: var(--danger); font-size: 11.5px; }
.conn-retarget { display: flex; gap: 7px; align-items: flex-start; margin: 6px 0 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); font-size: 12px; line-height: 1.45; }
.conn-retarget svg { flex: none; margin-top: 2px; }
.conn-test { display: flex; gap: 7px; align-items: flex-start; min-height: 18px; margin-top: 4px; font-size: 12px; line-height: 1.45; }
.conn-test.ok { color: #2fbf71; }
.conn-test.bad { color: var(--danger); }
.conn-spin { display: inline-block; width: 12px; height: 12px; margin-top: 2px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: conn-spin .8s linear infinite; flex: none; }
@keyframes conn-spin { to { transform: rotate(360deg); } }
.connection-dialog .confirm-actions .conn-left { margin-right: auto; }
/* Pick the machine, stage 3: where a thread runs. */
.fork-line { display: flex; align-items: center; gap: 10px; margin: 16px 6px; color: var(--muted); font-size: 12px; }
.fork-line::before, .fork-line::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.fork-line > svg { flex: none; }
.fork-line > span { max-width: 72%; text-align: center; line-height: 1.45; }
.move-ask { margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-size: 12.5px; }
.move-ask p { margin: 0 0 8px; line-height: 1.45; }
.move-ask div { display: flex; gap: 6px; flex-wrap: wrap; }
.deck-menu .check { margin-left: auto; padding-left: 10px; color: var(--accent); }
.deck-menu .sub + .check { margin-left: 8px; padding-left: 0; }
.deck-menu .menu-note { display: block; max-width: 270px; padding: 4px 9px 6px; color: var(--muted); font-size: 11px; line-height: 1.45; white-space: normal; }
/* The Work bar: a tab on top of the message box (v8 mockup's .tray). Its popovers open above it. */
.tray { --cut: color-mix(in srgb, var(--panel-2) 55%, var(--panel)); position: relative; display: flex; align-items: center; gap: 1px; margin: 0 12px -10px; padding: 5px 8px 14px; border-radius: 12px 12px 0 0; background: var(--cut); border: 1px solid var(--line); border-bottom: 0; min-width: 0; }
.tray .fold { --cut: color-mix(in srgb, var(--panel-2) 55%, var(--panel)); }
.tray-chip { display: inline-flex; align-items: center; gap: 6px; flex: none; min-width: 0; padding: 3px 9px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--text); font-size: 12px; white-space: nowrap; }
.tray-chip > span:not(.fold):not(.lock):not(.tint) { overflow: hidden; text-overflow: ellipsis; }
.tray-chip > svg, .tray-chip .fold, .tray-chip .lock { color: var(--muted); flex: none; display: inline-grid; }
.tray-chip .tint { display: inline-grid; flex: none; }
.tray-chip:hover:not(:disabled), .tray-chip.on { background: color-mix(in srgb, var(--text) 9%, transparent); border-color: transparent; }
.tray-chip.proj { flex: 0 1 auto; }
.tray-chip.work { gap: 5px; }
.tray-chip .count { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 24%, transparent); font-size: 10.5px; line-height: 1; }
.tray-gap { flex: 1 1 0; min-width: 4px; }
.tray-pop { z-index: 95; }
.tray-pop .deck-menu { position: static; }
.proj-picker { width: 330px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); box-shadow: 0 18px 50px #000a; padding: 4px; }
.proj-picker.files-pop { width: 340px; } .proj-picker.tools-pop { width: 352px; }
.proj-picker .search { display: flex; align-items: center; gap: 8px; padding: 7px 9px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; color: var(--muted); font-size: 12.5px; }
.proj-picker .search input { flex: 1; min-width: 0; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--text); font-size: 12.5px; line-height: 1.4; outline: none; box-shadow: none; }
.proj-picker .search input::placeholder { color: var(--muted); }
.proj-picker .list-wrap { position: relative; }
.proj-picker .list-wrap.fade::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(transparent, var(--panel-2)); pointer-events: none; }
.proj-picker .list { max-height: 172px; overflow-y: auto; scrollbar-width: none; }
.proj-picker .pk-row { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; border: 0; background: transparent; color: var(--text); font-size: 12.5px; border-radius: 6px; text-align: left; white-space: nowrap; }
.proj-picker .pk-row > svg { color: var(--muted); flex: none; }
.proj-picker .pk-row .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.proj-picker .pk-row .host { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.proj-picker .pk-row .host.mono { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
.proj-picker .pk-row .twin { color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.proj-picker .pk-row .check { margin-left: auto; color: var(--accent); }
.proj-picker .pk-row .off { margin-left: auto; font-size: 11px; color: var(--muted); }
.proj-picker .pk-row .end { margin-left: auto; padding-left: 10px; color: var(--muted); font-size: 11px; display: inline-flex; align-items: center; flex: none; }
.proj-picker .pk-row.hl, .proj-picker .pk-row:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.proj-picker .pk-row:disabled { opacity: .45; cursor: default; }
.proj-picker .foot { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.proj-picker .head, .proj-picker .pop-head { padding: 5px 9px 4px; color: var(--muted); font-size: 11.5px; }
.proj-picker .none { padding: 8px 9px; color: var(--muted); font-size: 12px; white-space: normal; }
.proj-picker .pop-note { display: flex; gap: 7px; align-items: flex-start; padding: 6px 9px 3px; color: var(--muted); font-size: 11px; line-height: 1.45; }
.file-ico { display: inline-grid; place-items: center; width: 16px; height: 16px; flex: none; }
.file-ico.img { color: #f472b6; } .file-ico.doc { color: #60a5fa; }
.work-menu { min-width: 372px; }
.work-menu .menu-head { padding: 5px 9px 3px; color: var(--muted); font-size: 11.5px; }
.work-menu .stays { display: flex; gap: 6px; align-items: flex-start; }
.work-menu .stays svg { flex: none; margin-top: 2px; }
.work-menu button[role="menuitemradio"] { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; border-radius: 6px; font-size: 12.5px; text-align: left; white-space: nowrap; background: transparent; border-color: transparent; }
.work-menu button[role="menuitemradio"]:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.work-menu button[role="menuitemradio"]:disabled { opacity: .45; cursor: default; }
.work-menu button[aria-checked="true"]:disabled { opacity: 1; }
.work-menu .sub { overflow: hidden; text-overflow: ellipsis; min-width: 0; margin-left: auto; padding-left: 14px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
.work-menu .sub.nocopy { font-style: italic; font-family: inherit; }
.work-menu .indent { width: 15px; flex: none; }
.work-menu .tint, .work-menu .hdot { flex: none; }
.work-menu .tint { display: inline-grid; }
/* The opening question of a thread with nothing in it yet. */
.empty .ask { max-width: 30ch; margin-left: auto; margin-right: auto; }
.empty .pick-name { padding: 0; border: 0; background: none; font: inherit; white-space: nowrap; color: var(--accent); text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 5px; cursor: pointer; }
.empty .where { color: var(--muted); font-size: 12.5px; margin-top: -4px; }
/* A narrow thread's Work bar keeps its icons: Files and Tools give up their words first. */
.composer-input { container-type: inline-size; }
@container (max-width: 430px) { .tray-chip.files .lbl, .tray-chip.tools .lbl { display: none; } .tray-chip { padding: 3px 7px; } }
@container (max-width: 330px) { .tray-chip.work .lbl { display: none; } }
/* A pane's top line: the project (pill) and its server stay; the title and status words give way first.
   At "min" a long project name shortens in the middle; the server name keeps 14 characters and its tooltip. */
.pane-ws { display: inline-flex; align-items: center; gap: 5px; flex: none; max-width: 22ch; padding: 1px 8px; border-radius: 999px; background: var(--panel); color: var(--text); font-size: 11.5px; white-space: nowrap; }
.pane-ws .fold { --cut: var(--panel); }
.pane-ws .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pane-ws .nm-short { display: none; }
.pane-host { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; }
.pane-host .tint { display: inline-grid; flex: none; }
.pane-host .hn { overflow: hidden; text-overflow: ellipsis; max-width: 14ch; }
.pane-head:is([data-fit="tight"], [data-fit="min"]) .pane-ws { padding: 1px 6px; }
.pane-head:is([data-fit="tight"], [data-fit="min"]) .pane-host .tint { display: none; }
.pane-head[data-fit="min"] .pane-ws .nm { display: none; }
.pane-head[data-fit="min"] .pane-ws .nm-short { display: inline; }
.pane-head[data-fit="min"] .pane-host .hn { max-width: 9ch; }
/* Narrow panes: the buttons never move out; the project pill and server label shrink to a few letters with their tooltips. */
.pane-head > .pane-menu-wrap, .pane-head > .icon { flex: none; }
.pane-ws { flex: 0 1 auto; min-width: 3.2em; }
.pane-host { flex: 0 1 auto; min-width: 2.8em; }
.pane-host .hn { min-width: 0; }
.pane-head[data-fit="min"] .pane-title { min-width: 3ch; }
.pane-ws { overflow: hidden; }
.pane-ws .nm-short { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
/* At the tightest step the short name is already short: it keeps its letters and the title gives way. */
.pane-head[data-fit="min"] .pane-ws { flex-shrink: 0; }
.pane-head[data-fit="min"] .pane-title { flex: 1 1 0; }
/* Very narrow panes (six on screen): empty slots take no gap, and the line tightens before anything leaves it. */
.pane-head > .pane-folder:empty, .pane-head > .pane-counts:empty { display: none; }
.pane-head:is([data-fit="tight"], [data-fit="min"]) { gap: 5px; padding-left: 10px; padding-right: 8px; }
.pane-head[data-fit="min"] .pane-ws { flex-shrink: 1; min-width: 4.4em; }
/* A new thread's project and machine row sits inside the message box, under the text. */
.composer-box.with-tray { flex-wrap: wrap; }
.composer-box.with-tray > .tray { order: 2; flex-basis: 100%; margin: 0; padding: 2px 0 3px; border: 0; border-radius: 0; background: none; }
.composer-box.with-tray > .tray .tray-chip { color: var(--muted); padding: 2px 8px; }
.composer-box.with-tray > .tray .tray-chip:hover, .composer-box.with-tray > .tray .tray-chip.on { color: var(--text); }

/* Kick: a quiet × at the chip's right end that shows on hover or keyboard focus. */
.chip .chip-kick { width: 0; padding: 0; overflow: hidden; opacity: 0; color: var(--muted); font-size: 13px; line-height: 1; transition: opacity .12s, width .12s; }
.chip-wrap:hover .chip-kick, .chip-wrap:focus-within .chip-kick { width: 16px; padding-right: 4px; opacity: 1; }
.chip .chip-kick:hover:not(:disabled), .chip .chip-kick:focus-visible { color: var(--text); }

/* The form on top of the message box: a bot's question, or next steps. */
.qform { margin: 0 8px; padding: 10px 12px; border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; background: var(--panel-2); font-size: 13px; }
/* The form joins the message box as one card: no gap at the seam, square inner corners. */
.composer-input > .qform + .composer-box { border-top-left-radius: 0; border-top-right-radius: 0; }
.qform-notice, .qform-pending { padding: 6px 12px; color: var(--muted); font-size: 12px; }
.qform-collapsed { display: block; width: calc(100% - 16px); min-height: 0; padding: 6px 12px; text-align: left; color: var(--text); cursor: pointer; }
.qform-steps { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; }
.qform-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.qform-chips { display: flex; flex: 1; min-width: 0; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.qform-chips button { flex: none; min-height: 0; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--text); white-space: nowrap; }
.qform-chips button.on, .qform-options button.on { border-color: color-mix(in srgb, var(--text) 45%, var(--line)); }
.qform kbd { margin-right: 6px; color: var(--muted); font: inherit; }
.qform-x { flex: none; margin-left: auto; min-height: 0; padding: 2px 6px; border: 0; background: transparent; color: var(--muted); }
.qform-x:hover { color: var(--text); }
.qform-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.qform-who { font-weight: 600; color: var(--agent-color, var(--text)); }
.qform-count, .qform-tag { color: var(--muted); font-size: 11px; }
.qform-q { margin: 2px 0 8px; }
.qform-options { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.qform-options button { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; width: 100%; min-height: 0; padding: 6px 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text); text-align: left; }
.qform-options button:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.qform-options button.picked { border-color: var(--line); background: color-mix(in srgb, var(--text) 6%, transparent); }
.qform-desc { grid-column: 2; color: var(--muted); font-size: 12px; }
.qform-other input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); font: inherit; }
.qform-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.qform-so-far { color: var(--muted); font-size: 12px; }
.qform-answered { margin: 4px 0; color: var(--muted); font-size: 12px; }

/* Plan: a steady cyan box and a small chip first in the bot row, the TL;DR pill's size. */
.composer.plan:not(.tldr) .composer-box { border-color: color-mix(in srgb, var(--brand-cyan) 70%, transparent); }
.composer.plan:not(.tldr) .composer-box textarea::placeholder { color: color-mix(in srgb, var(--brand-cyan) 70%, transparent); }
/* Sits left of the TL;DR pill and copies its box, so the two always match in size. */
.composer-box > .plan-chip { flex: none; align-self: flex-end; margin-bottom: 10px; margin-right: 4px; display: inline-flex; align-items: center; gap: .35em; box-sizing: border-box; height: 2.2em; min-height: 0; padding: 0 .9em; border: 1px solid color-mix(in srgb, var(--brand-cyan) 45%, transparent); border-radius: 999px; background: color-mix(in srgb, var(--brand-cyan) 12%, transparent); color: var(--brand-cyan); font-size: 7.5px; font-weight: 800; letter-spacing: .03em; cursor: pointer; transition: font-size .25s; }
.composer.tldr .composer-box > .plan-chip { font-size: 8.75px; }
.plan-chip:hover { background: color-mix(in srgb, var(--brand-cyan) 20%, transparent); }
.plan-chip-x { width: 0; overflow: hidden; opacity: 0; font-size: .9em; transition: opacity .12s, width .12s; }
.plan-chip:hover .plan-chip-x, .plan-chip:focus-visible .plan-chip-x { width: 1em; opacity: .8; }
.approval-plan { max-height: 240px; overflow: auto; margin: 6px 0; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.approval-plan[data-expanded="true"] { max-height: none; overflow: visible; }
.approval-plan-toggle { align-self: flex-start; margin-top: 6px; }

/* Library: every picture the bots made. */
.section-library { overflow: hidden; padding: 16px; }
.library-section { box-sizing: border-box; display: flex; flex: 1 1 auto; flex-direction: column; min-width: 0; min-height: 0; height: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.library-section > .section-intro { flex: none; padding: 18px 22px 14px; }
.library-section > .section-intro h1 { font-size: 22px; }
.library-section > .section-intro p { font-size: 13px; }
.library-filters { display: flex; flex: none; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 10px 20px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel-2); font-size: 13px; color: var(--muted); }
.library-scroll { flex: 1; min-height: 0; overflow: auto; }
.library-filters label { display: flex; align-items: center; gap: 8px; }
.library-search input { box-sizing: border-box; width: min(240px, 30vw); min-width: 130px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); font: inherit; }
.library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; padding: 16px 20px 24px; width: 100%; box-sizing: border-box; }
.library-layout { display: flex; gap: 4px; margin-right: auto; }
.library-layout button, .ph-lib-layout button { min-height: 36px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--muted); }
.library-layout button[aria-pressed="true"], .ph-lib-layout button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel-2)); }
.library-tile { display: flex; flex-direction: column; align-self: start; padding: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; text-align: left; cursor: zoom-in; }

.library-caption { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 8px 10px; font-size: 12px; color: var(--muted); }

.library-grid.is-list { grid-template-columns: 1fr; }

}

.apex-agent-entry { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--panel)); white-space: nowrap; }

.apex-agent-head-actions { display: flex; align-items: center; gap: 10px; }
.apex-agent-status { color: var(--accent); font-size: 11px; }
.apex-agent-status.paused { color: var(--warn); }

.apex-agent-message p { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.apex-agent-evidence { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.apex-agent-evidence button { text-align: left; max-width: 100%; color: var(--accent); font-size: 10px; }
.apex-agent-evidence button small { display: block; max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.apex-agent-composer { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--line); }
.apex-agent-composer textarea { flex: 1; resize: vertical; min-height: 42px; max-height: 150px; border-radius: 8px; padding: 9px 11px; }
.apex-agent-activity { flex: none; max-height: 42%; overflow-y: auto; border-top: 1px solid var(--line); padding: 10px 22px 14px; color: var(--muted); font-size: 11px; }

.apex-agent-controls { display: flex; justify-content: space-between; gap: 20px; padding: 10px 0; }

.apex-agent-buttons button { padding: 4px 8px; font-size: 10px; }
.apex-agent-findings { display: grid; gap: 8px; margin: 5px 0 12px; }
.apex-agent-findings article { display: grid; gap: 5px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); }
.apex-agent-findings article.settled { opacity: .58; }
.apex-agent-findings article small { display: block; color: var(--muted); }
.apex-agent-evidence-link { justify-self: start; padding: 2px 0; border: 0; background: transparent; color: var(--accent); font-size: 10px; }
.apex-agent-activity-row { display: flex; gap: 10px; padding: 4px 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.apex-agent-activity-row time { flex: none; width: 120px; }

.apex-agent-setup label { display: flex; flex-direction: column; gap: 5px; font-weight: 550; }
.apex-agent-setup label span { color: var(--muted); font-weight: 400; }
.apex-agent-setup textarea { resize: vertical; border-radius: 7px; padding: 9px 10px; }
.apex-agent-setup select { border-radius: 7px; padding: 8px; }
.apex-agent-setup fieldset { display: flex; flex-wrap: wrap; gap: 8px 14px; border: 1px solid var(--line); border-radius: 7px; }
.apex-agent-setup fieldset label { display: inline-flex; flex-direction: row; align-items: center; font-weight: 400; }
.apex-agent-empty { padding: 28px 22px; color: var(--muted); }
