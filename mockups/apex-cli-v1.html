<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex Deck CLI · Design preview</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#101010;--line:#2a2a2a;--text:#f2f2f2;--muted:#9a9a9a;--mint:#3def91;--cyan:#1ed7ee}*{box-sizing:border-box}body{margin:0;background:#080b0c;color:var(--text);font:14px/1.65 ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}header{max-width:1160px;margin:30px auto 20px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:12px;font:600 16px system-ui}.brand img{width:36px;height:36px}.preview{color:var(--muted);font-size:12px}nav{max-width:1112px;margin:0 auto 18px;display:flex;gap:8px;flex-wrap:wrap}nav button{background:transparent;color:var(--muted);border:1px solid transparent;padding:6px 13px;border-radius:5px}nav button[aria-selected=true]{background:#14241d;color:var(--mint);border-color:#28553e}.terminal{max-width:1112px;margin:auto;border:1px solid #343a3c;border-radius:11px;overflow:hidden;background:var(--bg);box-shadow:0 24px 90px #0009}.titlebar{height:43px;background:#191c1d;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px;position:relative}.lights{position:absolute;left:17px;display:flex;gap:8px}.lights i{width:10px;height:10px;border-radius:50%;background:#ff6059}.lights i:nth-child(2){background:#ffbd2e}.lights i:nth-child(3){background:#28c840}.screen{min-height:550px;padding:30px 38px 12px}.intro{display:flex;gap:30px;margin-bottom:26px;align-items:center}.terminal-mark{width:104px;height:104px;object-fit:contain;flex:none}.ascii{white-space:pre;font-size:14px;line-height:1.15;color:var(--mint);margin:0}.ascii span{color:var(--cyan)}h1{font-size:20px;letter-spacing:2px;margin:0 0 3px}.cyan{color:var(--cyan)}.green{color:var(--mint)}.muted{color:var(--muted)}.small{font-size:12px}.line{border-top:1px solid var(--line);margin:20px 0}.promptline{color:#b4b7b8;margin-bottom:18px}.promptline b{color:var(--mint);font-weight:400}.block{margin:15px 0;padding-left:18px;border-left:2px solid #32423b}.block p{margin:7px 0}.row{display:grid;grid-template-columns:24px 140px 1fr;gap:8px;padding:6px 0}.tag{color:var(--cyan)}.user{margin:21px 0;padding:12px 17px;background:#101615;border-left:2px solid var(--mint)}.approval{padding:16px 20px;border:1px solid #77603a;max-width:760px;margin:18px 0}.approval strong{color:#f2c675}.choices{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}.choices button{background:#171b19;border:1px solid #3f5548;color:var(--text);padding:6px 14px;border-radius:3px}.choices button:first-child{color:var(--mint);border-color:#3a9663}.code{color:#c0c6c3;white-space:pre-wrap;font-size:13px}.diff{color:var(--mint)}.composer{margin:0 38px;border-top:1px solid #3a6551;border-bottom:1px solid #3a6551;display:flex;gap:14px;padding:14px 0;align-items:center}.composer label{color:var(--mint);font-size:20px}.composer input{width:100%;background:none;border:0;color:var(--text);outline:none}.composer input::placeholder{color:#858d88}.status{padding:12px 38px 18px;color:#9aa39e;font-size:12px;display:flex;justify-content:space-between;gap:15px}.help{max-width:1112px;margin:18px auto 28px;display:flex;justify-content:space-between;color:#8b9490;font-size:12px;padding:0 4px}kbd{color:#c4cbc7;font:inherit}#transcript:empty{display:none}#transcript{margin-top:16px}.session{display:block;text-align:left;width:100%;background:none;color:var(--text);border:0;border-bottom:1px solid #202623;padding:13px 8px}.session:hover{background:#101c15}.session span{float:right;color:var(--muted)}@media(max-width:700px){header{margin-top:15px}nav{padding:0 15px}.terminal{margin:0 12px}.screen{padding:22px 19px;min-height:500px}.intro{gap:16px}.terminal-mark{width:76px;height:76px}.ascii{font-size:10px}h1{font-size:16px}.composer{margin:0 19px}.status{padding:12px 19px;flex-wrap:wrap}.help{padding:0 17px;gap:20px}.row{grid-template-columns:18px 92px 1fr;font-size:12px}.preview{max-width:130px;text-align:right}.session span{float:none;display:block}.brand{font-size:14px}}
</style>
<header><div class="brand"><img src="../public/branding/mark.svg" alt="Apex Deck">Apex Deck <span class="muted">/ CLI</span></div><div class="preview">Interactive concept · Design only</div></header>
<nav role="tablist" aria-label="Preview scenarios"><button role="tab" data-view="welcome">Welcome</button><button role="tab" data-view="chat">Chat & tools</button><button role="tab" data-view="team">Agent team</button><button role="tab" data-view="approval">Approval</button><button role="tab" data-view="sessions">Resume</button></nav>
<main class="terminal"><div class="titlebar"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>apex — ~/Projects/apex-deck</div><div class="screen"><div class="intro"><img class="terminal-mark" src="../public/branding/mark.svg" alt="Apex Deck mark"><div><h1>APEX DECK</h1><div class="cyan">Your agents. One workspace.</div><div class="muted small">CLI concept v0.1 · Local host</div></div></div><div id="content"></div><div id="transcript" aria-live="polite"></div></div><form class="composer" id="form"><label for="prompt">❯</label><input id="prompt" aria-label="Message or slash command" autocomplete="off" placeholder="Ask anything, or / for commands…"></form><div class="status"><span><span class="green">●</span> <span id="agent">Jigga</span> &nbsp; <span class="cyan">Codex</span> &nbsp; ~/Projects/apex-deck</span><span>Ask before changes &nbsp; <span class="green">Local</span></span></div></main>
<footer class="help"><span><kbd>Enter</kbd> send &nbsp; <kbd>/</kbd> commands &nbsp; <kbd>Esc</kbd> welcome</span><span>Simulated activity · No commands execute</span></footer>
<script>
const content=document.querySelector('#content'),transcript=document.querySelector('#transcript'),input=document.querySelector('#prompt');
const screens={welcome:`<div class="promptline"><b>❯</b> apex</div><p>Welcome back, Tyler.</p><p class="muted">Pick up where you left off, or start something new.</p><div class="block"><div><span class="green">✓</span> Workspace instructions loaded</div><div><span class="green">✓</span> Jigga is ready</div><div class="muted">  Same workspace on desktop, terminal, and phone</div></div><div class="line"></div><div class="row"><span class="cyan">/</span><span>resume</span><span class="muted">Continue a recent conversation</span></div><div class="row"><span class="cyan">/</span><span>team</span><span class="muted">Give your agents a shared task</span></div><div class="row"><span class="cyan">/</span><span>model</span><span class="muted">Choose who you work with</span></div><p class="muted small">Try “Review the composer changes” to preview a conversation.</p>`,chat:`<div class="user">❯ Review the composer changes before we ship.</div><p><span class="green">◆ Jigga</span></p><p>I’ll inspect the diff and check how the composer handles history.</p><div class="block"><div><span class="green">✓</span> Read &nbsp; src/ChatPane.tsx <span class="muted">&nbsp; 218 lines</span></div><div><span class="green">✓</span> Shell &nbsp; git diff -- src/ <span class="muted">&nbsp; 0.2s</span></div><div><span class="green">✓</span> Read &nbsp; tests/phone-composer-history.test.mjs</div></div><p>The draft survives navigation. One edge case needs attention:</p><p class="muted">Pressing ↑ in a multiline draft can replace the current text.<br>I’d keep cursor navigation until the caret reaches the first line.</p><p class="cyan">Want me to prepare that change?</p>`,team:`<div class="user">❯ Have the team review the composer. Check behavior and tests.</div><p><span class="green">◆ Jigga</span> &nbsp; I’ve split the review into two independent checks.</p><div class="line"></div><div class="row"><span class="green">✓</span><span>Alfred</span><span>Behavior review <span class="muted">· completed</span></span></div><div class="block muted">Found a multiline history-navigation edge case.<br>src/composerHistory.ts:84</div><div class="row"><span class="cyan">◉</span><span>Gronk</span><span>Test coverage <span class="muted">· reviewing</span></span></div><div class="block muted">Checking draft persistence and keyboard interactions.</div><div class="line"></div><p class="muted">1 of 2 reviews complete. Jigga will combine the findings.</p><p class="small cyan">You can leave this session and resume it from another device.</p>`,approval:`<div class="user">❯ Prepare the composer fix.</div><p><span class="green">◆ Jigga</span> &nbsp; Ready to update the history boundary.</p><div class="approval"><strong>Permission needed · Edit a file</strong><p>src/composerHistory.ts</p><div class="code">  function shouldRecallHistory(event, cursor) {<br><span style="color:#f29494">−   return event.key === 'ArrowUp';</span><br><span class="diff">+   return event.key === 'ArrowUp' && cursor.line === 0;</span><br>  }</div><p class="muted small">Allow this edit in ~/Projects/apex-deck?</p><div class="choices"><button data-answer="allow">Allow once</button><button data-answer="deny">Deny</button></div></div><p class="muted small">This preview shows the decision flow; it does not edit files.</p>`,sessions:`<div class="promptline"><b>❯</b> /resume</div><p>Continue a conversation</p><p class="muted small">This workspace · Sample sessions</p><button class="session" data-resume="chat">Composer review <span>Jigga · Terminal · 2m ago</span></button><button class="session" data-resume="team">Composer team review <span>3 agents · Desktop · 18m ago</span></button><button class="session" data-resume="approval">History navigation fix <span>Needs approval · Phone · 1h ago</span></button><p class="muted small">Select a conversation to preview resuming its state.</p>`};
function show(view){content.innerHTML=screens[view];transcript.replaceChildren();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===view)));input.value='';}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.view)show(e.target.dataset.view)};
content.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.resume){show(b.dataset.resume);return}if(b.dataset.answer){const box=b.closest('.approval');box.innerHTML=b.dataset.answer==='allow'?'<span class="green">✓ Permission granted for this simulated edit.</span><p class="muted">Preview complete. No files were changed.</p>':'<span class="muted">Edit denied. Jigga will wait for your direction.</span>';}};
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const value=input.value.trim();if(!value)return;const cmd=value.split(' ')[0];const map={'/':'welcome','/help':'welcome','/resume':'sessions','/team':'team','/approval':'approval','/chat':'chat'};if(map[cmd]){show(map[cmd]);return}if(cmd==='/model'){transcript.innerHTML='<p class="cyan">Preview model: Codex · Jigga</p><p class="muted">Provider selection will use your Deck configuration.</p>';input.value='';return}show('chat');content.querySelector('.user').textContent='❯ '+value;};
document.addEventListener('keydown',e=>{if(e.key==='Escape')show('welcome');if(e.key==='/'&&document.activeElement!==input){e.preventDefault();input.focus();input.value='/';}});show('welcome');
</script></html>
