function skinTile(name,note,index=null){const chosen=pageState.skin===name;return `<div class="skin-tile"><button data-skin="${escapeHTML(name)}" data-saved-index="${index??''}" aria-pressed="${chosen}"><div class="mini ${['Smoked','Dusk','Liquid'].includes(name)?'night':''}" aria-hidden="true"><div class="mini-side"><i></i><i></i><i></i></div><div class="mini-main"><i></i><i></i><b></b></div></div><strong>${escapeHTML(name)}</strong><small>${note}</small></button>${index===null?'':`<button class="skin-delete" data-delete-skin="${index}" aria-label="Delete saved skin ${escapeHTML(name)}">Delete</button>`}</div>`}
function appearance(){const a=appearanceState,clay=(a.saved.find(x=>x.name===pageState.skin)?.skin||pageState.skin)==='Clay';return `<div id="mode" tabindex="-1"><div class="section-title">Appearance mode</div><div class="mode-grid">${modeCard('light','Light','')}${modeCard('dark','Dark','night')}${modeCard('system','System','auto')}</div></div>`+card(row('skin','Current skin',`Using ${escapeHTML(pageState.skin)}. Browse built-in and saved skins below.`,`<span class="pill">${clay?'Solid surfaces':'Personal style'}</span>`)+row('accent','Accent color','Choose a color or enter its exact hex value.',colorControl('accent',pageState.accent))+row('density','Reading density','Space between rows and messages.',segment('density',['Compact','Comfortable'],pageState.density)))+advanced('Skins · built-in & saved',`<div id="skin-gallery" tabindex="-1"><div class="section-controls"><span class="muted">Built-in skins</span></div><div class="gallery">${builtins.map(([n,d])=>skinTile(n,d)).join('')}</div><div class="section-controls"><span class="muted">Your saved skins</span></div><div class="gallery">${a.saved.map((x,i)=>skinTile(x.name,'Saved skin',i)).join('')}</div>${!a.saved.length?'<p class="skin-note">No saved skins yet. Save your current style below.</p>':''}</div>`)+advanced('Tune surfaces & accent',`${clay?row('clay-presets','Clay accent','Terracotta, Sage or Slate are derived for each mode.',segment('clay',['Terracotta','Sage','Slate'],a.clay))+'<p class="skin-note">Clay uses solid surfaces and serif replies. Glass and background controls are still available when you choose another skin. The exact accent field overrides the preset.</p>':''}${row('corners','Corners','Corner size across panels and controls.',rangeControl('radius',a.radius,4,30,' px'))}${clay?'':row('glow','Glow','Strength of the light around active work.',rangeControl('glow',a.glow,0,100,'%'))+row('frost','Frost','Blur behind glass surfaces.',rangeControl('blur',a.blur,0,40,' px'))+row('surface','Surface opacity','Lower values reveal more of the backdrop.',rangeControl('opacity',a.opacity,30,100,'%'))+row('backdrop','Backdrop strength','Strength of the color field behind glass.',rangeControl('backdrop',a.backdrop,0,100,'%'))+row('flat','Flat surfaces','Solid panels without the glass effect.',appearanceToggle('flat',a.flat,'Flat surfaces'))}`)+advanced('Background patterns & glows',clay?`<div class="skin-note" id="effects" tabindex="-1">Clay is solid, so glass backgrounds do not apply. Select another skin to access all background controls.</div>`:`<div id="effects" tabindex="-1"><div class="section-controls">${a.flat?'<span class="muted">Flat surfaces hide the background. Editing it here turns glass on.</span>':'<span class="muted">Choose a background pattern</span>'}</div><div class="pattern-grid">${['Blobs','Aurora','Halo','Corners','Horizon','Mesh','Stripes','Rings','Dots','Spotlight','None'].map((x,i)=>`<button data-pattern="${x}" aria-pressed="${a.pattern===x}"><div class="pattern-sample" style="filter:hue-rotate(${i*19}deg)" aria-hidden="true"></div>${x}</button>`).join('')}</div></div>`+row('match-accent','Match accent','Turn this off to choose every glow color.',appearanceToggle('match',a.match,'Match accent'))+row('glow-count','Number of glows','One to eight glows behind the glass.',`<div class="stepper"><button data-glow-step="-1" aria-label="Fewer glows" ${a.count<=1?'disabled':''}>−</button><output>${a.count}</output><button data-glow-step="1" aria-label="More glows" ${a.count>=8?'disabled':''}>+</button></div>`)+(a.match?row('glow-colors','Glow colors','Following the accent color.',`<div class="swatches">${Array.from({length:a.count},(_,i)=>`<span class="swatch" style="background:${a.glowColors[i%a.glowColors.length]}" title="Accent-derived glow"></span>`).join('')}</div>`):Array.from({length:a.count},(_,i)=>row('glow-'+i,'Glow '+(i+1),'Choose a color or enter its hex value.',colorControl('glow-'+i,a.glowColors[i]||'#72b6a4'))).join(''))+row('glow-size','Glow size','Make glows tighter or wider.',rangeControl('size',a.size,50,200,'%'))+`<div class="section-controls"><button data-shuffle>Shuffle colors</button><button data-reset-background>Reset background</button></div>`)+advanced('Empty-thread field',row('field-enable','Show the field','Animated glyphs behind empty threads, never messages.',appearanceToggle('field',a.field,'Show empty-thread field'))+row('field-mode','Field color mode','Rainbow cycles hues, or choose one color.',segment('fieldMode',['Rainbow','One color'],a.fieldMode))+row('field-color','Field color','Used in One color mode.',colorControl('field',a.fieldColor,!a.field||a.fieldMode==='Rainbow'))+row('rainbow-speed','Rainbow speed','Zero freezes the color cycle.',rangeControl('speed',a.speed,0,3,'×',0.1,!a.field||a.fieldMode!=='Rainbow'))+row('ripple-shape','Third-click ripple','The shape every third click makes.',`<select aria-label="Third-click ripple" data-appearance-select="shape" ${!a.field?'disabled':''}><option ${a.shape==='Diamond'?'selected':''}>Diamond</option><option ${a.shape==='Circle'?'selected':''}>Circle</option><option disabled>Apex logo (coming later)</option></select>`))+advanced('Agent chips & details',row('chips','Agent chip style','Applies to current and new chats.',select('chip-style',['Classic','Dashed off / solid on','Tinted fill','Stamp','Avatar stack','Square mono tags','Ticket','Keycap','Tab','Ledger','Terminal brackets','Avatar tiles','Two-line cards'],'Square mono tags'))+`<div class="preview-thread"><span class="chip"><b>▦</b> Jigga</span><span class="chip"><b>▦</b> Muck</span><span class="muted" style="font-size:12px">Ready</span></div>`+row('effort','Show effort','How hard the agent thinks.',toggle('effort',true,'Show effort'))+row('usage','Show usage','Context and plan remaining. Low-context warnings always appear.',toggle('usage',true,'Show usage')))+advanced('Save, import & share skins',row('saved-skins','Save current skin','Keep a named copy in your gallery.',`<div class="control-pair"><input type="text" id="skinName" aria-label="Skin name" placeholder="Skin name" maxlength="40"><button data-save-skin>Save skin</button></div>`)+row('share','Import or export skin JSON','Skin files contain supported appearance values only.',`<div class="actions"><button data-export>Export JSON</button><button data-import>Import JSON</button><input type="file" id="skinFile" accept="application/json,.json" hidden></div>`)+`<div class="inset" id="skin-transfer" tabindex="-1"><label for="transferText" class="label">Skin JSON</label><p>Copy a skin or paste one to import. This preview keeps it in this browser tab.</p><textarea id="transferText" rows="4" maxlength="32000" placeholder="Paste skin JSON"></textarea><div class="actions" style="margin-top:10px"><button data-copy-json>Copy JSON</button><button data-import-paste>Import pasted JSON</button></div></div><div class="inset" id="ai-prompt" tabindex="-1"><label for="skinDescription" class="label">Copy an AI prompt</label><p>Describe a look, then copy a prompt with Deck’s skin format. The preview does not call an AI service.</p><textarea id="skinDescription" rows="3" maxlength="500" placeholder="Deep ocean at night, with a soft teal accent"></textarea><button data-copy-prompt style="margin-top:10px">Copy AI prompt</button></div><div id="appearanceNotice" class="mini-state" role="status"></div>`)+`<p class="note">All existing appearance controls are retained. This prototype simulates values and skin transfer; it does not reproduce the complete product’s visual effects engine.</p>`;}

function calls(){return `<div id="engine" tabindex="-1" class="call-select"><button data-engine="live" aria-pressed="${pageState.engine==='live'}"><strong>GPT-Live</strong><span>Natural, real-time conversation</span></button><button data-engine="local" aria-pressed="${pageState.engine==='local'}"><strong>Local</strong><span>Voice processing on this Mac</span></button></div>`+card(pageState.engine==='live'?row('voice','Voice','The voice you hear during GPT-Live calls.',select('live-voice',['Echo','Marin','Cedar','Shimmer'],'Echo'))+row('call-model','Realtime model','Changes apply to your next call.',select('realtime-model',['GPT Realtime','GPT Realtime Mini'],'GPT Realtime'))+row('call-key','OpenAI connection','API key is configured. Never shown here.',`<button class="link-btn" data-page="models" data-target="api-key">Manage API key</button>`):row('voice','Default local voice','For agents without a voice of their own.',select('local-voice',['Adam','Emma','Michael'],'Adam'))+row('pause','Pause before reply','A little room to finish your thought.',select('reply-pause',['100 ms','300 ms','500 ms'],'300 ms'))+row('local-status','Voice engine','Whisper and Kokoro are ready on this Mac.',status('Ready')))+card(row('call-controls','Call controls','The same layout across your chats.',select('call-layout',['Pill','Top bar','Bar'],'Pill')))+`<p class="note">Your Local and GPT-Live preferences are remembered separately.</p>`;}
function models(){return `<div class="section-title">Connected providers</div>`+card([['Claude Code','Installed','Login not checked',true],['Codex','Installed','Login not checked',true],['Muse','Installed','Login not checked',true],['DeepSeek','API key configured','Connection not checked',true],['Ollama','Not connected','Add a local endpoint',false]].map(([n,s,d,on],i)=>row(i===0?'provider-list':'provider-'+i,n,d,`<div style="display:flex;align-items:center;gap:16px"><span class="pill">${s}</span>${toggle('provider-'+i,on,'Show '+n+' when adding agents')}</div>`)).join(''))+`<p class="note">Switches choose what appears when adding an agent. A configured provider still needs a working connection.</p>`+advanced('API keys & endpoints',row('api-key','Provider credentials','Keys stay in the Mac Keychain. This preview has no real keys.',`<button data-demo="Manage API keys">Manage keys</button>`)+row('custom-api','Custom API provider','Connect an OpenAI-compatible endpoint.',`<button data-demo="Add an API endpoint">Add endpoint</button>`))+advanced('Advanced model options',row('image-support','Model image support','Detected where the provider supplies capability information.',`<span class="pill">Automatic</span>`)+row('unknown-model','Unknown model capability','Warn when computer use is called. Text controls remain available.',status('Warning only')));}
function computer(){return card(row('enable','Unified Computer Use','Make desktop tools available to supported agents.',toggle('computer-enabled',true,'Enable Unified Computer Use'))+row('readiness','Ready to work','Permissions are granted on this Mac.',status('Ready')))+`<div class="section-title">Access</div>`+card(row('thread-grants','Approve per Work thread','An app grant can be shared by supported agents in that thread.',`<span class="pill">Ask on first use</span>`)+row('active-grants','Approved apps','Example Work thread has access to Brave.',`<button data-demo="Review thread access">Review access</button>`))+`<div class="section-title">Cursor indicator</div>`+card(row('cursor','Show cursor indicator','A visible pointer and ripple show where the agent acts.',toggle('cursor',true,'Show cursor indicator'))+row('labels','Show action labels','Optional descriptions beside the cursor.',toggle('labels',false,'Show action labels'))+row('duration','Indicator duration','Give each action a moment to register.',select('cursor-duration',['Brief','Comfortable','Long'],'Comfortable')))+advanced('Mac permissions & privacy',row('permissions','Accessibility, Input Monitoring & Screen Recording','All three permissions are granted in this sample.',status('Allowed'))+row('privacy','Your selected model sees granted app content','Only approved apps are shared. Stop ends the current access.',`<button data-demo="Computer use privacy">Learn more</button>`))+`<div class="help-line"><span>Text-only models get a warning when the tool is called.</span><button class="danger" data-demo="Stop Unified Computer Use">Stop computer use</button></div>`;}
function threads(){return card(row('answers','Who answers','Used when creating a new Work thread.',select('who-answers',['Whoever I addressed last','Everyone at once','Everyone in turn'],'Whoever I addressed last'))+row('rounds','Agent-to-agent rounds','How many times agents can answer one another.',select('rounds',['0 rounds','1 round','2 rounds','3 rounds','4 rounds','5 rounds','6 rounds','7 rounds','8 rounds','9 rounds','10 rounds','Unlimited'],'3 rounds'))+row('access','Access for new agents','Tools that cannot enforce Ask first begin read-only.',select('new-access',['Read only','Ask first','Edits','Full'],'Ask first'))+row('steer','Confirm before steering','Ask before interrupting an active reply.',toggle('steer',false,'Confirm before steering')))+`<p class="note">Existing threads keep their own settings. <button class="link-btn" data-page="appearance" data-target="chips">Agent chip styling is in Appearance.</button></p>`;}
function general(){return card(row('artifacts','New artifacts','When an agent writes a file.',select('artifacts',['Open the pane','Just notify'],'Open the pane'))+row('run-buttons','Code-block Run buttons','Run a shell block in the thread’s folder and host.',toggle('run',true,'Show code-block Run buttons')))+`<div class="section-title">Looking for something else?</div>`+card(row('general-calls','Voice & call settings','All voice choices live in one place.',`<button class="link-btn" data-page="calls">Open Calls</button>`)+row('general-storage','Saved work & storage','Locations, older records and maintenance.',`<button class="link-btn" data-page="data">Open Data & storage</button>`));}
function computers(){return card(row('connections','This Mac','Apex Deck backend is connected.',status('Connected'))+row('remote-computer','Studio Mac','SSH key authentication needs attention.',`<button data-demo="Check SSH key">Check SSH key</button>`))+`<p class="note">The remote Mac could not verify your SSH key. Check the key and username, then retry.</p><button data-demo="Add a computer" class="primary">Add computer</button>`+advanced('Connection details',row('ssh-detail','Studio Mac diagnostic','Permission denied (publickey).',`<button data-demo="Retry connection">Retry</button>`));}
function phones(){return card(row('paired','Tyler’s iPhone','Seen 10 hours ago. Access to all threads.',`<div class="actions"><span class="pill">Full access</span><button data-demo="Rename phone">Rename</button></div>`)+row('old-phone','Travel iPhone','Seen 3 days ago. Chats only.',`<div class="actions"><span class="pill">Chat access</span><button data-demo="Rename phone">Rename</button></div>`))+`<button class="primary" data-demo="Pair a phone">Pair phone</button>`+advanced('Connectivity & device details',row('phone-reach','Remote connections','Paired phones can reach this Mac while it is online.',toggle('phone-remote',true,'Allow paired phone connections'))+row('phone-network','Network configuration','Optional addresses for a direct connection.',`<button data-demo="Phone network details">View details</button>`));}
function terminal(){return card(row('terminal-font','Font size','Updates every open terminal.',select('terminal-font',Array.from({length:11},(_,i)=>(10+i)+' px'),'13 px'))+row('scrollback','Scrollback','Lines kept above the visible terminal.',select('scrollback',['1,000 lines','5,000 lines','10,000 lines','50,000 lines'],'5,000 lines')))+`<div class="card" style="padding:24px;background:#17242a;color:#e6f0ee"><div class="mono" style="color:#93aaa9">~/apex-deck</div><p class="mono"><span style="color:#80ceca">❯</span> Ready when you are.</p></div>`;}
function shortcuts(){return ['Navigation','Threads & panes','Composer'].map((group,i)=>`<div class="section-title">${group}</div>`+card((i===0?[['Agents','⌘1'],['Code','⌘2'],['Threads','⌘3'],['Open Assistant','⌘K']]:i===1?[['New thread','⌘N'],['Next thing that needs you','⌘J'],['Previous / next pane','⌘[ / ⌘]'],['Maximize pane','⇧⌘↩']]:[['Steer an active reply','⌘↩'],['Settings','⌘,']]).map(([t,k],n)=>row(i===0&&n===0?'shortcut-list':'shortcut-'+i+'-'+n,t,'',`<span class="keyboard">${k}</span>`)).join(''))).join('')+`<p class="note">Keyboard shortcuts are fixed in this version.</p>`;}
function gateway(){return card(row('endpoint','Gateway endpoint','Available on this Mac only.',status('Enabled'))+row('gateway-url','Endpoint address','Use this URL in another app on this Mac.',`<span class="mono">http://127.0.0.1:8787/v1</span>`))+`<div class="section-title">Access you’ve issued</div><div class="card"><div class="empty">◇<strong>No access keys yet</strong>Create a key for an app you want to connect.<p><button data-demo="Create gateway key">Create access key</button></p></div></div>`+advanced('Network configuration',row('network','Listen address','Only change this when you need another device to connect.',`<input aria-label="Listen address" class="small-input" value="127.0.0.1" data-input>`)+row('gateway-port','Port','Disable the endpoint before changing it.',`<input aria-label="Gateway port" class="small-input" value="8787" data-input>`))+`<p class="note">Client access keys are different from the provider API keys in Models & providers.</p>`;}
function extensions(){return card(row('extension-list','Workspace notes','Adds a notes panel to your Work threads.',toggle('notes-extension',true,'Enable Workspace notes'))+row('extension-capabilities','Declared capabilities','Read and write files inside the granted workspace.',`<span class="pill">Files</span>`))+`<button data-demo="Add extension">Add extension folder</button>`+advanced('Extension details',row('extension-options','Workspace notes options','Change where notes are saved.',`<button data-demo="Extension options">Open options</button>`));}
function data(){return card(row('storage','Saved work location','Your chats, projects and local settings.',`<button data-demo="Show saved work folder">Show folder</button>`)+row('import','Older records','Review an import before anything changes.',`<button data-demo="Review older records">Review import</button>`))+advanced('Maintenance',row('remembered','Remembered model names','Suggestions collected from your configured providers.',`<button data-demo="Clear model suggestions">Clear suggestions</button>`))+`<p class="note">Keys and paired devices are managed in their own settings.</p>`;}
function about(){return card(row('updates','Apex Deck','Version 0.9.8 · preview sample.',`<button data-demo="Check for updates">Check for updates</button>`)+row('update-state','You’re up to date','Last checked just now in this sample.',status('Current')))+advanced('Build details',row('build','Release channel','Local testing candidate.',`<span class="pill">Test build</span>`)+row('diagnostics','Diagnostics','Inspect local app information.',`<button data-demo="View diagnostics">View details</button>`));}

const originalModels=models,originalCalls=calls,originalComputer=computer,originalComputers=computers,originalPhones=phones,originalGateway=gateway,originalExtensions=extensions,originalAbout=about;
function allProviders(){return advanced('All tools & provider visibility',card(['Claude Code','Codex','Antigravity / Gemini','Cursor Agent','GitHub Copilot','Grok','Muse Code','OpenCode','Aider','DeepSeek','Ollama','Other API','Custom command','Scripted'].map((n,i)=>row('all-provider-'+i,n,i===4?'Not installed in this sample.':'Choose whether it appears when adding an agent.',toggle('all-provider-'+i,i!==4,'Show '+n))).join(''))+`<div class="section-controls"><button data-demo="Enable all providers">Enable all</button><button data-demo="Hide uninstalled tools">Hide uninstalled tools</button></div>`)}

function completeModels(){return originalModels()+allProviders()+keyManagement()}
function completeCalls(){return originalCalls()+advanced('Voice samples & preserved engine options',row('voice-sample','Preview the selected voice','Play a sample before choosing.',`<button data-demo="Play voice sample">Play sample</button>`)+row('key-editor','OpenAI key management','Add, replace or remove the key in its one canonical location.',`<button class="link-btn" data-page="models" data-target="key-1">Manage OpenAI key</button>`)+row('all-live-models','Realtime model choices','Keep the installed app’s complete model and voice lists.',`<button data-demo="View complete realtime model and voice lists">View choices</button>`))}

function completeComputers(){return originalComputers()+advanced('Manage the saved computer',row('computer-edit','Edit SSH connection','Name, host, user and key configuration.',`<button data-demo="Edit SSH connection">Edit…</button>`)+row('computer-remove','Remove saved connection','Removes the saved entry, not the remote computer.',`<button data-demo="Remove saved connection">Remove</button>`))}
function completePhones(){return originalPhones()+advanced('Device access & network settings',row('phone-tier-1','Tyler’s iPhone access','Change what this paired phone may do.',select('iphone-access',['Chat','Full'],'Full'))+row('phone-revoke','Revoke a paired phone','Remove this device’s ability to connect.',`<button data-demo="Revoke paired phone">Revoke</button>`)+row('phone-endpoint','Endpoint ID','Stable across restarts. Sample identity only.',`<span class="mono">sample-device-id</span>`)+row('phone-port','UDP port','Kept after first start.',`<span class="mono">41641</span>`)+row('phone-addresses','Advertised addresses','Optional public name and forwarded port.',`<input class="small-input" placeholder="myhome.ddns.net:41641" aria-label="Advertised addresses" data-input>`)+`<div class="section-controls"><button data-demo="Save advertised addresses">Save addresses</button></div>`)}
function completeGateway(){return originalGateway()+advanced('Endpoint actions & provider readiness',row('gateway-toggle','Gateway enabled','Preserved endpoint on/off control.',toggle('gateway-enabled',true,'Enable model gateway'))+row('gateway-copy','Endpoint URL','Copy the endpoint to another app.',`<button data-demo="Copy gateway URL">Copy URL</button>`)+row('gateway-save','Save endpoint','Address and port are edited while the gateway is disabled.',`<button data-demo="Save gateway endpoint">Save endpoint</button>`)+row('gateway-providers','Provider readiness','Installation and configuration only; real completions are not checked.',`<button data-demo="View gateway provider readiness">View providers</button>`)+row('gateway-refresh','Refresh gateway','Update endpoint, key and provider state.',`<button data-demo="Refresh gateway status">Refresh</button>`))+advanced('Key limits, scopes & issued access',row('gateway-label','Device or person','Friendly name attached to a new key.',`<input class="small-input" aria-label="Gateway key name" placeholder="My other app" data-input>`)+row('gateway-scope','Model access','Choose which model families the key can reach.',select('gateway-model-access',['All available models','API providers only','Subscription CLIs only'],'All available models'))+row('gateway-daily','Daily requests','Blank means unlimited.',`<input class="small-input" type="number" min="1" max="10000" placeholder="Unlimited" aria-label="Daily requests" data-input>`)+row('gateway-spend','Spend cap per 30 days','Blank means unlimited. Provider cost reports may be delayed.',`<input class="small-input" type="number" min="0.01" step="0.01" placeholder="Unlimited" aria-label="Spend cap" data-input>`)+`<div class="section-controls"><button data-demo="Create gateway access key">Create key</button><button data-demo="Cancel key creation">Cancel</button></div>`+row('issued-key','Example issued access','Sample app · never used · 0 requests today.',`<button data-demo="Revoke gateway key">Revoke</button>`)+row('gateway-copy-secret','New-key one-time reveal','The real product shows a new secret once, with Copy key, Copy setup and Done.',`<button data-demo="One-time key reveal and copy setup">Preview reveal flow</button>`))+`<p class="note">Private MCP tools remain excluded. This is a display prototype; key creation, copy and revocation actions are explanatory dialogs.</p>`}
function completeExtensions(){return originalExtensions()+advanced('Manage extension & permissions',row('extension-reload','Reload extension','Refresh the installed extension.',`<button data-demo="Reload extension">Reload</button>`)+row('extension-reinstall','Reinstall from source','Copy the source folder in again.',`<button data-demo="Reinstall extension">Reinstall</button>`)+row('extension-remove','Remove extension','Remove the extension from Deck.',`<button data-demo="Remove extension">Remove</button>`)+row('extension-grants','Requested capabilities','These permissions remain configurable while an extension is off.',`<button data-demo="Edit extension capabilities">Edit permissions</button>`)+`<div class="inset preview-permissions"><label><input type="checkbox" checked> Run programs</label><label><input type="checkbox" checked> Network requests</label><label><input type="checkbox"> Read/write files</label><label><input type="checkbox"> Message and tool hooks</label></div>`+row('extension-config','Extension configuration','Supports text, boolean, number, enum, folder and file options.',`<button data-demo="Edit extension configuration">Edit options</button>`)+row('extension-enable','Turn on with permissions','Uses the requested capabilities above in the real app.',`<button data-demo="Turn on extension with permissions">Turn on with these permissions</button>`))}
function completeAbout(){return originalAbout()+advanced('Update installation states',row('update-install','Restart to update','Appears after a verified update is ready.',`<button data-demo="Restart to update">Restart to update</button>`)+row('update-progress','Checking, downloading & verifying','The product reports its real state; this is a sample.',`<span class="pill">State-aware actions</span>`))}
function completeShortcuts(){return ['Navigation','Threads','Panes & composer'].map((g,i)=>`<div class="section-title">${g}</div>`+card((i===0?[['Agents','⌘1'],['Code','⌘2'],['Threads','⌘3'],['New terminal','⌘T'],['Open Assistant','⌘K'],['Settings','⌘,']]:i===1?[['New thread','⌘N'],['Next thing that needs you','⌘J'],['Rename thread','⌥⌘R'],['Pin or unpin thread','⌥⌘P'],['Mark thread unread','⇧⌘U'],['Archive thread','⇧⌘A'],['Change thread project','⌥⇧⌘O']]:[['Previous pane','⌘['],['Next pane','⌘]'],['Maximize or restore pane','⇧⌘↩'],['Full-screen side panel','⇧⌘\\'],['Toggle terminal tool','⇧⌘`'],['Steer a working agent','⌘↩']]).map(([t,k],n)=>row(i===0&&n===0?'shortcut-list':'shortcut-'+i+'-'+n,t,'',`<span class="keyboard">${k}</span>`)).join(''))).join('')+`<p class="note">All existing shortcut actions are retained. Shortcut rebinding is outside this mockup’s scope.</p>`}
const renderers={appearance,calls:completeCalls,models:completeModels,computer:completeComputer,threads,general,computers:completeComputers,phones:completePhones,terminal,shortcuts:completeShortcuts,gateway:completeGateway,extensions:completeExtensions,data,about:completeAbout};

function render(page=pageState.page,target){const openGroups=page===pageState.page?[...document.querySelectorAll('#content details[open]>summary')].map(x=>x.textContent):[];pageState.page=page;nav();const p=catalog.find(x=>x.id===page);$('#content').innerHTML=`<div class="top-line"><span class="scope">${p.scope}</span><span class="pill">${p.group==='advanced'?'Advanced settings':'Your preferences'}</span></div><h2>${p.label}</h2><p class="intro">${p.description}</p>${renderers[page]()}<footer><span>Changes in this prototype stay in this browser tab.</span><button class="link-btn" data-failure>Try a save error</button></footer>`;document.querySelectorAll('#content details>summary').forEach(x=>{if(openGroups.includes(x.textContent))x.parentElement.open=true});document.querySelector('aside').classList.remove('open');if(!openGroups.length)window.scrollTo(0,0);if(target)requestAnimationFrame(()=>{let el=document.getElementById(target);if(!el&&page==='appearance')el=document.getElementById(target==='clay-presets'?'skin-gallery':'effects');if(el){let d=el.closest('details');if(d)d.open=true;el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});el.focus({preventScroll:true});el.classList.add('highlight');clearTimeout(highlightTimer);highlightTimer=setTimeout(()=>el.classList.remove('highlight'),2200)}});}
function applyMode(){const dark=pageState.mode==='dark'||(pageState.mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',dark);document.documentElement.style.setProperty('--accent',dark&&pageState.accent==='#147a76'?'#80ceca':pageState.accent);}
function save(fail=false){const n=++saveGeneration;clearTimeout(saveTimer);$('#saveState').className='save-state';$('#saveState').textContent='Saving preview…';saveTimer=setTimeout(()=>{if(n!==saveGeneration)return;$('#saveState').innerHTML=fail?'Could not save <button type="button" data-retry>Retry</button>':'✓ Saved in preview';$('#saveState').classList.toggle('error',fail);},500)}
function showDialog(title){$('#dialogTitle').textContent=title;$('#dialogText').textContent='This is a design preview. In Apex Deck, this opens the '+title.toLowerCase()+' flow. No app settings, permissions or connections have changed.';$('#dialog').showModal();}
function search(){const q=$('#search').value.trim().toLowerCase();if(!q){render();return}const results=searchItems.filter(x=>(x.label+' '+x.keywords+' '+catalog.find(p=>p.id===x.page).label).toLowerCase().includes(q)).sort((a,b)=>Number(b.label.toLowerCase().includes(q))-Number(a.label.toLowerCase().includes(q)));$('#content').innerHTML=`<span class="scope">Settings search</span><h2>Find a setting</h2><p class="intro">${results.length} ${results.length===1?'result':'results'} for “${escapeHTML($('#search').value)}”</p><div class="card">${results.length?results.map(r=>`<button class="result" data-page="${r.page}" data-target="${r.id}"><strong>${r.label}</strong><span>${catalog.find(p=>p.id===r.page).label} · ${catalog.find(p=>p.id===r.page).scope}</span></button>`).join(''):'<div class="empty"><strong>No settings found</strong>Try voice, dark, SSH, API key or cursor.</div>'}</div>`;window.scrollTo(0,0);}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function appearanceNotice(text,error=false){let n=document.getElementById('appearanceNotice');if(!n){showDialog(text);return}n.textContent=text;n.classList.toggle('field-error',error)}
function skinJSON(){return JSON.stringify({format:'apex-glass-playground',version:2,name:pageState.skin,appearance:{hue:163,accentColor:pageState.accent,glow:appearanceState.glow,blur:appearanceState.blur,opacity:appearanceState.opacity,radius:appearanceState.radius,backdrop:appearanceState.backdrop,density:pageState.density==='Compact'?0.72:1,light:pageState.mode==='light'||pageState.mode==='system'&&!matchMedia('(prefers-color-scheme: dark)').matches,flat:appearanceState.flat,backdropPattern:appearanceState.pattern.toLowerCase(),glowCount:appearanceState.count,glowSize:appearanceState.size,...(!appearanceState.match?{glowColors:appearanceState.glowColors.slice(0,appearanceState.count)}:{}),...(pageState.skin==='Clay'?{theme:'clay'}:{})}},null,2)}
function importSkin(text){try{if(new TextEncoder().encode(text).length>32000)throw Error('Skin files must be 32,000 bytes or smaller.');const x=JSON.parse(text);if(x.format!=='apex-glass-playground'||x.version!==2||!x.appearance||typeof x.name!=='string'||!x.name.trim())throw Error('Use a named Apex skin JSON file (version 2).');appearanceState.saved.push({name:x.name.slice(0,40),skin:x.appearance.theme==='clay'?'Clay':'Custom'});pageState.skin=x.name.slice(0,40);for(const k of ['glow','blur','opacity','radius','backdrop','flat'])if(typeof x.appearance[k]===typeof appearanceState[k])appearanceState[k]=x.appearance[k];if(/^#[0-9a-f]{6}$/i.test(x.appearance.accentColor))pageState.accent=x.appearance.accentColor;render();applyMode();appearanceNotice('Skin imported into the preview gallery.');save()}catch(e){appearanceNotice(e.message,true)}}
async function copyPreview(text,note){try{await navigator.clipboard.writeText(text);appearanceNotice(note)}catch{appearanceNotice('Clipboard unavailable. Use the JSON text field to copy manually.',true)}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const a=appearanceState;
if(b.dataset.skin){const i=b.dataset.savedIndex;const effective=i!==''?a.saved[Number(i)]?.skin:b.dataset.skin;pageState.skin=b.dataset.skin;a.flat=['Classic','Clay'].includes(effective);if(effective==='Clay')a.flat=true;render();save()}
else if(b.hasAttribute('data-delete-skin')){a.saved.splice(Number(b.dataset.deleteSkin),1);render();save()}
else if(b.dataset.appearanceToggle){a[b.dataset.appearanceToggle]=!a[b.dataset.appearanceToggle];render();save()}
else if(b.dataset.pattern){a.pattern=b.dataset.pattern;a.flat=false;render();save()}
else if(b.dataset.glowStep){a.count=Math.max(1,Math.min(8,a.count+Number(b.dataset.glowStep)));while(a.glowColors.length<a.count)a.glowColors.push('#72b6a4');a.flat=false;render();save()}
else if(b.hasAttribute('data-shuffle')){a.match=false;a.flat=false;a.glowColors=Array.from({length:a.count},()=>`#${Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0')}`);render();save()}
else if(b.hasAttribute('data-reset-background')){a.pattern='Blobs';a.match=true;a.count=3;a.size=100;render();save()}
else if(b.hasAttribute('data-save-skin')){const n=$('#skinName').value.trim().slice(0,40);if(!n)return appearanceNotice('Enter a name for this skin.',true);a.saved.push({name:n,skin:pageState.skin});pageState.skin=n;render();appearanceNotice('Skin saved in the preview gallery.');save()}
else if(b.hasAttribute('data-export')){$('#transferText').value=skinJSON();appearanceNotice('Current skin JSON is ready below.');}
else if(b.hasAttribute('data-import'))$('#skinFile').click();
else if(b.hasAttribute('data-import-paste'))importSkin($('#transferText').value);
else if(b.hasAttribute('data-copy-json'))await copyPreview($('#transferText').value||skinJSON(),'Skin JSON copied.');
else if(b.hasAttribute('data-copy-prompt')){const d=$('#skinDescription').value.trim();if(!d)return appearanceNotice('Describe the look you want first.',true);await copyPreview('Create an Apex Deck appearance skin for: '+d+'. Return JSON using this supported version-2 skin structure, changing only appearance values: '+skinJSON(),'AI prompt copied. No AI service was called.');}
});
document.addEventListener('input',e=>{const x=e.target;if(x.dataset.appearanceRange){appearanceState[x.dataset.appearanceRange]=Number(x.value);x.nextElementSibling.textContent=x.value+({radius:' px',blur:' px',speed:'×'}[x.dataset.appearanceRange]||'%');save();}});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.appearanceSelect){appearanceState[x.dataset.appearanceSelect]=x.value;save()}if(x.id==='skinFile'&&x.files[0])x.files[0].text().then(importSkin);if(x.dataset.colorInput||x.dataset.hex){const id=x.dataset.colorInput||x.dataset.hex;let v=x.value.trim();if(/^#[0-9a-f]{3}$/i.test(v))v='#'+[...v.slice(1)].map(c=>c+c).join('');if(!/^#[0-9a-f]{6}$/i.test(v)){x.setAttribute('aria-invalid','true');return}x.removeAttribute('aria-invalid');if(id==='accent'){pageState.accent=v;applyMode()}else if(id==='field')appearanceState.fieldColor=v;else if(id.startsWith('glow-'))appearanceState.glowColors[Number(id.slice(5))]=v;const pair=x.closest('.control-pair');pair.querySelectorAll('input').forEach(i=>i.value=v);save()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){$('#search').value='';render(b.dataset.page,b.dataset.target);if(!b.dataset.target)$('#content').focus({preventScroll:true});}else if(b.dataset.mode){pageState.mode=b.dataset.mode;applyMode();document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===pageState.mode));save();}else if(b.dataset.engine){pageState.engine=b.dataset.engine;render();save();}else if(b.dataset.toggle){const v=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',v);values.set(b.dataset.toggle,v);save();}else if(b.dataset.segment){if(b.dataset.segment==='density'){pageState.density=b.dataset.value;document.body.classList.toggle('compact',pageState.density==='Compact');}else if(b.dataset.segment==='fieldMode'){appearanceState.fieldMode=b.dataset.value;render();}else if(b.dataset.segment==='clay'){appearanceState.clay=b.dataset.value;pageState.accent={Terracotta:'#a86145',Sage:'#638c70',Slate:'#60798e'}[b.dataset.value];applyMode();}b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));save();}else if(b.dataset.color){pageState.accent=b.dataset.color;applyMode();b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));save();}else if(b.dataset.demo)showDialog(b.dataset.demo);else if(b.hasAttribute('data-failure'))save(true);else if(b.hasAttribute('data-retry'))save();});
document.addEventListener('change',e=>{if(e.target.dataset.select){values.set(e.target.dataset.select,e.target.value);save()}else if(e.target.hasAttribute('data-input')||e.target.hasAttribute('data-range'))save()});$('#search').addEventListener('input',search);$('.mobile-menu').onclick=()=>document.querySelector('aside').classList.toggle('open');$('#closeDialog').onclick=()=>$('#dialog').close();document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'){e.preventDefault();$('#search').focus();$('#search').select();}if(e.key==='Escape'&&!$('#dialog').open){if($('#search').value){$('#search').value='';render();$('#search').focus()}else if(document.querySelector('aside').classList.contains('open'))document.querySelector('aside').classList.remove('open');else{const open=$('#content details[open]');if(open){open.open=false;open.querySelector('summary').focus();}}}if(e.key==='ArrowDown'&&e.target.id==='search'){const r=$('.result');if(r){e.preventDefault();r.focus();}}if(e.target.matches('.result')&&['ArrowDown','ArrowUp'].includes(e.key)){const all=[...document.querySelectorAll('.result')],n=all.indexOf(e.target)+(e.key==='ArrowDown'?1:-1);if(all[n]){e.preventDefault();all[n].focus();}}});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(pageState.mode==='system')applyMode()});applyMode();render();
</script></body></html>
