# The Electron app. `npm run desktop:package` builds a signed Mac app with
# apex-daemon inside it and `npm run desktop:dmg` puts that app in a disk image.
# `npm run desktop:win` builds an unsigned Windows installer (NSIS) instead;
# GitHub's run signs it through scripts/package-win.mjs (APEX_DECK_WIN_SIGN=1).
appId: dev.apexdeck.app
productName: Apex Deck
directories:
  output: release
  buildResources: build
files:
  - package.json
  - desktop/**
  - dist/**
  # Shared generated-card validation is imported by the isolated main host.
  - shared/**
  # Only the audited local styles and attribution are needed at runtime.
  - third_party/open-intelligent-ui/design-system.css
  - third_party/open-intelligent-ui/LICENSE
  - third_party/open-intelligent-ui/manifest.json
  - third_party/open-intelligent-ui/README.md
  # The UI is bundled into dist/ and main uses only Electron and Node.
  - "!node_modules/**"
  # Dev-only launchers; smoke.mjs stays so the packaged app can be smoke-tested.
  - "!desktop/run-smoke.mjs"
  - "!desktop/dev.mjs"
  - "!desktop/run-widget-smoke.mjs"
  - "!desktop/generated-ui/security-*.mjs"
  - "!desktop/generated-ui/run-packaged-*.mjs"
  - "!desktop/generated-ui/runtime-smoke.mjs"
# Copied into the app's resources on every platform. The service binary is not
# here because its file name differs per platform: see `mac:` and `win:` below.
extraResources:
  - from: voice-sidecar
    to: voice-sidecar
    filter: ["**/*", "!**/__pycache__/**", "!tests/**", "!.venv/**"]
  - from: third_party/open-intelligent-ui/LICENSE
    to: third-party-notices/OpenIntelligentUI-MIT-LICENSE.txt
mac:
  icon: build/icons/icon.icns
  category: public.app-category.developer-tools
  extendInfo:
    NSMicrophoneUsageDescription: "Apex Deck uses your microphone only during voice calls you start."
  target: dmg
  # A bare electron-builder run signs ad hoc; scripts/package-mac.mjs passes
  # the Developer ID identity instead when the keychain has one.
  identity: "-"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: target/release/apex-daemon
      to: bin/apex-daemon
    - from: target/release/apex-provenance
      to: bin/apex-provenance
    # The upgrade transaction and its bundle check, run as root by the update job
    # from the protected copy (scripts/upgrade.py). Sealed by the app's signature.
    - from: scripts/upgrade.py
      to: updater/upgrade.py
    - from: scripts/verify-protected-bundle.sh
      to: updater/verify-protected-bundle.sh
dmg:
  # One fixed name, like the installer: each build overwrites the last one
  # instead of leaving release/ full of near-identical disk images. The version
  # and the stamped commit are in the bundle and in the .pkg manifest sidecar.
  artifactName: Apex-Deck.${ext}
win:
  icon: build/icons/icon.ico
  target:
    # x64 only for now; an arm64 build is M5.
    - target: nsis
      arch: [x64]
  extraResources:
    # Both native Windows services are built from the same release checkout.
    - from: target/release/apex-daemon.exe
      to: bin/apex-daemon.exe
    - from: target/release/apex-provenance.exe
      to: bin/apex-provenance.exe
nsis:
  # A real installer window, not a silent one-click drop into AppData: the
  # Human picks the folder and can find the app afterwards.
  oneClick: false
  # Trusted executable pins require an administrator-owned Program Files install.
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Apex Deck
  # Same rule as the dmg: one fixed artifact name per build.
  artifactName: Apex-Deck-Setup.${ext}
  # Stops the previous build's background service in .onInit, before any file is
  # copied. Windows locks a running program's image, so without this a second
  # build cannot replace apex-daemon.exe and the app keeps talking to the old
  # one. See the comments in the file itself.
  include: build/installer.nsh

# These are flipped before signing. JS startup checks are only a second layer.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
